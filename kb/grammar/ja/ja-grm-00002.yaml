title: 可能性がある：有可能……
structure: V-普通体 + 可能性がある
structure_pattern: V-普通形 + かのうせいがある
explanation_zh: 表示「有～的可能性」，用于客观推测。注意本句的「見られている」是「見る」的被动形「見られる」＋「ている」的叠加，表示「正在被看着」这一持续状态。
examples:
- text: つまり、見られている可能性がある。
  reading: つまり、みられているかのうせいがある。
  translation_zh: 也就是说，有可能（正）被人看着。
