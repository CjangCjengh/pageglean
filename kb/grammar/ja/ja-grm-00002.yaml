title: 可能性がある：有可能……
structure: 動詞連体形 + 可能性がある
structure_pattern: 動詞連体形 + かのうせいがある
explanation_zh: 表示「有～的可能性」，用于客观推测；動詞以連体形（日语学校文法的动词活用形之一，用于修饰其后的名词）接续名词「可能性」。若谓语为被动＋持续，如「見られている」，则由「見る」的未然形（学校文法的活用形之一，常用于接续助动词）接受身助动词「られる」（表示被动的助动词），再经连用形接接续助词「て」后接补助动词「いる」构成，表示「正被看着」这一持续状态。
examples:
- text: つまり、見られている可能性がある。
  reading: つまり、みられているかのうせいがある。
  translation_zh: 也就是说，有可能（正）被人看着。
