title: 〜んだって：口语传闻「听说……」
structure: 動詞・形容詞終止形／名詞・形容動詞語幹＋助動詞「だ」連体形「な」＋ん（形式名詞「の」の口語音便）＋助動詞「だ」＋って（伝聞の助詞）
structure_pattern: 終止形＋んだって（名詞・形容動詞語幹は「な」＋んだって）
explanation_zh: 「んだって」是口语中的传闻与确认用法，由形式名词「の」（只起语法作用、无实体意义的名词，口语中音便为「ん」）+助动词「だ」（表示断定）+传闻助词「って」构成，是「のだ＋って」的软化形式。接续上，动词、形容词接终止形（学校文法中表示陈述结句的活用形），名词、形容动词词干接助动词「だ」的连体形「な」（用于连接后续成分）。用于转述听来的消息，以疑问语调说出时表示「我听说……是真的吗？」，带有向对方求证、逼问的语感。
examples:
- text: 君、この写真の子の知り合いなんだって？
  reading: きみ、このしゃしんのこのしりあいなんだって？
  translation_zh: 听说你认识这张照片里的孩子？
