id: ja-grm-00003
language: ja
type: grammar
level: N4
level_rank: 2
title: 〜んだって：口语传闻「听说……」
structure: 普通体 + ん（の）だって
structure_pattern: 普通形 + んだって
explanation_zh: 口语中的传闻与确认用法，是「なのだ＋って」的软化形式。用于转述听来的消息；以疑问语调说出时，表示「我听说……是真的吗？」，带有向对方求证、逼问的语感。
examples:
- text: 君、この写真の子の知り合いなんだって？
  reading: きみ、このしゃしんのこのしりあいなんだって？
  translation_zh: 听说你认识这张照片里的孩子？
