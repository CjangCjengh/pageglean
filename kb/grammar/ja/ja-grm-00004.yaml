title: 〜んです（＝のです）：解释说明语气
structure: 用言連体形＋形式名詞の＋助動詞です（＝のです）
structure_pattern: 用言連体形＋形式名詞の＋助動詞です／んです（口語形）
explanation_zh: 「のです」由形式名詞「の」（无实义、仅起语法作用的名词）加助動詞「です」（表礼貌的助动词）构成，接用言連体形（日语学校文法中修饰体言的活用形）之后，用于向对方解释情况、说明原因；「んです」即其口语形式。例句「捨てられてたんです」是「捨てられていたんです」的口语缩略。其中「捨てる」未然形（接续被动、否定等的活用形）「捨て」接被动助动词「られる」表被动，再经接续助词「て」接补助动词「いる」的过去形「ていた」，表示被动后状态的持续。这是口语叙述中非常典型的结构。
examples:
- text: その子はダンボールに入って捨てられてたんです!!
  reading: そのこはダンボールにはいってすてられてたんです!!
  translation_zh: 那孩子是装在纸箱里被人丢弃的!!
