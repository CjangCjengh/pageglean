id: ja-grm-00006
language: ja
type: grammar
level: N4
level_rank: 2
title: 〜のに：明明……却……
structure: 用言・断定の助動詞「だ」の連体形 ＋ 形式名詞「の」 ＋ 格助詞「に」
structure_pattern: 連体形 ＋ 形式名詞「の」 ＋ 格助詞「に」
explanation_zh: 表示事实与预期相反的逆接，带有不满、委屈、遗憾的语气，相当于「明明……却……」。前接用言（动词、形容词、形容动词的总称）或断定助动词「だ」的连体形（学校文法活用形之一，用于修饰体言）。其中「の」是形式名词（本身无实义、起名词化作用的名词），「に」是格助词，二者共同表示逆接接续。口语中名词、形容动词后的「だ」常省略。
examples:
- text: 俺、本当に無実なのに……！
  reading: おれ、ほんとうにむじつなのに……！
  translation_zh: 明明我是真的无辜的……！
  source_book: book-ja-001
  source_chapter: null
  pointer: null
- text: 良い先生だと思ってたのに……
  reading: いいせんせいだとおもってたのに……
  translation_zh: 明明一直以为他是位好老师……
