id: ja-grm-00007
language: ja
type: grammar
level: N2
level_rank: 4
title: 〜とはいえ：虽说……
structure: V-普通体／N + とはいえ
structure_pattern: 普通形 + とはいえ
explanation_zh: 让步表达，「虽说～（但是）……」，先承认前项事实，再提出与之相悖的后项，语气偏书面。本句的「腐れている」来自「腐る（腐败、颓废）」，指那位警察熟人并不靠谱。
examples:
- text: 腐れているとはいえ、警察官が知り合いにいるじゃないか!!
  reading: くされているとはいえ、けいさつかんがしりあいにいるじゃないか!!
  translation_zh: 虽说（那家伙）有点不靠谱，但熟人里可是有位警察的啊!!
