title: 〜じゃないか：发现与提醒「不是有……吗」
structure: 动词・形容词的终止形／名词・形容动词词干＋じゃないか
structure_pattern: 終止形（名词・形容动词为词干）＋じゃないか
explanation_zh: 并非真正提问，而是以升调表示发觉、提醒或抱怨，意为「不是（明明）……吗！」。由「じゃ」（「では」在口语中的音变缩约）＋「ない」（学校文法的否定助动词，表示否定）＋「か」（表示反诘的终助词，即句末语气助词）构成，接在动词・形容词的终止形（直接结句的基本活用形）或名词・形容动词（学校文法中以「だ」结句的一类词）的词干之后。常用于突然想起某事时的自言自语，口语中常说成「〜じゃん／〜じゃねえか」。
examples:
- text: 警察官が知り合いにいるじゃないか!!
  reading: けいさつかんがしりあいにいるじゃないか!!
