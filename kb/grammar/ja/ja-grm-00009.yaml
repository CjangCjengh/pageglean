title: 〜と思っていた：一直以为／认为……
structure: 用言終止形＋格助詞「と」＋思っていた／いました
structure_pattern: 用言終止形＋格助詞「と」＋動詞「思う」連用形＋接続助詞「て」＋補助動詞「いる」連用形＋助動詞「た」（丁寧表現は「いる」連用形＋助動詞「ます」連用形＋助動詞「た」）
explanation_zh: 「〜と思っていた」由用言（动词、形容词、形容动词的统称，均有词形变化）的终止形（用于结句的活用形）＋格助词「と」（接在词语后表示其在句中的关系，此处表示引用内容）＋「思っていた」构成；后部分是动词「思う」的连用形（用于接续后续词语的活用形）＋接续助词「て」（接在连用形后表示接续关系的助词）＋补助动词「いる」（接在「て」后表示状态持续的动词）的过去形，表示某种想法一直持续，意为“一直以为／认为……”。礼貌体为「〜と思っていました」，即「いる」的连用形＋助动词（接在用言之后增添语法意义的词）「ます」（敬体）和「た」（过去）。「彼なら」中的「なら」是断定助动词「だ」的假定形（表示条件的活用形），用于把对方提为话题，相当于“要是他、关于他”。该句式常暗示原先的想法与后来揭示的事实形成对照。
examples:
- text: 彼なら、きっといつかヤらかすと思っていました
  reading: かれなら、きっといつかヤらかすとおもっていました
