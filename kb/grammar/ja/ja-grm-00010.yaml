title: なんて：竟然……（惊讶・难以置信）
structure: N／動詞・形容詞・形容動詞の終止形 ＋ なんて
structure_pattern: N/終止形 + なんて
explanation_zh: 「なんて」是副助词（日语学校文法中的一类助词，此处用于举出事例并附带说话人的主观评价），接在名词或动词、形容词、形容动词的终止形（日语学校文法中用于结句的活用形）之后。表示对意外之事的惊讶、难以置信或轻蔑，意为「居然……、……什么的／……之类的」。口语色彩浓，常带反问语气以强调事情出乎意料。
examples:
- text: 高校教師が性犯罪者なんて……
  reading: こうこうきょうしがせいはんざいしゃなんて……
  translation_zh: 高中老师竟然是性犯罪者什么的……
  source_book: book-ja-001
  source_chapter: null
  pointer: null
- text: あの先生が性犯罪者だったなんて……
  reading: あのせんせいがせいはんざいしゃだったなんて……
  translation_zh: 没想到那位老师竟然是性犯罪者……
