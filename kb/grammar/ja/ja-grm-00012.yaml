title: 〜って言われる：口语引用＋被动「被说……」
structure: 引用文（終止形／命令形）+ 格助詞って + 言われる（動詞「言う」未然形＋助動詞れる）
structure_pattern: 終止形／命令形 + って + 言われた
explanation_zh: 「って」是口语中表示引用的格助詞（表示词语间语法关系的助詞），作用相当于格助詞「と」。「言われる」由動詞「言う」未然形（日语学校文法的动词活用形之一，常用于接续助動詞）加表示被动的助動詞「れる」构成。引用部分用終止形（句子的基本结束形式）转述陈述，用命令形（表示命令、要求的活用形）转述命令。整体表示「被人说～、被要求～」，多用于转述他人的命令或批评，比「と言われた」更口语化。
examples:
- text: 私、母さんから『あの先生の事は忘れなさい』って言われたー
  reading: わたし、かあさんから『あのせんせいのことはわすれなさい』っていわれたー
  translation_zh: 我被妈妈说了「忘掉那位老师的事吧」——
