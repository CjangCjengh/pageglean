title: 〜てくれ（動詞連用形＋接続助詞て＋くれる的命令形）：男性化的命令・恳求
structure: 動詞連用形＋接続助詞て＋くれ（動詞くれる的命令形）
structure_pattern: V連用形＋て＋くれ
explanation_zh: 「〜てくれ」由動詞連用形（日语学校文法的动词活用形之一，常用于接续助词）、接続助詞「て」（接在动词连用形后表示接续关系）和动词「くれる」的命令形「くれ」（表示命令、请求语气的活用形）构成。它是「〜てください」的粗鲁简体形式，多为男性使用，表示直接的命令或急切的恳求。语气比礼貌体强烈得多，带有急迫、不客气的色彩。
