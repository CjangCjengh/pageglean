title: 動詞連用形＋接続助詞て＋おく（〜ておく／〜とく）：事先准备
structure: 动词连用形 + 接続助詞て + おく（口语缩约：〜とく）
structure_pattern: '動詞連用形＋接続助詞て＋おく（口語縮約: 動詞連用形＋とく）'
explanation_zh: 表示事先为了某种目的或应对将来的情况而做某事，可译为"先……好""……备着"。结构为动词连用形（日语学校文法的动词活用形之一，常用于接续助词）＋接続助詞て（表示动作先后承接），后接おく（補助動詞的用法，表示事先完成并保留结果）。口语中「ておく」常缩约为「とく」（如「入れとく」）。
examples:
- text: うわ……。新聞紙敷いておいて正解だったなー
  reading: うわ……。しんぶんししいておいてせいかいだったなー
  translation_zh: 哇……幸好事先铺了报纸啊——
