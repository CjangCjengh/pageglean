title: 〜ように：目的与转述要求（動詞連体形＋形式名詞「よう」＋格助詞「に」）
structure: 動詞連体形／動詞未然形＋打消の助動詞「ない」 ＋ 形式名詞「よう」＋格助詞「に」 ＋ 言う・気をつける
structure_pattern: V連体形（否定はV未然形＋打消の助動詞「ない」）＋形式名詞「よう」＋格助詞「に」＋言う／気をつける
explanation_zh: 「ように」由形式名詞「よう」（表示目标或指示、请求的内容）加格助詞「に」构成，接在动词连体形（日语学校文法的动词活用形之一，用于修饰体言，即一般教材所称的动词辞书形）之后。表达否定时用「动词未然形（学校文法中用于接续否定等助动词的活用形）＋打消助动词ない」。它表示非意志性的目的，译为“以便……”“让（某人）……”。与「言う」搭配表示转述要求，与「気をつける」搭配表示注意做到某事；因表达的是非意志性目标，不用于直接命令。
examples:
- text: 熱くなりすぎない様に気をつける。
  reading: あつくなりすぎないようにつきをつける
  translation_zh: 注意别让它热过头。
