title: 〜ず・〜ずに：不……而……
structure: 動詞未然形＋ず・ずに（サ変動詞「する」為「せず／せずに」）
structure_pattern: 動詞未然形＋ず／ずに
explanation_zh: 「ず」是表示否定的助動詞（文言残留的打ち消し助動詞），接在動詞的未然形（承接否定助動詞的活用形，如「行かない」的「行か」）上。「ずに」為「ず」的連用性用法，作用相當於「〜ないで」，表示不進行前項而進行後項，書面色彩較強。「構わず」由「構う＋ず」固化而來，意為「不顧、不管」。口語中一般用「〜ないで」，敘述中使用「ず・ずに」可營造簡潔的書面感。
examples:
- text: 俺は構わずそのまま再び走る。
  reading: おれはかまわずそのままふたたびはしる
  translation_zh: 我毫不在意，就这样再次跑起来。
