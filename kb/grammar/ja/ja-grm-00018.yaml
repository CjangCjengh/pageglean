title: 〜という＋名词：所谓……
structure: 文（終止形）＋格助詞「と」＋動詞「言う」（連体形）＋名詞
structure_pattern: 文（終止形）＋格助詞と＋言う（連体形）＋N
explanation_zh: 「〜という」由格助詞「と」（表示引用或说明内容）加五段活用动词「言う」的連体形（学校文法中修饰体言即名词类词语的活用形）构成，前面的文以終止形（句子的基本结句形式）出现，整体限定后面的名词，相当于“……的～”“所谓……”。其中「言う」意义已经虚化，不表示实际“说”的动作，只起提示内容的作用。「というのが」是「という」后接主格助词「が」（提示主语），常用于引出对前述情况的说明；口语中「という」常缩略为「って」。
examples:
- text: ここでバッタリ、というのが世に言う『お約束』だが
  reading: ここでバッタリ、というのがよにいうおやくそくだが
  translation_zh: 在这种场面撞个正着，正是世人口中的『定番展开』，不过……
