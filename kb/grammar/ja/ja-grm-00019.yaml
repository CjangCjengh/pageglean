title: 〜といえば：提起话题
structure: 普通形 + といえば
structure_pattern: 普通形 + といえば
explanation_zh: 表示由刚提到的词语联想到另一话题，"说到……""提起……"。本段主人公由『拾う』一词展开联想。与「というのは」（解释说明）不同，「といえば」重在话题触发。
examples:
- text: あ。『拾う』といえば……
  reading: あ。ひろうといえば……
  translation_zh: 啊。说到『捡』……
