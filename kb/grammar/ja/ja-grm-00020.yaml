title: 〜かも：不确定的推测
structure: 終止形・連体形＋かも（しれない）
structure_pattern: 終止形・連体形＋かも（しれない）
explanation_zh: 「かも」是「かもしれない」的口语省略形式，表示把握不大的推测，意为「或许……」「说不定……」。它接在動詞・形容詞・形容動詞的終止形・連体形（日语学校文法中结句或连体修饰名词的谓语基本形）之后，名詞则直接接续（省略判断助動詞「だ」）。「しれない」可分析为動詞「知る」未然形（学校文法中接否定等助動詞的活用形）＋可能助動詞「れる」＋否定助動詞「ない」，字面意为「无法知道（是否……）」。口语属性强，传达将信将疑的语气。
examples:
- text: 『いいこと』あったかも……
  reading: いいことあったかも……
  translation_zh: 也许有什么『好事』发生了……
