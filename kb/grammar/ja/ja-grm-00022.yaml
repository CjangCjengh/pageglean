title: 〜ている→〜てる：接続助詞「て」後の「いる」の「い」脱落（口語縮約）
structure: 動詞連用形＋接続助詞て＋いる→てる／動詞連用形＋接続助詞て＋いない→てない
structure_pattern: V連用形＋接続助詞て＋いる → V連用形＋てる／V連用形＋接続助詞て＋いない → V連用形＋てない
explanation_zh: 口语中，「動詞連用形（日语学校文法的动词活用形之一，用于接续助词、助动词等）＋接続助詞（接在用言活用形后表示连接关系的助词）て＋いる」中的动词「いる」常脱落元音「い」，缩约为「てる」，「ていない」同理缩为「てない」。缩约后仍保留「〜ている」的进行或结果状态义。该缩约大量出现于口语对话与独白。写作或正式场合应改用未缩约的原式。
examples:
- text: そろそろ飲み終わってる頃だろうな。
  reading: そろそろのみおわってるころだろうな
  translation_zh: 差不多也到喝完的时候了吧。
