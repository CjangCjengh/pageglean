title: 〜はと言うと：至于……呢
structure: 名詞＋係助詞「は」＋「と言うと」（格助詞「と」＋動詞「言う」終止形＋接続助詞「と」）
structure_pattern: 名詞＋係助詞「は」＋「と言うと」
explanation_zh: 「はと言うと」由係助詞「は」（日语学校文法中的提示助词，提示主题并兼带对比语气）后接惯用短语「と言うと」（格助词「と」表引用＋动词「言う」终止形＋接续助词「と」表契机）构成，已凝固为转换话题的固定说法。用于在叙述中将视角切换到另一方，引出对其状况的描述，相当于“至于……嘛”“……那边呢”。常带有与预期或前文形成对照的语感。较之单用「と言うと」，插入「は」后对比意味更为明显。
examples:
- text: そしてチビ達はと言うと……。
  reading: そしてチビたちはというと……
  translation_zh: 至于小家伙们那边嘛……
