title: 動詞終止形＋終助詞な・よ（禁止形）：别……哦
structure: 動詞終止形 + 終助詞な（＋終助詞よ）
structure_pattern: 動詞終止形 + 終助詞な + 終助詞よ（禁止）
explanation_zh: 动词终止形（日语学校文法的动词活用形之一，用于结句，相当于动词的基本形）后接终助词「な」（终助词是附于句末表示语气的词，此处表示禁止），构成“别……”“不许……”之意的禁止，语气直接生硬。再添终助词「よ」可加上提醒、叮嘱的语感。多为男性对亲近者的说法。礼貌场合应换成「〜ないでください」。
examples:
- text: すぐ戻るから、絶対ここ動くなよ？
  reading: すぐもどるから、ぜったいここうごくなよ？
  translation_zh: 我马上回来，你绝对别离开这里哦？
