title: 我ながら：连我自己都……
structure: 我（名詞）＋ながら（副助詞，表让步）＋评价性述語
structure_pattern: 我ながら＋述語
explanation_zh: 「我ながら」是由名词「我」加副助词「ながら」（日语学校文法助词的一类，此处表示让步、逆接，相当于“虽说是自己却……”）构成的固定表达。表示说话人对自己自身的行为、性情作自嘲式的评价，意为“连我自己都觉得……”。其后多接表示感叹、评价的谓语。
examples:
- text: ……我ながら単純だとは思う。
  reading: われながらたんじゅんだとはおもう
  translation_zh: ……连我自己都觉得（这想法）真是单纯。
