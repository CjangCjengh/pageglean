title: 〜ようだ：好像……
structure: 用言連体形 ＋ 比況助動詞「ようだ」（接名詞時：名詞＋の＋ようだ）
structure_pattern: 用言連体形＋比況助動詞「ようだ」／様な（「ようだ」的連体形）
explanation_zh: 比況助動詞「ようだ」（日本学校文法中的助动词类别，表示比拟）表示说话人主观而不确定的推测或比喻，意为“好像……”“像……似的”，常与「まるで」呼应。它接在用言（动词、形容词、形容动词的总称）的連体形（学校文法六段活用形之一，主要用于修饰名词）之后，接名词时则加「の」构成「名詞＋の＋ようだ」。与助动词「そうだ」的传闻、样态用法相比，更侧重说话人基于自身感知的主观判断。书面语、口语皆可使用。
examples:
- text: 嫌がっている様な返事じゃなかった事に軽く安堵し、脱衣所を出る。
  reading: いやがっているようなへんじじゃなかったことにかるくあんどし、だついしょをでる
  translation_zh: 听上去不像是嫌弃的回答，我稍稍松了口气，走出更衣室。
