title: 〜うちに：趁……
structure: 〜ている/名词＋の + うちに
structure_pattern: 〜うちに（今のうちに）
explanation_zh: 「〜うちに」表示趁着某种状态持续的期间赶紧做某事，"趁……的时候"。「今のうちに」即"趁现在"。强调时机窗口，错过就难办了。
examples:
- text: 今のうちにあの子の着替えをっと
  reading: いまのうちにあのこのきがえをっと
  translation_zh: 趁现在赶紧把孩子的换洗衣物（备好）——
