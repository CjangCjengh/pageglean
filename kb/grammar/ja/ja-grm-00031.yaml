title: 〜てやる：为下方对象做某事
structure: 動詞連用形＋接続助詞「て」＋やる（授受動詞）
structure_pattern: 動詞連用形＋接続助詞「て」＋やる
explanation_zh: 「〜てやる」由动词连用形（日语学校文法的动词活用形之一，可后接续助词「て」）＋接续助词「て」（接于连用形之后、表示动作连续或方式的助词）＋授受动词「やる」（表示给予恩惠的动词）构成。它表示说话人为地位较低或关系亲近的对象做某事，是“我给予别人恩惠”的授受表达，语气居高而温柔。在书面叙述或句中停顿时，句末的「やる」可换用其连用形「やり」以接续下文。
examples:
- text: 後で温めた牛乳でも持っていってやるか……
  reading: あとであたためたぎゅうにゅうでももっていってやるか……
  translation_zh: 待会儿带点热好的牛奶之类的过去给它吧……
  source_book: book-ja-001
  source_chapter: null
  pointer: null
  annot: 後[あと]で温[あたた]めた牛乳[ぎゅうにゅう]でも持[も]っていってやるか……
- text: 『拾ってやって下さい』と書かれたそのダンボール箱は、ソレを隠すには浅すぎる。
  reading: ひろってやってくださいとかかれたそのダンボールばこは、ソレをかくすにはあさすぎる。
  translation_zh: 那个写着“请把它捡走收养”的纸箱实在太浅，根本藏不住它。
  source_book: book-ja-001
  source_chapter: null
  pointer: null
  annot: 『拾[ひろ]ってやって下[くだ]さい』と書[か]かれたそのダンボール箱[はこ]は、ソレを隠[かく]すには浅[あさ]すぎる。
