id: ja-grm-00033
language: ja
type: grammar
level: N2
level_rank: 4
title: 〜ことから：由于（事实原因）
structure: 小句（连体形）+ ことから
structure_pattern: 用言・助动词连体形 + 形式名词「こと」+ 格助词「から」
explanation_zh: 「ことから」接在小句之后，表示原因或根据，意为“由于…（这一事实）”。结构上，小句谓语以连体形（用言・助动词修饰体言时所用的活用形）后接形式名词「こと」（意义虚化、使小句名词化的名词），再接格助词「から」（接在体言之后表示原因的助词）。该表达多用于书面叙述，比接续助词「から」「ので」（接在用言连用形之后表示原因的助词）更为正式。例句中的「出来ず」即「できない」，「ず」是文语否定助动词「ず」（文语中表示否定的助动词，相当于口语的「ない」）的连用形，同样带有书面色彩。
examples:
- text: この道は帰り道である事から無視することも出来ず、街灯の陰になっていた場所に目を向ける。
  reading: このみちはかえりみちであることからむしすることもできず、がいとうのかげになっていたばしょにめをむける。
  translation_zh: 因为这条路正是回家的路，没法视而不见，我便把目光投向路灯的阴影处。
