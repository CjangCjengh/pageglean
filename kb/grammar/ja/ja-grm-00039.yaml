title: 〜わけではない：并不是说……
structure: 用言・助動詞「だ」の連体形 + 形式名詞「わけ」+ 助動詞「だ」未然形「で」+ 否定の助動詞「ない」
structure_pattern: 用言・助動詞「だ」の連体形 + 形式名詞「わけ」+ 助動詞「だ」未然形「で」+ 否定の助動詞「ない」
explanation_zh: 「〜わけではない」接在用言連体形（动词、形容词、形容动词修饰名词时所用的活用形）之后；「わけ」为表示“道理、缘由”的形式名词（意义虚化、主要起语法作用的名词）。「ではない」由断定助动词「だ」的未然形「で」（用于接续否定助动词的活用形）接否定助动词「ない」构成，整体表示部分否定，意为“并不是……、倒也不是……”。用于委婉地否认某种推断或印象，而非全盘否定。可与副词「決して」呼应以加强否定语气。
examples:
- text: 俺は決して太めなわけではない。
  reading: おれはけっしてふとめなわけではない。
  translation_zh: 我绝对不算胖。
