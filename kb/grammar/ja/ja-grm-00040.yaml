title: 〜かける：差点就……、眼看要……
structure: 动词連用形 + かける
structure_pattern: V-連用形 + かける
explanation_zh: 「〜かける」由前项动词連用形（日语学校文法的动词活用形之一，常用于连接后续词语）与后项动词「かける」构成复合动词，表示动作刚要发生或进行到一半便中止，意为“差点就……、眼看要……”。「理性トビかけた」即“理性差点就要绷断”，以此夸张地描写内心动摇。
examples:
- text: さっきのは俺でも理性トビかけた。
  reading: さっきのはおれでもりせいとびかけた。
  translation_zh: 刚才那一下，连我都差点理智断线。
