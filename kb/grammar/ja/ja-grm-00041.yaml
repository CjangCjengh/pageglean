title: 〜ようとする：正要做……
structure: 動詞未然形＋意志の助動詞「う・よう」＋格助詞「と」＋サ変動詞「する」
structure_pattern: V（動詞）未然形 + 意志の助動詞「う・よう」 + 格助詞「と」 + する
explanation_zh: 「〜ようとする」由动词未然形（日语学校文法的动词活用形之一，常用于接续助动词）后接意志助动词「う・よう」（表示意志、劝诱的助动词，五段动词用「う」，如「書こう」；一段动词等用「よう」），再加格助词「と」与サ変動詞「する」构成。整体表示正要做某事、刚要……，描述动作即将发生的瞬间。常以「〜ようとしたとき（に）」的形式引出意外状况。
examples:
- text: リビングの扉を開けようとして、扉のガラス越しに『その光景』が眼に入る。
  reading: リビングのとびらをあけようとして、とびらのガラスごしに『そのこうけい』がめにはいる。
  translation_zh: 正要打开客厅的门时，透过门上的玻璃，“那幅光景”映入了眼帘。
