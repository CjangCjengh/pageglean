id: ja-grm-00045
language: ja
type: grammar
level: N3
level_rank: 3
title: 〜にしては：以…而言却…
structure: N + にしては
structure_pattern: N + にしては
explanation_zh: 表示“以…的标准来看却…”，后项多为与预期不符的评价。本段中女孩报出的号码是九位数，“作为电话号码却少了一位”。与「〜にしても」「〜わりに」意思相近。
examples:
- text: 電話番号にしては１ケタ足りない。
  reading: でんわばんごうにしてはいちけたたりない。
  annot: 電話番号にしては１ケタ足りない。
  translation_zh: 作为电话号码来说，少了一位数。
  source_book: book-ja-001
  source_chapter: null
  pointer: null
- text: あいつにしては珍しく、おふざけもイラストもない、祈るような文字たち。
  reading: ''
  annot: あいつにしては珍[めずら]しく、おふざけもイラストもない、祈[いの]るような文字[もじ]たち。
  translation_zh: 对那家伙来说很难得，既没有玩笑也没有涂鸦，只有仿佛在祈祷般的字迹。
  source_book: book-ja-011
  source_chapter: null
  pointer: null
