id: ja-grm-00054
language: ja
type: grammar
level: N4
level_rank: 2
title: 〜じゃないか：发现与提醒「不是有……吗」
structure: 普通体 + じゃないか
structure_pattern: 普通形 + じゃないか
explanation_zh: 并非真正提问，而是以升调表示发觉、提醒或抱怨，「不是（明明）……吗！」。常用于突然想起某事时的自言自语。口语中常说成「〜じゃん／〜じゃねえか」。
examples:
- text: 警察官が知り合いにいるじゃないか!!
  reading: けいさつかんがしりあいにいるじゃないか!!
  annot: 警察官が知り合いにいるじゃないか!!
  translation_zh: 熟人里不就有个警察吗!!
