title: 〜らしい：传闻「听说……」
structure: 普通体 + らしい
structure_pattern: 普通形 + らしい
explanation_zh: 传闻助动词，表示根据他人消息的转述「听说～、好像～」。句末的「わよ」是柔和语气词，本片段中配合主妇角色的口吻。注意与表推测的「〜そうだ」区分。
examples:
- text: 自宅からはＨなゲームがゴロゴロ出てきたらしいわよ？
  reading: じたくからはエッチなゲームがゴロゴロでてきたらしいわよ？
  annot: 自宅からはＨなゲームがゴロゴロ出てきたらしいわよ？
  translation_zh: 听说从他家里搜出了一大堆H游戏哦？
