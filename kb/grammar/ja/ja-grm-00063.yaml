title: 〜という＋名词：所谓……
structure: 小句 + という + 名词
structure_pattern: 文節 + という + N
explanation_zh: 「〜という」用一句话说明或限定后面的名词，相当于"……的~""所谓……"。如「彼女を拾うという選択」即"捡回她这一选择"。口语中常说「って」；「というのが」还能引出对前情的说明。
examples:
- text: ここでバッタリ、というのが世に言う『お約束』だが
  reading: ここでバッタリ、というのがよにいうおやくそくだが
  annot: ここでバッタリ、というのが世に言う『お約束』だが
  translation_zh: 在这种场面撞个正着，正是世人口中的『定番展开』，不过……
