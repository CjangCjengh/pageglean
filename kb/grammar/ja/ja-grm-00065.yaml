title: 〜かも：不确定的推测
structure: 普通形 + かも（しれない）
structure_pattern: 普通形 + かも（しれない）
explanation_zh: 「かもしれない」的口语省略，表示把握不大的推测，"也许……""说不定……"。少女含糊低语中的「あったかも」传达出将信将信的语气，口语属性强。
examples:
- text: 『いいこと』あったかも……
  reading: いいことあったかも……
  annot: 『いいこと』あったかも……
  translation_zh: 也许有什么『好事』发生了……
