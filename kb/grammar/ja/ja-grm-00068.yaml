id: ja-grm-00068
language: ja
type: grammar
level: N2
level_rank: 4
title: 〜た上で：在……之后／基础上
structure: Vた形 + 上で
structure_pattern: V-た + 上で
explanation_zh: 「〜た上で」表示以前项动作为前提、基础再进行后项，"在……之后（才）"。比「〜てから」更强调前项是后项的审慎前提。本段倒装句突出了"先确认没人在"这一步。
examples:
- text: いる気配が無いのを確認した上で。
  reading: いるけはいがないのをかくにんしたうえで
  annot: いる気配が無いのを確認した上で。
  translation_zh: 是在确认里面没有人的气息之后。
