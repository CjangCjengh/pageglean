title: 〜ようだ：好像……
structure: 普通形 + ようだ／様な
structure_pattern: 普通形 + ようだ／様な
explanation_zh: 「〜ようだ」表示主观的不确定推测或比喻，"好像……""像……似的"，常与「まるで」呼应。比传闻、样态的「〜そうだ」更侧重说话人的主观判断，书面、口语皆可。
examples:
- text: 嫌がっている様な返事じゃなかった事に軽く安堵し、脱衣所を出る。
  reading: いやがっているようなへんじじゃなかったことにかるくあんどし、だついしょをでる
  annot: 嫌がっている様な返事じゃなかった事に軽く安堵[ど]し、脱衣所を出る。
  translation_zh: 听上去不像是嫌弃的回答，我稍稍松了口气，走出更衣室。
