title: 体言止め・助詞止め：余韵结句
structure: 名词/助词（へ・に）+ 。（省略谓语结句）
structure_pattern: N／助詞止め（体言止め）
explanation_zh: 句子不以谓语收尾，而以名词或助词「へ」「に」等戛然而止，留下画面感与节奏感。轻小说动作场景中大量使用，营造镜头切换般的紧凑感，属书面文体技巧。
