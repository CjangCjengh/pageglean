id: ja-grm-00077
language: ja
type: grammar
level: N3
level_rank: 3
title: 〜わけではない：并不是说……
structure: 普通形 + わけではない
structure_pattern: 普通形 + わけではない
explanation_zh: 「〜わけではない」表示部分否定，意为“并不是……、倒也不是……”。用于委婉否认某种推断或印象，而非全盘否定。片段中与「決して」呼应以加强语气。
examples:
- text: 俺は決して太めなわけではない。
  reading: おれはけっしてふとめなわけではない。
  annot: 俺は決して太めなわけではない。
  translation_zh: 我绝对不算胖。
  source_book: book-ja-001
  source_chapter: null
  pointer: null
- text: あの姿での願望が即ち現在の願望というわけではない
  reading: ''
  annot: あの姿[すがた]での願望[がんぼう]が即[すなわ]ち現在[げんざい]の願望[がんぼう]というわけではない
  translation_zh: （她）那副模样下的愿望，并不就等于现在的愿望。
