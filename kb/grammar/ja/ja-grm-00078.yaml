title: 〜かける：差点就……、眼看要……
structure: 动词ます形（去ます）+ かける
structure_pattern: V-ます + かける
explanation_zh: 「〜かける」表示动作“刚要发生、差点就……”，停在半途。「理性トビかけた」即“理性差点就要绷断”。轻小说常用这种夸张表达来描写内心动摇。
examples:
- text: さっきのは俺でも理性トビかけた。
  reading: さっきのはおれでもりせいとびかけた。
  annot: さっきのは俺でも理性トビかけた。
  translation_zh: 刚才那一下，连我都差点理智断线。
