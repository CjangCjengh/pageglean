title: 〜ようとする：正要做……
structure: 动词辞书形 + ようとする
structure_pattern: V-辞書形 + ようとする
explanation_zh: 「〜ようとする」表示“正要做某事、刚要……”，描述动作即将发生的瞬间。常以「〜ようとしたとき（に）」引出意外状况。片段中“正要开门时，看到了那一幕”。
examples:
- text: リビングの扉を開けようとして、扉のガラス越しに『その光景』が眼に入る。
  reading: リビングのとびらをあけようとして、とびらのガラスごしに『そのこうけい』がめにはいる。
  annot: リビングの扉を開けようとして、扉のガラス越しに『その光景』が眼に入る。
  translation_zh: 正要打开客厅的门时，透过门上的玻璃，“那幅光景”映入了眼帘。
