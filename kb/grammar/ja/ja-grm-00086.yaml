title: 「〜ハメになる」：陷入糟糕境地
structure: 用言連体形・体言の＋形式名詞「ハメ（羽目）」＋になる
structure_pattern: V-連体形 + 羽目（ハメ）になる
explanation_zh: 形式名詞「羽目」指不情愿的糟糕处境，「〜羽目になる」表示结果被迫陷入倒霉的境地，相当于中文“弄得……、落得……”。多用于不如意、哭笑不得的结果。
examples:
