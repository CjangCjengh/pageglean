title: 「〜のだ」：解释与强调的语气
structure: 终止形 ＋ のだ（口语作「んだ」）
structure_pattern: 用言-終止形 / 体言・助動詞「だ」連体形 + 形式名詞「の」 + 助動詞「だ」
explanation_zh: 形式名词「の」使前面的句子体言化，再接断定助动词「だ」，构成带解释、强调语气的「〜のだ」。常用于追问原因或强调结论，口语中「の」音变为「ん」。莉亚连用「何があるのだ」「なんなのだ」等，显得一本正经，形成其独特口癖。
