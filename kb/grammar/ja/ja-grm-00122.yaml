title: 「〜事で〜事ができる」：手段与可能
structure: 动词终止形 + 事で（手段）…+ 事ができる（可能）
structure_pattern: V終止形 + 事で + … + 事ができる
explanation_zh: 「こと」是形式名词，使动词终止形体言化；「事で」中的格助词「で」表示手段、方法，意为“通过……”。「事が出来る」是形式名词「こと」加「出来る」构成的可能表达，相当于“能够……”。本片段系统说明文里反复用此结构讲解操作方式。
examples:
- text: そのアビリティの効果は、その項目に意識を集中する事で見る事が出来る。
