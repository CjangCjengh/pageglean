title: 「〜てはどうだ」：不如……怎么样
structure: 動詞連用形 ＋ て ＋ は ＋ どうだ
structure_pattern: V連用形 + て + は + どうだ
explanation_zh: 「〜てはどうだ（どうだろう）」表示提议，意为"……怎么样？／不如……吧"。结构为动词连用形＋接续助词「て」＋副助词「は」。是日常口语中常用的建议句式，也可说「〜てはどうか」。
examples:
- text: どうせなら魔眼を試してみてはどうだ？
  reading: ''
  annot: どうせなら魔眼[まがん]を試[ため]してみてはどうだ？
  translation_zh: 反正都这样了，不如试试魔眼怎么样？
