title: 「〜わけにもいかない」：碍于情理不能……
structure: 動詞終止形＋形式名詞「わけ」＋助詞「にも」＋「いかない」
structure_pattern: V-終止形 + わけにもいかない
explanation_zh: 形式名词「わけ」表事理，「〜わけにはいかない」表示碍于情理、立场或现实而不能做某事，即『不能……／做不得……』。它不是能力上做不到，而是出于顾虑不便去做，与「〜られない」（能力不足）形成对照。口语中常省略「は」说成「わけにもいかない」。
examples:
- text: アッサリ解放するわけにもいかないだろ？
  reading: ''
