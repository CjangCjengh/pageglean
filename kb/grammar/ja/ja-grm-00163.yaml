title: 〜としましょう：就定为……吧（提议做决定）
structure: 名詞＋と＋する（意向形）
structure_pattern: N + と + する（意向形）
explanation_zh: 格助詞と＋サ変動詞する构成「Nとする」，表示「把N作为决定、当作N」。其意向形「としましょう」以柔和的口吻提议双方共同采纳某决定，相当于「就定为……吧」。多用于礼貌、郑重场合的提议。
examples:
- text: ――わかりました、休戦としましょう。
  reading: ''
  annot: ――わかりました、休戦[きゅうせん]としましょう。
  translation_zh: ——我明白了，那就暂时休战吧。
