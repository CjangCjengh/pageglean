title: 〜ないでもない：双重否定的委婉肯定
structure: 动词未然形 + 否定助动词「ない」＋ でも ＋ 「ない」
structure_pattern: V-未然形 + ない + でも + ない
explanation_zh: 「〜ないでもない」用双重否定表达委婉的肯定，意为“并非不……／多少也有些……”，语气比直接肯定含蓄保留。「思わないでもない」即“也不是不这么想”。属于略带书面色彩的口语表达。
examples:
- text: 自分でも『なんでフリーザ様？』と思わないでもないが、今は二度寝に――
  reading: ''
  annot: 自分[じぶん]でも『なんでフリーザ様[さま]？』と思[おも]わないでもないが、今[いま]は二度寝[にどね]に――
  translation_zh: 连我自己也不是没在想“怎么成了弗利萨大人？”，不过现在还是先睡个回笼觉——
