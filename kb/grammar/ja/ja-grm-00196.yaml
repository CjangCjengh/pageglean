title: 「〜までもない」：自不待言、用不着
structure: 動詞終止形 ＋ 副助詞 まで ＋ も ＋ ない
structure_pattern: V-終止形 + までもない
explanation_zh: 「まで」为副助词，表示程度的极限；「〜までもない」表示“连…的程度都达不到”，即“用不着…、…自不待言”。“言うまでもない”是固定表达，意为“不用说、不言而喻”。文中“どっちがマシかは言うまでもない”即此用法。
examples:
- text: 男が女のを見ちゃうのと、女が男の見ちゃうの、どっちがマシかは言うまでもないでしょ？
  reading: ''
  annot: 男が女のを見ちゃうのと、女が男の見ちゃうの、どっちがマシかは言うまでもないでしょ？
  translation_zh: 男人看到女人的（那种东西）和女人看到男人的，哪个还算好些，这不用我说也明白吧？
