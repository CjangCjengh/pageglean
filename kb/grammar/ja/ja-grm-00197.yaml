id: ja-grm-00197
language: ja
type: grammar
level: N4
level_rank: 2
title: 「のだ／んだ」：解释语气（形式名词 の）
structure: 用言連体形 ＋ 形式名詞 の ＋ 助動詞 だ（口語音変：んだ）
structure_pattern: 用言-連体形 + のだ／んだ
explanation_zh: 「のだ」由形式名词「の」加断定助動詞「だ」构成，赋予句子解释、说明、强调的语气；口语中「の」音变为「ん」。文中“ノーマルなんだよ”是口语倒装用法，“わかったのだが”则是独白式的书面语体。
examples:
- text: 今のでわかっただろうが……ノーマルなんだよ、こいつ
  reading: ''
  annot: 今[いま]のでわかっただろうが……ノーマルなんだよ、こいつ
  translation_zh: 刚才那一下你们也明白了吧……这家伙是正常的（喜欢异性）。
  source_book: book-ja-007
  source_chapter: null
  pointer: null
- text: その……比較対象が居たためにわかったのだが。
  reading: ''
  annot: その……比較対象[ひかくたいしょう]が居[い]たためにわかったのだが。
  translation_zh: 那个……因为有比较对象在，我才弄明白。
  source_book: book-ja-007
