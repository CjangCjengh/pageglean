title: 連用形中止法：书面叙事的中顿（中止法）
structure: 動詞連用形（マス形去掉マス）＋読点，表示中顿
structure_pattern: V-連用形(中止法)
explanation_zh: 用言連用形可直接中顿或结句，称“中止法”，是「〜て」接续在书面语体中的替代形式。轻小说叙述常用它串联一连串动作，使节奏紧凑利落。口语中一般改用「〜て」形。
examples:
- text: 「心構えを作り、油断をしないように――」
