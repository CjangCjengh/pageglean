title: 敬語：謙譲語「いたす」与尊敬語「お〜なさる」
structure: お ＋ サ変動詞語幹 ＋ いたす／お ＋ 体言 ＋ になさる
structure_pattern: お + N + いたす; お + N + になさる
explanation_zh: 「いたす」是「する」的謙譲語，用于自己或己方的动作以抬高对方；「なさる」是「する」的尊敬動詞，「お気になさる」即「気にする」的尊敬表达。句末「お気になさらず」以助動詞「ず」委婉收尾，是客气的劝阻说法。
examples:
- text: 「どうかお気になさらず」
