title: 〜てある：人为结果的状态存续
structure: 他动词连用形 + 接续助词「て」+ 补助动词「ある」
structure_pattern: 他V-連用形 + て + ある
explanation_zh: 他动词连用形＋接续助词「て」＋补助动词「ある」，表示某人有意图地做完某事后，其结果状态仍在持续。与单纯表状态的「ている」不同，「てある」强调人为准备的目的性。此处指为防备“搜查”而事先藏好、维持着该状态。
examples:
- text: 利便性を捨て、完璧[かんぺき]な隠し場所にしまってある……！
