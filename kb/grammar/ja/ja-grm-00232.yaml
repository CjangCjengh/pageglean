title: すら（も）：连……都……
structure: 名詞＋すら（も）
structure_pattern: N + すら / すらも
explanation_zh: 助词「すら」举出极端事例以强调“连……都……”，语气比「も」更强、更书面，可叠加为「すらも」。片段两句分别强调“连视线都不给”与“连莉亚都看呆了”的反差。
examples:
- text: こちらに視線すら向けずに歩き続けるリア。
  reading: ''
  annot: こちらに視線[しせん]すら向[む]けずに歩[ある]き続[つづ]けるリア。
  translation_zh: 莉亚连视线都不朝这边扫一下，自顾自地继续走。
