title: 「〜てたまるか」：哪能……、怎么忍受得了（口语）
structure: V連用形 ＋ て ＋ たまるか（反问表示强烈否定）
structure_pattern: V-連用形 + て + たまるか
explanation_zh: 「たまる」是五段动词「堪る」（忍受得了）的終止形，后接終助詞「か」以反问形式表示强烈否定：“哪能～、绝对不～”。属口语句末表达，轻小说中高频出现，多用于说话人愤然立志的场合。文中主人公以此喊出绝不放弃的决心。
examples:
- text: ……諦めてたまるかよッ!!
