title: 〜どころじゃない：哪止是……的程度
structure: 名詞／イ形容詞語幹＋どころではない（口语粗犷形：どころじゃねー）
structure_pattern: N/Adj語幹 + どころではない
explanation_zh: 「〜どころではない」表示程度远非前项所能概括，「岂止是……、根本不是……的程度」，常用于反驳对方轻描淡写的说法。句中「じゃねー」是「じゃない」的男性粗犷口语变体，语气随便、情绪强烈。也可表示「无暇顾及」（如：忙得顾不上）。
examples:
- text: 厄介どころじゃねーだろ……。
