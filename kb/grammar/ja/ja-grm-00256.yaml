title: 〜てくる：朝向说话人的动作
structure: 动词连用形＋て＋くる
structure_pattern: V-て + くる
explanation_zh: 「くる」接动词连用形＋て后作补助动词，表示动作朝着说话人而来或波及说话人。中文常译为「……过来」。片段中「射抜いてくる」「抱きついてくる」分别增添了逼视而来的压迫感与扑过来的亲近感。
examples:
- text: そのまま抱きついてくるリア（幼）。
