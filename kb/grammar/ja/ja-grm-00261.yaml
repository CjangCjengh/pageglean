title: 助詞「し」：列举理由
structure: 用言終止形＋終助詞「し」（体言には「だ」を添える）
structure_pattern: 用言終止形 + し / N + だ + し
explanation_zh: 终助词「し」用于列举理由，暗示“除此之外还有其他理由”，体言接续时需加「だ」。片段以「懐いてるし」推出“不会受坏待遇”，进而得出“不必生气”的结论。大致相当于中文的“又…（而且…）”。
examples:
- text: それにその子、リアちゃん。凄く和希に懐いてるし。
  reading: ''
  annot: それにその子[こ]、リアちゃん。凄[すご]く和希に懐[なつ]いてるし。
  translation_zh: 而且那孩子，莉亚酱，非常亲近和希呢。
