title: 〜てくださる：补助动词「くれる」的尊敬语（此处反讽）
structure: 动词连用形＋接续助词「て」＋补助动词「くださる」（「くれる」的尊敬语）
structure_pattern: V-連用形 + て + くださる
explanation_zh: 「〜てくださる」是补助动词「〜てくれる」的尊敬语，本用于感谢对方好意为自己做事。此处却描述莉亚『干脆地拒绝』自己，属幽默反讽的敬语用法，制造反差喜感。轻小说常借敬语错位营造喜剧效果。
examples:
- text: きっぱりと断ってくださるリア（幼）。
