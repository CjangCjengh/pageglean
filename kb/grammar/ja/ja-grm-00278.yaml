title: 〜じゃん：口语终助词（「ではないか」的缩略）
structure: 用言终止形（简体）＋终助词「じゃん」
structure_pattern: 普通形 + じゃん(=ではないかの縮約)
explanation_zh: 口语终助词，由「ではないか」缩略而来，用于主张自己的判断或指出对方理应认同的事实，带有提醒、说服的语气。「イスカも友達じゃん」＝伊丝卡不也是朋友嘛。语气随便，轻小说日常对话中高频出现。
examples:
- text: だって、イスカも友達じゃん？
