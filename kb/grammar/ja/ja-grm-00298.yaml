title: 〜だもん（もの）：辩解性的理由说明
structure: 体言・用言終止形＋断定の助動詞「だ」＋終助詞「もの」（口語形「もん」）
structure_pattern: 終止形 + (だ) + もん
explanation_zh: 终助词「もの（もん）」以申辩、撒娇的口吻陈述理由，多见于女性或儿童用语（口语属性）。「だもん」即“因为（是）……呀”；「来たんだもん」中的「んだ」是「のだ」的口语体（解释语气）。片段连用两次，凸显角色的稚气与执拗。
examples:
