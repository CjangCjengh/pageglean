title: 〜のに：明明……却……
structure: 用言連体形 + 接続助詞「のに」
structure_pattern: V/A連体形 + のに
explanation_zh: 接续助词「のに」接在用言连体形后，表示与预期相反的逆接，含意外、不满的语气，相当于中文“明明……却……”。注意与“形式名词の＋格助詞に”（如表目的）区分。
examples:
- text: 戸惑っていたのに、そう問われると律儀に考えるイスカ。
  reading: ''
  annot: 戸惑[とまど]っていたのに、そう問[と]われると律儀[りちぎ]に考[かんが]えるイスカ。
  translation_zh: 明明还不知所措，被这样一问，伊斯卡却老老实实地认真思考起来。
