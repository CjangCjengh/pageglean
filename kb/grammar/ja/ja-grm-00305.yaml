title: 〜てる／〜てた：「ている」的口语缩约
structure: ている → てる（ていた → てた）
structure_pattern: V-て + いる → てる
explanation_zh: 口语中持续体「ている／ていた」的「い」常脱落，缩约为「てる／てた」。轻小说对话中极为常见，正式书面文体中不使用。
