title: 〜たはいいが：做了倒是做了，可是……
structure: 動詞連用形＋助動詞「た」＋はいいが
structure_pattern: V-た + はいいが
explanation_zh: 表示某事虽然做了，却由此引出了棘手的问题，后项常带有为难、无奈的语气。「はいいが」先用系助词「は」姑且肯定前项，再用接续助词「が」转折。口语和书面都常用。
examples:
- text: 憧れ＆一目惚れでハイになった勢いで憧れのシチュに持っていったはいいが、ずっと頭の中で『私は何を!?』と『グッジョブ、私！』が交互に繰り返されて……
  reading: ''
  annot: 憧れ＆一目惚れでハイになった勢いで憧れのシチュに持っていったはいいが、ず
