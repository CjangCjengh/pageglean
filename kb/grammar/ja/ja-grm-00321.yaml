title: 〜せいで：都怪……（消极原因）
structure: 用言連体形＋せいで（形式名詞「所為」）
structure_pattern: V-連体形 / イ形 / Naな + せいで
explanation_zh: 形式名词「せい」（汉字作“所為”）表示导致不良结果的原因，带有归咎、不满的语气。「〜せいで」作状语，「〜せいだ」作谓语。中文可译为“都怪……”“因为……（而遭殃）”。
examples:
- text: 会った当初から意味不明な好意向けられたせいで散々意識させられて、なのに手を出したらハルマゲドンって言うから
  reading: ''
  annot: 会った当初から意味不明な好意向けられたせいで散々意識させられて、なのに手を出したらハルマゲドンって言うから
