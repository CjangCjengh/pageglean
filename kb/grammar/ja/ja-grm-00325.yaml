title: 〜以上：既然……就……（理由・决意）
structure: 動詞連体形・ナリ活用の「である」＋以上
structure_pattern: V(連体形) / Nである + 以上
explanation_zh: 接续助词「〜以上」表示「既然前项已成立，自然就有后项」，后项多为决心、判断、要求或义务。既可接动词连体形（だった以上），也可接「である」。片段中出现两次，都用于表达不服输的决心。
examples:
- text: スタートが私からだった以上、負けっぱなしは少し悔しい
  reading: ''
  annot: スタートが私[わたし]からだった以上[いじょう]、負[ま]けっぱなしは少[すこ]し悔[くや]しい
  translation_zh: 既然开始是由我主动的，那一直输下去就有点不甘心。
