title: 〜ているんじゃない（口语「〜てんじゃねぇ」）：反诘与责备
structure: V連用形＋補助動詞「ている」＋形式名詞「の」＋ではない → 口语缩约形
structure_pattern: V-連用形 + て + いる + のではない → 口語縮約形
explanation_zh: 「〜ているのではない（〜ているんじゃない）」用反诘语气表示责备、制止或确认；口语中の→ん、ではない→じゃねぇ，缩约为「〜てんじゃねぇ」，语气粗鲁，多为男性使用。助動詞「いる」接动词連用形构成持续体（进行或结果状态），形式名词「の」将其名词化。可理解为汉语的“别正在……啊”“不是正……吗”。
examples:
- text: 出るの遅ぇ！ イチャついてんじゃねぇよ!!
  reading: ''
