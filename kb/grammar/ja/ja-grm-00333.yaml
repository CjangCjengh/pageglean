title: 「〜てしまう／ちゃう」：完成与遗憾
structure: 动词连用形 + 接续助词「て」+ 补助动词「しまう」（口语缩约形「〜ちゃう」）
structure_pattern: V-連用形 + て + しまう / 〜ちゃう
explanation_zh: 补助动词「しまう」接续助词「て」后，表示动作彻底完成或出现不如意、遗憾的结果。口语中「てしまう」缩约为「ちゃう」，如「変えてしまった」→「換えちゃった」。轻小说作者后记等口语性文本中缩约形高频出现，值得掌握。
examples:
