title: 「〜わけではなく」：形式名词「わけ」的部分否定
structure: 用言连体形／体言 + 形式名词「わけ」+ ではない
structure_pattern: V-連体形 / N + わけ + ではない
explanation_zh: 形式名词「わけ」表示道理、原委，「わけではない」对其加以否定，意为“并不是说……”“未必……”，是一种委婉的部分否定。此处用于澄清“并非一开始就打算写成笨蛋情侣作品”。句中「気だった」表示“曾有那个打算”，可一并留意。
examples:
- text: 実は最初からバカップル物にする気だったわけではなく。
  reading: ''
  annot: 実は最初からバカップル物にする気だったわけではなく。
  translation_zh: 其实我也并非一开始就打算写成笨蛋情侣题材。
