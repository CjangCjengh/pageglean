title: 终助词「かな」：自问与委婉推测（口语）
structure: 终止形 + 终助词「かな」
structure_pattern: 終止形 + かな
explanation_zh: 终助词「かな」接文句终止形，表示自问、不确定的推测或轻微的愿望，语气柔和、避免断言。片段中既用于独白式推测「心配する必要はないかな」，也用于引用内心疑问「これでいいのかな？」。口语中常拉长写作「かなー」，是轻小说高频语气表达。
examples:
