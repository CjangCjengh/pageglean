title: 〜んじゃなかった：后悔自语（口语）
structure: 動詞連用形 ＋ んじゃなかった（＝のではなかった）
structure_pattern: V-連用形 + んじゃなかった
explanation_zh: 「のではなかった」的口语缩约：「の」变「ん」、「ては」变「じゃ」。表示对已做之事的后悔自责，“本不该〜的”。多用于自言自语，书面语一般写作「〜べきではなかった」。
examples:
- text: 思わず口からこぼれた言葉に、自分で気落ちする。言うんじゃなかった。
  reading: ''
  annot: 思[おも]わず口[くち]からこぼれた言葉[ことば]に、自分[じぶん]で気落[きお]ちする。言[い]うんじゃなかった。
  translation_zh: 话语不经意脱口而出，我自己都沮丧起来。真不该说出口的。
