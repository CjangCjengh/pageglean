title: 〜はずがない：绝无可能
structure: 用言連体形 ＋ はずが（も）ない
structure_pattern: 用言-連体形 + はずがない
explanation_zh: 形式名词「はず」表示按理应有的预期。「はずがない」强烈否定某种可能性，“不可能〜”。加上「も」的「はずもない」语气更重，带有书面色彩。
examples:
- text: だけど普通に考えてそんなことができるはずもない。
  reading: ''
  annot: だけど普通[ふつう]に考[かんが]えてそんなことができるはずもない。
  translation_zh: 但正常想想，那种事根本不可能做到。
