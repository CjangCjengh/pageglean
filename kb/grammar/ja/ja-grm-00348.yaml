title: 〜ものではない：按常理不该〜
structure: 動詞終止形 ＋ ものではない
structure_pattern: V-終止形 + ものではない
explanation_zh: 形式名词「もの」表示一般性的道理。「〜ものではない」表示按常理、人之常情“不该〜”，语气比「〜てはいけない」更委婉、更具概括性。片段中用以表达不愿去回忆的心情。
examples:
- text: 正直、そんなに思い出したいものではない。
  reading: ''
  annot: 正直[しょうじき]、そんなに思[おも]い出[だ]したいものではない。
  translation_zh: 说实话，那并不是什么想让人回忆起来的事。
