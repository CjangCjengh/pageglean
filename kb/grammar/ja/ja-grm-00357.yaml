title: 〜てしまう（口语〜ちゃう）：完了与意外、遗憾
structure: 動詞連用形＋接続助詞「て」＋補助動詞「しまう」（口語形「ちゃう」）
structure_pattern: V-連用形(て) + しまう / ちゃう(口語)
explanation_zh: 接动词连用形，表示动作彻底完成，或对已然之事带有遗憾、意外的语气。口语中「てしまう」约音为「ちゃう」。例文『憑依しちゃった』即「憑依してしまった」，属典型的轻小说口语用法。
