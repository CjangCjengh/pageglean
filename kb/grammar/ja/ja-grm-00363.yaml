title: 〜てしまう：完成与遗憾（口语约音 ちまう／ちゃう）
structure: 動詞連用形＋て＋しまう（口語音便形：〜ちまう／〜ちゃう）
structure_pattern: V-連用形 + て + しまう → (口) ちまう / ちゃう
explanation_zh: 補助動詞「しまう」接動詞連用形（て形），表示動作完成或帶有遺憾、無可奈何的語氣。口語中常音便為「〜ちまう」（粗豪、偏男性）與「〜ちゃう」（通用）。本段兩種變體並用，是輕小說口語的典型寫法。
examples:
