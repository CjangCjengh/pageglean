title: 〜ておく：事先准备（口语约音 とく）
structure: 動詞連用形＋て＋おく（口語約音形：〜とく）
structure_pattern: V-連用形 + て + おく → (口) とく
explanation_zh: 補助動詞「おく」接動詞連用形，表示為之後的情況預先做好準備或處置。口語中「ておく」約音為「とく」（如「しとく」「やめとく」）。例1同時使用「〜たほうがいい」（最好做……）來徵詢意見。
