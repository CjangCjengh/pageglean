title: 〜のだ／〜んだ：解释说明语气
structure: 用言終止形＋のだ（口語：んだ）
structure_pattern: V/A 終止形 + のだ → (口) んだ
explanation_zh: 形式名詞「の」加斷定助動詞「だ」，表示解釋、說明緣由，帶有把事情說給對方（或自己）聽的語感。口語中「のだ」說成「んだ」。本文敘述用「のだ」、內心獨白用「んだ」，文體層次分明，值得對照體會。
