title: わけがない・わけにもいかない：情理上的不可能
structure: 用言終止形＋わけがない／用言終止形＋わけにもいかない
structure_pattern: V/A 終止形 + わけがない / わけにもいかない
explanation_zh: 形式名詞「わけ」表示道理、情理。「わけがない」是從情理上推斷不可能（不可能……）；「わけにもいかない」是礙於情理而不能做（不能……）。例2中用口語引用助詞「って」代替「と」。
