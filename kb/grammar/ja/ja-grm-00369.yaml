id: ja-grm-00369
language: ja
type: grammar
level: N4
level_rank: 2
title: 〜てくる／〜ていく：移动与变化的趋向
structure: 動詞連用形＋て＋くる／いく（補助動詞）
structure_pattern: V-連用形 + て + くる / いく
explanation_zh: 補助動詞「くる／いく」接動詞連用形，除表示實際移動方向外，還表示事態變化：「〜てくる」表變化向說話點靠近或顯現，「〜ていく」表逐漸远去。「出てくる」指靈魂現身於外，「なってきた」指情緒漸漸產生。
