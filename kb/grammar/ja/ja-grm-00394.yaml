id: ja-grm-00394
language: ja
type: grammar
level: N4
level_rank: 2
title: 〜てしまう：完成与遗憾（口语缩约〜ちゃう）
structure: 動詞連用形＋接続助詞「て」＋補助動詞「しまう」（口语缩约为「〜ちゃう」）
structure_pattern: 'V-連用形 + て + しまう（口語: ちゃう）'
explanation_zh: 补助动词「しまう」表示动作完成或事态不受控地成为现实，常带遗憾、无奈的语气。口语中「てしまう」缩约为「ちゃう」（过去式为「ちゃった」）。片段中既有口语的「萌えちゃった」，也有叙述体的「うつむいてしまう」，可对照体会。
examples:
- text: 童貞くん萌えちゃったかな？
  reading: ''
  annot: 童貞[どうてい]くん萌[も]えちゃったかな？
  translation_zh: 处男君是不是已经心动了呀？
