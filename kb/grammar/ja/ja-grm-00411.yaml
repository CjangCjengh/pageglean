title: 〜なければならない：义务（口语「しなきゃなんねぇ」）
structure: 动词未然形（否定形）+ なければ + ならない → 口语约音 なきゃ + なんない
structure_pattern: V-未然形 + なきゃ + なんない
explanation_zh: 标准形式为〜なければならない，表示义务，「必须做……」。口语中なければ约音为なきゃ，ならない变为なんない，粗鲁的男性语进一步说成ねぇ。片段中主人公硬着头皮吼出这句话给自己壮胆。
