title: 授受动词〜てやる・〜てあげる：恩惠表达
structure: 动词连用形 + て + やる / あげる
structure_pattern: V-連用形 + て + やる / あげる
explanation_zh: 授受动词作补助动词，接动词连用形＋て：〜てあげる语气柔和，〜てやる粗鲁并带男性意志色彩，也可用于威胁。してやんよ是してやるよ的口语约音。片段两句分别呈现女生温和的请求与主人公虚张声势的叫嚣。
