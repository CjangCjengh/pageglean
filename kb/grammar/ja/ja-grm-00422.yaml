title: 「〜にくい：难以〜」
structure: 動詞の連用形＋形容詞型接尾語「にくい」
structure_pattern: V-連用形 + にくい
explanation_zh: 接尾语「にくい」接动词连用形构成形容词，表示该动作难以进行，反义词是「やすい」。活用方式与形容词相同（言いにくい→言いにくかった）。与中文「难以……」「不好……」基本对应。
examples:
- text: 文句も言いにくい。
