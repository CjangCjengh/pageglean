title: 「〜すぎる：过于〜／〜过头」
structure: 動詞の連用形＋上一段動詞「過ぎる」（複合動詞）
structure_pattern: V-連用形 + すぎる
explanation_zh: 动词连用形后接动词「過ぎる」构成复合动词，表示动作的程度过头。口语中常直接以连用形结句，如文中「抱きしめすぎ！」，语气直白随意。形容词词干也可直接接「過ぎる」。
examples:
