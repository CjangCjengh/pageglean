title: 「言わんこっちゃない：我不是说了嘛」
structure: 動詞の未然形＋文語の打消の助動詞「ぬ」の撥音便「ん」＋「こっちゃない（＝ことではない）」
structure_pattern: V-未然形 + ん + こっちゃない（= ことではない）
explanation_zh: 「言わんこっちゃない」由「言わないことではない」演变而来，是看到结果后说「我早就说了吧」的惯用责备语。其中「ん」是文语否定助动词「ぬ」的音便残留（与「知らん」同源），「こっちゃない」是「ことではない」的口语缩约。属口语惯用句。
