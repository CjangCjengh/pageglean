title: まくる：过度地做某事
structure: 动词连用形 ＋ まくる
structure_pattern: V連用形 + 複合動詞「まくる」
explanation_zh: 「〜まくる」是接在动词连用形后的复合动词，表示动作被反复、过度地进行，带有『过头、不像话』的语感。文中两次出现：『ナンパしまくって』与『磨きがかかりまくっている』，均强调程度之甚。可译为『拼命地……／……得不得了』。
examples:
- text: 女の子をナンパしまくって何をするつもりだったのか訊ねてみると
