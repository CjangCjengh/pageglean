title: ておく／とく：事先处置与口语约音
structure: 动词连用形 ＋ ておく（口语约音：〜とく）
structure_pattern: V連用形 + て + 補助動詞「おく」（口語約音：とく）
explanation_zh: 「〜ておく」由动词连用形＋接续助词「て」＋补助动词「おく」构成，表示事先做好某事或暂且采取某种处置。口语中常约音为「〜とく」：『いっとけ＝言っておけ』『見といて＝見ておいて』。文中完整形与约音形同时出现，可对照掌握。
examples:
- text: とりあえず『硬派でいっとけ』と書いておいたら
  reading: ''
  annot: とりあえず『硬派[こうは]でいっとけ』と書[か]いておいたら
  translation_zh: 我姑且回了一句『先走硬汉路线吧』，结果……
