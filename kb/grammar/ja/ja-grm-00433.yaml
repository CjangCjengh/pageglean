title: 被动助动词れる＋ている：被动结果状态
structure: 被动助动词 れる/られる 接用言未然形，后续补助动词 ている
structure_pattern: V-未然形 + れる + ている
explanation_zh: 被动助动词れる/られる接动词未然形，此处再与补助动词ている搭配，表示“被写上、被放上”等动作以结果状态存续，多用于书面性描写。文中“書かれている”反复出现，描述笔记上的留言。另有被动叠加愿望助动词たい的形式（ワサワサされたい）。
examples:
- text: 一番上に乗せられているメモには『わたしなりに坂本くんをかっこよくプロデュースしてみました！』と書かれている。
  reading: ''
  annot: 一番上[いちばんうえ]に乗[の]せられているメモには『わたしなりに坂本[さかもと]くんをかっこよくプロデュースしてみました！』と書[か]かれている。
  translation_zh: 放在最上面的那张便签上写着：“我用我自己的方式把坂本同学打造得帅帅的啦！”
