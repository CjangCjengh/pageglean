title: のだ・なのです：解释与断言语气
structure: 用言终止形 + 形式名词 の + 判断助动词 だ／です
structure_pattern: 终止形 + のだ / なのです
explanation_zh: 形式名词の（准体助词）与判断助动词组合，表解释说明或加强断言语气，だ为常体，です为敬体。文中妹妹通篇使用「なのです」，语气稚气又一本正经，是塑造人物口癖的典型手段。
examples:
