title: 假装……：〜ふりをする
structure: 连体修饰＋名词ふり＋する
structure_pattern: V-連体形 + ふりをする
explanation_zh: 「ふり」为名词，意为“样子、姿态”，前接连体修饰语，与「する」搭配表示装出某种样子。「興味ないふり」即假装不感兴趣。文中主角借此描写自己刻意装作漫不经心的样子。
examples:
- text: あくまでさりげなく。興味ないふりを演じて。
  reading: ''
  annot: あくまでさりげなく。興味ないふりを演じて。
  translation_zh: 务必显得不经意。装出一副不感兴趣的样子。
