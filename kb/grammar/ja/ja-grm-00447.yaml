title: 「〜ておく／〜とく：事先处置」
structure: 动词连用形＋ておく（口语缩约：とく）
structure_pattern: V-連用形 + 接続助詞「て」 + 補助動詞「おく」（口語縮約「とく」）
explanation_zh: 补助动词「おく」接动词连用形，表示为之后做准备而事先做某事，或让某种状态暂时保持。口语中「ておく」常缩约为「とく」，「しといた」即「しておいた」。片段中「黙っておく」「統一しといた」均为事先处置的用法。
examples:
- text: なんとか言い逃れの言葉を捜索してみるが、逆にボロが出そうなのでもう黙っておくことにした。
  reading: ''
  annot: なんとか言[い]い逃[のが]れの言葉[ことば]を捜索[そうさく]してみるが、逆[ぎゃく]にボロが出[で]そうなのでもう黙[だま]っておくことにした。
  translation_zh: 我试着搜罗些搪塞的话，可那样反而容易露馅，索性决定保持沉默。
