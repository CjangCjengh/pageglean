id: ja-grm-00456
language: ja
type: grammar
level: N4
level_rank: 2
title: 〜んだ（のだ）：解释与强调的语气
structure: 用言連体形＋んだ／体言＋なんだ
structure_pattern: 用言-連体形 + のだ(んだ) / 体言 + なのだ(なんだ)
explanation_zh: 「のだ」由形式名词「の」＋断定の助動詞「だ」构成，口语中「の」说成「ん」，用于解释原因、说明情况或加强语气。文中「ちがうんだ」「そんなんじゃないんだ」（「そんなん」＝「そんなの」）反复出现，表现主角慌乱的自我否认。「なに考えてんだ」则是「なにを考えているのだ」省略「いる」的更随意的口语形式。
