title: 〜やがる：轻蔑与恼怒（补助动词）
structure: 动词连用形＋补助动词「やがる」
structure_pattern: V連用形 + やがる
explanation_zh: 补助动词「やがる」接动词连用形，表示说话人对他人行为的轻蔑、厌恶或恼怒，近于竟然、胆敢〜。文中「出しやがって」以连用形结句，留下愤愤的余白。属粗俗口语，只用于极随便的场合，轻小说吐槽中常见。
examples:
