title: 〜わけがない：按常理绝无可能
structure: 普通形 + わけ + が + ない
structure_pattern: 普通形 + わけ + が + ない
explanation_zh: 形式名词「わけ」本义为"道理、缘由"，加上主格助词「が」与否定，构成强烈否定推断，意为"按道理不可能~"，语气远强于单纯的「〜ない」。中文可译为"不可能~""哪能~"。注意与表示解释说明的「〜わけだ」区分。
examples:
- text: だけど、だからといってそれを見過ごすなんてできるわけがない。
  reading: ''
  annot: だけど、だからといってそれを見過ごすなんてできるわけがない。
  translation_zh: 但是，就算如此，我也绝不可能对那件事视而不见。
