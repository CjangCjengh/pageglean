title: のだ／んです：说明解释语气
structure: 形式名词の + 判断助动词だ／です（口语中音便为んだ／んです）
structure_pattern: 简体小句 + のだ／んです
explanation_zh: 形式名词の加判断助动词构成のだ，口语中说成んだ／んです，表示解释说明或强调主张，提示事情有其缘由。片段里「したいんです」用于拼命恳求，「思ってるんだ」用于愤怒质问。与接续助词から呼应构成「…からだ」，即对事态的原因作解释说明。
examples:
- text: 俺はあなたとどうしても話がしたいんです！
  reading: ''
  annot: 俺[おれ]はあなたとどうしても話[はなし]がしたいんです！
  translation_zh: 无论如何我都想和您谈一谈！
