title: 尊敬语动词〜なさる・〜くださる（敬语）
structure: 动词连用形 + 尊敬语特殊动词なさる／くださる
structure_pattern: V-连用形 + くださる／なさる
explanation_zh: 学校文法中尊敬语可由特殊尊敬动词构成：动词连用形后接なさる或くださる，其命令形分别是なさい、ください。片段里「怯えなさっている」是尊敬与ている叠加，描写夫人的状态；「教えてくださる？」用くださる以疑问形式委婉提出请求。
examples:
- text: ね、お名前教えてくださる？
