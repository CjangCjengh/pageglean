title: 样态助动词「〜そうだ」：看起来……
structure: 動詞連用形・形容詞語幹・形容動詞語幹＋様態の助動詞「そうだ」
structure_pattern: V連用形/Adj語幹 + そうだ(助動詞)
explanation_zh: 样态助动词「そうだ」接动词连用形或形容词语干后，表示凭眼前景象作出的直观判断，即“看起来……”。片段中「嬉しそう」「おとなしそう」「不健康そう」都是凭外观推断的印象。注意与接终止形的传闻助动词「そうだ」（“听说”）相区别。
examples:
- text: おとなしそうな子だったわ。
  reading: ''
  annot: おとなしそうな子[こ]だったわ。
  translation_zh: 是个看起来文文静静的孩子呢。
