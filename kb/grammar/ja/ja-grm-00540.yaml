title: 连用形中止法：书面语中的句子并列（口语「て形」的书面说法）
structure: 動詞連用形による中止法（接続助詞「て」を用いない並列接続）
structure_pattern: V連用形(中止法)
explanation_zh: 中止法指以动词连用形（而非「て」）连接句子的书面接续方式，语气比「て」更凝练、更具文学性。片段以一连串连用形中止法回顾相册中少女成长的瞬间，营造出回忆般的抒情节奏。轻小说叙事段落中常见的书面语接续。
examples:
