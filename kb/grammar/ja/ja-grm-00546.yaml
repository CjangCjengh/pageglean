id: ja-grm-00546
language: ja
type: grammar
level: N3
level_rank: 3
title: 「らしい・ようだ・みたいだ」：推测与传闻
structure: 用言終止形＋助動詞「らしい」／用言連体形＋助動詞「ようだ」／（口語）用言終止形＋みたいだ
structure_pattern: 用言終止形+らしい／用言連体形+ようだ／用言終止形+みたいだ
explanation_zh: 「らしい」是助動詞，表基于传闻或客观迹象的推测；「ようだ」也是助動詞，接用言連体形，表主观比喩或推测；「みたいだ」是口語中相当于「ようだ」的说法。片段中它们反复出现（含连用中止形「らしく」），呈现叙述者边观察边揣测的语气。
examples:
- text: どうやらマジに怒ったみたいだ。わかるだろ？
