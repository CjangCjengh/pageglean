title: 形式名词「わけ」：わけがない／わけにはいかない
structure: 用言終止形＋形式名詞「わけ」＋「が＋ない」／「には＋いかない」
structure_pattern: V終止形+わけがない／V終止形+わけにはいかない
explanation_zh: 「わけ」是形式名词，表示情理、道理。「わけがない」从情理上彻底否定，意为“不可能…”；「わけにはいかない」表示碍于情理、立场而“不能…”，否定的是行为的选择余地。两者都是书面与口语通用的常用表达。
examples:
- text: だけど、引くわけにはいかない。
  reading: ''
  annot: だけど、引[ひ]くわけにはいかない。
  translation_zh: 但是，我不能退缩。
  source_book: book-ja-011
