title: 「〜なければよかった：追悔过去」
structure: 动词未然形 + 助动词「ない」假定形「なければ」 + 「よかった」
structure_pattern: V-未然形 + なければ + よかった
explanation_zh: 表示对既成事实的后悔，「早知道就不……／要是没……就好了」。由动词未然形接否定助动词「ない」的假定形「なければ」，再加「よかった」构成。与单纯否定不同，专用于追悔已发生之事。
examples:
- text: おまえなんかに関わらなければよかったよ
  reading: ''
  annot: おまえなんかに関[かか]わらなければよかったよ
  translation_zh: 真后悔跟你这种家伙扯上关系。
