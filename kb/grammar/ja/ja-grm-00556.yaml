title: 「〜あげく：……到最后（多指坏结果）」
structure: 动词连体形（た形） + 形式名词「あげく（挙げ句）」
structure_pattern: V-た + あげく（に）
explanation_zh: 表示经过一段时间或一番过程之后，最终导致（多为不好的）结果，「……到最后竟然……」。前接动词た形或「名词＋の」。多含消极评价。
examples:
- text: 男同士の喧嘩にほうきをもって乱入したあげくヒートアップさせたり
