title: 「〜たびに：每当……」
structure: 连体形 / 名词＋の + 形式名词「たび（度）」 + 助词「に」
structure_pattern: V-連体形／Nの + たびに
explanation_zh: 「たびに」意为「每当……的时候」，前后两事每次都相伴发生。由形式名词「たび」（次、回）＋助词「に」构成。强调反复性与规律性。
examples:
- text: その度に教師に呼び出されては怒られていたよ。
  reading: ''
  annot: その度[たび]に教師[きょうし]に呼[よ]び出[だ]されては怒[おこ]られていたよ。
  translation_zh: 每次（出事）都被老师叫去训一顿。
