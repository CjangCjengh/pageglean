title: まるで〜ようだ：简直像……一样
structure: 副词「まるで」＋体言＋「の/みたいな」＋形式名词「ようだ」；或用言连体形＋「ようだ」
structure_pattern: まるで + N + のようだ / V連体形 + ようだ
explanation_zh: 形式名词「よう」表样子，与副词「まるで」呼应构成比喻，“简直像……一样”。既可接“体言＋の/みたいな”，也可接用言连体形。本段用它渲染沉重氛围，如“仿佛在拒绝活下去”。
examples:
- text: まるで遺書みたいなメールだったよ。
  reading: ''
  annot: まるで遺書[いしょ]みたいなメールだったよ。
  translation_zh: 那简直就是一封遗书般的邮件。
