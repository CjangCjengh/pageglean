title: 〜ものなら：“有本事就……”（接可能形的挑衅条件）
structure: 动词可能形＋ものなら
structure_pattern: V-可能 + ものなら
explanation_zh: 形式名词「もの」接助动词「だ」的假定形「なら」，与可能动词搭配，以“如果你真有本事……”的口吻提出实际上极难实现的假设，后项常接命令形构成挑衅。片段中风城以此回应坂本“止められるものなら止めてみろ”。
examples:
- text: 止められるものなら止めてみろ。
  reading: ''
  annot: 止[と]められるものなら止[と]めてみろ。
  translation_zh: 你有本事拦住我，就来试试看啊。
