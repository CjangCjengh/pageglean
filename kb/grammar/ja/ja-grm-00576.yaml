title: 「〜次第だ」：全看……而定
structure: 体言＋形式名詞「次第」＋だ
structure_pattern: N + 次第だ
explanation_zh: 形式名词「次第」接在体言后，表示『完全取决于……、全看……』。片段「おまえら次第だ」即『接下来就看你们自己了』。另注意「〜次第」还有『一……马上……』的意思，属另一用法。
examples:
- text: そこから先はおまえら次第だ！
