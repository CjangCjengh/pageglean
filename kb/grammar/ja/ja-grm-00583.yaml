title: 〜始める／〜出す：动作的开始（起始体貌）
structure: 动词连用形＋复合动词后项「始める」／「出す」
structure_pattern: V(連用形) + 始める/出す
explanation_zh: 接在动词连用形后构成复合动词，表示动作或变化的开始。「〜始める」侧重渐进的开始，如“気づき始める”（开始察觉）；「〜出す」侧重突然、不由自主的开始，如“泣き出す”（快要哭出来）。是轻小说中常见的体貌表达。
examples:
- text: この時点でうっすらと気づきはじめる。
  reading: ''
  annot: この時点[じてん]でうっすらと気[き]づきはじめる。
  translation_zh: 到这个阶段，我开始隐约察觉到了。
