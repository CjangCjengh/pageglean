title: 〜しかない：唯一的选择
structure: 动词连体形 ＋ しかない
structure_pattern: V-连体形 + しかない
explanation_zh: 「しかない」接在动词连体形后，表示除此之外别无选择，相当于“只能～、只好～”。语感带有下定决心或无计可施的意味，常用于独白与决断场面。文中「やるしかないな」正是主人公下定决心的自语。
