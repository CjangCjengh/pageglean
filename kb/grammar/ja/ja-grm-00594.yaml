title: 「命令形・禁止形：〜ろ／〜め／〜な」
structure: 動詞命令形（一段〜ろ・五段え段音）／未然形 ＋ な（禁止）
structure_pattern: V-命令形 / V-未然形 + な
explanation_zh: 命令形是动词活用形之一：一段动词为「〜ろ」（見せろ），五段动词为词尾え段音（読め）。禁止用「未然形＋な」，口语常作「〜すんな」（するな）。男性角色和粗暴场面高频使用，风城的台词几乎全由命令形构成。
