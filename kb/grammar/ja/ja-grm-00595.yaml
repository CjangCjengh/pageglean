id: ja-grm-00595
language: ja
type: grammar
level: N3
level_rank: 3
title: 「〜とは：意外的感叹」
structure: … ＋ とは（詠嘆・意外，後続の述語は省略されることが多い）
structure_pattern: … + とは
explanation_zh: 句末的「とは」表示出乎意料的惊讶与感叹，相当于“竟然……！”，其后的谓语（如「思わなかった」）常省略。文中「ツッコミをするとは！」「こんな趣味があったとは」都表达强烈的意外。
examples:
- text: おお、このカタブツがツッコミをするとは！
  reading: ''
  annot: おお、このカタブツがツッコミをするとは！
  translation_zh: 哦哦，没想到这块木头居然会吐槽！
