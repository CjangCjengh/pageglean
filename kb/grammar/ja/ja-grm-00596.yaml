title: 「〜つもり：打算与意图」
structure: 動詞辞書形 ＋ 形式名詞「つもり」
structure_pattern: V-辞書形 + つもり
explanation_zh: 形式名词「つもり」接动词辞书形，表示主观的打算或意图，“打算……／本以为……”。文中「死ぬつもりで」意为“本已抱着去死的决心”，与「てっきり（满以为）」呼应，突显事与愿违的反差。
examples:
- text: 俺、死ぬつもりで……てっきり……
