title: 〜じゃん：寻求认同的口语终助词
structure: 用言終止形＋じゃん
structure_pattern: 用言終止形 + じゃん（終助詞、「じゃない」の縮約）
explanation_zh: 终助词，由「じゃない」缩约而来，属口语用法。用于向对方确认或提醒双方共知的事实，语气轻松随意，相当于中文的“……嘛”“……不是吗”。轻小说会话中高频出现，正式文体中应避免使用。
examples:
