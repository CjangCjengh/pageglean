title: 〜つもりだ：意图与打算
structure: 動詞終止形＋つもりだ
structure_pattern: V終止形 + つもり（形式名詞） + だ（助動詞）
explanation_zh: 形式名词「つもり」表示主观的打算、意图，后接断定助动词「だ」。片段以「死ぬつもりでいたのに」的形式出现：「つもりでいる」强调持续抱有某种打算的状态，「のに」表示与预期相反。中文可译为“明明打算……却……”。
examples:
- text: 俺は本気で死ぬつもりでいたのに……
