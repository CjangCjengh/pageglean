title: 〜すぎる：程度过头
structure: 動詞連用形・形容詞語幹＋すぎる
structure_pattern: V連用形／A語幹 + すぎる（接尾語）
explanation_zh: 由动词「過ぎる」虚化而来的接尾语，接动词连用形或形容词语干，表示程度过头、超出适当范围。如「血がのぼりすぎる」（血往上冲得太猛）、「いい男すぎる」（帅过头了）。在日常会话与轻小说中都是极常用的表达。
examples:
- text: 頭に血がのぼりすぎたか？
  reading: ''
  annot: 頭[あたま]に血[ち]がのぼりすぎたか？
  translation_zh: 是血往上冲得太猛了吗？
