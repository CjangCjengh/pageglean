title: 「〜とのこと」：书面化的传闻“据说”
structure: 引用文 ＋ 引用助词「と」＋ 形式名词「こと」＋ 断定（だ）的省略
structure_pattern: 文 + とのこと
explanation_zh: 「とのこと」是引用助词「と」＋形式名词「こと」＋断定的省略形式，用于客观转述他人或书面内容，相当于“据说”“听说是……”。语气较「〜そうだ」更书面、更疏离。片段中用于转述妹妹留下的便条内容。
examples:
- text: なんでだろ？ よくわかんないけど仲直りするチャンスだよね！』とのこと。
  reading: ''
  annot: なんでだろ？ よくわかんないけど仲直[なかなお]りするチャンスだよね！』とのこと。
  translation_zh: （便条上）写道：“为什么呢？不太明白，但这是和好的机会对吧！”
