title: 〜そこねる：没能做成〜
structure: 动词连用形（ます形去掉ます）＋そこねる
structure_pattern: V-連用形 + そこねる
explanation_zh: 复合动词「〜そこねる」接在动词连用形之后，表示没能做成某事、错过了做某事的时机。「助けそこねる」即“没能救成”。语气上常带有遗憾与失误感，是小说叙事中常见的体貌表达。
examples:
- text: 俺がたすけそこねたままだった、あの──。
  reading: ''
  annot: 俺[おれ]がたすけそこねたままだった、あの──。
  translation_zh: 那就是我终究没能救出的那个──。
