title: 「〜にしろ」：即使～也～
structure: 疑問詞／体言＋にしろ（＝にしても）
structure_pattern: 疑問詞 + にしろ
explanation_zh: 表示让步，“即使是～也…”，与「にしても」同义；「疑問詞＋にしろ」表示“无论…都…”。原文「どういう結果にしろ」即“无论结果如何”。同型的「にせよ」语气更硬一些。
examples:
- text: どういう結果にしろ、戦を止めた者を憎んではいない
  reading: ''
  annot: どういう結果[けっか]にしろ、戦[たたかい]を止[と]めた者[もの]を憎[にく]んではいない
  translation_zh: 无论结果如何，我们并不憎恨终结了战争的人。
