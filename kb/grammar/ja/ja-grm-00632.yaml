title: 「〜ことにする」：决定与“当作……”
structure: 动词终止形＋形式名词「こと」＋する
structure_pattern: V-終止形 + ことにする
explanation_zh: 形式名词「こと」把前面的句子名词化，后接「する」表示说话人主观上做出决定或认定。既可用于“决定做某事”（决定把自己交给睡意），也可用于“明知并非如此却当作如此”（当作没发生）。后者带刻意无视事实的语感，是口语与小说中的常用表达。
