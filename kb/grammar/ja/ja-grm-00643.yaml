title: 〜なくもない：並非不…（雙重否定）
structure: 動詞未然形＋ない＋くもない（形容詞型二重否定）
structure_pattern: V-未然形 + ない + くもない
explanation_zh: 「分からない」的未然形「分からな」＋「くもない」，構成雙重否定，表示「並非不能理解＝某種程度上可以理解」。語氣比直接肯定更委婉含蓄，帶有保留態度。口語中也說「ないことはない」。
examples:
