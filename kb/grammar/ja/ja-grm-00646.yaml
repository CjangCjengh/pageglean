title: 〜てくれると嬉しい：委婉期望（如果你……我会很高兴）
structure: 動詞連用形＋接続助詞「て」＋補助動詞「くれる」＋仮定の「と」＋「嬉しい」
structure_pattern: V-て + くれる + と + 嬉しい
explanation_zh: 授受补助动词「てくれる」（对方为我方做某事）后续表示假定条件的助词「と」，再加情感形容词「嬉しい」，构成委婉的请求或期望。语气柔和礼貌，是自我介绍、拜托他人时的实用句型。
examples:
- text: リアみたいに上手くお話はできませんが、私も仲良くしてくれると嬉しいですっ。
  reading: ''
  annot: リアみたいに上手[うま]くお話[はなし]はできませんが、私[わたし]も仲良[なかよ]くしてくれると嬉[うれ]しいですっ。
  translation_zh: 我没办法像莉亚那样能言善道，但大家要是愿意和我友好相处，我会很高兴的。
