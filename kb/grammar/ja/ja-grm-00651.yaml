title: 〜と言わんばかりに：仿佛在说……似的
structure: 引用「と」 + 言わ（未然形）＋ ん（文語推量）+ ばかりに
structure_pattern: 〜と + 言わん + ばかりに
explanation_zh: 「言わん」是文語表達，意為「快要說、彷彿要說」（動詞未然形接推量助動詞「ん」，含否定意味，相當於「言わないだろう」）。後接助詞「ばかりに」表示「幾乎就是那樣的樣子」。整體為書面色彩濃厚的慣用句式。
examples:
- text: 『よくある事』と言わんばかりに授業に戻る
