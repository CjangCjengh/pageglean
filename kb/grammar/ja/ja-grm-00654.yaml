title: 〜とはいえ：让步，“虽说……却……”
structure: 用言終止形・体言＋接続助詞「とはいえ」
structure_pattern: V終止形 / 体言 + とはいえ
explanation_zh: 由格助词「と」加动词「言う」构成，意为“虽说……但……”。承认前项事实，但后项引出与其预期相反的结论，属书面语色彩较浓的让步表达。
examples:
- text: しかし。系統が違うとはいえ、リアのルックスがイスカに劣っているとは思えない。
  reading: ''
  annot: しかし。系統[けいとう]が違[ちが]うとはいえ、リアのルックスがイスカに劣[おと]っているとは思[おも]えない。
  translation_zh: 不过。虽说系别不同，但我不觉得莉亚的外貌逊色于伊斯卡。
