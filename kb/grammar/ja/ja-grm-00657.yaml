title: 〜てみる：试着做……
structure: 動詞連用形＋接続助詞「て」＋補助動詞「みる」
structure_pattern: V-連用形 + て + みる
explanation_zh: 补助动词「みる」接动词连用形＋て，表示尝试做某事，意为“试着……”。口语中常以请求形「〜てみて」「〜てみてくれ」出现。
examples:
