title: 〜と言うより〜と言うべき：与其说……不如说理应……
structure: 引用助词「と」＋动词「言う」＋比较助词「より」……＋文语助动词「べし」的连体形「べき」
structure_pattern: 〜と言う + より + 〜と言う + べき
explanation_zh: 「〜と言うより〜」表示“与其说是……不如说……”，用于提出更准确的说法来修正前项。「べき」是文语助动词「べし」（表示当然、义务）的连体形，「言うべき」即“理应这么说”。
examples:
- text: 『戦う』と言うより『向き合う』と言うべきか
  reading: ''
