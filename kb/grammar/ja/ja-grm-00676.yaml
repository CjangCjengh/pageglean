title: お〜いただく：谦让语"承蒙……"
structure: お + 体言（動作性名詞） + いただく
structure_pattern: お + N + いただく
explanation_zh: 「いただく」是「もらう」的谦让语（謙譲語），「お〜いただく」表示承蒙对方为自己做某事，抬高对方、放低自己。句中「お気遣い頂いた」是较郑重的措辞，与全篇随意的口语形成语体反差，体现敬语层次。
examples:
- text: ええ、いろいろお気遣い頂いたようですから。せめて遅刻はしないように、と
  reading: ''
  annot: ええ、いろいろお気遣[きづか]い頂いたようですから。せめて遅刻[ちこく]はしないように、と
  translation_zh: 嗯，毕竟承蒙她多方关照。至少要做到不迟到——她是这么说的。
