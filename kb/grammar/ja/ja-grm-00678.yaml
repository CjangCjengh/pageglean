title: 授受表现「〜てもらう」：接受他人为自己做…（此处用命令形）
structure: V-連用形＋て ＋ 授受動詞「もらう」〈命令形：もらえ〉
structure_pattern: 'V-て + もらう (命令形: もらえ)'
explanation_zh: 「てもらう」表示说话人或相关者接受他人为自己做的动作，属授受动词。此处用其命令形「もらえ」，表面是命令对方“让人多抱紧你”，带调侃与推开的语气。授受表达须依说话人立场选择，是日语核心难点。
examples:
- text: たくさん抱きしめてもらえ
  reading: ''
