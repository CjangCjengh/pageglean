title: 助词「〜し」：列举理由（…又…）
structure: 文（終止形）＋助詞「し」（理由の列挙）
structure_pattern: 普通形 + し
explanation_zh: 助词「し」接于句末，列举多个理由中的一项，含“既…又…”之意，语气较随意。此处“反正也只是在打闹嘛”。常与「から／だし」呼应，口语与叙述均常见。
examples:
- text: じゃれ合ってるだけみたいだし
  reading: ''
