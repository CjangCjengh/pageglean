title: らしい：推测与传闻
structure: 体言・用言終止形＋推量助動詞「らしい」（推量・伝聞）
structure_pattern: N/Adj/V-終止形 + らしい
explanation_zh: 推量助動詞「らしい」接体言或用言終止形之后，有两种用法：基于某种根据的推测（好像……）和转述他人话语的传闻（听说……）。本片段两处分别体现这两种用法。
examples:
- text: このアホアホな感じが生徒には人気らしいが、俺にはよくわからん。
  reading: ''
  annot: このアホアホな感[かん]じが生徒[せいと]には人気[にんき]らしいが、俺[おれ]にはよくわからん。
  translation_zh: 这副傻乎乎的样子在学生中好像挺有人气的，我可完全搞不懂。
