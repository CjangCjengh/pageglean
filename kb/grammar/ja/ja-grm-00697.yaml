title: 〜のです／〜のだ：解释与强调语气
structure: 普通形＋のだ／のです（准体助詞「の」＋断定的助動詞）
structure_pattern: 普通形 + のだ/のです
explanation_zh: 准体助词「の」加断定表达「だ／です」构成「のだ／のです」，用于解释缘由或强调主张，语气比直接断定更强。妹妹的口癖「〜なのです！」和规则条文中的「〜のだ！」都靠它营造煞有介事的口吻。
