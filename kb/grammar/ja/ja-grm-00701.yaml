title: 「〜はずだ」：基于事理的预期
structure: 用言連体形（或体言）＋形式名词「はず」＋断定助动词「だ」
structure_pattern: V/A普通形 + 形式名词「はず」 + だ
explanation_zh: 形式名词「はず」表示基于某种依据“理应如此”的预期。文中反复出现「あってもいいはずなんだ」「あるはずだ」，主人公借此确认悲伤之情本该存在。否定推断则用「はずがない／わけがない」。
examples:
- text: そう、あってもいいはずなんだ。
  reading: ''
  annot: そう、あってもいいはずなんだ。
  translation_zh: 对，（那份悲伤）本来就该有的。
  source_book: book-ja-011
