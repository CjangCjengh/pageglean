title: ちゃう／ちゃった：〜てしまう的口语缩约
structure: 動詞連用形＋てしまう → ちゃう
structure_pattern: V-連用形 + て + しまう → ちゃう
explanation_zh: 「〜てしまう」在口语中缩约为「ちゃう」，表示完成或带来遗憾、难为情的结果。片段中既有缩约体「失敗しちゃった」，也有原形「しまった」，可对照体会。遗憾语气的「しまった」是独白中的高频感叹。
examples:
- text: 失敗しちゃったけど、ヒーローになりたかったんだよね。
  reading: ''
  annot: 失敗[しっぱい]しちゃったけど、ヒーローになりたかったんだよね。
  translation_zh: 虽然搞砸了，但你是想成为英雄来着对吧。
  source_book: book-ja-011
