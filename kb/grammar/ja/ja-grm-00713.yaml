title: 〜っけ：唤起记忆与确认的终助词
structure: 用言終止形（简体，多接た形）＋っけ
structure_pattern: V/A-終止形(简体) + っけ
explanation_zh: 终助词「っけ」用于追忆、确认记忆中含糊的事，相当于“……来着？”“……了吗？”。常接过去助動詞「た」之后。轻小说独白中用来营造回忆与不确定的语感，属典型口语表达。
examples:
