title: 使役＋てもらう：承蒙允许做某事（揉ませてもらった）
structure: 动词未然形＋使役助动词「せる」连用形＋て＋もらう
structure_pattern: V-未然形 + せる + て + もらう
explanation_zh: 五段动词未然形接使役助动词「せる」（一段动词接「させる」）构成使役，其连用形后接「てもらう」表示承蒙对方允许自己做某事。文中「揉ませてもらった」即「揉む」未然形「揉ま」＋せる→「揉ませ」＋て＋もらう。使役与授受叠加，中文可译为“（她）让我摸了”。
examples:
- text: 揉ませて……もらった……？
