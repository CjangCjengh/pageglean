title: のだ／んだ：解释与强调语气
structure: 用言・助动词终止形＋形式名词「の」＋断定助动词「だ」（口语：んだ）
structure_pattern: 普通体 + のだ/んだ
explanation_zh: 形式名词「の」加断定助动词「だ」表示解释说明或强调，口语缩为「んだ」。用于问句时追问缘由（なにやってんだよ＝何をしているのだ），陈述句则加强理由（難しいんだから）。本段多处出现，是口语情绪表达的核心句式。
