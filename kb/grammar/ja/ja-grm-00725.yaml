title: 〜のだ（んです）：解释说明语气
structure: 動詞連体形＋のだ；名詞・な形容詞語幹＋な＋のだ
structure_pattern: V-連体形 + のだ；N/ナ形容詞語幹 + な + のだ
explanation_zh: 「のだ」接动词连体形（名词、な形容词加な），表示解释、说明或强调，带有说话人领悟、向对方主张的语气。口语中缩为「んだ」，礼貌体为「のです」。旁白用「そこにあったのだ」营造恍然自嘲的语气，人物台词「ゴミなのです」则让角色语气显得俏皮。
examples:
- text: そう、いわゆるＢＬ本がそこにあったのだ。
