title: 受身（れる・られる）：被动与受害被动
structure: 動詞未然形＋助動詞「れる・られる」
structure_pattern: V-未然形 + れる・られる
explanation_zh: 学校文法将被身（被动）处理为助动词「れる・られる」接动词未然形（五段动词用れる，一段动词用られる）。本段多为说话人遭受不快的“受害被动”：铃声被擅改、被人嘲笑、被不意打ち地祝贺。与「ていた・ている」连用时表示被动状态的持续。
examples:
- text: 不意打ちでお祝いをされた日もある。
  reading: ''
  annot: 不意打[ふうい]ちでお祝[いわ]いをされた日[ひ]もある。
  translation_zh: 也有被搞突然袭击般祝贺过的日子。
  source_book: book-ja-011
