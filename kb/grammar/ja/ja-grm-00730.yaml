title: 〜じゃん（か）：指出事实、寻求认同（口语终助词）
structure: 用言終止形＋じゃん（か）
structure_pattern: V/形容詞-終止形 + じゃん（か）
explanation_zh: 口语终助词「じゃん（か）」是「じゃないか」的缩略，以轻松的语气指出事实、寻求认同或轻度吐槽。「かわいいとこもあるじゃんか」即“不是也有可爱的一面嘛”。属关东系随意说法，轻小说对话中高频出现。
