id: ja-grm-00732
language: ja
type: grammar
level: N4
level_rank: 2
title: 〜やがる：轻蔑与不满的粗俗助动词
structure: 五段動詞連用形（サ変「しやがる」）＋ やがる
structure_pattern: V(五段/サ変)連用形 + やがる
explanation_zh: 接在五段动词连用形（サ変用「しやがる」）后，表示说话人的轻蔑、恼怒或不满，语气粗鲁，多见于男性口语。う・つ・る的音便形之后常以「〜ていやがる」形式出现（如「ぶらさがっていやがる」）。可译为“竟然……”。
examples:
