title: 〜ておく→〜とけ：预先处置的口语命令形
structure: 動詞連用形 ＋ ておく（補助動詞）→ 口語約音「とく」→ 命令形「とけ」
structure_pattern: V-連用形 + ておく → とく → とけ
explanation_zh: 补助动词「おく」接在动词连用形后，表示事先做好某事或使某状态保持下去。口语中「ておく」约音为「とく」，其命令形「〜とけ」语气强硬，多用于粗鲁的忠告或命令。
examples:
- text: そこは友達とかでごまかしとけよ！
  reading: ''
