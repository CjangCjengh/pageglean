title: 〜ですよね：征求同意的句尾语气
structure: 述辞終止形 ＋ 終助詞「よ」「ね」／〜と思いませんか
structure_pattern: 述文 + ですよね／〜と思いませんか
explanation_zh: 句尾叠加终助词「よ」（提示）与「ね」（求同），向对方征求同意与共鸣；「〜と思いませんか」以反问形式寻求认同。这一句式在本段提问箱文体的引文中高频出现，是典型的互动口吻。
examples:
