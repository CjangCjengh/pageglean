title: 使役助动词「せる」：使令与阻止
structure: 動詞未然形＋せる（五段・サ変）／させる（下一段・カ変）
structure_pattern: V未然形 + せる/させる
explanation_zh: 学校文法中「せる」「させる」是接在动词未然形后的使役助动词，表示使令、容许或阻止。「言わせるな」是使役加禁止，意为别让我反复说；「そうはさせない」是使役加否定，表示不会让对方得逞、阻止事态发生。
examples:
- text: 何度も言わせるな。
  reading: ''
