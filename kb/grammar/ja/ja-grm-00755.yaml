title: 解释与主张的「のだ／んだ」
structure: 用言終止形＋形式名詞「の」＋だ（口語形：んだ）
structure_pattern: V/A終止形 + のだ/んだ
explanation_zh: 形式名词「の」把前面的句子体言化，再由断定助动词「だ」结句，表示对理由、情况的解释或强调主张。口语中缩约为「んだ」，如「そうじゃないんだ」「証拠なんだよ」。本片段大量使用，用于加强辩驳与恳求的语气。
examples:
- text: 違う！ そうじゃないんだ！
