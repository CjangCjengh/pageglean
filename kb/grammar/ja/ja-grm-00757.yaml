title: 「〜てもしかたがない」：无济于事、无可奈何
structure: 動詞連用形（五段経音便）＋接続助詞「ても」＋しかたがない
structure_pattern: V連用形 + ても + しかたがない
explanation_zh: 接续助词「ても」接动词连用形，表示逆接让步，相当于“即使……也”。「しかたがない」意为没有办法、无可奈何。「生きていてもしかたがない」即“活着也没有意义”，表达说话人的绝望心境。
examples:
- text: 俺はもう生きていてもしかたがないんだ……
  reading: ''
