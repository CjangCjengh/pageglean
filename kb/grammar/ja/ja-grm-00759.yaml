title: 口语缩约「〜っつってんだろ」：焦躁地重申
structure: 引用文＋っつって（＝と言って）＋んだろ（＝のだろう）
structure_pattern: 引用 + と言って + いる + のだろう
explanation_zh: 「っつって」是引用助词「と」加动词「言う」的连用形「といって」在口语中的缩约。「んだろ」是说明语气的「のだ」加表推量的「だろう」的口语形。全句等于「やめろと言っているだろう」，传达不耐烦地重申警告的语气，口语属性强。
