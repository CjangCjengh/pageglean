title: 样态助動詞「そうだ」：〜しそうだ（眼看要〜／似乎能〜）
structure: 用言連用形 ＋ 样态助動詞「そうだ」
structure_pattern: V/A連用形 + そうだ(様態)
explanation_zh: 样态助动词「そうだ」接在用言连用形后，表示根据眼前状况作出推测，即“看起来……、眼看就要……”。片段中「いけそうだ」「なれそうだ」均由可能动词直接接续。须与接终止形、表示传闻的「そうだ」严格区分。
examples:
- text: おまえの顔なら遠慮なくいけそうだ。
  reading: ''
  annot: おまえの顔[かお]なら遠慮[えんりょ]なくいけそうだ。
  translation_zh: 要是你那张脸的话，我毫不客气也能揍得下去。
