title: わけがない：不可能・没道理
structure: 用言連体形 + 形式名詞「わけ」 + がない
structure_pattern: V-る / イ-い / ナ-である + わけがない
explanation_zh: 「わけ」是形式名词，意为“道理、缘由”。「〜わけがない」表示“没有那样的道理”，强烈否定某种可能性，译为“不可能……”。口语中常略作「あるわけない」。
