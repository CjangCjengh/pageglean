title: 〜ちゃう：〜てしまう的口语约音
structure: 動詞連用形（音便）+ 接続助詞「て」 + しまう → 〜ちゃう
structure_pattern: V-て + しまう → 〜ちゃう / 〜じゃう
explanation_zh: 「〜てしまう」的口语约音形，五段动词拨音便后作「〜じゃう」。表示完成或遗憾，本例中表达歉意。轻小说对白中高频出现，属典型口语语法。
