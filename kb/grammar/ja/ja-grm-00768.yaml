title: 〜を前にして：面对着……
structure: 体言 + を + 前にして
structure_pattern: N + を前にして
explanation_zh: 表示“面对着……”，描写人物处于某对象之前的状态或心理。「前にして」整体作状语，书面语色彩较强。本片段描写主角站在家门前垂头丧气的样子。
examples:
- text: 自宅を前にして、肩を落とす。
