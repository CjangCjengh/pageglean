title: 使役受身：被迫做……
structure: 動詞未然形 + 使役助動詞（せる/させる）+ 受身助動詞（られる）→ らされる
structure_pattern: V-未然形 + せられる/られる → される/らされる
explanation_zh: 使役助动词「せる/させる」与受身助动词「られる」叠用构成使役受身，表“被迫做某事”。五段动词的「せられる」口语中常约简为「される」。本片段用于抱怨被迫到处走。
examples:
- text: なんのために歩きまわらされたんだか。
  reading: ''
  annot: なんのために歩[ある]きまわらされたんだか。
  translation_zh: 到底是为了什么让我这么到处跑啊
