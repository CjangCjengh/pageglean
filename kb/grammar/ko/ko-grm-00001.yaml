- text: 나는 다시금 한숨을 내쉬면서 컴퓨터를 아예 꺼 버렸다.
  reading: ''
  annot: 나는 다시금 한숨을 내쉬면서 컴퓨터를 아예 꺼 버렸다.
  translation_zh: 我再次叹了口气，索性把电脑彻底关掉了。
