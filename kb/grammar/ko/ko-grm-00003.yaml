title: 「-아/어야 제맛」：只有……才有滋味
structure: 동사 어간 + -아/어야 + 제맛
structure_pattern: V-아/어야 제맛
explanation_zh: 惯用表达，「제맛」指「真正的滋味/应有的乐趣」。整体表示「只有做某事才够味/才有意思」，相当于中文「……才有滋味/才带劲」。片段中读者反复高喊「히로인은
  죽여야 제맛」，凸显其偏执狂热。
examples:
