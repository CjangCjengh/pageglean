title: 「-는데」：背景铺垫与委婉转折
structure: 용언 어간 + -는데 (연결어미)
structure_pattern: V-는데 / A-(으)ㄴ데 / -았/었는데
explanation_zh: 连接词尾，可表背景铺垫或转折对比，相当于中文「……（不过/但是）……」。片段中「아쉽긴 했는데 통쾌했으니」表达让步后的转折，「아니었는데
  말이죠」引出与现状对比的背景。语气较委婉含蓄。
examples:
- text: 악마공작이 죽은 것도 아쉽긴 했는데 통쾌했으니 됐음.
  reading: ''
