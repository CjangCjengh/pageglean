title: -아/어 버리다：彻底完成与干脆语气
structure: 동사 어간 + -아/어 + 보조동사 '버리다'
structure_pattern: 동사 어간 + -아/어 + 버리다(보조동사)
explanation_zh: 补助动词，接在动词词干后，表示动作彻底完成或做完。常带有痛快、遗憾或“干脆”的语气，中文可译为“……掉了”“干脆……了”。
examples:
