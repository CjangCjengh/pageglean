title: -게 되다：变得、结果的形成
structure: 용언 어간 + -게 + 되다
structure_pattern: 용언 어간 + -게 + 되다
explanation_zh: 表示情况发生变化、形成某种结果，相当于“变得……”“最终……”。多用于描述并非出于主观意愿的变化或结果。
