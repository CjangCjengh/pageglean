title: -(으)ㄴ/는다고 하다：间接引用
structure: 용언 어간 + -(으)ㄴ/는다고 하다
structure_pattern: 용언 어간 + -(으)ㄴ/는다고 + 하다
explanation_zh: 间接引用，用于转述他人的话或自己的想法。陈述用 -ㄴ/는다고，疑问用 -냐고，意志用 -겠다고。片段中大量出现，用于转述与自语。
