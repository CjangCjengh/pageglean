title: -(으)ㄹ 뻔하다：差点……
structure: 동사 어간 + -(으)ㄹ + 의존명사 '뻔' + 하다
structure_pattern: 동사 어간 + -(으)ㄹ 뻔하다(의존명사 '뻔')
explanation_zh: 依存名词 뻔 表示某事险些发生但最终没有发生，相当于“差点……”“险些……”。片段中主角差点被车撞到，用来自嘲。
examples:
