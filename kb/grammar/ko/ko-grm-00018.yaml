id: ko-grm-00018
language: ko
type: grammar
level: TOPIK3
level_rank: 3
title: -기 때문이다：是因为……
structure: 用言词干 + -기 때문이다
structure_pattern: V/A + -기 + 때문이다 (의존명사 때문)
explanation_zh: 名词形转成词尾 -기 将谓词名词化，再与依存名词 때문이다 搭配，表示原因与根据，是书面语中说明理由的典型表达。片段中既有用于句中的
  -기 때문에，也有用于句末结句的 -기 때문이다。相当于中文『是因为……』。
examples:
- text: 아즐란은 작중 인물 중에서 다섯 손가락 안에 드는 뛰어난 마법사이기 때문에 전투력이 높고,
