  reading: ''
  annot: 무엇보다 뛰어난 지략을 지니고 있어 어떤 위기라도 손쉽게 빠져나갔기 때문이다.
  translation_zh: 更因为他有过人的智谋，任何危机都能轻松化解，正是因为这个缘故。
