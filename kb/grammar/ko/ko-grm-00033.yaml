id: ko-grm-00033
language: ko
type: grammar
level: TOPIK3
level_rank: 3
title: -(으)면서/-며：动作同时进行
structure: 用言词干 + 동시 연결어미 '-(으)면서'（缩略形 '-며'）
structure_pattern: V + -(으)면서 / -며 (동시 연결어미)
explanation_zh: 学校文法中属于表示同时性的连接词尾（동시 연결어미），接在用言词干后，表示前后两个动作或状态同时进行，相当于中文的『一边……一边……』。书面语与小说中常用其缩略形式'-며'。本片段中两种形式都有出现。
examples:
- text: 그렇게 내 시선을 빼앗으면서 침대 위로 올라온 레이나가, 머리카락을 쓸어 올리며 천천히 나에게로 다가왔다.
  reading: ''
  annot: 그렇게 내 시선을 빼앗으면서 침대 위로 올라온 레이나가, 머리카락을 쓸어 올리며 천천히 나에게로 다가왔다.
  translation_zh: 蕾娜那样夺走我的视线后爬上床来，一边把头发挽上去，一边缓缓向我靠近。
