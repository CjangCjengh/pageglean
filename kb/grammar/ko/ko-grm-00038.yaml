  pointer: null
- text: 명예를 중요시하는 아레이티아 가문의 딸다운 모습이었다.
  reading: ''
  annot: 명예를 중요시하는 아레이티아 가문의 딸다운 모습이었다.
  translation_zh: 那模样真不愧是重视名誉的阿莱蒂西亚家的女儿。
