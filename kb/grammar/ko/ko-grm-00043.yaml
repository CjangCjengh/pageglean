  pointer: null
- text: 아무리 공작님이 색골이라고 해도 황녀님은 안 건드릴 거야.
  reading: ''
  annot: 아무리 공작님이 색골이라고 해도 황녀님은 안 건드릴 거야.
  translation_zh: 就算公爵再怎么好色，也不会对皇女殿下出手的。
