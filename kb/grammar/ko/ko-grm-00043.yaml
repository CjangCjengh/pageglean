title: 「-아/어도：即使……也……」
structure: 谓词词干 + 连接词尾 -아/어도（让步）
structure_pattern: V/A-아/어도
explanation_zh: 连接词尾 -아/어도 表示让步，即前项情况不影响后项的结果或判断，常与副词 아무리（无论多么）呼应使用。相当于中文的「即使……也……」。片段中还与
  조금도 … -지 않다（一点也不）搭配，加强否定语气。
examples:
- text: 아무리 불행한 일을 겪어도 조금도 퇴색되지 않는 너의 고결함을, 나는 좋아했다.
  reading: ''
  annot: 아무리 불행한 일을 겪어도 조금도 퇴색되지 않는 너의 고결함을, 나는 좋아했다.
  translation_zh: 无论经历怎样的不幸都丝毫不褪色的你的高洁，我曾深深喜欢过。
  source_book: book-ko-015
