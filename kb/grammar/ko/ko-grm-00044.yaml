title: 「-ㄹ 리가 없다：按理不可能……」
structure: 谓词词干 + 冠形词尾 -ㄹ + 依存名词 리 + 주격 조사 가 없다
structure_pattern: V/A-ㄹ + 리가 없다
explanation_zh: 冠形词尾 -ㄹ 修饰依存名词 리（道理、情理），再与 가 없다 构成惯用型，表示按常理推断绝不可能发生，语气比单纯否定更强。相当于中文的「怎么可能……」「不可能……」。片段中出现两次，分别用于自我辩解和对他人反应的推测。
examples:
- text: 내 모든 것을 쏟아부은 소설의 인물들에게 애정이 없을 리가 없다.
  reading: ''
  annot: 내 모든 것을 쏟아부은 소설의 인물들에게 애정이 없을 리가 없다.
  translation_zh: 对倾注了我一切的小说人物，我怎么可能没有感情呢。
  source_book: book-ko-015
