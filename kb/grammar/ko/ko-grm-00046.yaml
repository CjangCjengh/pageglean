title: 「-기 위해서：为了……」
structure: 谓词词干 + 依存名词 기 + 依存名词 위(해서)
structure_pattern: V-기 + 위해(서)
explanation_zh: 依存名词 기 将动作名词化后，接 위(해서) 表示行为的目的，相当于中文的「为了……」。与 -(으)려고 相比，-기 위해서 更书面、更正式，也可作定语（-기
  위한 + 体言）。片段中叙述与台词里均有出现。
examples:
- text: 레이나라는 캐릭터를 완성시키기 위해서는 목숨까지 버리는 고결함을 묘사해 내야 했다.
