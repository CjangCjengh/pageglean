title: 「-아/어 오다：一直持续至今」
structure: 谓词词干 + 连接词尾 -아/어 + 补助动词 오다
structure_pattern: V/A-아/어 + 오다
explanation_zh: 连接词尾 -아/어 后接补助动词 오다，表示某种动作或状态从过去某一时间点一直持续到现在，强调时间上的延续性。相当于中文的「一直……到现在」。片段中「데뷔
  이후 줄곧 그래 왔다」（出道以来一直如此）是典型搭配，줄곧（一直）常与之共现。
examples:
- text: 데뷔 이후 줄곧 그래 왔다.
