title: 「-아/어 주다」：为（对方）做……、请……
structure: 动词词干 + -아/어 주다
structure_pattern: V-아/어 + 주다
explanation_zh: 보조적 연결어미 -아/어 后接보조동사 주다，表示动作为他人带来恩惠。向对方提出请求时用 -아/어 주다（敬语 -아/어 주세요），片段中主人对下属使用半语
  -아/어 줘，体现阶位差异。中文可译为“帮忙……、给（我）……”。
examples:
