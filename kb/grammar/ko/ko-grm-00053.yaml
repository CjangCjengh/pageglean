title: 「-며(서)」：一边……一边……
structure: 用言词干 + -며 / -면서
structure_pattern: V-며(서)
explanation_zh: 연결어미 -면서 表示两个动作同时进行；其缩略形 -며 书面色彩更浓，小说叙述中常见。片段用 -며 衔接连续动作，相当于中文“一边……一边……”或“……着”。
examples:
- text: 레이나가 고개를 끄덕이며 얼떨떨한 표정을 지었다.
  reading: ''
  annot: 레이나가 고개를 끄덕이며 얼떨떨한 표정을 지었다.
  translation_zh: 蕾娜一边点头，一边露出茫然的表情。
