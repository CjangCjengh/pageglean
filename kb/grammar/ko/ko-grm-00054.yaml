id: ko-grm-00054
language: ko
type: grammar
level: TOPIK2
level_rank: 2
title: 「-기 위해(서)」：为了……
structure: 动词词干 + -기 위해(서)；-기 위한 + 名词
structure_pattern: V-기 + 위해서 / 위한 + N
explanation_zh: 명사형 전성어미 -기 加의존명사'위해서'表示行为目的，“为了……”；修饰名词时换用관형사형 -기 위한。语体偏书面，口语多说 -려고，片段中连续用于交代迷宫防御设施的目的。
examples:
- text: 그 내부에는 외적을 격퇴하기 위한 방어 시설이 무수히 존재한다.
  reading: ''
  annot: 그 내부에는 외적을 격퇴하기 위한 방어 시설이 무수히 존재한다.
  translation_zh: 其内部存在着无数用于击退外敌的防御设施。
