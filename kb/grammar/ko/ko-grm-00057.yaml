id: ko-grm-00057
language: ko
type: grammar
level: TOPIK2
level_rank: 2
title: -기 때문이다：因为……（原因·理由）
structure: 동사·형용사 어간 + -기 때문이다
structure_pattern: V/A + -기(명사형 전성어미) + 때문이다
explanation_zh: 接在动词、形容词词干后表示原因或理由，相当于中文的"因为……"。由名词化转成词尾（명사형 전성어미）-기 与表示"缘故"的依存名词
  때문 构成，后接副词格助词 에。可与过去时时制词尾结合为 -았/었기 때문이다，如片段中的"자원이었기 때문에"。
examples:
- text: 고대 마법 문명에서 마석은 지금보다 더 중요한 자원이었기 때문에 마석을 둘러싼 전쟁이 흔했고
