title: -기 위해(서)：为了……（目的）
structure: 동사 어간 + -기 위해(서)
structure_pattern: V + -기 + 위해(서)
explanation_zh: 接在动词词干后表示动作的目的，相当于中文的"为了……"。-기 将动词名词化，위하다 意为"为了"，也可用作定语形式 -기 위한 ＋名词。片段中"为了守护魔石""为了维持领地"等处多次出现。
examples:
- text: 타국의 침략으로부터 마석을 지키기 위해 침입자를 격퇴할 수 있는 미궁이 만들어졌다고 한다.
  reading: ''
  annot: 타국의 침략으로부터 마석을 지키기 위해 침입자를 격퇴할 수 있는 미궁이 만들어졌다고 한다.
  translation_zh: 据说，为了抵御外国的侵略、守护魔石，（人们）建造了能够击退入侵者的迷宫。
