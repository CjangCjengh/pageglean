title: -아/어 놓다：做完后保持状态（补助动词）
structure: 동사 + -아/어 놓다
structure_pattern: V + -아/어(연결 어미) + 놓다(보조 동사)
explanation_zh: -아/어 놓다 是补助动词结构，表示动作完成后其结果状态持续保留，相当于中文的"（做完）……着／放在那里"。与单纯描写状态的 -아/어
  있다 相比，更强调该状态是有意图地造成并保留的。片段中描写摊开在书桌上放着的地图。
examples:
- text: 그렇게 중얼거리면서 나는 책상 위에 펼쳐 놓은 지도를 살펴보았다.
