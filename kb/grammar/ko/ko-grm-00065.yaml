title: 「-는 것：动词的名词化」
structure: 动词冠形词形词尾 -는 + 依存名词 것
structure_pattern: V-는 것
explanation_zh: 依存名词「것」接在动词冠形词形「-는」后，把动词短语名词化，可作主语、宾语等，相当于汉语的“……这件事”。插入补助词尾「도/는」构成「-는
  것도/-는 것은」，带有“连……也”“至于……”的对比意味。这是韩语书面语中出现频率极高的结构。
examples:
- text: 다른 영주에게 싸움을 걸어 새로운 미궁을 확보하는 것도 나쁘지는 않다.
