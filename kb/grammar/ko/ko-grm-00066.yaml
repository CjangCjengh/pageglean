id: ko-grm-00066
language: ko
type: grammar
level: TOPIK3
level_rank: 3
title: 「-지는 않다：否定与对比强调」
structure: 用言 + 补助连接词尾 -지 + 否定补助用言 않다（中间可插入补助词尾 는）
structure_pattern: A/V-지 않다 / A/V-지는 않다
explanation_zh: 「-지 않다」是否定补助用言结构，相当于“不……”。在「-지」与「않다」之间插入补助词尾「는」，表示对比或弱化语气，如「나쁘지는 않다」（不算坏，但言外之意有所保留）。常与副词「별로」呼应构成「별로
  -지 않다」。
examples:
- text: 하지만 별로 내키지 않았다.
