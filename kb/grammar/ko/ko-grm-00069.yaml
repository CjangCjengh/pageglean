title: 「-(이)라 불리다 / -다고 일컫다：间接引用与“被称为”」
structure: 引用成分 + -(이)라 / -다고 + 불리다/일컫다
structure_pattern: N-(이)라 불리다 / A(다)-다고 일컫다
explanation_zh: 韩语间接引用体系中，名词用「-(이)라」、形容词/动词用「-다고」引出内容，后接「불리다/일컫다」构成“被称作……”。「수백만 마나르를
  보유한 대영주들……‘5제후’라 불리는」是典型的先描述后点名称呼的写法。引用词尾与被动动词的搭配是韩语阅读中的常见难点。
examples:
- text: 왜냐하면 아즐란이 상대해야 하는 건 수백만 마나르를 보유한 대영주들…… ‘5제후’라 불리는 이 세계의 지배자들이니까.
