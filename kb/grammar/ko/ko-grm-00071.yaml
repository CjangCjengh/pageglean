title: 「-(으)ㄴ 걸 보면 …-ㄴ/는 것 같다：依据与推测」
structure: 冠形词形词尾 -(으)ㄴ + 依存名词 것(걸) + 보다，后句接 -ㄴ/는 것 같다
structure_pattern: A/V-(으)ㄴ 걸 보면 + … -ㄴ/는 것 같다
explanation_zh: 「-(으)ㄴ 걸 보면」意为“从……来看／看……的样子”，用于提出推测的依据，后句常用「-ㄴ/는 것 같다」给出委婉推断。「것 같다」字面为“像是……那样”，是韩语避免武断语气的重要手段。片段中阿尔蒂雅正是借召集全员这一事实推断事情重要。
examples:
- text: 주군, 저희 넷을 전부 소집하신 걸 보면 상당히 중요한 안건인 것 같습니다.
