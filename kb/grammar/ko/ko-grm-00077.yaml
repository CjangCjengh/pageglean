title: -다고/겠다고 하다：间接引用
structure: 인용 연결어미 '-다고' + 선어말어미 '-겠-'（의지） + 인용 동사 '하다/말하다'
structure_pattern: V/A + -다고/겠다고 + 하다(말하다)
explanation_zh: 用于转述他人话语的间接引用。'-다고'是引用连接词尾，'겠'是表示意志的先语末词尾，后接'하다/말하다'等引用动词，口语中动词常省略。引用部分还可加보조사'만/는'，对内容进行限定或对比。
examples:
- text: 어젯밤 약혼을 취소하겠다고 주인님이 직접 말씀하셨습니다.
