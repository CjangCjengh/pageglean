id: ko-grm-00078
language: ko
type: grammar
level: TOPIK4
level_rank: 4
title: -(으)ㄹ 뿐만 아니라：不仅如此
structure: 관형사형 전성어미 '-(으)ㄹ' + 의존명사 '뿐' + 보조사 '만' + '아니라'
structure_pattern: V/A + -(으)ㄹ + 뿐만 아니라
explanation_zh: 表示「不仅……而且……」，后句补充比前句更进一步的内容。学校文法分析为冠形词形转换词尾'-(으)ㄹ'＋依存名词'뿐'＋补助助词'만'＋'아니라'。后句常与'도/까지'呼应，表示范围的扩大。
examples:
- text: 아즐란이 생활하는 저택을 관리하고 있을 뿐만 아니라 사실상 아즐란의 비서 같은 역할까지 하고 있다.
  reading: ''
  annot: 아즐란이 생활하는 저택을 관리하고 있을 뿐만 아니라 사실상 아즐란의 비서 같은 역할까지 하고 있다.
  translation_zh: 她不仅管理阿兹兰居住的宅邸，实际上还承担着类似秘书的角色。
