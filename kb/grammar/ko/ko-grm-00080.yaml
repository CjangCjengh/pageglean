title: -(느)ㄴ다고 하다：间接引用与-는다는定语化
structure: 동사 어간 + -(느)ㄴ다고 하다；관형사형 전성 어미 -(느)ㄴ다는 + 명사（간접 인용）
structure_pattern: V-(느)ㄴ다고 하다
explanation_zh: 间接引用（转述）结构：动词用-(느)ㄴ다고 하다，过去时用-았/었다고 하다。置于名词前时缩略为-(느)ㄴ다는，表示“据说……的／传闻中……的”。片段中用于转述关于怪物的传说与情报。
examples:
- text: 데우미나스는 최소 백만 명의 고대인을 언데드 몬스터로 만들었다는 전설적인 리치다.
