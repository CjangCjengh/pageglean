title: -아/어 두다：做好准备并保持结果
structure: 동사 어간 + -아/어 두다（본용언 + 보조 동사 두다）
structure_pattern: V-아/어 두다
explanation_zh: 补助动词두다表示动作完成后其结果状态被保持下去，常含“事先准备好”的意味，相当于中文“……好放着／提前……好”。口语中变体为-아/어
  둬、둬야겠다，片段多次出现。
examples:
- text: 아랄칸 산맥에 만들어 둔 자신의 미궁 ‘베크류 지하 묘지’에 은둔하고 있다.
  reading: ''
  annot: 아랄칸 산맥에 만들어 둔 자신의 미궁 ‘베크류 지하 묘지’에 은둔하고 있다.
  translation_zh: （他）隐居于自己事先建在阿拉尔坎山脉的迷宫“贝克留地下墓地”中。
