- text: 정 안 되면 리치가 되기 전에 제가 잘라서 보관해 둘게요!
  reading: ''
  annot: 정 안 되면 리치가 되기 전에 제가 잘라서 보관해 둘게요!
  translation_zh: 实在不行的话，趁您还没变成巫妖，我把它切下来保管好！
