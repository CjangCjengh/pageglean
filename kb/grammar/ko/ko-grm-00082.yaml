- text: 천사와 악마의 강제 교배로 만들어진 기형종이라든가…… 하여간 그런 놈들이다.
  reading: ''
  annot: 천사와 악마의 강제 교배로 만들어진 기형종이라든가…… 하여간 그런 놈들이다.
  translation_zh: 又或是天使与恶魔强制交配产下的畸形种……总之就是些那样的家伙。
