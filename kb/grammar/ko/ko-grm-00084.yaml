title: -잖아요：唤起已知事实（这不是……嘛）
structure: 용언 어간 + -잖아요（종결 표현, ‘-지 않아요’의 축약）
structure_pattern: V/A-잖아요
explanation_zh: “-지 않아요”的缩略形，作为终结表达提醒对方双方已知的事实，并以此作为理由或反驳，语气相当于中文“这不是……嘛”。口语对话中使用频率极高。
