id: ko-grm-00086
language: ko
type: grammar
level: TOPIK3
level_rank: 3
title: -는데：背景铺垫与语气缓和
structure: 동사 어간 + -는데 / 형용사 어간 + -(으)ㄴ데（배경·대조의 연결 어미, 종결도 가능）
structure_pattern: V-는데 / A-(으)ㄴ데
explanation_zh: 连接词尾，为后文提供背景铺垫或暗示转折；用于句末时使语气委婉、留有余地，等对方接话。相当于中文“不过……／倒是……”，常欲言又止。引用形-다는데亦由它构成。
examples:
