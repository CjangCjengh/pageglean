title: -(으)ㄹ 수 있다/없다：能与不能
structure: 动词词干 + 冠形词形转成词尾 -(으)ㄹ + 依存名词 '수' + 谓词 '있다/없다'
structure_pattern: 동사 어간 + -(으)ㄹ + 의존명사 '수' + 있다/없다
explanation_zh: 依存名词 '수' 与 '있다/없다' 搭配，表示有无做某事的能力或可能性，相当于中文的'能/不能~'。否定也可用副词 '못' 或补助动词
  '-지 못하다' 表达（쓰지 못한다）。片段中主角反复强调自己无法使用魔法，两种否定形式均出现。
examples:
