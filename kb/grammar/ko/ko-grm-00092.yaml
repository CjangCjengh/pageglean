title: -(으)ㄴ/는 모양이다：看来、似乎
structure: 谓词词干 + 冠形词形转成词尾 -(으)ㄴ/는 + 依存名词 '모양' + 서술격 조사 '이다'
structure_pattern: 용언 어간 + -(으)ㄴ/는 모양이다
explanation_zh: 依存名词 '모양' 本义'样子、情形'，根据外部观察到的迹象做出推测，相当于'看来、好像'。与 '-(으)ㄴ/는 것 같다' 近义，但更强调依据眼前状况做出的判断。
examples:
- text: 그래도 2시간이나 전투를 하니 한계에 도달한 모양이다.
