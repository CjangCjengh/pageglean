title: -다고 하다：间接引用与传闻
structure: 谓词词干 + 间接引用连接词尾 -다고 + '하다'（形容词 -다고，动词现在时 -는다고）
structure_pattern: 용언 어간 + -다고 + 하다
explanation_zh: 间接引用连接词尾 '-다고' 与 '하다' 搭配，表示转述或传闻，即'据说~、听说~'。片段中以 '-다고 하니까'（听说……所以）引出推测的依据；另有体词引用的
  '-(이)라는'（'악마공작' 아즐란）。
examples:
- text: 기본적으로 고대의 마법사들은 현대보다 훨씬 강력했다고 하니까.
