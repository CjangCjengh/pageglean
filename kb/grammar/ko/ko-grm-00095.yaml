  pointer: null
- text: 아직까지 주저앉아 있는 틸프와 마이시아를 힐끔 바라보며 말했다.
  reading: ''
  annot: 아직까지 주저앉아 있는 틸프와 마이시아를 힐끔 바라보며 말했다.
  translation_zh: 我瞥了一眼至今仍瘫坐在地上的蒂尔芙和玛伊西亚，开口说道。
