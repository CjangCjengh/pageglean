title: -(으)니까：理由与根据（口语）
structure: 用言词干 + 连接词尾 -(으)니까
structure_pattern: V/A-(으)니까
explanation_zh: 表示理由、根据的连接词尾，与 -아/어서 不同，后句可以接推测、命令、共动等多种叙法，且前面可带过去时制先语末词尾 -았/었- 或
  -겠-。常用于向对方提示判断依据并加以断定的语气。片段中“없으니까”“아니니까”均体现这一接续特点。
examples:
- text: 네 해골은 이 지하 묘지에서 단 한 발짝도 나갈 수 없으니까.
  reading: ''
  annot: 네 해골은 이 지하 묘지에서 단 한 발짝도 나갈 수 없으니까.
  translation_zh: 因为你这具骷髅，连一步都迈不出这座地下墓穴。
  source_book: book-ko-015
