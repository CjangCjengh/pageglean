id: ko-grm-00097
language: ko
type: grammar
level: TOPIK2
level_rank: 2
title: -려고：意图与目的
structure: 动词词干 + 连接词尾 -려고
structure_pattern: V-려고
explanation_zh: 表示主体意图或目的的连接词尾，相当于中文“想要……”“为了……”。与主要结合 가다/오다 类动词的 -러 不同，-려고 可与多种叙述句结合。片段中还以“-려고
  했던 성기사”的形式，经冠形词形转成词尾修饰体言。
examples:
- text: 너는 외부에서 활동하기 위한 새로운 몸을 얻으려고 하는 거야.
  reading: ''
  annot: 너는 외부에서 활동하기 위한 새로운 몸을 얻으려고 하는 거야.
  translation_zh: 你是想弄一具新的躯体，好到外面去活动。
  source_book: book-ko-015
