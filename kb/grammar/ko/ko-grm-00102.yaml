title: 「-(으)ㄹ 것이다：推测与判断」
structure: 冠形词形转换词尾 -(으)ㄹ + 依存名词 것 + 이다
structure_pattern: V-(으)ㄹ 것이다
explanation_zh: 学校语法分析为冠形词形转换词尾 -(으)ㄹ 后接依存名词 것，再与 이다 结合，表示对情况的推测或有把握的判断。过去时 -았/었을
  것이다 推测已然之事，口语中缩作 -(으)ㄹ 거야。片段里叙述者多次用它推测德乌米纳斯的心理与行动。
examples:
- text: 아까 말한 대로 쓸데없는 말을 늘어놓는 건 무의미하다고 생각했을 것이다.
  reading: ''
  annot: 아까 말한 대로 쓸데없는 말을 늘어놓는 건 무의미하다고 생각했을 것이다.
  translation_zh: 他想必认为，像刚才所说的那样说些废话毫无意义。
  source_book: book-ko-015
  source_chapter: null
  pointer: null
- text: 스스로 마력의 흐름을 정지시켜 영혼을 잠들게 했을 것이다.
  reading: ''
