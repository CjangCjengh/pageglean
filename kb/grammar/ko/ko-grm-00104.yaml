title: 「敬语阶位：-네·-지·-군 的语体差异」
structure: 终结词尾 -네（하오체/하게체 感叹）· -지（确认、独白）· -군（感叹）
structure_pattern: 어미 -네 / -지 / -군
explanation_zh: 韩语终结词尾承载敬语法信息：-네 常见于 하오체/하게체，带长者感叹语气；-지 用于自我确认或独白；-군 表示对新事实的感叹。片段中德乌米纳斯混用
  해라체（받아들이지）与 하오체（축복해 주겠네），塑造符合其古老身份的庄重口吻，与主人公平辈语气（고맙군、가자）形成对照。阅读小说时可借词尾选择分辨说话人身份与人物关系。
