title: 「-(으)ㄴ/는 것」：名词化与名词从句
structure: '관형사형 전성어미 ''-(으)ㄴ/-는'' + 의존명사 ''것''（구어 축약: ''건/거''）'
structure_pattern: V/A-(으)ㄴ/는 + 의존명사_것
explanation_zh: 冠形词形转成词尾'-(으)ㄴ/-는'修饰依存名词'것'，把小句整体名词化，充当主语、宾语等成分；口语中'것이'常缩为'건'。片段中'원한
  건''필요로 하는 건'均指'……的东西/事情'。
examples:
