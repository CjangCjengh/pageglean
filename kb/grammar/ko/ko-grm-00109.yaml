title: 「-아/어야 하다」：必须、得（义务·必要）
structure: '연결어미 ''-아/어야'' + ''하다''（다짐: ''-아/어야지/-아야겠다''）'
structure_pattern: V/A- + -아/어야 + 하다
explanation_zh: 连接词尾'-아/어야'后接'하다'，表示义务或必要，即'必须……''得……'。在独白中以'-아/어야지''-아야겠지'收尾时，表示说话人的自我决心或打算。片段中多次出现。
examples:
- text: 그렇기 때문에 전투력을 보강할 수 있는 장비를 갖춰야 한다.
