title: 「-아/어 주다」：补助动词，为（某人）做……
structure: 본용언 + 연결어미 '-아/어' + 보조동사 '주다'
structure_pattern: V- + -아/어 + 보조동사_주다
explanation_zh: 连接词尾'-아/어'后接补助动词'주다'，表示该动作使他人受益，即'给（某人）做……'。对长辈或需尊敬的对象改用'-아/어 드리다'。片段中'해설해
  줬다''되돌려 준다'均属此结构。
examples:
- text: 새로운 등장인물이 등장할 때마다 그 능력을 해설해 줬다.
