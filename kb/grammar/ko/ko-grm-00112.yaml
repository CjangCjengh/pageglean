id: ko-grm-00112
language: ko
type: grammar
level: TOPIK3
level_rank: 3
title: 「-아/어 있다」：结果状态的持续
structure: 본용언 + 연결어미 '-아/어' + 보조 형용사 '있다'
structure_pattern: V- + -아/어 + 보조_형용사_있다
explanation_zh: '''-아/어 있다''表示动作完成后其结果状态的持续，相当于汉语''……着''，常与被动形搭配，如''놓여 있다''（被放着）、''저장되어
  있다''（被保存着）。注意与表示动作正在进行的''-고 있다''相区别。'
examples:
- text: 5권에서 나는 이곳에 어떤 물건들이 저장되어 있는지 조금 묘사해 두었다.
