title: -(으)ㄹ 만하다：值得、有使用价值
structure: 동사 어간 + 관형사형 전성어미(冠形形转成词尾) -(으)ㄹ + 보조 형용사(补助形容词) 만하다
structure_pattern: V-(으)ㄹ 만하다
explanation_zh: 冠形形转成词尾 -(으)ㄹ 后接补助形容词（보조 형용사）“만하다”，表示值得做某事或某物具有使用价值，相当于“值得……、……起来不错”。常用搭配“쓸
  만하다”意为“能用、还不错”。也可作定语修饰名词，如“쓸 만한 거”（能用的东西）。
examples:
- text: 너도 쓸 만한 거 있나 찾아봐.
