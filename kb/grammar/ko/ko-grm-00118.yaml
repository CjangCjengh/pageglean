title: -아/어 봤자：就算……也白搭
structure: 동사 어간 + 보조적 표현(补助谓词) -아/어 보다 + 양보 연결어미(让步连接词尾) -(으)ㅂ자
structure_pattern: V-아/어 봤자 + 절
explanation_zh: -아/어 보다 后接让步连接词尾 -(으)ㅂ자，表示“即使……也没有用、白搭”，后句多为否定或负面评价。语气比 -아/어도 更强，强调徒劳感。片段中指“就算给她别的魔法道具，她也不会用”。
examples:
- text: 다른 마법 아이템을 줘 봤자 안 쓸 것 갖고…….
