title: 「-아/어 놓다：结果状态的留存」
structure: 动词词干 + -아/어 놓다（보조적 연결어미 + 보조용언）
structure_pattern: V-아/어 + 놓다
explanation_zh: 补助动词'놓다'表示动作完成后其结果状态被保留下来，强调"事先做好、存着"。与强调彻底完结的-아/어 버리다形成对照：-아/어 놓다侧重结果留存，中文可译"……好、……着"。
