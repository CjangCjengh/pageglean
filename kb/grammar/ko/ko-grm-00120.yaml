title: 「-던：回忆性冠形词尾」
structure: 动词/形容词 + -던 + 名词（관형사형 전성어미，表回忆）
structure_pattern: V-던 + N
explanation_zh: 관형사형 전성어미 -던用于回忆过去尚未完成或中断的事情，并以此修饰后面的名词。与过去时制词尾-았/었-结合成-았/었던时，则回忆已经完结的往事。是小说叙述中刻画"回忆"最具代表性的修饰形式。
examples:
- text: 우리들 코앞까지 다가와 칼을 치켜들던 해골 하나가 먼지가 되어 바스러졌다.
