title: 「-기 위해(서)：书面化的目的表达」
structure: 动词 + -기 위하-여(서)（명사형 전성어미 -기 + 위하다）
structure_pattern: V-기 위해(서)
explanation_zh: -기 위해(서)表示行为的目的，比-(으)러、-려고更正式，多用于书面语和叙述性文体。在句末以"…위해"收束时，可对前述行为追加目的性说明，制造余韵。中文译为"为了……"。
examples:
- text: 미궁을 차지하기 위해, 그리고 훗날의 절대 권력자가 되기 위해.
  reading: ''
  annot: 미궁을 차지하기 위해, 그리고 훗날의 절대 권력자가 되기 위해.
  translation_zh: 为了夺取迷宫，也为了成为日后的绝对掌权者。
