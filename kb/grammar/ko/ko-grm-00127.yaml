title: -아/어 대다：动作剧烈、反复地进行
structure: 动词词干 + -아/어 대다（补助动词）
structure_pattern: 동사 어간 + 보조동사 -아/어 대다
explanation_zh: 「-아/어 대다」是补助动词，表示动作反复、剧烈地进行，带有程度超出寻常的语感，相当于『不停地……』『……个不停』。'웃어 대다'指『狂笑不止』，强调动作的猛烈与持续。
examples:
- text: 그야말로 미친 듯이 웃어 대고 있었다.
