title: -기 때문이다：是因为……
structure: 谓词词干 + -기（名词形）+ 때문이다
structure_pattern: 용언 어간 + 의존명사 기 + 때문이다
explanation_zh: 「-기 때문이다」表示原因、理由，是'-아/어서'的书面化、客观化说法。谓词词干加'-기'变成名词形，再加'때문이다'，常用于说明或解释，前句多为'그것은/이는…'。相当于中文的『是因为……』。
examples:
- text: 그것은 그녀가 인간을 죽이는 행위에서 가장 큰 만족감을 얻기 때문이다.
  reading: ''
