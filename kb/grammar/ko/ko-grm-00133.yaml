title: 「-(으)ㄹ게」：说话人的承诺与意志
structure: 动词词干 + -(으)ㄹ게(요)
structure_pattern: V-(으)ㄹ게
explanation_zh: 종결어미 -(으)ㄹ게 表示向听话人承诺某行为或表明说话人意志，属非格式（반말）终结表达，相当于中文"我会……／这就……"。片段中身居高位的克劳对下属使用，体现其随意的说话姿态。注意与单纯表推测的
  -ㄹ 거야 相区分。
