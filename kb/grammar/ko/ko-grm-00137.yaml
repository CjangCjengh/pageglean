title: 「-ㄹ 리가 없다」：绝不可能
structure: 动词/形容词词干 + -(으)ㄹ 리가 없다
structure_pattern: V/A-(으)ㄹ 리가 없다
explanation_zh: 依存名词 리（理）与冠词形转成词尾 -(으)ㄹ 结合，否定某种情形的合理性或可能性，相当于中文"不可能……""哪会……"。反问形式
  -ㄹ 리가 있겠습니까 通过反诘进一步加强否定，意为"怎么可能呢"。
examples:
