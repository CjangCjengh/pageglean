  pointer: null
- text: 만약 정말로 그런 인물이 존재한다면, 제가 책임지고 그를 생포해서 클라우 님 앞에 데리고 오겠습니다.
  reading: ''
  annot: 만약 정말로 그런 인물이 존재한다면, 제가 책임지고 그를 생포해서 클라우 님 앞에 데리고 오겠습니다.
  translation_zh: 如果真的存在那样的人物，我会负责将他生擒，带到克劳大人面前。
