title: 「-아/어 놓다」：动作结果的存续
structure: 动词 + -아/어 놓다
structure_pattern: V-아/어 놓다
explanation_zh: 连接词尾 -아/어 与补助动词 놓다 结合，表示动作完成后其结果状态被保留或已预先备好，相当于中文"……好/着/起来"。与偏重状态的
  -아/어 있다 不同，-아/어 놓다 强调有人为意图地完成并留下结果。文中 감춰 놓다（藏起来）、준비해 놓다（备好）皆是。
