title: -잖아(요)：提醒对方已知的事实
structure: 用言词干 + -잖아(요)（-지 않아요 的缩略）
structure_pattern: 어간 + 종결어미 '-잖아(요)' (← -지 않- + -아요)
explanation_zh: '''-지 않아요''的缩略形，属终结词尾，用于提醒对方已知或理应知道的事实，常带“我早说过”的语气。口语色彩强，片段对话中出现两次。'
