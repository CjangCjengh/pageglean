title: -(으)ㄹ 수 있다/없다：能力与可能性
structure: 动词词干 + -(으)ㄹ 수 있다/없다
structure_pattern: 동사 어간 + 관형사형 전성어미 -(으)ㄹ + 의존명사 '수' + 있다/없다
explanation_zh: 由定语词尾 -(으)ㄹ、依存名词 수 与 있다/없다 组成，表示能力或可能性，是韩语依存名词结构的代表。片段中反复出现，并与将来推测等结构叠加。
