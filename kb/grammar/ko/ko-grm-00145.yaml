title: -(ㄴ/는)다는 게·-다는 점이다：转述性名词化与评价
structure: 动词词干 + -(ㄴ/는)다는 것/게；-(았/었)다는 점이다
structure_pattern: 어간 + 관형사형 전성어미 -(ㄴ/는)다는 + 의존명사 '것/점'
explanation_zh: “-(느)ㄴ다고 하는 것이”的缩略，把整个事件名词化后加以评价；-다는 점이다 常与 문제는 搭配，表“问题在于……”。属中高级叙事核心结构，片段前后两处呼应。
