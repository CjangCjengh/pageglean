  pointer: null
- text: 그 대신 너희는 가끔씩 나의 ‘의뢰’를 받아들여 주면 돼.
  reading: ''
  annot: 그 대신 너희는 가끔씩 나의 ‘의뢰’를 받아들여 주면 돼.
