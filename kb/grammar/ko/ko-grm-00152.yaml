  pointer: null
- text: 어디에 나타난 몬스터를 퇴치해 줬으면 한다, 어디에 숨겨진 보물을 찾아 줬으면 한다.
  reading: ''
  annot: 어디에 나타난 몬스터를 퇴치해 줬으면 한다, 어디에 숨겨진 보물을 찾아 줬으면 한다.
  translation_zh: 比如希望你们去讨伐出现在某处的怪物，希望你们去寻找藏在某处的宝物。
