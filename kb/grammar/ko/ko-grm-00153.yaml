- text: 내가 입가에 손가락을 가져가자 두 사람은 굳은 표정으로 고개를 끄덕였다.
  reading: ''
  annot: 내가 입가에 손가락을 가져가자 두 사람은 굳은 표정으로 고개를 끄덕였다.
  translation_zh: 我刚把手指放到唇边，两人就带着僵硬的表情点了点头。
