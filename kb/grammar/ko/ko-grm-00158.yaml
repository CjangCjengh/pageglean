title: -잖아(요)：提醒已知事实
structure: 谓词词干 + -잖아(요)（否定补助连接词尾 -지 + 补助形容词 않다 + -아/어요 的缩略形）
structure_pattern: V/A-잖아(요)
explanation_zh: -지 않아요 的缩略形，但不是单纯否定，而是说话人提醒、强调对方理应知道的事实的终结词尾。用于疑问句时带有反驳或寻求认同的语气。口语会话中高频出现。
examples:
