title: -아/어지다：被动派生与状态持续
structure: 动词词干 + 连接词尾 -아/어 + 被动补助动词 지다；后接 -아/어 있다 表示结果状态持续
structure_pattern: V-아/어지다
explanation_zh: 接在动词词干后构成被动，如 차리다→차려지다，表示动作由他人完成。与 -아/어 있다 结合表示被动结果的状态持续（차려져 있다＝被摆好并持续着）。是韩语被动的主要派生手段之一。
examples:
- text: 두 사람에게 존재했던 경계심이, 계속해서 테이블 위에 차려지는 요리와 맥주로 점차 사라져 간다.
