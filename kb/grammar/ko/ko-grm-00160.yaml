title: -아/어 주다：恩惠补助动词
structure: 动词词干 + 连接词尾 -아/어 + 补助动词 주다（恩惠・授与）
structure_pattern: V-아/어 주다
explanation_zh: 补助动词 주다 表示该动作为他人带来好处，是他人为我（或为某人）做某事。命令形 -아/어 줘 常用于请求、吩咐。与尊敬先语末词尾 -시-
  结合时用 -아/어 주시다（如片段中 데려가셔도 됩니다）。
examples:
- text: 주인장, 이 식당에서 가장 비싸고 맛있는 요리들을 종류별로 전부 차려 줘.
