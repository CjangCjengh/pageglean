title: -(으)ㄹ 뿐만 아니라：不仅……而且
structure: 谓词词干 + 冠形形转成词尾 -(으)ㄹ + 依存名词 뿐 + 添意助词 만 + 形容词 아니다 + 连接词尾
structure_pattern: V/A-(으)ㄹ 뿐만 아니라
explanation_zh: 由冠形形词尾 -(으)ㄹ、依存名词 뿐（仅）、添意助词 만 和形容词 아니다 组合而成的递进连接表达，意为“不光A，还进一步B”。后句与前句方向一致，内容上更进一步。论述、说明文中常用。
examples:
- text: 아즐란은 카이트와 그 동료들의 원한을 사는 걸 피할 수 있을 뿐만 아니라, 세계 최강의 전투력을 지닌 카이트를 아군으로 삼을 수 있게
    된다.
  reading: ''
  annot: 아즐란은 카이트와 그 동료들의 원한을 사는 걸 피할 수 있을 뿐만 아니라, 세계 최강의 전투력을 지닌 카이트를 아군으로 삼을 수 있게
    된다.
  translation_zh: 阿兹兰不仅能避免招来凯特及其同伴的怨恨，还能将拥有世界最强战力的凯特收为友军。
  source_book: book-ko-015
  source_chapter: null
  pointer: null
- text: 마석 생산뿐만 아니라 고대 문명의 고위층을 위한 별장 역할도 하고 있었기 때문이다.
  reading: ''
  annot: 마석 생산뿐만 아니라 고대 문명의 고위층을 위한 별장 역할도 하고 있었기 때문이다.
  translation_zh: （因为它）不仅产出魔石，还曾充当古代文明高层的别墅。
