title: -았/었으면 좋겠다：委婉的愿望
structure: 先语末词尾 -았/었- + 连接词尾 -면 + '좋다' + 推量词尾 -겠다
structure_pattern: V-았/었으면 좋겠다
explanation_zh: 表示希望、愿望，相当于"要是……就好了／希望……"。先用 -았/었으면 提出带有假设性的期望，再以 '좋겠다' 收束，语气比 -고
  싶다 委婉，常用于向对方提出请求或期望。
examples:
- text: 그러니까 나를 믿어 줬으면 좋겠어.
