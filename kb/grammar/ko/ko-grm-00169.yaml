title: 相对敬语法：-ㅂ니다 体与半语的交替
structure: 格式体尊待终结词尾 -ㅂ니다 ↔ 非格式体半语终结词尾 -아/어라（해라체）
structure_pattern: V-ㅂ니다 ↔ V-아/어라
explanation_zh: 学校文法中按听话人调节礼貌等级的方式称"相对敬语法"，主要通过终结词尾实现。本段凯特对时研使用格式体尊待（감사했습니다、기뻤습니다），时研却对凯特使用半语（자라、얘기해
  줄게）。同一对话中两种敬语阶位形成对比，体现两人地位与心理距离的差异。
