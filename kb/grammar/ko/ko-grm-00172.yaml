  pointer: null
- text: 내가 카이트를 찾아냈기 때문에, 클라우 또한 카이트를 찾아낼 수 있었다.
  reading: ''
  annot: 내가 카이트를 찾아냈기 때문에, 클라우 또한 카이트를 찾아낼 수 있었다.
  translation_zh: 正因为是我找到了凯特，克劳才能也找到凯特。
