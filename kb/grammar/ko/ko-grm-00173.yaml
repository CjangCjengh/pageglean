title: 使动派生词尾 -이-/-우-：使役含义
structure: 동사 어근 + 사동 파생 접미사 '-이-/-히-/-리-/-우-' (먹다→먹이다, 자다→재우다, 죽다→죽이다)
structure_pattern: V-이-/히-/리-/우- (사동 파생)
explanation_zh: 在词根后添加使动派生词尾构成使动词，表示使他人做某事，如 먹다→먹이다（喂食）、자다→재우다（使入睡）、죽다→죽이다（杀死）。学校语法中属于派生法（파생법）范畴。主人公“灌酒”“哄睡”凯特的使动行为，正是悲剧发生的直接原因。
examples:
