title: -(으)ㄹ까：独白中的自问与不安
structure: 서술어 어간 + 의문 종결 어미 '-(으)ㄹ까'（혼잣말에서는 자문·번민 표현）
structure_pattern: V/A-(으)ㄹ까
explanation_zh: 疑问终结词尾，在自言自语中用于自问，表达无法确知的猜测或内心的纠结。常以肯定与否定对举的形式出现。本片段用“들었을까/못 들었을까”的对举，表现主人公动摇不安的心理。
examples:
- text: 내 절규를 카이트가 들었을까. 아니면 못 들었을까.
  reading: ''
