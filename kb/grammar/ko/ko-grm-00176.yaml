  pointer: null
- text: 앞으로 많은 일을 해야 하는데, 해야 할 일이 많은데…… 죽어 버렸어.
  reading: ''
  annot: 앞으로 많은 일을 해야 하는데, 해야 할 일이 많은데…… 죽어 버렸어.
  translation_zh: 今后明明还有很多事要做，还有那么多该做的事……却死掉了。
