title: -아/어 버리다：完结与遗憾
structure: 用言词干 + 连接词尾 -아/어 + 补助动词 버리다
structure_pattern: 용언 어간 + 연결어미 -아/어 + 보조 동사 버리다
explanation_zh: 学校文法上属于本用言经连接词尾 -아/어 接补助动词的补助用言构成，表示动作彻底完结。文中用 죽어 버리다 强调卡伊特之死已成定局，带有强烈的悔恨与失落语气。对应中文的“（竟然）……死了/……掉了”。
examples:
- text: 하지만 내 실수로 카이트는 죽어 버렸다.
  reading: ''
