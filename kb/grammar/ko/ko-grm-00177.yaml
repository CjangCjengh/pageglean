title: -아/어야 하다：义务与责任
structure: 用言词干 + 连接词尾 -아/어야 + 하다
structure_pattern: 용언 어간 + 연결어미 -아/어야 + 하다
explanation_zh: 表条件的连接词尾 -아/어야 与 하다 结合，构成“必须……”的义务表达，相当于中文“应该/得做某事”。本片段高频反复出现，强调凯特本应完成的众多使命。与先语末词尾
  -았/었- 结合则为过去义务 -아/어야 했다。
examples:
