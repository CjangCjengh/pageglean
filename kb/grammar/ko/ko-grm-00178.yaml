title: -(으)ㄹ 수 있다/없다：可能性
structure: 用言词干 + 冠形词形转成词尾 -(으)ㄹ + 依存名词 수 + 있다/없다
structure_pattern: 용언 어간 + 관형사형 전성어미 -(으)ㄹ + 의존명사 수 + 있다/없다
explanation_zh: 冠形词形转成词尾 -(으)ㄹ 修饰依存名词 수（可能性、办法），再由 있다/없다 叙述，构成可能式。文中既作谓语，也作定语，如 이끌
  수 있는 修饰名词。还可与依存名词 리 呼应，用 수 있을 리가 없다 强烈否定可能性。
examples:
