title: -는데：背景铺垫与转折
structure: 用言词干 + 连接词尾 -는데
structure_pattern: 용언 어간 + 연결어미 -는데
explanation_zh: 连接词尾 -는데 用于提供背景、对比或使语气委婉。文中先以 해야 하는데, 할 일이 많은데 铺陈背景，再用 죽어 버렸어 转出事实，形成强烈的遗憾与落差。作终结词尾时则留下余韵、等待对方反应。
examples:
- text: 그런 남자가 죽었어. 앞으로 많은 일을 해야 하는데, 해야 할 일이 많은데…… 죽어 버렸어.
  reading: ''
  annot: 그런 남자가 죽었어. 앞으로 많은 일을 해야 하는데, 해야 할 일이 많은데…… 죽어 버렸어.
  translation_zh: 那样的男人死了。今后还有很多事要做，还有那么多该做的事……却死掉了。
