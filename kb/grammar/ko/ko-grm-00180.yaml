title: -면서 / -며：动作同时进行
structure: 用言词干 + 连接词尾 -면서（缩写形 -며）
structure_pattern: 용언 어간 + 연결어미 -면서 / -며
explanation_zh: 连接词尾 -면서 表示两个动作或状态同时进行，-며 是其缩写形，书面叙述中尤为常见。本片段叙述句大量以 바라보며 말했다 等形式，把动作与发言交织在一起，是小说文体的典型笔法。
examples:
- text: 나를 지그시 바라보며 레이나가 말했다.
  reading: ''
  annot: 나를 지그시 바라보며 레이나가 말했다.
  translation_zh: 蕾娜凝视着我，开口说道。
