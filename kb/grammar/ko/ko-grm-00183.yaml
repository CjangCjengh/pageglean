  source_chapter: null
  pointer: null
- text: 당신이 너무 침울해 보여서 잔소리 좀 했을 뿐이에요.
  reading: ''
  annot: 당신이 너무 침울해 보여서 잔소리 좀 했을 뿐이에요.
  translation_zh: 只是因为您看起来太消沉了，我才唠叨了几句而已。
