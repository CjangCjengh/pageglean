- text: 주인님이 이 세계의 패권을 차지하기 위해 비상(飛翔)하실 날을, 그동안 계속 기다리고 있었습니다.
  reading: ''
  annot: 주인님이 이 세계의 패권을 차지하기 위해 비상(飛翔)하실 날을, 그동안 계속 기다리고 있었습니다.
  translation_zh: 我一直盼望着主君为了夺取这个世界的霸权而腾飞的那一天。
