title: -시-：主体敬语（尊敬动作主体）
structure: 谓词词干 + -시- + 词尾
structure_pattern: V/A + -시- (주체 높임 선어말어미)
explanation_zh: -시-是学校语法中的主体敬语先语末词尾（주체 높임 선어말어미），接在谓词词干后，对动作主体表示尊敬。与过去时先语末词尾-았/었-结合时缩为-셨-（하셨다、지키셨다）。片段中仆人露西描述主人亚兹兰的言行时全篇使用此词尾，体现严格的主从阶位。
examples:
- text: 결심하셨군요.
  reading: ''
  annot: 결심하셨군요.
  translation_zh: 您下定决心了啊。
  source_book: book-ko-015
