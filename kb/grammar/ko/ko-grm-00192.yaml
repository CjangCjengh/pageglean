title: 「-(으)ㄹ 수 없다：能力与可能性的否定」
structure: 용언 어간 + 관형사형 전성어미 -(으)ㄹ + 의존명사 '수' + 없다
structure_pattern: V-(으)ㄹ 수 없다
explanation_zh: 관형사형 어미 '-(으)ㄹ' 后接 의존명사 '수'，表示能力或可能性，'-ㄹ 수 없다' 即「不能／无法做某事」。片段中主人公用「마법을
  사용할 수 없다」「쓸 수 없다」反复强调自己无法使用魔法，是贯穿全文的核心表达。肯定形式为 '-(으)ㄹ 수 있다'。
