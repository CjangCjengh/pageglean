title: 「-(으)려고 하다：打算/想要……」
structure: 动词词干 + -(으)려고 하다
structure_pattern: V-(으)려고 + 하다
explanation_zh: -(으)려고 是表示意图或目的的连接词尾，与 하다 搭配构成 -(으)려고 하다，意为「打算/想要……」。作冠形词形（관형사형）修饰名词时用
  -려는，文中「두려고 하는 건」「진행되려는 경향」即此。「죽이려고 했었어」用 -았었- 表示过去一直持续的意图。
examples:
- text: 너는 지금까지 계속 나를 죽이려고 했었어.
  reading: ''
  annot: 너는 지금까지 계속 나를 죽이려고 했었어.
  translation_zh: 你到现在为止，一直都在设法杀我。
  source_book: book-ko-015
