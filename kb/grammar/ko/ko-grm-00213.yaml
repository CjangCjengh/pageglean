title: -(으)ㄹ 뿐이다：仅此而已
structure: 用言词干/体言 + 冠形词形 -(으)ㄹ + 依存名词 뿐 + 이다
structure_pattern: V/A-(으)ㄹ 뿐이다; N-(이)ㄹ 뿐이다
explanation_zh: 뿐是依存名词，接在用言的冠形词形 -(으)ㄹ 或体言+이다（일）之后，再用 이다 收尾，表示限定，相当于中文的“只是……而已”。本句强调克劳对“我”来说不过是要打倒的对象。口语中常简化使用，语气冷静而决绝。
examples:
- text: 어차피 나에게 클라우는 쓰러뜨려야 할 대상일 뿐이다.
  reading: ''
  annot: 어차피 나에게 클라우는 쓰러뜨려야 할 대상일 뿐이다.
  translation_zh: 反正对我来说，克劳不过是一个必须打倒的对象罢了。
