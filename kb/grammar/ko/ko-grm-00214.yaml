title: -거든：口语中说明理由
structure: 用言词干 + 终结词尾 -거든
structure_pattern: V/A-거든
explanation_zh: -거든是表示理由的终结词尾，多用于口语，向对方说明原因，带有“我告诉你哦，因为……”的语气，后续句常省略。与书面性的 -기 때문이다
  相比更为随意，日常会话与影视台词中高频出现。
