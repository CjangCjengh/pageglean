title: -(으)ㄹ 수 있다/없다：能力与可能
structure: 용언 '-(으)ㄹ' + 의존명사 '수' + '있다/없다'
structure_pattern: V/A-(으)ㄹ + 수 + 있다/없다
explanation_zh: 用言加定语形词尾-(으)ㄹ修饰依存名词수，再以있다/없다作谓语，表示能力或可能性。있으면表可能，없으면表不可能。对应中文的“能/可以……”或“不能……”。
examples:
- text: 틸프보다 강하다는 건, 적어도 근접전에서는 우리들 중 누구도 이길 수 없다는 의미다.
