title: -면서/-(으)며：一边……一边……
structure: 동사 어간 + 동시 동작 연결어미 '-면서 / -(으)며'
structure_pattern: V + -면서 / -(으)며
explanation_zh: '''-면서/-(으)며''表示两个动作同时进行，-며是-면서的书面体形式，前后分句主语通常一致。本段用“호위하면서”“끄덕이며”等，刻画一边做某动作一边进行另一动作的情景。对应中文的“一边……一边……”。'
examples:
- text: 틸프, 너는 주군을 호위하면서 그녀와 몇 번 부딪힌 적이 있을 거다.
  reading: ''
  annot: 틸프, 너는 주군을 호위하면서 그녀와 몇 번 부딪힌 적이 있을 거다.
