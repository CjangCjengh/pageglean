title: -다면：如果……的话（假定条件）
structure: 用言语干 + 假定条件连接词尾 '-다면'（体言后为 '-이라면'）
structure_pattern: V/A-다면; N-이라면
explanation_zh: '''-다면''是表示假定条件的连接词尾，相当于中文的“如果……的话”。与单纯条件''-면''相比，''-다면''带有较强的推测、设想语气，常用于提出假设性前提供讨论。片段中人物反复用它推演各种作战方案的可能性，如''필요하다면''''사실이라면''。'
examples:
- text: 그 얘기가 사실이라면 클라우의 목을 베는 것도 불가능하겠네.
  reading: ''
  annot: 그 얘기가 사실이라면 클라우의 목을 베는 것도 불가능하겠네.
  translation_zh: 如果那番话是真的，那么要砍下克劳的脖子也不可能了呢。
  source_book: book-ko-015
  source_chapter: null
  pointer: null
- text: 필요하다면 자기가 원하는 위치에 형성시킬 수도 있는 것 같아.
  reading: ''
  annot: 필요하다면 자기가 원하는 위치에 형성시킬 수도 있는 것 같아.
  translation_zh: 如果有必要的话，似乎也能在自己想要的位置形成（剑）。
