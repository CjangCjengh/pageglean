title: -(으)ㄹ 수밖에 없다：别无选择、只能如此
structure: 用言 + 冠形词形词尾 -(으)ㄹ + 依存名词 '수' + 补助词 '밖에' + 否定述语 '없다'
structure_pattern: V/A-(으)ㄹ + 수 + 밖에 + 없다
explanation_zh: 依存名词'수'表示方法或可能性，补助词'밖에'意为'除……之外'，与否定形'없다'搭配，字面即'除此之外没有别的办法'，引申为'只好、只能～'。中文对应'只能……、不得不……'。片段中两次出现，均用于表示别无选择的处境。
examples:
- text: 신화 속 영웅을 불러오는 수밖에 없겠죠.
  reading: ''
