title: -(으)ㄹ 정도로：达到～的程度
structure: 用言 + 冠形词形词尾 -(으)ㄹ + 依存名词 '정도' + 副词格助词 '로'
structure_pattern: V/A-(으)ㄹ + 정도 + 로
explanation_zh: 用言以冠形词形词尾-(으)ㄹ修饰依存名词'정도'（程度），再结合副词格助词'로'，表示'达到～的程度'，用于具体说明某种状态或动作程度之深。中文对应'到……的程度／地步'。片段中两处分别用于描写打击强度与庆幸的程度。
examples:
- text: 클라우 에른베스크의 재생 능력을 뛰어넘을 정도로 압도적인 타격
  reading: ''
  annot: 클라우 에른베스크의 재생 능력을 뛰어넘을 정도로 압도적인 타격
  translation_zh: 达到超越克劳·恩贝斯克再生能力程度的压倒性打击
