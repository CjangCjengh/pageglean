title: -(으)며：一边～一边…（书面同时动作）
structure: 用言 + 对等连接词尾 -(으)며（相当于 '-면서' 的书面形式）
structure_pattern: V/A-며
explanation_zh: 对等连接词尾-(으)며表示两个动作同时进行或两种状态并存，功能与'-면서'相当，但书面语色彩更强，在小说叙述中尤为常见。片段中'내쉬며''상상하며''중얼거리며'等反复出现，用于描写主要动作的伴随动作。中文可译为'一边……一边……'或处理为连动结构。
examples:
- text: 알테아가 한숨을 내쉬며 고개를 절레절레 흔들었다.
  reading: ''
  annot: 알테아가 한숨을 내쉬며 고개를 절레절레 흔들었다.
  translation_zh: 阿尔忒娅叹着气，连连摇头。
