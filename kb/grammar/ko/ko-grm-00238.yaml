- text: 그런 비현실적인 존재를 상상하며, 네 사람은 동시에 한숨을 내쉬었다.
  reading: ''
  annot: 그런 비현실적인 존재를 상상하며, 네 사람은 동시에 한숨을 내쉬었다.
  translation_zh: 想象着那种不现实的存在，四个人同时叹了口气。
