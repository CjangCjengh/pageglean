id: ko-grm-00239
language: ko
type: grammar
level: TOPIK2
level_rank: 2
title: 「-자마자」：一……就……
structure: 동사 어간 + 연결 어미 ‘-자마자’
structure_pattern: V-자마자
explanation_zh: 表示前一动作刚完成、后一动作紧接着发生，相当于中文的“一……就……”。直接接在动词词干后，不受词干元音影响。本段用于描写军令一下达便立即集结出发，是该词尾表紧接关系的典型叙事用法。
examples:
- text: 명령이 떨어지자마자 지금 당장 움직일 수 있는 7천 병력을 긁어모아 아즐란의 본거지인 가시나무 왕궁을 향해 즉각 출발시켰다.
  reading: ''
