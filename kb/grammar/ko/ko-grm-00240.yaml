title: 「-(으)ㄹ 뿐이다」：只不过……罢了
structure: 용언 관형사형 전성 어미 ‘-(으)ㄹ’ + 의존 명사 ‘뿐’ + 서술격 조사 ‘이다’
structure_pattern: V/A-(으)ㄹ 뿐이다
explanation_zh: 由冠形词形转成词尾“-(으)ㄹ”加依存名词“뿐”再加叙述格助词“이다”构成，表示限定，意为“仅此而已”。文中两次出现，分别淡化“只是服从方针”与“计策终归只是计策”。与“-만”义近，但限定语气更强、更具书面感。
examples:
- text: 마크베르거는 주군의 방침을 따를 뿐이었다.
  reading: ''
  annot: 마크베르거는 주군의 방침을 따를 뿐이었다.
  translation_zh: 马克贝格只不过是遵从主君的方针罢了。
  source_book: book-ko-015
  source_chapter: null
  pointer: null
- text: 책략은 결국 책략일 뿐이다.
  reading: ''
