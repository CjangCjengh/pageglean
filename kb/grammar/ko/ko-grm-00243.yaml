title: 「-아/어 대다」：不停地……（反复与强调）
structure: 본용언 ‘-아/어’ + 보조 동사 ‘대다’
structure_pattern: V-아/어 대다
explanation_zh: 本动词接“-아/어”后接补助动词“대다”，表示动作反复、持续不停或程度强烈，多带夸张乃至贬抑的语气。“대다”活用为过去时写作“-아/어
  댔다”。文中“떠들어 댔다”形容副官旁若无人地说个不停。
examples:
- text: 마크베르거는 입을 꾹 다물고 있었지만 부관은 상관하지 않고 계속 떠들어 댔다.
  reading: ''
  annot: 마크베르거는 입을 꾹 다물고 있었지만 부관은 상관하지 않고 계속 떠들어 댔다.
  translation_zh: 马克贝格一直紧闭双唇，副官却毫不在意，仍旧滔滔不绝地说个不停。
