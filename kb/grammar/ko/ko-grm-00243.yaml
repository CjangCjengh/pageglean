  pointer: null
- text: 목을, 몸통을, 어깨를, 다리를, 몇 번이고 몇 번이고 찔러 댔다.
  reading: ''
  annot: 목을, 몸통을, 어깨를, 다리를, 몇 번이고 몇 번이고 찔러 댔다.
