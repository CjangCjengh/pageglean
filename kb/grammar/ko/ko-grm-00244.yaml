id: ko-grm-00244
language: ko
type: grammar
level: TOPIK2
level_rank: 2
title: 관형사형 전성어미 -(으)ㄴ/-는/-(으)ㄹ：名词的时态修饰
structure: 용언 + 관형사형 전성어미 (과거 -(으)ㄴ / 현재 -는 / 미래 -(으)ㄹ) + 체언
structure_pattern: (V/A)-(으)ㄴ/-는/-(으)ㄹ + N
explanation_zh: 관형사형 전성어미接在용언后，使其修饰后面的체언（名词），相当于中文的「的」。过去用 -(으)ㄴ，动词现在时用 -는，将来用 -(으)ㄹ。本段中「쓰러지는
  보스」（现在）与「쓰러질 잔챙이」（将来）连用，通过形态差异体现时态对照。
examples:
- text: 클라우 에른베스크는 1권에서 쓰러지는 첫 번째 보스다.
