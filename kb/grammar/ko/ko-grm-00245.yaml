title: -고 있다：进行与状态持续
structure: 본용언 + 보조적 연결어미 -고 + 보조동사 있다
structure_pattern: V-고 + 있다
explanation_zh: 보조적 연결어미 '-고' 与 보조동사 '있다' 构成보조 용언，表示动作进行或状态持续，相当于「正在……」「一直……着」。过去形
  '-고 있었다' 表示过去持续中的状态。文中以「호소하고 있었다」「잘못되고 있다」等描写危机中持续紧绷的感受。
examples:
- text: 그제야 마크베르거는 뭔가 잘못되고 있다는 것을 깨달았다.
