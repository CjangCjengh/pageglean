id: ko-grm-00246
language: ko
type: grammar
level: TOPIK3
level_rank: 3
title: -기 때문이다：原因说明「是因为……」
structure: 용언 + 명사형 전성어미 -기 + 의존명사 때문 + 서술격 조사 이다
structure_pattern: (V/A)-기 + 때문이다
explanation_zh: 명사형 전성어미 '-기' 将用言名词化，后接 의존명사 '때문' + 이다，表示原因、理由，相当于「是因为……」。比连接词尾 -아/어서
  更书面、更具说明性，可叠加过去 '-았/었기 때문에'。文中两次用于解释世界设定与圣溃剑的限制。
examples:
- text: 이것은 이 세계가 프린세스 컨퀘스트라는 소설을 바탕으로 한 세계이기 때문이다.
  reading: ''
  annot: 이것은 이 세계가 프린세스 컨퀘스트라는 소설을 바탕으로 한 세계이기 때문이다.
  translation_zh: 这是因为，这个世界是一个以小说《公主征服》为原形的世界。
  source_book: book-ko-015
  source_chapter: null
  pointer: null
- text: 어차피 성궤검의 사용 횟수에는 제한이 있기 때문에 지금 이 자리에서는 더 이상 사용할 수 없다.
  reading: ''
  annot: 어차피 성궤검의 사용 횟수에는 제한이 있기 때문에 지금 이 자리에서는 더 이상 사용할 수 없다.
  translation_zh: 反正星溃剑的使用次数有限制，所以此时此刻无法再使用了。
  source_book: book-ko-015
