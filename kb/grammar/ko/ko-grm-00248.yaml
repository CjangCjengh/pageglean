id: ko-grm-00248
language: ko
type: grammar
level: TOPIK3
level_rank: 3
title: -(으)ㄹ 뿐이다：只是……而已
structure: 용언 + 관형사형 전성어미 -(으)ㄹ + 의존명사 뿐 + 이다
structure_pattern: (V/A)-(으)ㄹ + 뿐이다
explanation_zh: 의존명사 '뿐' 受관형사형 전성어미修饰，表示限定，意为「只是～」「不过是～而已」，常与부사 '그저' 呼应。注意与接在体言后、无空格的보조사
  '뿐'（如 물뿐）区分：依存名词前面必有冠形词形。
examples:
- text: 군사 지휘관인 마크베르거조차 소설 본문에서는 몇 줄 언급되고 끝날 뿐이다.
  reading: ''
  annot: 군사 지휘관인 마크베르거조차 소설 본문에서는 몇 줄 언급되고 끝날 뿐이다.
  translation_zh: 就连军事指挥官马克伯格，在小说正文里也不过是被提上几行就结束而已。
  source_book: book-ko-015
  source_chapter: null
  pointer: null
- text: 그저 알테아 옆을 지나, 천천히 앞으로 나아갈 뿐이다.
  reading: ''
  annot: 그저 알테아 옆을 지나, 천천히 앞으로 나아갈 뿐이다.
  translation_zh: 只是从阿尔忒亚身旁经过，缓缓向前走去而已。
