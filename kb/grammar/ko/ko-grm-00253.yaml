title: 「-던：回想定语词尾」
structure: 용언 어간 + 회상 관형사형 어미 '-던' + 체언
structure_pattern: V/A + -던 + N
explanation_zh: '''-던''是回想形冠形词尾，追忆说话者过去亲历或曾经持续的状态来修饰后面的名词。与单纯过去完成的''-았던''不同，它带有''当时如此、如今回溯''的现场感。片段中''애용하던、살던、줬던、날아오던''反复出现，是小说叙述的典型手段。'
examples:
- text: 오른손에 들고 있는 건 예전부터 애용하던 검이고,
  reading: ''
