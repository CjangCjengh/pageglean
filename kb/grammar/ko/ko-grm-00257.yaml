title: 「-면서：一边……一边……」
structure: 용언 어간 + 연결어미 '-면서'
structure_pattern: V + -면서
explanation_zh: 连接词尾'-면서'表示两个动作同时进行，前后主语须一致。本片段高频出现（'도약하면서、쳐 내면서、지르면서、내려다보면서'），是描写战斗场面伴随动作的基本手段。也可表示前项为背景。
examples:
- text: 고함을 지르면서 틸프를 향해 달려들었지만, 틸프의 접근을 허락한 시점에서 그들의 운명은 이미 결정된 것이었다.
  reading: ''
  annot: 고함을 지르면서 틸프를 향해 달려들었지만, 틸프의 접근을 허락한 시점에서 그들의 운명은 이미 결정된 것이었다.
  translation_zh: 他们呐喊着扑向蒂尔芙，但在放任蒂尔芙近身的那一刻，他们的命运就已经注定了。
