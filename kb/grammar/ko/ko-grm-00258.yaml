title: -며：一边……一边……（同时与背景）
structure: 动词词干 + -며（连接词尾，表示前后动作同时进行，前句作背景）
structure_pattern: V-어간 + -며
explanation_zh: -며 是连接词尾（연결어미），接在动词词干后，表示两个动作同时进行，前句常作后句的背景，相当于“一边……一边……”。与 -면서 意义相近但语感更简洁，多用于书面叙述。本片段反复出现，承担场景铺陈的功能。
examples:
- text: 아즐란을 생각하며, 마이시아는 다음 마법을 준비했다.
