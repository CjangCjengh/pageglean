title: -(으)ㄴ 채：保持某种状态
structure: 动词词干 + -(으)ㄴ 채（依存名词 채 表示状态的保持）
structure_pattern: V-어간 + -(으)ㄴ 채
explanation_zh: 채 是依存名词（의존명사），受冠形词形转成词尾 -(으)ㄴ 修饰，表示后一动作在保持前一结果状态的情况下进行，相当于“保持着……的状态”。与
  -아/어서 不同，它强调状态的保持而非原因。片段中出现三次，用于刻画人物姿态。
examples:
- text: 커다란 방패를 든 병사들에게 둘러싸인 채, 중년 남자가 후퇴하고 있었다.
