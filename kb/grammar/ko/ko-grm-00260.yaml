title: -(으)ㄹ 뿐이다：只是……而已
structure: 动词词干 + -(으)ㄹ 뿐이다（依存名词 뿐 表示限定）
structure_pattern: V-어간 + -(으)ㄹ 뿐이다
explanation_zh: 뿐 是依存名词（의존명사），表示限定，相当于“只是、不过”。接动词时以冠形词形 -(으)ㄹ 修饰构成 -(으)ㄹ 뿐이다；体言后可直接接
  뿐（如“말살뿐이다”）。片段中反复出现，强调“除此之外别无其他”的语气。
examples:
- text: 고향을 등진 마이시아는 오로지 아즐란을 위해서 살아갈 뿐이다.
  reading: ''
  annot: 고향을 등진 마이시아는 오로지 아즐란을 위해서 살아갈 뿐이다.
