title: -아/어 주다：为（某人）做……
structure: 动词词干 + -아/어 + 보조동사 주다（表示动作使他人受益）
structure_pattern: V-어간 + -아/어 주다
explanation_zh: 주다 作补助动词（보조동사）时表示行为给他人带来恩惠，接受者常以 -에게 标记；尊敬语境改称 드리다。片段中“해 줄 말”即“愿意对你们说的话”，常用于说话人表明自己的立场。
