title: -(으)ㄹ 수 없다 / -지 못하다：无法……
structure: 动词词干 + -(으)ㄹ 수 없다（依存名词 수 表可能）；动词词干 + -지 못하다（长形否定）
structure_pattern: V-어간 + -(으)ㄹ 수 없다 / -지 못하다
explanation_zh: 两者都表示能力或可能性的否定。-(으)ㄹ 수 없다 以依存名词 수 构成，较为正式；-지 못하다 是否定副词 못 的长形，语气略强。片段中多次用于描写被控制者“无法抵抗、无法警戒”的处境。
examples:
