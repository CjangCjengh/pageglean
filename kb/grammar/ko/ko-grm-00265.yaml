title: -(으)ㅂ니다 / -(으)ㅂ니까：格式体敬语终结词尾
structure: 动词词干 + -(으)ㅂ니다（陈述）/ -(으)ㅂ니까（疑问），可加主体尊敬先语末词尾 -시-
structure_pattern: V-어간 + -(으)ㅂ니다 / -(으)ㅂ니까 (+ -시-)
explanation_zh: -(으)ㅂ니다 / -(으)ㅂ니까 是格式体（합쇼체）的敬语终结词尾（종결어미），用于正式、庄重的场合；疑问形 -(으)ㅂ니까 句尾语调不上扬。片段中露西的审讯用语全部使用这一阶位，与敌将的半语（해체，如“그게
  뭐야”）形成鲜明的阶位对照。
examples:
- text: 가장 먼저 묻겠습니다. 클라우 에른베스크는 지금 어디 있습니까?
  reading: ''
  annot: 가장 먼저 묻겠습니다. 클라우 에른베스크는 지금 어디 있습니까?
