title: 「-(으)며 / -(으)면서：动作同时进行」
structure: 용언 어간 + -(으)며 / -(으)면서（연결 어미）
structure_pattern: 용언 어간 + -(으)며
explanation_zh: -(으)며是接在用言词干后的连接词尾，表示两个动作或状态同时进行，是-(으)면서的缩略形。在叙事文体中多用-며，使句子简洁、节奏紧凑。对应中文的"一边……一边……"或"……着"。
examples:
- text: 그 방심한 틈을 노려야겠다고 생각하며, 루시는 클라우에게 쇄도했다.
