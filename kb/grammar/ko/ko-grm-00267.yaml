id: ko-grm-00267
language: ko
type: grammar
level: TOPIK2
level_rank: 2
title: 「-지만：转折与对比」
structure: 용언 어간 + -지만（역접 연결 어미）
structure_pattern: 용언 어간 + -지만
explanation_zh: -지만是表示转折的连接词尾，后句内容与前句相反或出乎意料。本段战斗描写中反复用该结构强调攻击被挫败的落差。动词、形容词词干后均可直接接-지만。
examples:
- text: 대부분의 촉수가 클라우의 검에 절단되었지만, 그래도 적지 않은 숫자의 촉수들이 빈틈을 파고들며 클라우의 머리를 향해 쇄도했다.
  reading: ''
  annot: 대부분의 촉수가 클라우의 검에 절단되었지만, 그래도 적지 않은 숫자의 촉수들이 빈틈을 파고들며 클라우의 머리를 향해 쇄도했다.
  translation_zh: 大部分触手被克劳的剑斩断了，但仍有不少触手钻进空隙，朝克劳的头部猛冲过去。
