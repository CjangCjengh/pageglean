  pointer: null
- text: 클라우가 집어 던진 칼날이 알테아의 몸에 정통으로 꽂혔지만, 마법적으로 강화된 갑옷에 꽂혔을 뿐 알테아의 몸을 꿰뚫지는 못했다.
  reading: ''
