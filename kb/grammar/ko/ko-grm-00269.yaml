title: 「-아/어 내다：动作达成结果」
structure: 본용언 어간 + -아/어 + 보조 동사 '내다'
structure_pattern: V-아/어 내다
explanation_zh: 补助动词내다通过-아/어与主要动词结合，强调动作取得结果或贯彻到底（학교문법的补助动词构成）。本段战斗描写中高频出现：잘라 내다（切断）、뻗어
  나오다（伸出）、튕겨 내다（弹开）。中文常译出结果补语"断、出来、开"。
examples:
- text: 흑색의 칼날은 거대한 갈퀴를 아무 저항 없이 파고들어 소유자의 팔을 잘라 내고, 더 나아가 몸뚱이까지 꿰뚫으려 했다.
  reading: ''
