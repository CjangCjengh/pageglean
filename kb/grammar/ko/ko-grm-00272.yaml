title: -(으)ㄹ 수 있다/없다：可能性
structure: 动词词干 + -(으)ㄹ 수 있다/없다（관형사형 전성어미 + 의존명사 '수'）
structure_pattern: 용언 어간 + 관형사형 전성어미 -(으)ㄹ + 의존명사 '수' + 있다/없다
explanation_zh: 由冠形词形转换词尾 -(으)ㄹ 加依存名词 수 构成，表示有能力或条件做某事，相当于中文的“能、可以”，否定用 -(으)ㄹ 수 없다。片段中出现频率极高，如“깎을
  수 있을 거라”还叠加了推测表达 -(으)ㄹ 것이다。
examples:
- text: 치명상을 입히지는 못하더라도 성궤검을 둔기로 사용해 계속해서 구타한다면 체력 정도는 깎을 수 있을 거라 생각하면서.
