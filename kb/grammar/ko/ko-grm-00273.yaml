title: -고 있다：进行与状态持续
structure: 动词词干 + -고 있다（연결어미 -고 + 보조동사 '있다'）
structure_pattern: 동사 어간 + 연결어미 -고 + 보조동사 '있다'（진행·결과 상태 지속）
explanation_zh: 连接词尾 -고 后接补助动词 있다，表示动作正在进行或结果状态的持续，相当于中文的“正在……”“……着”。片段中“꿰뚫고 있었다”强调刀刃刺入后持续保持的状态，是战斗场面描写的骨架结构。
examples:
- text: 땅에서 솟아나온 검은색 칼날이, 알테아의 다리를 꿰뚫고 있었다.
