  pointer: null
- text: 클라우가 웃으면서 입을 연 그 순간, 틸프의 눈앞에 검은색 칼날이 출현했다.
  reading: ''
  annot: 클라우가 웃으면서 입을 연 그 순간, 틸프의 눈앞에 검은색 칼날이 출현했다.
