title: -기 위해서 / -(으)려 하다：目的表达
structure: 动词词干 + -기 위해서；动词词干 + -(으)려(고) 하다
structure_pattern: 동사 어간 + 명사형 전성어미 -기 + 위해서 / 동사 어간 + 연결어미 -(으)려고 + 보조동사 '하다'
explanation_zh: 名词化词尾 -기 加 위해서 构成目的状语，-(으)려고 하다 则以目的连接词尾搭配补助动词，表示“为了……”“打算做……”。片段反复用这两种形式交代人物行为的动机，如观察敌情、强行行动。名词后还可接
  을/를 위해서라면，如“주군을 위해서라면（若是为了主君）”。
examples:
- text: 틸프가 루시와 알테아가 당하는 것을 그냥 지켜보고만 있었던 건 클라우의 공격을 제대로 관찰하기 위해서였다.
