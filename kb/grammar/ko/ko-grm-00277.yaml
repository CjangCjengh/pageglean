  pointer: null
- text: 틸프가 두 손에 각기 다른 검을 든 채 지그재그로 움직이며 클라우에게 돌진했다.
  reading: ''
  annot: 틸프가 두 손에 각기 다른 검을 든 채 지그재그로 움직이며 클라우에게 돌진했다.
  translation_zh: 蒂尔芙双手各持一柄不同的剑，以之字形走位向克劳突进。
