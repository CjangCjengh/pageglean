title: -(으)ㄴ 채(로)：保持某种状态
structure: 动词词干 + -(으)ㄴ 채(로)
structure_pattern: 동사 어간 + 관형사형 전성어미 -(으)ㄴ + 의존명사 '채'
explanation_zh: 冠形词形转换词尾 -(으)ㄴ 加依存名词 채，表示在保持某一状态的情况下进行另一动作，相当于中文的“保持着……（做某事）”。与 -면서
  相比更强调状态的固定不变。片段连续使用“거리를 유지한 채”“입을 다문 채”“검을 든 채”，是战斗描写的常用手法。
examples:
- text: 클라우가 입을 다문 채 틸프를 응시했다.
  reading: ''
  annot: 클라우가 입을 다문 채 틸프를 응시했다.
  translation_zh: 克劳紧闭着嘴，凝视着蒂尔芙。
  source_book: book-ko-015
