title: 「-(으)ㄹ 수 없다」：依存名词 수 表不可能
structure: 用言词干 + 冠形词形转成词尾 -(으)ㄹ + 依存名词 수 + 없다
structure_pattern: V/A-(으)ㄹ + 수 + 없다
explanation_zh: 冠形词形转成词尾 -(으)ㄹ 修饰依存名词 수（『…的可能/办法』），再接 없다 构成『不能…』。肯定式为 -(으)ㄹ 수 있다。本片段中反复出现，是表达客观条件限制的核心结构。
examples:
- text: 이 자리에서 본격적인 치료를 할 수는 없다.
  reading: ''
  annot: 이 자리에서 본격적인 치료를 할 수는 없다.
  translation_zh: 在这里是无法进行正式治疗的。
