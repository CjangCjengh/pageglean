title: 「-면서」：连接词尾表同时动作
structure: 用言词干 + 连接词尾 -면서
structure_pattern: V-면서(연결어미)
explanation_zh: 连接词尾 -면서 表示两个动作同时进行，相当于『一边…一边…』，前后主语须一致。片段中多处描写人物边做某事边做另一事，是叙事中刻画动作的高频连接词尾。
examples:
- text: 클라우가 나른하다는 듯이 하품을 하면서 천천히 걸어 나왔다.
  reading: ''
  annot: 클라우가 나른하다는 듯이 하품을 하면서 천천히 걸어 나왔다.
