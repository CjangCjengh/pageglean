  pointer: null
- text: 발버둥 치면서 클라우의 손을 뿌리치려 했지만 마법사인 마이시아의 힘으로는 클라우를 뿌리칠 수 없었다.
  reading: ''
  annot: 발버둥 치면서 클라우의 손을 뿌리치려 했지만 마법사인 마이시아의 힘으로는 클라우를 뿌리칠 수 없었다.
