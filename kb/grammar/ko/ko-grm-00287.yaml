title: 「-는 것도 아니고 ~는 것도 아닌」：双重否定式描写
structure: 动词词干 + 冠形词形转成词尾 -는 + 依存名词 것 + -도 아니고/-도 아닌
structure_pattern: V-는 것도 아니고 + V-는 것도 아닌
explanation_zh: 用冠形词形转成词尾 -는 将动作名词化为 것，再以 -도 아니다 并列否定两者，表达『既不是…也不是…』的中间状态。常用于细腻描摹表情、气氛等难以归类的样态。
examples:
- text: 웃는 것도 아니고 우는 것도 아닌, 여러 가지 감정이 섞인 듯한 표정이었다.
  reading: ''
  annot: 웃는 것도 아니고 우는 것도 아닌, 여러 가지 감정이 섞인 듯한 표정이었다.
