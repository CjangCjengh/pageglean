title: 「-(으)ㄹ 텐데」：委婉推测与转折铺垫
structure: 用言词干 + 依存名词'터'构成的推测结构'-(으)ㄹ 터' + 连接词尾'-인데'
structure_pattern: V/A + -(으)ㄹ 터 + -인데
explanation_zh: '''터''是表示推测、想法的依存名词，''-(으)ㄹ 터이다''整体表示''应该会……''的推测。后接连接词尾''-인데''引出背景或转折，相当于''应该……可是……''，常用于推测对方情况后接疑问或建议。本段中反复出现，暗含实际情况与预期不符的语气。'
examples:
- text: 그 제안은 이미 거절했을 텐데.
  reading: ''
