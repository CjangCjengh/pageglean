title: 「-잖아(요)」：提醒显而易见的事实
structure: 用言词干 + 终结词尾'-잖아'（'-지 않아'的缩略）
structure_pattern: V/A + -잖아(요)
explanation_zh: '''-잖아(요)''是''-지 않아요''的缩略，用于提醒对方已知或显而易见的事实，相当于''不是……吗''。口语对话中使用频率极高，常带指出理由、根据的语气。本段以''불가침
  상태잖아''''마법을 쓸 수 없잖아''提醒对方既定事实。'
examples:
- text: 어째서 아리네시아와 싸워야 하는 거지? 서로 불가침 상태잖아.
  reading: ''
  annot: 어째서 아리네시아와 싸워야 하는 거지? 서로 불가침 상태잖아.
