title: 「-(으)ㄹ 수 있다/없다」：可能与不可能
structure: 动词词干 + 冠形形词尾'-(으)ㄹ' + 依存名词'수' + 있다/없다
structure_pattern: V + -(으)ㄹ 수 있다/없다
explanation_zh: '''수''是依存名词，必须与前面动词的冠形形''-(으)ㄹ''搭配，与''있다/없다''结合表示可能性或能力的有无，相当于中文''能/可以……''''不能……''。插入助词还可以说''-(으)ㄹ
  수도 있다''，表示''也有可能……''。本段对话中多次出现，是最高频的基础结构之一。'
examples:
