title: 「-다고 해도：让步假设」
structure: 用言 + 间接引用连接语尾 -다고 + 让步连接 -해도
structure_pattern: A/V-다고 해도
explanation_zh: 由间接引用结构「-다고 하다」加让步连接语尾「-아/어도」构成，表示「即使……也」，常与「아무리」呼应。动词现在时用「-ㄴ/는다고
  해도」，形容词用「-다고 해도」。此句表示即使装备再多魔法道具也无济于事。
examples:
- text: 아무리 마법 아이템을 잔뜩 장비하고 있다고 해도, 나는 너를 충분히 죽일 수 있어.
  reading: ''
  annot: 아무리 마법 아이템을 잔뜩 장비하고 있다고 해도, 나는 너를 충분히 죽일 수 있어.
  translation_zh: 就算你装备了一堆魔法道具，我也完全能杀死你。
