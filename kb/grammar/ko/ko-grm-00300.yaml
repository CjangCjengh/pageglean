id: ko-grm-00300
language: ko
type: grammar
level: TOPIK2
level_rank: 2
title: -ㄹ 수 있다/없다：能与不能
structure: 动词词干 + -(으)ㄹ 수 있다/없다
structure_pattern: V-(으)ㄹ 수 있다 / -(으)ㄹ 수 없다
explanation_zh: 由依存名词수（可能性）构成的基本可能表达，相当于「能……」「不能……」。动词词干后接-(으)ㄹ 수 있다/없다，形容词一般不适用。本片段反复出现「~할
  수 없다」，渲染无力回天的语境，是该结构最典型的用法。
