title: -는 듯하다：仿佛……似的
structure: 动词词干 + -는 듯(하다)，常与마치搭配
structure_pattern: V-는 듯하다 / V-는 듯한 + N
explanation_zh: 依存名词듯表示「好像、仿佛」，常与副词마치搭配构成比喻。动词后接-는 듯(하다)可作谓语，也可转成「-는 듯한+名词」作定语。原文「마치…듯한
  느낌」写出刺空时那种不真实的触感。
examples:
- text: 마치 아즐란의 그림을 찌르는 듯한 느낌이었다.
  reading: ''
