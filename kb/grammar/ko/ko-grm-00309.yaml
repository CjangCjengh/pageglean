title: -(으)ㄴ다면：假设条件
structure: 动词冠形形 -(으)ㄴ + 다면（形容词用 -다면）
structure_pattern: V-(으)ㄴ다면 / A-다면
explanation_zh: 由引用形‘-ㄴ다고’加假设连接词尾‘-면’构成，表示假设性条件，相当于“如果……的话”。与一般的‘-면’相比，假设、推论的意味更强，常用于根据某种情况推测结果。形容词、体言则分别用‘-다면’‘-(이)라면’。
examples:
- text: 카이트의 시체와 함께 있는 광경을 본다면 그녀가 황족이라는 것쯤은 쉽게 알아챌 것이다.
  reading: ''
