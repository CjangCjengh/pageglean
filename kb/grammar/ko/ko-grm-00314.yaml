title: -아/어 주다·드리다：为他人而做
structure: 동사 어간 + -아/어 주다/드리다
structure_pattern: V-아/어 주다/드리다
explanation_zh: 补助动词'주다/드리다'接在动词连接形后，表示动作是为他人而做，含施惠、受益意味。'드리다'是'주다'的谦让形，敬语层级更高。文中'묻어
  주다''만들어 드리다''가르쳐 주다'都是为他人着想的表达。
examples:
- text: 일이 대충 정리되면, 오라버니를 제대로 땅에 묻어 주고 싶어요.
  reading: ''
