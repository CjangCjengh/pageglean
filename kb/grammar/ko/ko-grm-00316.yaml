title: -ㄴ 채로：保持某种状态
structure: 동사 어간 + -ㄴ 채 + 로
structure_pattern: V-ㄴ 채로
explanation_zh: 冠词形词尾'-ㄴ'加依存名词'채'，再续助词'로'，表示保持某种状态做某事或持续处于该状态，相当于'……着、保持着……的状态'。文中'쓰러진
  채로'意为'保持着倒地的状态'。
examples:
- text: 하지만 바닥에 쓰러진 채로 조금도 움직이지 못했다.
  reading: ''
  annot: 하지만 바닥에 쓰러진 채로 조금도 움직이지 못했다.
  translation_zh: 但他保持着倒在地板上的姿势，一动也动不了。
