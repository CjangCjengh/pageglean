title: -게 되다：变化的实现
structure: 동사 어간 + '-게 되다'（연결어미 '-게' + 동사 '되다'）
structure_pattern: V-게 되다
explanation_zh: 动词词干后接 -게 되다，表示某种情况因外部因素而发生变化或得以实现，相当于中文的“变得……、终于……起来”。这种变化并非出于主语自身意志，多由环境或他人促成。片段中用它描述阿尔特亚渐渐萌生梦想、最终实现梦想的过程。
