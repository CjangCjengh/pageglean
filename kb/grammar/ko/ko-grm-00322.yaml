title: -다가：动作的中断与转换
structure: 연결어미 '-다가'(동작의 중단·전환)
structure_pattern: V-다가
explanation_zh: 连接词尾-다가表示前一动作或状态在进行中中断、转为另一情况，相当于汉语「正在……的时候（却）……」。只接动词，后半句多为中途遭遇的事件。片段中「탐색하다가」「싸우다가」都引出行动中途发生的变故。
examples:
