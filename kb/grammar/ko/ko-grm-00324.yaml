title: -아/어 버리다：彻底完成与遗憾语气
structure: 动词词干 + -아/어 버리다
structure_pattern: V-아/어 + 보조용언 '버리다'
explanation_zh: 连接词尾 -아/어 接补助动词 버리다，表示动作彻底完成、不留余地。说话人常带有遗憾、痛快或无可奈何的语气。相当于中文的“……掉了”“干脆……了”。
examples:
- text: 어떤 공격을 받아도 끄떡없는 불사신 같은 적을, 규격 외의 힘으로 일도양단해 버리는 주인공……
  reading: ''
  annot: 어떤 공격을 받아도 끄떡없는 불사신 같은 적을, 규격 외의 힘으로 일도양단해 버리는 주인공……
  translation_zh: 无论受到什么攻击都毫不动摇、如同不死之身般的敌人，以超出规格的力量将其一刀两断的主人公……
