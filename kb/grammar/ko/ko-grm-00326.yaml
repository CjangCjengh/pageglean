title: -기 때문에 / -기에：理由与原因
structure: 动/形词干 + -기 때문에；书面语中可紧缩为 -기에
structure_pattern: V/A-기 + 의존명사 '때문' + 조사 '에' / V/A-기에
explanation_zh: -기 때문에 用名词化词尾 -기 加依存名词 때문 表示原因，语气郑重。-기에 是其书面紧缩形式，多见于小说和正式文体。两者强调客观原因，相当于“因为……”“由于……”。
