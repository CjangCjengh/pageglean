title: -(으)ㄴ 채(로)：保持某种状态
structure: 动词词干 + -(으)ㄴ 채(로)
structure_pattern: V-(으)ㄴ + 의존명사 '채'
explanation_zh: 冠形词形转成词尾 -(으)ㄴ 修饰依存名词 채，表示维持前一动作的状态不变而进行后一动作，即“保持着……”。助词 로 常可省略。与汉语“……着”“维持原样地……”对应。
examples:
- text: 고개를 숙인 채, 클라우가 자그마한 목소리로 중얼거렸다.
  reading: ''
