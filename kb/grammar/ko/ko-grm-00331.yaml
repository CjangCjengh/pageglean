title: -아/어 놓다/두다：动作结果的存续
structure: 动词词干 + -아/어 놓다/두다
structure_pattern: V-아/어 + 보조용언 '놓다/두다'
explanation_zh: 补助动词 놓다/두다 接在连接词尾 -아/어 后，表示动作完成后其结果状态被保留下来，即“……好、放着”。놓다 强调有意的安排，두다
  语气较为中性。与 -아/어 있다 相比，更强调“做完并保持”。
examples:
- text: 마치 아무 일도 없었다는 것처럼 푸른 하늘을 되돌려 놓았다.
  reading: ''
