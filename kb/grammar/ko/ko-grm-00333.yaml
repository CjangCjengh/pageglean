id: ko-grm-00333
language: ko
type: grammar
level: TOPIK3
level_rank: 3
title: -면서：同时、列举与转折
structure: 用言词干 + 连接词尾 -면서
structure_pattern: V/A + -면서
explanation_zh: 连接词尾'-면서'接在用言词干后，主要有同时、列举、转折三种用法。本段'개조하면서…만들어 놓으면서'为列举同时并行的状况，'황족도
  아니면서…오른다'则表转折，相当于'明明……却……'。阅读时需依据上下文区分是同时还是转折。
examples:
- text: 부모님이 나를 개조하면서, 에른베스크 가문의 의무라면서, 나를 엉망진창으로 만들어 놓으면서,
  reading: ''
