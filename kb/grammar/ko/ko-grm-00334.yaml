title: -(으)ㄹ 뿐이다：仅仅、只不过
structure: 用言冠形词形/体言 + 依存名词 뿐 + 서술격 조사 이다
structure_pattern: N/-(으)ㄹ 뿐이다
explanation_zh: 依存名词'뿐'表示限定，意为'只、仅'，后接叙述格助词'이다'构成'-(으)ㄹ 뿐이다'，强调'只不过……而已'。语气上常带有轻视或无奈的色彩。本段三次使用，强调克劳的言行'不过是自言自语''不过是个疯子'。
examples:
- text: 클라우는 자기만이 알고 있는 자기만의 이야기를 혼자서 중얼거릴 뿐이다.
  reading: ''
  annot: 클라우는 자기만이 알고 있는 자기만의 이야기를 혼자서 중얼거릴 뿐이다.
  translation_zh: 克劳只是独自喃喃着只有她自己才知道的故事罢了。
  source_book: book-ko-015
  source_chapter: null
  pointer: null
- text: 소설 속에서 묘사되는 너는 그냥 미치광이일 뿐이야.
  reading: ''
  annot: 소설 속에서 묘사되는 너는 그냥 미치광이일 뿐이야.
  translation_zh: 在小说里被描写的你，不过是个疯子而已。
  source_book: book-ko-015
