title: -오/-소：하오체终结词尾（庄重宣告语体）
structure: 用言词干 + 하오체 종결어미 -오/-소（命令形 -(으)시오）
structure_pattern: V/A + -오/-소 / -(으)시오 (하오체 종결어미)
explanation_zh: '''-오/-소''与''-(으)시오''是相对敬语中''하오체''的终结词尾，比''합쇼체''古朴庄重，如今多见于史剧与翻译体幻想小说的宣告场面。本段马克贝格尔的阵前演说通篇使用此语体，营造当众宣告的庄严感。现代日常会话中一般不使用。'
examples:
