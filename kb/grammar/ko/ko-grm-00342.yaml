title: 보조 용언 -고 말다：终究……（既成结果）
structure: 动词 + 연결어미 '-고' + 보조 용언 '말다'
structure_pattern: V- + -고 말다
explanation_zh: '''-고 말다''是보조 용언结构，表示某事终究发生或发展至不可挽回的结果。该结构常含遗憾语气，此处则强调连克劳·恩贝斯克最终也被打倒的既成事实。与''-아/어
  버리다''意义相近，但更具书面语色彩。'
examples:
- text: 공작 각하는 1만의 군세를 분쇄하고, 마침내 세레나데 전하를 직접 죽이겠다고 나선 클라우 에른베스크까지 쓰러뜨리고 말았소!
  reading: ''
