title: 「间接引用：陈述 -(ㄴ/는)다고 / 命令 -(으)라고」
structure: 动词/形容词词干 + -(ㄴ/는)다고 하다；动词词干 + -(으)라고 하다
structure_pattern: A/V-(ㄴ/는)다고 하다; V-(으)라고 하다
explanation_zh: 韩国学校语法把引用分为直接引用与间接引用，间接引用按句子类型变换词尾：陈述用'-(ㄴ/는)다고 (하다)'，命令用'-(으)라고 (하다)'。引语中的主语和时制常可省略。片段中'없다고
  유명하다'与'제공하라고 명령을 내리다'分别是两者的典型用例。
