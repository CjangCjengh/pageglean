title: 「-아/어 놓다·두다：预备与状态存续」
structure: 动词 + -아/어 놓다 / -아/어 두다（补助用言）
structure_pattern: V-아/어 놓다; V-아/어 두다
explanation_zh: '''놓다/두다''作补助用言接在''-아/어''后，表示动作预先完成、其结果状态持续存在，强调''事先准备好''或''放着不管''。''놓다''侧重有目的地安排好，''두다''侧重搁置、留存。''해
  놓았다''即''早已布置妥当''。'
examples:
- text: 소설에서 아즐란은 클라우가 죽기 전부터 치밀한 공작을 하여, 그녀가 죽으면 바로 자신에게 권력이 이양되도록 해 놓았다.
  reading: ''
  annot: 소설에서 아즐란은 클라우가 죽기 전부터 치밀한 공작을 하여, 그녀가 죽으면 바로 자신에게 권력이 이양되도록 해 놓았다.
