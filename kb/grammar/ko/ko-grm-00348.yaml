title: 「连接词尾 -자：前后紧接」
structure: 动词 + -자（连接词尾）
structure_pattern: V-자
explanation_zh: '''-자''是连接词尾，表示前一事件刚发生，后一事件随即出现，相当于''一……就……''。只能接在动词后，且不能再加过去时制先语末词尾。片段中''대꾸하자''''대답하지
  않자''都用于紧凑衔接前后两个动作。'
examples:
- text: 내가 대꾸하자, 세레나데는 나를 지그시 쳐다보며 물었다.
  reading: ''
