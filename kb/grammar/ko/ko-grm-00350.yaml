title: 「-는 한편：同时进行·另一方面」
structure: 动词 + -는 한편（依存名词 한편 + 冠形形词尾）
structure_pattern: V-는 한편
explanation_zh: '''한편''意为''一方面、另一面''，与''-는''搭配表示两个动作或状态同时进行，或从另一角度展开论述，相当于''一边……一边……／一方面……另一方面……''。比''-면서''更书面、正式，常见于叙述与议论文。'
examples:
- text: 앞으로 나는 세레나데를 내세우는 한편 계속 세력을 확대해야 한다.
  reading: ''
  annot: 앞으로 나는 세레나데를 내세우는 한편 계속 세력을 확대해야 한다.
  translation_zh: 今后我要一边把塞蕾娜德推上台面，一边继续扩大势力。
