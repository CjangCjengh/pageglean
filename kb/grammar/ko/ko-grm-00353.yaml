id: ko-grm-00353
language: ko
type: grammar
level: TOPIK2
level_rank: 2
title: 「-기 때문이다」：表示原因
structure: 用言词干 + 名词化词尾 -기 + 依存名词 때문 + 이다
structure_pattern: V-기 + 때문이다
explanation_zh: 名词化词尾 -기 把前面的小句变成名词性成分，再经依存名词 때문 和 이다 谓述，表示原因、缘故，可用于时制词尾之后（-았/었기 때문이다）。多用于说明性叙述和辩解语气。片段连用两次，先否定、后肯定，形成对照。
examples:
