title: 「-잖아(요)」：指出对方已知的事实
structure: 用言词干 + 连接词尾 -지 않 + 아/어 的缩略形 잖아(요)
structure_pattern: V/A-지 않다 → -잖아(요)
explanation_zh: 잖다 是连接词尾 '-지 않 + 아/어' 的缩略，用于指出对方已经知道或显而易见的事实，常带提醒、反驳、强调的语气，相当于中文「不是…嘛」「明明…」。口语对话中使用频率极高，敬语对话中说
  -잖아요。片段中说话人借此步步紧逼对方。
examples:
- text: 너는 오빠를 조금도 사랑하지 않았잖아?
