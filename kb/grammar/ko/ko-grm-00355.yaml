title: 「-(으)ㄹ 뿐이다」：只是、只不过
structure: 冠形词尾（定语词尾）-(으)ㄹ + 依存名词 뿐 + 이다
structure_pattern: V-(으)ㄹ + 뿐 + 이다
explanation_zh: 冠形词尾 -(으)ㄹ 修饰依存名词 뿐，表示限定，意为「只是…」「无非是…」，强调除此之外没有别的。与 '밖에 없다' 意义相近，但
  뿐이다 语气更冷静、书面。片段两处分别揭穿「只是在利用」和「只是静静地看着」。
examples:
