title: 「-(으)는 대신(에)」：作为交换、代替
structure: 动词词干 + -(으)는 + 依存名词 대신(에)
structure_pattern: V-(으)는 + 대신(에)
explanation_zh: 冠形词尾 -(으)는 修饰依存名词 대신，表示「作为…的交换（条件）」或「代替…」。片段中用于提出「我协助你」与「你替我杀人」之间的交换条件，是谈判类对话的典型句式。
examples:
- text: 제가 협력해 주는 대신 클라우 에른베스크를 죽여 주겠다고 약속하셨을 텐데요.
  reading: ''
  annot: 제가 협력해 주는 대신 클라우 에른베스크를 죽여 주겠다고 약속하셨을 텐데요.
  translation_zh: 您可是答应过，作为我协助的交换，会去杀掉克劳·艾恩贝斯克的。
