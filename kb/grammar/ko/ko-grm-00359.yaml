title: -기 때문에：原因与理由
structure: 용언 어간 + 명사형 어미 '-기' + 부사격 조사 '때문에'
structure_pattern: V/A-기 때문에
explanation_zh: 由名词化词尾“-기”将谓词转为名词性成分，再加副词格助词“때문에”表示原因，相当于“因为……所以……”。比口语的“-아/어서”更书面，强调逻辑上的因果关系。“그렇기
  때문에”（正因如此）是高频固定搭配。
examples:
- text: 그렇기 때문에 세레나데는 7권에서 죽는다.
