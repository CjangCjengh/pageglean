title: 「-(으)ㄹ 것 같다：委婉的推测」
structure: 동사 어간 + -(으)ㄹ 것 같다 / 형용사·이다 어간 + -(으)ㄴ 것 같다
structure_pattern: V + -(으)ㄹ 것 같다 / A·N이다 + -(으)ㄴ 것 같다
explanation_zh: 依存名词“것”加“같다”，表示说话人委婉、不确定的推测或感觉。动词后用“-(으)ㄹ 것 같다”，形容词和“이다”后用“-(으)ㄴ 것
  같다”。也可用于夸张表达，如“귀여워서 죽을 것 같았다（可爱得要命）”。
examples:
- text: 그럴 수도 있을 것 같고, 아닐 것 같기도 하다.
  reading: ''
