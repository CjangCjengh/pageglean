title: 「-(으)ㄹ게(요)：向对方许诺」
structure: 동사 어간 + -(으)ㄹ게(요)（의지·약속의 종결어미）
structure_pattern: V + -(으)ㄹ게(요)
explanation_zh: 表示说话人向听者许下诺言、决心要做某事的终结词尾，语气亲切。因是面向对方的承诺，主语通常是第一人称。常与“-아/어 주다”结合，构成“해
  줄게（我会为你做的）”。
examples:
- text: 알았어. 책임지고 이 세계를 정복해 줄게.
  reading: ''
