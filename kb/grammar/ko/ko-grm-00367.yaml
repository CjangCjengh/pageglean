title: 「-(으)면서/-(으)며：同时进行的动作」
structure: 동사 어간 + -(으)면서 / -(으)며（대등적 연결어미）
structure_pattern: V + -(으)면서 / -며
explanation_zh: 表示同一主语的两个动作同时进行，相当于“一边……一边……”。“-며”是其书面、简洁的形式，多用于叙述文体。前后动作的主语须一致。
examples:
- text: 세레나데는 그렇게 속삭이면서 내 품 안으로 파고들었다.
  reading: ''
  annot: 세레나데는 그렇게 속삭이면서 내 품 안으로 파고들었다.
  translation_zh: 塞蕾纳德那样低声说着，钻进了我的怀里。
