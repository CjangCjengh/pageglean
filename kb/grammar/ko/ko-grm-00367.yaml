- text: 예상외로 세레나데는 살짝 얼굴을 붉히며 쑥스러워하는 반응을 보였다.
  reading: ''
  annot: 예상외로 세레나데는 살짝 얼굴을 붉히며 쑥스러워하는 반응을 보였다.
  translation_zh: 出乎意料，塞蕾纳德微微红了脸，露出害羞的反应。
