title: 「-다고/-자고：间接引用与名词化」
structure: 동사 어간 + -(ㄴ/는)다고 / -자고 / -냐고 + 하다
structure_pattern: V + -(ㄴ/는)다고 / -자고 + 하다
explanation_zh: 间接引用（간접 인용문）用来转述他人或自己的想法：陈述句用“-(ㄴ/는)다고”，共动句用“-자고”，疑问句用“-냐고”。“-다는 것/걸”把句子转成名词性从句，常作“알다、깨닫다”的宾语。
