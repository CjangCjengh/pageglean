title: 「-잖아요：提醒对方已知的事实」
structure: 용언 어간 + -지 않다 → 축약 -잖아요
structure_pattern: V/A + -잖아요 (= -지 않다)
explanation_zh: “-지 않다”的缩略形式“-잖다”，用于提起双方都知道的事实，借此说明理由或背景。语气上常带一点提醒、轻微的责怪或确认，口语中使用频率很高。
examples:
- text: 그래, 그 약혼녀한테도 결국 손을 안 대셨잖아?
