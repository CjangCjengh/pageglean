title: 「-았/었으면 합니다：委婉的请求与愿望」
structure: 용언 어간 + -았/었으면 + 하다 + -ㅂ니다
structure_pattern: V/A + -았/었으면 합니다
explanation_zh: “-았/었으면 하다”把愿望说得非常间接，因而显得礼貌、克制。与尊称“-시-”及补助动词“주다”结合的“-아/어 주셨으면 합니다”是郑重的请求惯用型。
examples:
- text: 그 점은 오해하지 말아 주셨으면 합니다.
  reading: ''
  annot: 그 점은 오해하지 말아 주셨으면 합니다.
  translation_zh: 那一点，希望您不要误会。
