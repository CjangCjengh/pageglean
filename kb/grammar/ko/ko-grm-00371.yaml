title: -며：两个动作同时进行
structure: 动词词干 + 连接词尾 -(으)며（表示伴随，相当于 -면서 的书面形式）
structure_pattern: V + -(으)며
explanation_zh: 连接词尾，表示前一动作与后一动作同时进行，相当于“一边……一边……”或表示伴随状态。比 -면서 更书面化。小说叙述中高频出现“-며
  말했다”的形式，用伴随动作引出说话。
examples:
