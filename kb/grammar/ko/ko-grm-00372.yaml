title: -기 위해서：为了……（目的）
structure: 动词词干 + 名词化词尾 -기 + 위해서；名词 + 助词 을/를 + 위해서
structure_pattern: V-기 + 위해서; N + 을/를 위해서
explanation_zh: 表示行为的目的，相当于“为了……”。动词经名词化词尾 -기 转为体言后接 위해서，名词则直接加 을/를 위해서。文中“-기 위해서였겠지”还叠加了过去时与推测，表示“当时应该是为了……吧”。
examples:
- text: 그래, 클라우 에른베스크를 쓰러뜨리기 위해서였겠지.
  reading: ''
