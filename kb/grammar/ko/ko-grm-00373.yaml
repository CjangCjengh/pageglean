title: -ㄴ다는 거야?：反问确认对方的意思
structure: 动词词干 + 间接引用形 -ㄴ다고 하다 → -ㄴ다는 것 + 이야?（것→거 口语缩略）
structure_pattern: V + -ㄴ다는 거야?
explanation_zh: 由间接引用“-ㄴ다고 하다”加依存名词 것 构成，用来反问确认对方话语的含义，相当于“你的意思是说……吗？”。거 是 것 的口语形式，只出现在对话体中。理解这类结构对读懂韩语对话至关重要。
examples:
- text: 공작님이 그것 때문에 우리를 안 부른다는 거야?
  reading: ''
