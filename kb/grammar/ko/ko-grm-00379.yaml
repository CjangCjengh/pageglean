title: 「-ㄴ/는다고 하다」：间接引用
structure: 动词 + 叙述形词尾 -ㄴ/는다 + 인용 연결어미 고 + 하다；形容词/体言 + -다고/-(이)라고 하다
structure_pattern: V-ㄴ/는다고 하다; A-다고 하다; N-(이)라고 하다
explanation_zh: 间接引用结构：动词接-ㄴ/는다고 하다，形容词接-다고 하다，体言接-(이)라고 하다，用以转述他人话语或传闻。片段中"-다는 것"将其名词化后追问"정말인가요?"，用以核实传闻的真实性。
examples:
