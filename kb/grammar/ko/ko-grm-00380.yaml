title: 「-며/-면서」：同时进行
structure: 动词 + 대등적 연결어미 -며（-면서 的书面缩略形）
structure_pattern: V-며 / V-면서
explanation_zh: -며与-면서是表示两个动作同时进行的连接词尾，学校语法中归为并列（대등적）连接词尾，-며语体更偏书面。小说叙述常用它描写伴随场景，如片段中"一边交谈一边举杯"。
examples:
- text: 그렇게 대화를 나누며, 두 사람은 느긋한 기분으로 술잔을 기울였다.
  reading: ''
