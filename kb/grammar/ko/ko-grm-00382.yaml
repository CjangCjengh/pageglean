title: 「-기로 되어 있다」：既定的安排
structure: 动词 + 명사형 어미 -기 + 부사격 조사 로 + 되어 있다
structure_pattern: V-기로 되어 있다
explanation_zh: -기(名词化词尾)+助词로+되어 있다，表示某事已经决定、安排或约定如此，强调客观的规定与预定而非说话人的个人意志。片段用它解释金书镇为何被派去联系失踪的作家。
examples:
- text: 8권부터 김서진이 담당하기로 되어 있었기 때문에 그가 총대를 메게 되었다.
  reading: ''
