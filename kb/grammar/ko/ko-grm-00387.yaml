- text: 네 명의 직속 부하들하고도 육체관계가 있는 것 같은데, 그녀들하고는 어떤 방식으로 하는 걸까.
  reading: ''
  annot: 네 명의 직속 부하들하고도 육체관계가 있는 것 같은데, 그녀들하고는 어떤 방식으로 하는 걸까.
  translation_zh: （他）好像和四名直属部下也有肉体关系，和她们又是用什么方式做的呢？
