title: 「-며 / -면서」：同时动作与并存让步
structure: 用言词干 + 연결어미（连接词尾）-며（=-면서）；-면서도 表让步并存
structure_pattern: V/A- + -며 / -면서(도)
explanation_zh: 表同时动作的连接词尾，'-며'是'-면서'的缩略形，连接两个同时发生的动作或状态。加上'-도'成'-면서도'，可表示相反状况的并存（让步），如'기분
  좋으면서도 안심되는'（舒服的同时又令人安心）。
examples:
- text: 고개를 갸웃거리며 생각했다.
  reading: ''
