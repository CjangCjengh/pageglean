title: 「-ㄴ다/는다 평서형：小说叙述的基本语域」
structure: 용언 어간 + 평서법 종결어미 '-ㄴ다/는다'(현재), '-았/었다'(과거), 체언 + '이다'
structure_pattern: V/A + -ㄴ다/는다; V/A + -았/었다
explanation_zh: 韩语小说、文章的叙述部分一般采用平叙式（해라체），即'-ㄴ다/는다'（现在）、'-았/었다'（过去）等终结词尾，而对话部分则按人物关系使用不同敬语阶位。阅读时要区分叙述层与对话层的语域差异。
