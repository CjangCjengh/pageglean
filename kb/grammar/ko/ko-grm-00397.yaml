title: 「-(느)ㄴ지 모르다：间接疑问」
structure: 의문사 + 종속절 어미 '-(느)ㄴ지/(으)ㄴ지' + '모르다/알다'
structure_pattern: V-는지 / A-(으)ㄴ지 + 모르다
explanation_zh: '''-(느)ㄴ지''把疑问内容包嵌为从属小句，疑问词保留在原位，后接''모르다/알다''等构成间接疑问。动词现在时用''-는지''，形容词及过去时用''-(으)ㄴ지''。''모르겠다''中的''-겠-''使语气更委婉。'
examples:
- text: 뭐가 다른 건지 모르겠다.
  reading: ''
  annot: 뭐가 다른 건지 모르겠다.
  translation_zh: 不知道到底有什么不同。
