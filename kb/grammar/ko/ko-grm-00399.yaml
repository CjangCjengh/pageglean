title: -기 때문이다：原因与理由
structure: 谓词词干 + 名词形转成词尾'-기' + 依存名词'때문' + 서술격 조사'이다'
structure_pattern: V/A + -았/었기 + 때문이다
explanation_zh: 由名词形转成词尾'-기'将前句名词化，经依存名词'때문'加'이다'表示原因，相当于「因为……」。可结合过去时制词尾（-았/었기 때문에），语感比口语的'-아/어서'更正式、书面。
examples:
- text: 너무 간절히 바랐기 때문에 악마가 찾아왔던 것일까.
  reading: ''
