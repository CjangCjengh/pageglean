title: -(으)ㄴ/는 탓에：消极归因「都怪……」
structure: 谓词 + 冠词形转成词尾'-(으)ㄴ/는' + 依存名词'탓' + 副词格助词'에'
structure_pattern: V/A + -(으)ㄴ/는 탓에
explanation_zh: '''탓''是依存名词，专指导致坏结果的原因，''-(으)ㄴ/는 탓에''相当于「都怪……／由于……（才）」，只用于消极语境。片段中两次出现（전개한
  탓에、그 탓에），是叙述不幸缘由的高频表达。'
examples:
