title: -(으)ㄴ/는 듯(하다)：「仿佛……似的」
structure: 谓词 + 冠词形转成词尾'-(으)ㄴ/는' + 依存名词'듯'（+ '하다'）
structure_pattern: V/A + -(으)ㄴ/는 듯(하다)
explanation_zh: '''듯''是依存名词，表示「像……那样／仿佛……」，可作状语修饰谓语，也可接''하다''充当谓语。文中''대답하듯''描摹动作情态，''알고
  있는 듯한 태도''描摹揣测状态，是小说刻画情态的常用手段。'
examples:
- text: 그리고 키이리의 질문에 대답하듯 시나가 고개를 갸웃했다.
  reading: ''
  annot: 그리고 키이리의 질문에 대답하듯 시나가 고개를 갸웃했다.
  translation_zh: 仿佛在回答基里的问题似的，诗娜歪了歪头。
