title: -(으)ㄴ/는 가운데：状况背景「在……之中」
structure: 谓词 + 冠词形转成词尾'-(으)ㄴ/는' + 依存名词'가운데'
structure_pattern: V/A + -(으)ㄴ/는 가운데
explanation_zh: '''-(으)ㄴ/는 가운데''表示后句事件发生的状况背景，相当于「在……之中／在……的情况下」。常见于新闻报道与书面叙事，文中用来在混乱嘈杂的场面中引出镜头般的场景转换。'
examples:
- text: 혼란과 소음이 혼재한 가운데―
