title: 「-(으)ㄴ 채(로)」：保持原状
structure: 动词词干 + -(으)ㄴ 채(로)
structure_pattern: 용언 어간 + 관형사형 전성어미 -(으)ㄴ + 의존명사 '채'(+ 조사 로)
explanation_zh: 表示在前一状态原样保持的情况下进行后一动作，相当于汉语“保持着……的状态”“……着”。学校语法中“채”为依存名词，受冠形词形转换词尾
  -(으)ㄴ 修饰。后接“로”可表示带着该状态行动。
examples:
