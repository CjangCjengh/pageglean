title: 「-잖다」：强调显而易见的理由
structure: 谓词词干 + -잖다
structure_pattern: 용언 어간 + 종결어미 -잖다('-지 않다'의 준말, 배경 설명)
explanation_zh: -잖다 是 -지 않다 的缩略，用于陈述对方已知或显而易见的事实作为理由，带提醒、辩解语气。与 -니까 不同，它预设听话人也知晓该事实。片段中多次出现，是口语高频表达。
