title: 「-기 마련이다」：理所当然，难免
structure: 动词/形容词词干 + -기 마련이다
structure_pattern: 용언 어간 + 명사형 전성어미 -기 + 서술 표현 '마련이다'
explanation_zh: 表示按常理自然如此、不可避免，相当于“自然会……”“难免……”。学校语法分析为名词化词尾 -기 使谓词名词化后接“마련이다”。片段用以说明“骗子的话听久了自然会觉得像模像样”。
examples:
- text: 사기꾼들 얘기도 30분만 듣다 보면 다 그럴싸하게 들리기 마련이지.
