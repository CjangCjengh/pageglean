id: ko-grm-00415
language: ko
type: grammar
level: TOPIK4
level_rank: 4
title: 「-는지(도) 모르다 / -(으)ㄹ지도 모르다：也许……吧」
structure: 用言 + 연결어미 -는지 + (도) + 모르겠다；用言 + -(으)ㄹ지도 + 모르다
structure_pattern: V/A-는지 (도) 모르겠다 / V/A-(으)ㄹ지도 모르다
explanation_zh: -는지 모르겠다 表示没有把握的推测，意为「说不定……」「也许……吧」，加 도 使语气更委婉。-(으)ㄹ지도 모르다 同义，本段两种形式都出现。相比
  -ㄹ 것이다，不确定的语气更浓，常见于人物内心独白。
examples:
- text: 어쩌면 그게 그녀 나름대로는 당황한 표현이었는지도 모르겠지만.
  reading: ''
  annot: 어쩌면 그게 그녀 나름대로는 당황한 표현이었는지도 모르겠지만.
  translation_zh: 不过，也许那说不定是她以自己特有的方式做出的慌张表现吧。
  source_book: book-ko-026
  source_chapter: null
  pointer: null
- text: 그녀는 나와 시나가 ‘적’이 될지도 모른다고 생각하는 것 같았다.
  reading: ''
  annot: 그녀는 나와 시나가 ‘적’이 될지도 모른다고 생각하는 것 같았다.
  translation_zh: 她似乎觉得，我和希娜说不定会变成“敌人”。
  source_book: book-ko-026
  source_chapter: null
  pointer: null
