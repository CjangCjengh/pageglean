title: 「-ㄴ/는다고 하다：间接引用（陈述）」
structure: 인용문：陈述 -ㄴ/는다고，疑问 -냐고，命令 -(으)라고，共动 -자고 + 하다 类动词
structure_pattern: V-ㄴ/는다고 하다；A-다고 하다；名词-(이)라고 하다
explanation_zh: 학교문법的间接引用体系：陈述句用 -(느)ㄴ다고，疑问用 -냐고，命令用 -(으)라고，共动用 -자고，后接 말하다/대답하다/생각하다
  等。本段‘혐오한다고 말한’‘필요하다고 대답했다’都是典型的陈述间接引用，并可作관형절修饰名词（말한 그녀는）。
examples:
- text: 무지를 혐오한다고 말한 그녀는, 그런 방법 따위 모른다는 무지한 말 대신 생각할 시간이 필요하다고 대답했다.
