title: 「-(으)ㄹ 정도로：到……的程度」
structure: 用言 + -(으)ㄹ + 의존명사 정도（+ 조사 로/이다）
structure_pattern: V/A-(으)ㄹ + 정도(로)
explanation_zh: 의존명사 ‘정도’表示程度，‘-(으)ㄹ 정도로’作状语，意为「到……的程度」。也可作名词性成分，如‘이길 수 있을 정도야?’（到能赢的程度吗？）。本段借程度表达衡量塔玛的实力，是小说中比较战力时的常用结构。
examples:
- text: 그 새들, 내가 상대하기 벅찰 정도로 강하진 않았어.
  reading: ''
