- text: 눈이 평소의 세 배쯤은 커져서 나를 노려보더니 탄식하듯 말했다.
  reading: ''
  annot: 눈이 평소의 세 배쯤은 커져서 나를 노려보더니 탄식하듯 말했다.
  translation_zh: 她的眼睛瞪得比平时大了三倍左右，怒视着我，随后像叹息似的说道。
