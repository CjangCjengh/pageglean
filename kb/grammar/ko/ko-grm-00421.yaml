title: 「-면서/-(으)며」：表同时进行的连接词尾
structure: 用言词干 + 连接词尾 -면서（副词形连接，表两动作同时进行）
structure_pattern: V-면서 / V-며 + V
explanation_zh: 连接词尾，接动词后表示两个动作同时进行，相当于“一边……一边……”或“……的同时”，前后主语须为同一主体。书面及小说叙述中常用缩略形
  -(으)며，本片段中多次出现（참으며、걸으며、삼키며）。
examples:
- text: 키이리가 누군가를 ‘그 여자’라고까지 지칭하면서 적대하는 건 처음 보는 것이라 좀 의외였다.
