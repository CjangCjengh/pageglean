title: 「-았/었었-」：大过去先语末词尾
structure: 用言词干 + 先语末词尾 -았/었- 叠用（대과거，过去之过去）
structure_pattern: V-았/었었-
explanation_zh: 过去先语末词尾 -았/었- 连用构成大过去，表示曾经发生但现已中断、与当前不再相关的事情，比单纯过去时多一层“时过境迁”的距离感。小说叙述中常与回忆性语境呼应，本例与
  놓다 合用为 놓았었으니까。
examples:
- text: 시나가 가슴 크기를 가지고 키이리 속을 신나게 뒤집어 놓았었으니까.
  reading: ''
  annot: 시나가 가슴 크기를 가지고 키이리 속을 신나게 뒤집어 놓았었으니까.
