title: -거든：说明理由的口语终结词尾
structure: 용언 어간 + -거든（해체/반말）
structure_pattern: 어간 + -거든
explanation_zh: '''-거든''是表示理由的终结词尾，主要用于口语半语（해체），向对方说明自己言行背后的原因。与''-아/어서''''-니까''相比，带有解释、辩解的口吻，且句子到此终结，后面不再接续分句。'
examples:
- text: 나, 지금까지 자기처럼 마력이 강한 인간은 본 적이 없거든.
  reading: ''
