title: -며：同时进行与并列
structure: 용언 어간 + -며
structure_pattern: 어간 + -며
explanation_zh: '''-며''是表示两个动作同时进行或单纯并列的连接词尾，意义与''-면서''相同，但更偏书面语和文学语体。本句中前一分句的动作充当后一分句的背景动作（삼키며
  입을 다물었다）。'
examples:
- text: 나는 일단 분노를 삼키며 입을 다물었다.
