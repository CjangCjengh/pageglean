title: 「-(으)ㄴ/는 듯 · -처럼：比喻“像……似的”」
structure: 用言 + 관형사형 전성어미 -(으)ㄴ/는 + 의존명사 ‘듯’；体言 + 보조조사 ‘처럼’
structure_pattern: V/A-(으)ㄴ/는 듯(이); N-처럼
explanation_zh: 学校文法中，관형사형 전성어미（冠形词形转换词尾）‘-ㄴ/는’后接의존명사（依存名词）‘듯’构成比喻，表示“仿佛……似的”；体言则用보조조사（辅助助词）‘처럼’。片段中反复以“口渴的人似的”“陷入恍惚的人似的”描摹시나的神态。相当于中文的“像……一样”。
examples:
- text: 시나가 갈증이 난 사람처럼 윗입술을 핥으며 말했다.
