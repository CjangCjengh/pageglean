title: 「-(으)ㄴ/는지 모르다·궁금하다：间接疑问与不确定」
structure: 用言 + 관형사형 전성어미 -(느)ㄴ + 의존명사 ‘지’ + 모르다/궁금하다
structure_pattern: V/A-(으)ㄴ/는지 + 모르다/궁금하다/알다
explanation_zh: 의존명사（依存名词）‘지’前接冠形词形词尾，把“是否/哪边……”嵌入从句，表示不确定或好奇；主句多用모르다、궁금하다、알다。文中的‘건’是‘것이’的缩略。相当于中文“不知道是否……”“好奇会不会……”。
examples:
- text: 이 여자가 과연 어느 쪽으로 안달이 나 있는 건지를 모르겠다.
  reading: ''
  annot: 이 여자가 과연 어느 쪽으로 안달이 나 있는 건지를 모르겠다.
  translation_zh: 我真搞不懂这女人究竟是在为哪一边急得坐立不安。
  source_book: book-ko-026
