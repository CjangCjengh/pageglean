title: 「-아/어 있다・-고 있다」：结果与状态的持续
structure: 동사 어간 + 연결어미 '-아/어' / '-고' + 보조동사 '있다'
structure_pattern: V-아/어 + 있다; V-고 + 있다
explanation_zh: 补助动词（보조동사）'있다'与连接词尾'-아/어'结合，表示动作完成后结果状态的持续；与'-고'结合时多用于입다·쓰다等穿戴动词，表示状态的持续。相当于中文的“穿着”“躺着”。片段中'뻗어
  있다''입고 있다''안고 있다'反复出现，是叙事描写的高频结构。
examples:
- text: 그러고 보니 메이드복을 입고 있다.
  reading: ''
  annot: 그러고 보니 메이드복을 입고 있다.
  translation_zh: 这么一看，（她）正穿着女仆装。
