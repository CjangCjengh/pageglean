title: 「-(으)며」：动作同时进行
structure: 동사 어간 + 연결어미 '-(으)며'
structure_pattern: V-(으)며
explanation_zh: 连接词尾（연결어미）'-(으)며'接在动词词干后，表示前后两个动作同时进行，相当于“一边……一边……”。与'-면서'意义相同，但'-(으)며'更偏书面，在小说叙事中十分常见。
examples:
- text: 속으로 시동어를 읊으며 골목 안으로 들어선 순간.
