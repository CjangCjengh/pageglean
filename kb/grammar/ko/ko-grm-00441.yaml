title: 「-도록」：目的与指向
structure: 용언 어간 + 연결어미 '-도록'
structure_pattern: V/A-도록
explanation_zh: 连接词尾'-도록'可表示动作的目的或指向，构成目的副词节，相当于“为了……”。常与否定形式'-지 않다'搭配，表示“以免……”“不让……”。片段中两处都表示主人公不想引起他人注意的目的。
examples:
- text: 다른 사람들에게 들키지 않도록 속전속결로 끝내야 한다.
  reading: ''
  annot: 다른 사람들에게 들키지 않도록 속전속결로 끝내야 한다.
  translation_zh: 为了不被别人发现，必须速战速决地解决。
