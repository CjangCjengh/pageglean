title: 「-아/어도 되다」：许可与请求
structure: 동사 어간 + 연결어미 '-아/어도' + 보조적 표현 '되다' (+ 종결어미 '-ㄹ까요')
structure_pattern: V-아/어도 + 되다 (+ -ㄹ까요)
explanation_zh: 「-아/어도 되다」表示许可，意为“可以……”“……也没关系”。与疑问形终结词尾'-ㄹ까요'（해요체）连用，构成礼貌地请求对方允许的表达，相当于“可以……吗”。片段中女仆用此结构委婉地向主人公一行确认情况。
examples:
- text: 실례지만, 그 볼일이라는 게 뭔지 여쭤 봐도 될까요?
