title: 「-잖아(요)」：强调显而易见的事实
structure: 용언 어간 + '-지 않다'의 축약 종결어미 '-잖다'
structure_pattern: V/A-지 않다 → V/A-잖다
explanation_zh: 「-잖아(요)」是「-지 않아요」的口语缩略形，作终结词尾使用，用于强调对方已知或显而易见的事实，带有提醒、反问的语气，相当于“不是……吗”“……嘛”。独白中也常用于自我说服或吐槽，是小说对话与心理描写的高频表达。
examples:
- text: 할리퀸 소설 첫 페이지에나 나올법한 상황이잖아?
