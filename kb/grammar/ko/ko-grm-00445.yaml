title: 「-ㄴ/는 것 같다：委婉的推测」
structure: 용언 + 관형사형 어미 -ㄴ/는 + 의존명사 '것' + 형용사 '같다'
structure_pattern: V/A-ㄴ/는 것 + 같다
explanation_zh: 依存名词것把前面的内容名词化，再由冠形词形词尾-ㄴ/는修饰，配合같다表示推测，相当于中文的"好像……"。动词现在时用-는，形容词和过去时用-ㄴ。语气比直接断言委婉，在口语和叙述中都非常高频。
examples:
