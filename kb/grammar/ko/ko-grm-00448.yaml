title: 「-구나/-군：感叹与新察觉」
structure: 용언 + 감탄형 종결어미 -구나/-군
structure_pattern: V/A-구나/-군
explanation_zh: 感叹形终结词尾，表示说话人新察觉到某事而发出感叹，带有"原来……啊"的语气。-군是接近해라체/반말的形式，常见于男性话语或内心独白。片段中主人公多次用它自言自语，独白色彩浓厚。
