title: -는데：铺垫背景，话锋轻转
structure: 动词词干 + -는데 / 形容词·体言 + -(으)ㄴ데
structure_pattern: V-는데 / A·N-(으)ㄴ데 (연결어미)
explanation_zh: 连接词尾，先铺陈一个背景事实，再顺势引出后句的话题、对比或轻微转折。形容词、体言后接 -(으)ㄴ데，动词后接 -는데，语气比 -지만
  柔和。汉语近似“倒是……”“……不过……”。
