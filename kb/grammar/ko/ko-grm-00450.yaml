title: -더니：回想所见，引出后变
structure: 动词词干 + -더니
structure_pattern: V-더니 (연결어미)
explanation_zh: 连接词尾，表示说话人回想起自己先前观察到的事实，后句多出现随之而来的变化或对比结果，主语通常为第三人称，是小说叙事的高频接续。汉语近似“（刚才还）……接着/结果却……”。
examples:
- text: 브룬이 대뜸 내 옷자락을 꽉 움켜잡더니, 그렁그렁한 얼굴로 나를 올려다보았다.
