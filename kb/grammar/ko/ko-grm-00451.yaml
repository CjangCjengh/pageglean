title: -아/어 주다：为对方做某事的补助动词
structure: 动词词干 + -아/어 주다
structure_pattern: 본용언 -아/어 + 보조용언 주다
explanation_zh: 补助动词（보조용언），表示动作是为他人而做、施惠于人，汉语近似“给（某人）做……”。片段中多以定语形 -아/어 줄 + 名词的形式出现，如“놀아
  줄 시간”“중개해 준 것”。
