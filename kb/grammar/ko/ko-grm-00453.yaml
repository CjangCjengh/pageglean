title: -고 나서야：等到……之后才
structure: 动词词干 + -고 나서 + 辅助词 -야
structure_pattern: V-고 + 보조동사 나다 + 보조사 야
explanation_zh: 连接词尾 -고 나서 表示前一动作完成，再追加辅助词 야 强调“直到此时才……”，后句多为领悟、发现等迟来的结果。汉语近似“……之后这才……”。
examples:
- text: 나는 그녀가 입에 담은 이름을 듣고 나서야 그 인사의 의미를 깨달았다.
  reading: ''
  annot: 나는 그녀가 입에 담은 이름을 듣고 나서야 그 인사의 의미를 깨달았다.
