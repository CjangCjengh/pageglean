title: 「-(으)려고 / -(으)려：目的与意图」
structure: 动词词干 + -(으)려고（缩略形式 -(으)려），连接词尾
structure_pattern: V- + -(으)려(고)(연결어미)
explanation_zh: 意图连接词尾-(으)려고的缩略形式，表示前一行为是后一行为的目的，相当于「为了……、打算……」。前后主语须一致，中文常译为「（为了）……而……」。完整形-(으)려고较口语，缩略形-(으)려在小说叙述和书面语中更常见。
examples:
