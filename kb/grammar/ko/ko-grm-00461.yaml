title: 「하게体：贵族长辈的说话阶位（-(으)시게 / -네 / -는가）」
structure: 谓词词干 + -(으)시게 / -네 / -(느)ㄴ가（对话者敬语终结词尾，可叠加主体敬语先语末词尾 -(으)시-）
structure_pattern: V-(으)시- + -게 / -네 / -는가(종결어미, 상대높임법 ‘하게체’)
explanation_zh: 学校语法相对敬语（对话者阶位）体系中的하게체，介于하오체与반말之间，典型用于长辈对成年晚辈礼貌而不过分客气的场合，小说中十分常见。本段领主빈自始至终使用此阶位：오시게、용서하게、찾아오셨는가，并可叠加主体敬语先语末词尾-(으)시-。它与키이리使用的합쇼체（감사할
  따름입니다）形成鲜明对照，体现身份与场合的差别。
examples:
