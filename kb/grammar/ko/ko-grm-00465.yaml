title: 「-는다는 듯이：仿佛在说……似的」
structure: 관형사형 -(느)ㄴ다는 + 듯이（-다고 하는 듯이 的缩略）
structure_pattern: V-(느)ㄴ다는 듯이 / A-다는 듯이
explanation_zh: ‘-(느)ㄴ다고 하는 듯이’的缩略形，用动作或神态暗示“好像在说……似的、像是……的样子”。动词词干后用‘-는다는 듯이’，形容词和‘이다’后用‘-다는
  듯이’；也可加先语末词尾‘-겠-’，如文中的‘알겠다는 듯이’。
examples:
- text: 빈은 알겠다는 듯이 고갤 끄덕였다.
