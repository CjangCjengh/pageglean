title: 「-네·-군·-ㅂ세：하게체 长者口吻」
structure: 用言词干 + 하게체 终结词尾 -네（陈述/感叹）/ -군（发现）/ -(으)ㅂ세（共动）
structure_pattern: V-네 / V-군 / V-(으)ㅂ세
explanation_zh: 하게체 是对平辈或晚辈略带客气的语阶，小说中长者常用。‘-네’表陈述与感叹，‘-군’表新察觉的感慨，“原来……啊”，‘-(으)ㅂ세’表提议；疑问则用‘-는가’。片段中贵族老者宾的台词全用此语阶，塑造长者口吻。
examples:
