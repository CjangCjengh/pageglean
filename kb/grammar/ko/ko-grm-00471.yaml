title: 「-았/었다가」：前一动作完成后转向另一情况
structure: 动词词干 + 过去时词尾‘-았/었-’ + 전환 연결 어미(转换连接词尾)‘-다가’
structure_pattern: V + -았/었다가
explanation_zh: ‘-다가’表示动作中断或方向转换；加在过去时词尾后构成‘-았/었다가’，强调前一动作已完成，随后转向另一（常为相反）的情况。与单纯并列的‘-고’不同，含“转折·取消”意味。
examples:
- text: 애초에 예고도 없이 찾아왔다가 자기 하고 싶은 말만 내뱉어 대고 예고도 없이 사라져 버린 여자였다.
