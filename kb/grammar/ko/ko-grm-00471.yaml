  annot: 애초에 예고도 없이 찾아왔다가 자기 하고 싶은 말만 내뱉어 대고 예고도 없이 사라져 버린 여자였다.
  translation_zh: 她本就毫无预告地找来，只顾倾倒自己想说的话，又毫无预告地消失掉了，就是这样的女人。
