title: 「-아/어 대다」：反复、肆意地进行
structure: 动词词干 + 연결 어미(连接词尾)‘-아/어’ + 补助动词‘대다’
structure_pattern: V + -아/어 대다
explanation_zh: 补助动词‘대다’表示该动作反复、不停地肆意进行，多含负面或嫌弃的语气。文中“내뱉어 대고”与“내뱉다”（脱口而出）搭配，强调对方毫无忌惮地一个劲儿乱说。
examples:
- text: 자기 하고 싶은 말만 내뱉어 대고 예고도 없이 사라져 버린 여자였다.
  reading: ''
  annot: 자기 하고 싶은 말만 내뱉어 대고 예고도 없이 사라져 버린 여자였다.
  translation_zh: （她）只顾把自己想说的话一股脑儿倒出来，然后就毫无预告地消失了。
