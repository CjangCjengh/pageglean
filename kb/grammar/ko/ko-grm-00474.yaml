title: 「-(ㄴ/는)다는 둥」：不以为然的转述列举
structure: 动词/形容词词干 + 引用形‘-(ㄴ/는)다고’ + 의존명사(依存名词)‘둥’
structure_pattern: V/A + -(ㄴ/는)다는 둥
explanation_zh: 依存名词‘둥’表示大致的列举，“……之类的”。前面接引用形，列举他人说的话或行为，常暗含说话者并不当真、不以为然的语气。文中用两个‘-다는
  둥”并列，转述那个女人说过的话。
examples:
- text: 무지를 혐오한다는 둥, 호기심을 채운다는 둥 얘기했으니
