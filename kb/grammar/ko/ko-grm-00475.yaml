title: 「-(으)ㄴ 셈이다」：实质上的认定
structure: 动词/形容词词干 + 관형형 전성 어미(冠形形转成词尾)‘-(으)ㄴ’ + 의존명사(依存名词)‘셈’ + 서술격 조사(叙述格助词)‘이다’
structure_pattern: V/A + -(으)ㄴ 셈이다
explanation_zh: ‘셈’本义为“算计、折算”，整个结构表示虽非字面如此，但实质上“算是……”，是说话者的主观认定。文中“나와 악마를 같이 취급한 셈이다”表达“我”对对方那句问话言外之意的解读。
examples:
- text: 빈은 지금의 질문으로 한순간에 나와 악마를 같이 취급한 셈이다.
  reading: ''
  annot: 빈은 지금의 질문으로 한순간에 나와 악마를 같이 취급한 셈이다.
