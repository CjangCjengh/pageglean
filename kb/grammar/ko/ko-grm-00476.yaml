title: 「-네·-게·-세·-(으)ㄴ가」：하게体（敬语阶位）
structure: 종결 어미(终结词尾)‘-네 / -게 / -세 / -(으)ㄴ가 / -ㄹ걸세’ 等（하게체，介于하오체与해체之间的阶位）
structure_pattern: V/A + -네 / -게 / -세 / -(으)ㄴ가 (하게체 종결 어미)
explanation_zh: 하게체是年长者或地位较高者对略低于自己的对象使用的阶位：保持一定体面，却不用正式敬语（합쇼체/해요체）。典型词尾有‘-네’‘-게’‘-세’‘-(으)ㄴ가’‘-ㄹ걸세’。本段中빈的所有台词（“고맙네”“몰랐을
  걸세”“생각하나?”）均属此阶位，塑造了年长绅士的口吻。
