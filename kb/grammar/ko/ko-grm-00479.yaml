title: -(으)ㄹ 뻔하다：差点儿就……
structure: 动词词干 + -(으)ㄹ + 뻔하다
structure_pattern: V-(으)ㄹ + 뻔하다（依存名词 뻔 + 하다）
explanation_zh: 依存名词 ‘뻔’ 与 하다 搭配，表示某事差一点发生而实际上并未发生，即“差点儿……”。叙述已经过去的情况时用 -(으)ㄹ 뻔했다
  的形式。
examples:
- text: 심지어 제 아버지가 악마와 계약할 뻔했다는 얘기를 어떻게 생각할지도 모를 일이고.
  reading: ''
