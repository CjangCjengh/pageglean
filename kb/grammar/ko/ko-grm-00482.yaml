title: -(으)ㄴ 채(로)：保持……的状态
structure: 动词词干 + -(으)ㄴ 채(로)
structure_pattern: V-(으)ㄴ 채(로)（依存名词 채）
explanation_zh: 依存名词 ‘채’ 前接冠形词形词尾 -(으)ㄴ，表示保持前一状态不变而进行后面的动作，即“保持着……的样子/状态”。常用 -(으)ㄴ
  채로 的形式。
examples:
- text: 그녀는 고개를 빳빳이 한 채 반대편 벽 어딘가에 시선을 꽂으며 말했다.
