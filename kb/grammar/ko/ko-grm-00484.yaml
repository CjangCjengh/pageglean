title: -잖아(요)：不是……嘛（提醒已知事实）
structure: 动词/形容词 + -지 않나(요) 的缩略形 -잖아(요)
structure_pattern: V/A-잖다 ← V/A-지 않다 + -나(요)（终结词尾）
explanation_zh: -잖아(요) 是 -지 않나(요) 的口语缩略形，用于提醒对方已知或显而易见的事实以寻求认同，常带辩解、强调或抱怨的语气。例中 아니시잖아요
  还叠加了主体敬语词尾 -시-，体现对主人的敬语阶位。
examples:
- text: 주인님은 어차피 주인님 돈으로 먹고 노는 거 아니시잖아요.
  reading: ''
