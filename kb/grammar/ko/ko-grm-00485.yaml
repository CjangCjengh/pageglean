title: -았/었던 모양이다：对过去情况的推测
structure: 용언 어간 + 선어말어미 '-았/었-' + 관형사형 전성어미 '-던' + 의존명사 '모양' + 서술격 조사 '이다'
structure_pattern: V/A-았/었던 + 모양이다
explanation_zh: 表示对过去已发生之事的推测或传闻，相当于中文的“看来是……”“好像……了”。모양 为依存名词，前接过去时制先语末词尾 -았/었- 与回想冠形词形转成词尾
  -던，构成回想性推测。语气比 -ㄴ 것 같다 更带间接推断意味。
examples:
