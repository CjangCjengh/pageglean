title: -는 듯 / -(으)ㄴ 듯：好像、仿佛
structure: '동사 어간 + 관형사형 전성어미 ''-는'' + 의존명사 ''듯''；형용사·과거: ''-(으)ㄴ'' + ''듯'''
structure_pattern: V-는 듯 / A·V-(으)ㄴ 듯
explanation_zh: 依存名词 듯 表示推测或比喻，相当于中文的“好像……”“仿佛……似的”。动词现在时用 -는 듯，形容词和过去时用 -(으)ㄴ 듯。也可与过去时制词尾结合为
  -았/었던 듯，表示对过去情况的回想性推测。
examples:
- text: 각자의 생각을 추측하고 정리하는 듯 서로 시선만 교환했다.
  reading: ''
