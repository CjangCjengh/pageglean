title: -다니：惊讶与反问
structure: 용언 어간 + 연결어미 '-다니'
structure_pattern: V/A-다니
explanation_zh: 连接词尾，表示对对方所说内容感到惊讶、意外或不满，并由此引出后文的反应或反问。相当于中文的“竟然说……”“说什么……”。常用于对话中表达说话人的情绪反应。
examples:
- text: 미묘해 보였다니, 한마디로 그냥 네 녀석의 '감'이라는 거냐?
  reading: ''
  annot: 미묘해 보였다니, 한마디로 그냥
  translation_zh: 你说“看起来微妙”，说白了不就是凭你这家伙的“直觉”吗？
  source_book: book-ko-026
  source_chapter: null
  pointer: null
- text: 행운의 동전을 갖고 있다니, 너무 부러워요!
