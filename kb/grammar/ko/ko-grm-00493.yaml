title: -(으)ㄹ 뻔하다：险些发生
structure: 动词词干 + 依存名词 뻔 + 하다
structure_pattern: V + -(으)ㄹ 뻔하다
explanation_zh: 依存名词 뻔 指“险些出现的事态”，与 -(으)ㄹ 搭配表示“差点儿……”，即某事几乎发生但最终没有发生。常与副词 하마터면（差点儿）呼应使用。句中“하마터면
  넘어질 뻔”即“差点儿摔倒”。
examples:
- text: 우와, 위험했다! 하마터면 넘어질 뻔, 아, 으아아, 마와아아아아앙?!
