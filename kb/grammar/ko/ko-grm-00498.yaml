title: -ㄴ대/-ㄹ 거래：间接引用的口语缩略
structure: -ㄴ다고 하다 → -ㄴ대；-ㄹ 거라고 하다 → -ㄹ 거래
structure_pattern: V-ㄴ다고 해 → V-ㄴ대 ; V-ㄹ 거라고 해 → V-ㄹ 거래
explanation_zh: 间接引用句（간접인용）「-ㄴ다고 하다 / -ㄹ 거라고 하다」的口语缩略，用于转述第三方的话。「간댔어」即「간다고 했어」，「갈
  거래」即「갈 거라고 해」。只用于口语和非正式文体，是小说对话中的高频形式。
examples:
