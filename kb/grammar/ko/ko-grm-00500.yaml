title: -잖다：明明……（提醒与反驳）
structure: 용언 어간 + 종결어미 -잖다 (-지 않다의 준말)
structure_pattern: V/A-잖다
explanation_zh: 终结词尾-잖다是-지 않다的缩略，用于提醒对方已知或理应知道的事实，带有确认、反驳、埋怨的语气。属口语平语（반말），不能对长辈使用。本段连用三次，强化说话人的愤愤不平。
