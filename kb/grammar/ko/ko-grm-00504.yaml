title: -기 무섭게：刚一……就……
structure: 动词词干 + 依存名词 -기 + 무섭다 + 副词形连接词尾 -게（惯用化）
structure_pattern: V-기 무섭게
explanation_zh: 表示前一动作刚完成，后一动作紧接着发生，相当于"刚一……就……"。由名词化依存名词 -기 加 무섭다 固化而成的惯用表达，书面色彩较强。后句通常叙述已然发生的事实。
examples:
- text: 말이 끝나기 무섭게 요나가 빈의 앞에 무릎을 꿇고 앉았다.
