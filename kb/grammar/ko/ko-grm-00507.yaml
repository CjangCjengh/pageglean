title: -는 와중에：正当……之际
structure: 动词现在定语词尾 -는 + 名词 와중(渦中) + 副词格助词 -에
structure_pattern: V-는 와중에
explanation_zh: 와중(渦中)指某事正在进行、持续的过程当中，表示在前项背景下发生了后项。比 -는 동안 更强调"正当其时"的现场感与背景感。多用于书面叙事。
examples:
- text: 브룬의 이야기가 계속 이어지는 와중에, 나는 요나가 조그마한 목소리로 빈과 나누는 대화 내용을 엿들었다.
