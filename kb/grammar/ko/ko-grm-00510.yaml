title: -(으)시- + -ㅂ니다：主体敬语与格式体敬语阶
structure: 主体敬语先语末词尾 -(으)시- + 格式体终结词尾 -ㅂ니다/습니다（주체경어법）
structure_pattern: V/A-(으)시- + -ㅂ니다/습니다
explanation_zh: -(으)시- 是主体敬语先语末词尾，用来抬高动作的主体；搭配格式体终结词尾 -ㅂ니다 构成正式的尊敬阶。片段中女仆约娜对领主的所有发言均使用这一阶位，体现严格的主从关系与敬语层级。
