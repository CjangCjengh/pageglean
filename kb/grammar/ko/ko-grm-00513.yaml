id: ko-grm-00513
language: ko
type: grammar
level: TOPIK2
level_rank: 2
title: -는데：铺垫、对照与余韵
structure: 动词词干 + 连接词尾 -는데；形容词·이다 + -(으)ㄴ데
structure_pattern: V + -는데; A/이다 + -(으)ㄴ데
explanation_zh: 连接词尾：动词词干后用 -는데，形容词与 이다 后用 -(으)ㄴ데。可为后文铺垫背景，也可表对照、转折；口语里直接结句则留下余韵、等待对方回应。片段中‘만져
  주는데’铺垫话题，‘시간뿐인데’表对照并引出遗憾。
examples:
- text: 요나가 빈 헬로이스의 넥타이를 만져 주는데 역시 분위기가 좀 이상했지?
  reading: ''
