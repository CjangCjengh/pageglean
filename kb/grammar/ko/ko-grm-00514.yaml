title: -단 말이다：强调申辩“我是说……”
structure: -(ㄴ/는)다는 말이다 的缩略；体言 + -(이)란 말이다
structure_pattern: V-(ㄴ/는)단 + 말이다; N-(이)란 + 말이다
explanation_zh: ‘-단 말이다’是‘-다는 말이다’的缩略（动词 -ㄴ/는다고 → -단；体言 + -(이)라 → -란），用于强调或辩解地重申自己的话，相当于“（我）是说……啊”。带有申辩、撒娇或不耐烦的情绪色彩，多用于口语。片段中儿童角色布伦两次使用，正突出其娇憨语气。
examples:
- text: 나, 이렇게 여럿이서 노는 거, 처음이란 말이야.
  reading: ''
