title: 连接词尾 -며：两个动作同时进行
structure: 用言词干 + 大等连接词尾 -며
structure_pattern: 용언 어간 + -며
explanation_zh: -며 是学校语法中的大等连接词尾，连接两个分句，表示两个动作或状态同时进行，相当于“一边……一边……”。它是 -면서 更简练、偏书面的形式，常见于小说叙述。
