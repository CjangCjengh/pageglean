title: -고 나다：动作完成之后
structure: 动词词干 + 连接词尾 -고 + 补助用言 나다
structure_pattern: 동사 어간 + -고 나다
explanation_zh: -고 나다 表示前一动作完结，常强调完成之后出现的结果或变化，后句多为新状况或转折。口语中也常用其变形 -고 나서。
