title: 终结词尾 -는데：迟疑、反问与铺垫
structure: 用言词干 + 终结词尾 -ㄴ/는데（动词/过去时用 -는데，形容词用 -ㄴ데）
structure_pattern: 용언 어간 + -ㄴ/는데 (종결어미)
explanation_zh: 终结词尾 -ㄴ/는데 不把话说尽，留下余韵，可表示迟疑、轻微疑问或为后文做铺垫。口语半语中极为常见，具体是疑问还是感叹取决于语调。
examples:
- text: 잠깐만. 이 상황……, 어쩐지 익숙한데?
  reading: ''
