title: 间接引用 -고 하다：转述请求、劝诱与禁令
structure: 引用节 + 引用助词 -고 + 하다（命令·禁止用 -(으)라고，劝诱用 -자고，请求用 -아/어 달라고）
structure_pattern: V-자고 하다 / V-(으)라고 하다 / V-아/어 달라고 하다
explanation_zh: 间接引用按原句的句式类型变换词尾：劝诱句引作 -자고，命令·禁止句引作 -(으)라고，请求引作 -아/어 달라고，再接 하다 等动词。片段中三种形式均有出现，是掌握间接引用的好材料。
