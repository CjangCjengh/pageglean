title: 回想冠形词形词尾 -던：追忆未完结的过去
structure: 用言词干 + 冠形词形词尾 -던（回想）
structure_pattern: 용언 어간 + -던 (관형사형 어미)
explanation_zh: -던 是表示回想的冠形词形词尾，修饰其后名词，追忆过去未完结或中断的状态、动作。与表示完成的 -ㄴ/은 不同，-던 强调“当时正在……”“那时一直……”。
examples:
