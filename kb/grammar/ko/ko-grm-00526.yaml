title: -(으)시-：主体敬语与敬语阶位
structure: 主体敬语先语末词尾 -(으)시-，与格式体终结词尾 -ㅂ니다 并用
structure_pattern: V/A-(으)시-
explanation_zh: -(으)시- 是主体敬语先语末词尾，抬高动作主体的身份。文中约娜对『我』全程使用 -으시- 与格式体敬语，表面恭敬，实则含讥讽之意。理解敬语阶位是把握韩语对话语气与人物关系的关键。
