  pointer: null
- text: 키이리는 빨개진 얼굴을 양손으로 가린 채 내 눈치를 살폈다.
  reading: ''
  annot: 키이리는 빨개진 얼굴을 양손으로 가린 채 내 눈치를 살폈다.
  translation_zh: 基里用双手捂住涨红的脸，偷偷观察我的反应。
