title: 미처 -지 못하다：未能及时……
structure: 副词 미처 + 动词词干 + 长形否定 -지 못하다
structure_pattern: 미처 + V + -지 못하다
explanation_zh: 副词 미처 意为“来得及（之前）”，必须与 -지 못하다 等否定叙述搭配使用。多用于后悔、遗憾的语境，文中以对偶句式两次出现。对应中文“没能及时……／未及……”。
examples:
