title: -(으)ㄴ 채(로)：保持某种状态
structure: 동사 어간（动词词干）+ -(으)ㄴ 채(로)
structure_pattern: 동사 어간 + 관형형 전성 어미 '-(으)ㄴ' + 의존 명사 '채' + (부사격 조사 '로')
explanation_zh: 依存名词'채'表示前句动作形成的状态原样保持，在此状态下进行后一动作，相当于“保持着……的样子（做某事）”。后面的'로'可省略。中文可译为“（保持）……着”“以……的状态”。
examples:
- text: 키이리가 양손으로 입을 가린 채 울먹울먹한 눈으로 말했다.
