title: -더니：回想与转折
structure: 동사 어간（动词词干）+ -더니
structure_pattern: 동사 어간 + 연결 어미 '-더니'
explanation_zh: 连接词尾，带有回想语气，以前一分句亲历的事实为背景，后句出现与之不同或出乎意料的情况，相当于“（原以为……）结果却……”“……之后才发现……”。主语多为第二、第三人称，或说话者将过去的自己当作他人来叙述。
examples:
- text: 이상한 느낌이 들어서 눈을 떴더니, 눈앞에 거구의 여성이 검을 빼어 든 채 쳐다보고 있다는 걸 확인한 순간
  reading: ''
