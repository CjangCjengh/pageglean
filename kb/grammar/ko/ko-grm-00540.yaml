title: -자마자：一……就……
structure: 동사 어간（动词词干）+ -자마자
structure_pattern: 동사 어간 + 연결 어미 '-자마자'
explanation_zh: 连接词尾，表示前一动作刚结束，后一动作或情况紧接着发生，强调两个事件之间的时间间隔极短。相当于汉语的“一……就……”“刚……马上……”。
examples:
- text: 일어나자마자 내가 좋아하는 사람들 얼굴을 보니까 기분 좋네.
  reading: ''
