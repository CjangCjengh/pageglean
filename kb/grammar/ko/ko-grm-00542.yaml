title: -(으)라고 하다：转述命令/请求
structure: '간접 인용문: 명령형 어미 ''-(으)라'' + 인용 조사 ''고'' + ''하다'''
structure_pattern: V-(으)라 + 고 하다
explanation_zh: 间接引用中转述命令内容时用命令形 -(으)라 加 -고 하다，相当于中文“让/叫（某人）做……”。例1中请对方代为转告加罗；对朋友或晚辈直接下达亲切命令时，也可以
  -(으)라고 作终结（如例2）。
examples:
- text: 가로한테 이따가 와서 침대 밑에 있는 검 찾아가라고 해.
