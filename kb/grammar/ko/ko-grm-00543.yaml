title: -ㄴ/는다고 하다：传闻与转述
structure: '간접 인용문: 관형사형 어미 ''-ㄴ/는다'' + 인용 조사 ''고'' + ''하다'''
structure_pattern: V-ㄴ/는다고 하다
explanation_zh: 用于转述他人陈述或传达听来的消息，相当于“据说/听说……”。动词现在时用 -ㄴ/는다고 하다，形容词用 -다고 하다。小说常借此间接交代背景信息，避免作者直接断言。
examples:
- text: 몇 주간 이어지던 축제가 오늘로 끝이 나고, 내일이면 ‘가면 축제’가 새롭게 시작된다고 했다.
