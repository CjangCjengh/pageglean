title: 感叹形终结词尾：-는구나/-군（感叹法）
structure: 감탄형 종결어미 '-는구나 / -군(요), -구나'（서법 중 감탄법）
structure_pattern: V-는구나 / A-구나; V-는군 / A-군
explanation_zh: 感叹形终结词尾表示新发现、惊讶或感慨，属学校语法“感叹法”的范畴。动词接 -는구나/-는군，形容词接 -구나/-군，其中 -군(요)
  语气更接近轻声自语。文中商贩惊叹“나타났구나!”与主角心想“훈훈하군”，分别体现强烈的惊叹与淡淡的自语。
examples:
