title: 「从……（来源）」：格助词 -로부터
structure: 격조사 '-로부터'（表示动作或事物的出发点、来源）
structure_pattern: N-로부터
explanation_zh: -로부터 是表示出发点的格助词，强调动作或事物的起点、来源，相当于中文“从……、自……”。用于人时表示“从某人那里（得到、听到）”，比
  -에서 更突出来源。文中两处分别表示礼物“来自店家”、欢迎“来自他人”。
examples:
- text: 들르지도 않은 옆 가게 주인들로부터 온갖 옷과 선물과 먹거리와, 하다못해 어린애들이나 가지고 노는 장난감 나팔까지
  reading: ''
