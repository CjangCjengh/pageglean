title: 「-기로 하다：决定做某事」
structure: 동사 어간 + 명사형 전성어미 '-기' + 부사격 조사 '로' + 동사 '하다'
structure_pattern: V-기 + 로 + 하다
explanation_zh: 명사형 전성어미 '-기' 把动词短语名词化，再接副词格助词 '로' 和动词 '하다'，表示决定做某事，相当于汉语“决定……”。主语为第一人称时表示自己的决定，与过去时连用表示当时作出的决定。
examples:
- text: 결국 나는 광장 계단에 앉아서 휴식을 취하기로 했다.
