title: 「-(으)ㄹ 줄 알았는데：原以为……却……」
structure: 용언 어간 + 관형사형 전성어미 '-(으)ㄹ' + 의존명사 '줄' + 동사 '알다' + 연결어미 '-았는데'
structure_pattern: V/A-(으)ㄹ + 줄 + 알았는데
explanation_zh: 依存名词 '줄' 表示事情的内容，与 '알다' 搭配表示以为、预料。后接转折连接词尾 '-았는데' 时，表示实际情况与预想相反，相当于汉语“原以为……（没想到……）”。
examples:
- text: 브룬이 먼저 나가떨어질 줄 알았는데.
  reading: ''
  annot: 브룬이 먼저 나가떨어질 줄 알았는데.
  translation_zh: 我还以为会是布鲁恩先撑不住倒下呢。
