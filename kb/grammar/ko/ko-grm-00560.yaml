title: -(으)니까：表示原因或根据
structure: 용언 어간 + -(으)니까
structure_pattern: 용언 + -(으)니까 (연결어미)
explanation_zh: 连接词尾 -(으)니까 表示原因或根据，后句常接命令、建议或推测，语气比 -기 때문에 更口语化。本段人物解释理由时多次使用。
