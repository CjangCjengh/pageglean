title: -ㄹ 정도다：到了……的程度
structure: 용언 + -(으)ㄹ 정도(이)다
structure_pattern: 용언 + -(으)ㄹ + 정도 + 이다 (의존명사)
explanation_zh: 依存名词 정도 表示程度、水平，-(으)ㄹ 정도다 意为“到了……的地步”。用于强调某种状态或情况的程度之深。
examples:
- text: 어찌나 열성적으로 친절을 베풀던지 작위적이게 느껴질 정도였다.
  reading: ''
  annot: 어찌나 열성적으로 친절을 베풀던지 작위적이게 느껴질 정도였다.
  translation_zh: 他们那么热情地招待我们，甚至让人觉得有些刻意了。
