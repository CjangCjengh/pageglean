title: -아/어 놓다：动作完成后状态保持
structure: 동사 어간 + -아/어 + 놓다
structure_pattern: V + -아/어 + 놓다 (보조동사)
explanation_zh: 补助动词 놓다 表示动作完成后其结果状态得以保持，与 -아/어 두다 相近。强调行为留下的状态。本段描写硬币被“放好、寄存”的状态时使用。
examples:
- text: 내 손바닥 위에 척 하고 동전을 올려놓았다.
  reading: ''
  annot: 내 손바닥 위에 척 하고 동전을 올려놓았다.
  translation_zh: （奇莉）啪地一下把硬币放在了我的手心上。
  source_book: book-ko-026
  source_chapter: null
  pointer: null
- text: 잃어버릴 것 같으니까 맡겨 놓는 건가……?
  reading: ''
