title: -ㄴ/는 척하다：假装……
structure: 용언 + -(으)ㄴ/-는 + 척하다
structure_pattern: 용언 + -(으)ㄴ/는 + 척 + 하다 (의존명사)
explanation_zh: 依存名词 척 表示“装作、假装”，与动词结合表示假装做某事或假装处于某种状态。本段“못 들은 척을 했다”（装作没听见）是典型用法。
examples:
- text: 뭐라고 말해야 할지 몰라, 나는 그냥 못 들은 척을 했다.
  reading: ''
  annot: 뭐라고 말해야 할지 몰라, 나는 그냥 못 들은 척을 했다.
  translation_zh: 我不知道该说什么好，就干脆假装没听见。
