title: -자마자：一……就……
structure: 동사 어간 + -자마자
structure_pattern: V + -자마자 (연결어미)
explanation_zh: 连接词尾 -자마자 表示前一动作刚结束，后一动作紧接着发生，相当于中文“一……就……”。强调两个事件之间几乎没有时间间隔。
examples:
- text: 키이리는 꽃을 받아 들자마자 나에게 자랑이라도 하려는 듯 이쪽을 쳐다보았다.
