title: 「-고 말다」：不由自主、终竟如此
structure: 动词词干 + -고 + 补助动词 말다
structure_pattern: V-고 + 보조용언 말다
explanation_zh: 本动词后接连接词尾'-고'再加补助动词'말다'，表示事情终于发生、无法挽回，多含遗憾、后悔或无奈之意。与近义的'-아/어 버리다'相比，'-고
  말다'更偏书面、语气更含蓄。过去时'-고 말았다'在小说叙述中高频出现。
examples:
- text: 어쩐지 즉각적으로 키이리를 변명하고 말았다.
