title: -ㄹ 리가 없다：不可能……
structure: 用言词干 + -(으)ㄹ 리가 없다
structure_pattern: V-(으)ㄹ（관형형 전성어미）+ 의존명사 '리' + 주격조사 '가' + '없다'
explanation_zh: 依存名词 '리' 表事理或可能性，'-ㄹ 리가 없다' 意为『不可能……/哪会……』，表示对某事发生的可能性加以坚决否定。本段用『무서울
  리가 없잖아』强调这东西根本没什么可怕的。
examples:
- text: 애초에 귀신의 집도 아니고, 이런 게 무서울 리가 없잖아.
