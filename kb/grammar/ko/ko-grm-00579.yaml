title: -아/어 죽겠다：……死了
structure: 形容词/动词 + -아/어 죽겠다
structure_pattern: A/V-아/어（연결어미）+ 보조용언 '죽다' + '-겠다'
explanation_zh: 补助动词结构 '-아/어 죽겠다' 以『要死了』的夸张说法表示某种感觉或状态程度极深，相当于中文的『……死了』。本段用『아파 죽겠다』生动地表现撞疼后的剧烈痛感，是日常口语的高频表达。
examples:
- text: 아파 죽겠다. 이번엔 진짜 너무 아프다.
  reading: ''
  annot: 아파 죽겠다. 이번엔 진짜 너무 아프다.
  translation_zh: 疼死了。这次是真的太疼了。
