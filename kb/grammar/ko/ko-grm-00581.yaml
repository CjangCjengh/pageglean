id: ko-grm-00581
language: ko
type: grammar
level: TOPIK3
level_rank: 3
title: -ㄹ지도 모르다：说不定……
structure: 用言词干 + -(으)ㄹ지도 모르다
structure_pattern: V-(으)ㄹ（관형형 전성어미）+ 의존명사 '지' + 보조조사 '도' + '모르다'
explanation_zh: '''-ㄹ지도 모르다'' 表示对某种可能性的推测，意为『说不定……/也许……』，语气较为迟疑。本段结尾连用两句，刻画主角不安地设想自己或许误会了什么、或许还有不知道的事实，烘托悬念。'
examples:
- text: 내가 뭔가 착각하고 있는 것일지도 모른다.
  reading: ''
  annot: 내가 뭔가 착각하고 있는 것일지도 모른다.
  translation_zh: 也许是我误会了什么。
