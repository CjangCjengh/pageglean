title: 「-(으)면서」：同时进行——一边……一边……
structure: 用言（动词）词干 + -(으)면서（연결어미/连接词尾）
structure_pattern: V-(으)면서
explanation_zh: -(으)면서是接在用言词干后的连接词尾，表示两个动作或状态同时进行，相当于“一边……一边……”。与助词까지结合为“-면서까지”，强调“甚至到了……的地步”。片段中用于描写伴随动作与让步语气。
examples:
- text: 마왕이랑 싸우고 논쟁하면서까지 지켜야 할 정도로 소중한 건 아니잖아, 저거.
