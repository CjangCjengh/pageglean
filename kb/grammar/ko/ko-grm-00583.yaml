title: 「-아/어 버리다」与「-고 말다」：彻底完成与无奈结局
structure: 动词 -아/어形 + 보조동사（补助动词）버리다；动词 -고 + 말다
structure_pattern: V-아/어 + 버리다 / V-고 + 말다
explanation_zh: 버리다接在动词-아/어形后作补助动词，表示动作彻底完成，常带惋惜或如释重负的语气。-고 말다同样表示“最终还是……了”，强调无奈或遗憾的结果。片段中던져
  버리다强调“干脆扔掉”，빠지고 말았다表现“不由得愣住了”。
