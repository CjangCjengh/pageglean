title: 「-다고/자고/라고 하다」：间接引用与「-다는 말」
structure: 用言 + -다고/자고/라고 하다（간접 인용/间接引用）；-다는 말 = -다고 하는 말
structure_pattern: V/A-다고 하다 / -자고 하다 / -라고 하다 / V/A-다는 말
explanation_zh: 韩语间接引用按句型变换：平叙-다고 하다、提议-자고 하다、命令-라고 하다、请求-아/어 달라고 하다。“-다는 말”是“-다고
  하는 말”的缩略，意为“说的……话”。片段中有“버리자고/버리라고 하다”，并用两个“-다는 말”回忆요나说过的话。
