  pointer: null
- text: 한 번도 직접 본 적은 없었지만, 나는 그녀의 옛날이 어땠을지 쉽게 상상해 볼 수 있었다.
  reading: ''
  annot: 한 번도 직접 본 적은 없었지만, 나는 그녀의 옛날이 어땠을지 쉽게 상상해 볼 수 있었다.
  translation_zh: 虽然一次也不曾亲眼见过，但我能够轻易想象出她的过去是什么样子。
