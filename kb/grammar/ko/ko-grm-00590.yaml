title: -ㄴ 척하다：假装
structure: 체언 / 용언 관형형 + 의존명사 척 + 보조동사 하다
structure_pattern: N-척(을) 하다 / V·A-(으)ㄴ 척하다
explanation_zh: 依存名词척指装出来的样子，与하다结合表示"假装……"。体言直接接척(을) 하다，动词、形容词则先以冠形词形-(으)ㄴ修饰척。文中"완벽한
  척 속이는 거지"生动地刻画出琪莉假装完美来糊弄世人的样子。
examples:
- text: 그냥 완벽한 척 속이는 거지.
  reading: ''
