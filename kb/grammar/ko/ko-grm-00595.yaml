title: -ㄹ/을지도 모르다：不确定的推测「也许会……」
structure: 용언 어간 + 연결어미 '-(으)ㄹ지' + 보조사 '도' + 용언 '모르다'
structure_pattern: V/A- + -(으)ㄹ지 + 도 + 모르다
explanation_zh: 在谓词词干后接'-(으)ㄹ지도 모르다'，表示对某事发生的可能性把握不大的推测，相当于'也许会……'。比'-ㄹ 것이다'语气更弱、更没把握，'이다'用'일지도
  모르다'。
examples:
- text: 요나가 악마라면 궁지에 몰렸을 때 본색을 드러낼지도 모른다고 생각했다.
  reading: ''
  annot: 요나가 악마라면 궁지에 몰렸을 때 본색을 드러낼지도 모른다고 생각했다.
  translation_zh: 我想，倘若约拿是恶魔，被逼入绝境时说不定就会露出真面目。
