title: 「-잖다：提醒显而易见的事实」
structure: -지 않다（补助性连接词尾 -지 + 补助用言 않다）的口语缩约终结形 -잖다
structure_pattern: V/A-잖다 (= -지 않다)
explanation_zh: -지 않다 的口语缩约形，用于指出对方已知或显而易见的事实，带有“你也该知道吧、不是吗”的语气，对话中高频出现。相当于中文“不是……嘛”。
