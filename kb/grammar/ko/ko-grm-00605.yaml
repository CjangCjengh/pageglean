title: 「-자 / -자마자：前一动作刚结束，后一动作随即发生」
structure: 动词词干 + 连接词尾 -자 / -자마자
structure_pattern: V-자 / V-자마자
explanation_zh: -자 与 -자마자 为连接词尾，表示前一分句的动作刚完成，后一分句的情况紧接着发生，前后主语可以不同（区别于 -아/어서）。相当于中文“一……就／刚……就”，-자마자
  衔接感更强。
examples:
- text: 무심하게 고갤 돌린 요나가 동전을 확인하자마자 온 얼굴이 다 찌그러질 정도로 인상을 썼다.
