title: 「-기 마련이다：按其规律必然如此」
structure: 用言词干 + 名词化词尾 -기 + 依存名词 마련 + 叙述格助词 이다
structure_pattern: V/A-기 + 마련이다
explanation_zh: 依存名词 마련 意为“注定的道理、当然的规律”，与名词化词尾 -기 搭配，表示按其本性必然如此、在所难免。多用于书面语与说理语境，相当于中文“自然会／难免／理所当然”。
examples:
