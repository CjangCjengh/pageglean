title: -ㄹ 테니(까)：想来会……所以（推测性原因）
structure: 谓词 + 冠形词尾 -ㄹ + 의존명사 터 + 서술격 조사（叙述格助词）-이- + 连接词尾 -니(까)
structure_pattern: V/A-ㄹ 터이- + -니(까) → -ㄹ 테니(까)
explanation_zh: 터 是表“事理、情理”的依存名词，-ㄹ 터이니(까) 缩略为 -ㄹ 테니(까)，表示基于推测或意志的前提性原因，相当于“想来会……所以/既然……”。主语为第一人称时表意志，其余情况多表对状况的推测。句中
  '인간일 테니' 意为“（对方）终究是人类，所以……”。
examples:
- text: 빈 헬로이스는 어디까지나 인간일 테니, 죽을 위기에 처하면 뭐든 솔직해지지 않겠어?
  reading: ''
