title: -(으)니까：因为……（理由与根据）
structure: 谓词 + 连接词尾 -(으)니까（前句为后句的理由、根据）
structure_pattern: V/A- + -(으)니까
explanation_zh: -(으)니까 是表原因的终结型连接词尾，强调前句是后句判断、行为或命令的理由与依据，可译为“因为/既然……”。与 -아/어서 不同，它后面可以接祈使句、共动句，也能接在时制词尾之后（如
  -았으니까）。本段人物多次用它自述理由，语气较主观。
examples:
- text: 브룬은 어딜 가든 인형을 품에서 놓은 적이 없었으니까.
