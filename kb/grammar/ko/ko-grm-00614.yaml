title: 「-ㄴ 채：状态的保持」
structure: 用言冠形词形 -(으)ㄴ + 依存名词 채（可加助词 로）
structure_pattern: V/A-(으)ㄴ 채(로)
explanation_zh: 依存名词채接在用言的冠形词形-(으)ㄴ后，表示前一状态原样保持的同时进行另一动作，相当于汉语“保持着……的状态（做某事）”。片段中“빛을
  잃은 채 / 감싸 쥔 채 / 엎드린 채”反复出现，是叙事中描写伴随状态的典型手段。
examples:
- text: 메이드가 양손으로 머리를 감싸 쥔 채 비명을 질렀다.
  reading: ''
