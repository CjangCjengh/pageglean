title: 「-고자：意图与目的」
structure: 动词词干 + 意图・目的连接词尾 -고자
structure_pattern: V-고자
explanation_zh: 连接词尾-고자表示主体的意图或目的，相当于-려고，主要接在动词后，多用于书面叙述，语气比-려고更正式。句中“상황을 파악하고자”即“为了弄清状况”，后句常接为达成该目的而采取的行动。
examples:
- text: 상황을 보다 정확히 파악하고자 재빠르게 빈 헬로이스의 어깨를 잡고 가볍게 흔들었다.
  reading: ''
  annot: 상황을 보다 정확히 파악하고자 재빠르게 빈 헬로이스의 어깨를 잡고 가볍게 흔들었다.
  translation_zh: 为了更准确地弄清状况，（加罗）迅速抓住宾·赫洛伊斯的肩膀，轻轻摇晃。
