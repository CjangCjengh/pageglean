title: -(으)ㄹ까 봐：担心、害怕……
structure: 用言词干 + 连接词尾 -(으)ㄹ까 + 补助动词 보다（表心理担忧）
structure_pattern: V/A-(으)ㄹ까 봐(서)
explanation_zh: 用言词干后接表推测的连接词尾「-(으)ㄹ까」，再结合虚化的动词「보다」，表示担心、忧虑某事发生，相当于「怕……」「担心会……」。本片段主人公连用三次该结构，层层递进地展现内心不安，是心理描写的典型句式。中文可用「怕……」「担心……」对应。
examples:
- text: 내가 행동할수록 그 누군가의 계획대로 돌아가는 것일까 봐.
  reading: ''
