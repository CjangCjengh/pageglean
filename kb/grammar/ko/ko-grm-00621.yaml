- text: 악마를 잡겠다고 설치던 것이, 자신만만하게 나의 판단을 믿고 밀어붙인 것이, 결국 내 오만이고 실수였을까 봐 두렵다.
  reading: ''
  annot: 악마를 잡겠다고 설치던 것이, 자신만만하게 나의 판단을 믿고 밀어붙인 것이, 결국 내 오만이고 실수였을까 봐 두렵다.
