title: 补助动词 -아/어 버리다 与 -아/어 놓다
structure: 用言 -아/어 形 + 补助动词 버리다（彻底完成·遗憾）/ 놓다·두다（结果存续）
structure_pattern: V-아/어 버리다 / V-아/어 놓다
explanation_zh: 两者都属于学校语法所说的补助动词（보조 용언）：前一动词以「-아/어」形连接，后一动词虚化补充语义。「-아/어 버리다」表示动作彻底完成，常带遗憾、无可奈何的语气，相当于「……掉了」；「-아/어
  놓다/두다」表示动作完成后其结果存续着，相当于「（做好）放在那儿」。辨析要点：버리다 强调完结与不可挽回，놓다/두다 强调结果的保存。
examples:
- text: 예상치 못한 빈 헬로이스의 사망에 모든 사고가 엉망이 되어 버렸다.
