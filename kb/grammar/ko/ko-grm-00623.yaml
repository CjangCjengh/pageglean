title: -다니：「竟然……！」的惊讶感叹
structure: 动词/形容词词干 + 连接词尾 -다니；이다 → -라니；过去时制词尾后 -았/었 + 다니
structure_pattern: V/A-다니, 이다-라니
explanation_zh: 连接词尾「-다니」表示说话人对已听闻或已发生之事感到惊讶、感叹、难以置信，常以反问形式出现，相当于「竟然……」「居然……」。动词、形容词词干后直接加「-다니」，「이다」用「-라니」。片段中两处均用于表现人物面对冲击性事实时的震惊与无法接受。
examples:
