title: -아/어 보다：尝试做某事
structure: 动词词干 + -아/어 + 보다（补助动词）；让步式 -아/어 봐야
structure_pattern: V-아/어 + 보다 (보조 동사)
explanation_zh: 动词词干后接连接词尾 -아/어 再接补助动词 보다，表示“尝试做某事”，口语中常缩为 봐。后接 -야（봐야）构成让步，即“即使试着……也……”，常与
  소용없다 呼应。相当于中文的“试试看”。
examples:
- text: 나를 이런 밧줄이나 허술해 빠진 지하 창고에 가둬 봐야 소용없다는 것 정도는 알고 있었을 거라고 생각한다.
  reading: ''
