id: ko-grm-00634
language: ko
type: grammar
level: TOPIK2
level_rank: 2
title: -아/어 보다：试着做、做做看
structure: 동사 어간 + 연결어미 '-아/어' + 보조동사 '보다'（시도/경험）
structure_pattern: V-아/어 보다
explanation_zh: 补助动词 ‘보다’ 接在 -아/어 后，表示尝试做某事，译为“……看看、试着……”。与 -ㄴ 적이 있다 连用（와 본 적이 있다）则表示过去的经历。本片段中反复出现，是叙事文中的高频结构。
examples:
