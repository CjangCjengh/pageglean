  pointer: null
- text: 방의 한쪽 구석에 진열하듯 늘어서 있는 실제 사람만 한 인형들이다.
  reading: ''
  annot: 방의 한쪽 구석에 진열하듯 늘어서 있는 실제 사람만 한 인형들이다.
  translation_zh: 房间一角，像陈列展示般整齐排着的、真人大小的人偶。
