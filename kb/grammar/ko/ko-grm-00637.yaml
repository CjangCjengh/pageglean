title: -며：一边……一边……（동시동작）
structure: 동사 어간 + -며（동시동작 연결어미）
structure_pattern: V-stem + -며
explanation_zh: 연결어미 '-며' 表示两个动作或状态同时进行（동시동작），相当于汉语的“一边……一边……”，属书面语形式，口语多用 '-면서'。片段中高频出现，如
  '부르며 다가오다'、'물러나며 대답하다'。
examples:
- text: 복도 저 끝에서부터 나를 부르며 다가오는 발소리가 들렸다.
  reading: ''
  annot: 복도 저 끝에서부터 나를 부르며 다가오는 발소리가 들렸다.
