id: ko-grm-00639
language: ko
type: grammar
level: TOPIK5
level_rank: 5
title: -기 무섭게：刚一……就……
structure: 동사 어간 + -기 무섭게（시간 연결 표현）
structure_pattern: V + -기 무섭게
explanation_zh: 시간 연결 표현 '-기 무섭게' 表示前一动作刚结束，后一动作紧接着发生，相当于“……刚一……就……”。字面意为“……得令人害怕”，语感比
  '-자마자' 更强烈，多用于书面叙事。
examples:
- text: 가로의 말이 끝나기 무섭게, 창 너머 굉장히 먼 곳에서 환호성 소리가 들려왔다.
