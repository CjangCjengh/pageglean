id: ko-grm-00644
language: ko
type: grammar
level: TOPIK2
level_rank: 2
title: -아/어야 하다：义务与必要
structure: 동사/형용사 어간 + 연결어미 -아/어 + 보조사 -야 + 보조동사 '하다'（强调时：-야만 하다）
structure_pattern: V/A-아/어 + 야 + 하다
explanation_zh: 连接词尾-아/어后接보조사-야与하다，表示“必须/不得不做某事”。插入보조사만则成为-야만 하다，强调“非……不可”。片段中反复出现，描写人物迫于形势不得不做出的行动。
examples:
- text: 그 많은 인파를 헤치고 키이리와 브룬과 요나를 찾아야 할 일이 막막하기만 했다.
