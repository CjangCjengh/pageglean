title: -(으)ㄴ/는 것 같다：推测与委婉判断
structure: 용언의 관형사형 전성어미 -(으)ㄴ/-는 + 의존명사 '것' + 형용사 '같다'
structure_pattern: V-(으)ㄴ/는 것 같다
explanation_zh: 用관형사형 전성어미修饰依存名词것，再接같다表示推测或委婉的判断，相当于“好像……”。现在时用-는，过去时用-ㄴ。是韩语中软化断言、表达不确定的高频结构。
examples:
