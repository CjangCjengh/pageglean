title: -아/어 주다：为他人做（施惠）
structure: 용언 어간 + 연결어미 '-아/어' + 보조 용언 '주다'
structure_pattern: V-아/어 + 주다 (보조 용언)
explanation_zh: 动词词干后接连接词尾 -아/어，再补助动词 주다，表示为对方做某事、带有施惠或成全的语气。主语是施予动作的一方，对应中文“为……做／帮……做”。敬语形式为
  -아/어 드리다。
