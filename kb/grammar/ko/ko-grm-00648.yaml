id: ko-grm-00648
language: ko
type: grammar
level: TOPIK3
level_rank: 3
title: -기를 바라다：希望、祈愿
structure: 용언 어간 + 명사형 전성어미 '-기' + 목적격 조사 '를' + 서술어 '바라다'
structure_pattern: V-기 + 를 + 바라다
explanation_zh: 用名词化转成词尾 -기 将动词体言化，加宾格助词 를，再接动词 바라다（盼望），表示“希望……”。语气偏书面、郑重，常用于祝愿或恳切的期盼。口语中多用
  -았/으면 좋겠다 替代。
examples:
