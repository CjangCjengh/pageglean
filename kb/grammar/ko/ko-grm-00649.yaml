title: -아/어 버리다：彻底做完（常含遗憾）
structure: 용언 어간 + 연결어미 '-아/어' + 보조 용언 '버리다'
structure_pattern: V-아/어 + 버리다 (보조 용언)
explanation_zh: 补助动词构成，表示动作彻底完成、不留余地，常伴随遗憾、后悔或如释重负的语气。文段两处均表示“完全……掉了”，强调结果的不可逆。
examples:
- text: 단번에 손쉽고 깔끔하게 상대를 저 세상에 보내 버리는 지점을 알고 있다.
  reading: ''
  annot: 단번에 손쉽고 깔끔하게 상대를 저 세상에 보내 버리는 지점을 알고 있다.
  translation_zh: （她）知道能一下子轻松利落地把对方送上西天的要害。
