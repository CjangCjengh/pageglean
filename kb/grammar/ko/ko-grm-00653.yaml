title: -는 한：只要…（条件限度）
structure: 용언 어간 + 관형사형 전성어미 '-는' + 의존명사 '한'
structure_pattern: V-는 한
explanation_zh: 冠形词形词尾 -는 加依存名词 한（限度），表示“只要……（就）”“在……的范围内”。用于设定条件或界限，强调在该条件成立时结论不变。
examples:
