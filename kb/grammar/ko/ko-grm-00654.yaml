title: -는 척하다：假装
structure: 动词冠形形 -는 + 의존명사（依存名词）'척' + 하다
structure_pattern: V-는 척하다 / A-(으)ㄴ 척하다
explanation_zh: '''-는 척하다''表示假装某种动作或状态，相当于''装作……''。动词后用''-는 척하다''，形容词后用''-(으)ㄴ 척하다''。片段中哥哥以反问句当面戳穿女孩假装的关心。'
examples:
