title: -(느)냐고/-느냔 말이야：激愤的反问
structure: 动词词干 + -느냐 (의문 종결 어미) + 인용 '-고/-ㄴ' + 말이야
structure_pattern: V-냐고 / V-느냔 말이야
explanation_zh: 由动词疑问型终结词尾'-느냐'加引用结构构成，用于带着强烈情绪反问、反驳对方；'말이야'进一步加强语气，相当于中文带着怒气的'到底……吗！''说什么……！'。'뭘
  했느냔 말이야'是小说中激愤质问的典型句式。
examples:
- text: 당신이 대체 뭘 아냐고―!
  reading: ''
  annot: 당신이 대체 뭘 아냐고―!
  translation_zh: 你到底懂什么——！
