title: 「-며」：两个动作同时进行
structure: 动词词干 + 连接词尾 '-며'（表示同时动作/并列）
structure_pattern: V- + -며
explanation_zh: 连接词尾「-며」连接两个同时进行的动作或状态，作用相当于「-면서」，但更偏书面叙述。前后主语一般一致，后句常用现在时描写眼前情景。本片段的人物动作描写大量借助这一结构串联。
examples:
