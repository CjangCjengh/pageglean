  pointer: null
- text: 팔이 자유로워지자마자 요나는 양팔을 들어 황급히 눈을 가린 채 소리 내어 울기 시작했다.
  reading: ''
  annot: 팔이 자유로워지자마자 요나는 양팔을 들어 황급히 눈을 가린 채 소리 내어 울기 시작했다.
  translation_zh: 双臂刚一获得自由，约娜就抬起双手慌忙遮住眼睛，放声哭了起来。
