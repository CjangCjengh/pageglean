title: 「-자 / -자마자」：一……就立刻……
structure: 动词词干 + 时间连接词尾 '-자' / '-자마자'（表示后一动作紧接着发生）
structure_pattern: V- + -자 / -자마자
explanation_zh: 连接词尾「-자」表示前一动作或状态刚发生，后一动作随即发生。「-자마자」在其后加依存名词「마자」，强调“刚一……马上……”，语气更紧。相当于中文的“……之后立刻”。
examples:
- text: 내가 신경질적으로 소리치자, 요나가 뒷말을 삼켰다.
  reading: ''
  annot: 내가 신경질적으로 소리치자, 요나가 뒷말을 삼켰다.
  translation_zh: 我神经质地一吼，约娜便把后面的话咽了回去。
  source_book: book-ko-026
