title: 「-느라」：因忙于前事而招致后果
structure: 动词词干 + 原因连接词尾 '-느라'
structure_pattern: V- + -느라
explanation_zh: 连接词尾「-느라」表示因为持续进行前句的动作而导致了后句的结果，且后句多为消极、否定性的结果。前后主语必须一致，一般只接动词。可译为“因为忙于……（所以）”。
examples:
- text: 악을 지르느라 쉬어 버린 목소리가 목구멍을 스치며 새어 나왔다.
  reading: ''
