title: 「-아/어 버리다」：彻底完成与遗憾语气
structure: 用言 + 补助连接词尾 '-아/어' + 补助动词 '버리다'（补助用言结构）
structure_pattern: V/A-아/어 버리다
explanation_zh: 「-아/어 버리다」由补助连接词尾「-아/어」接补助动词「버리다」构成，表示动作彻底完成，或出现令人遗憾、懊悔的结果。相当于中文的“……（彻底）……掉了”。片段中以冠形词形「쉬어
  버린」修饰“嗓音”，带出无奈感。
examples:
