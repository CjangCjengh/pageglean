title: 「-았으면 좋겠다」：表达难以实现的愿望
structure: 用言 + 过去时连接词尾 '-았으면' + '좋겠다'（形容词 '좋다' + 先语末词尾 '-겠-'）
structure_pattern: V/A-았으면 좋겠다
explanation_zh: 「-았으면 좋겠다」由过去时连接词尾「-았으면」加「좋겠다」构成，表示与现实相悖或难以实现的愿望。语气比「-고 싶다」更委婉，暗含期盼。相当于中文的“要是……就好了”。
examples:
