title: 「-(으)니까：原因与根据」
structure: 形容词/动词 + -(으)니까（原因、根据）
structure_pattern: Adj/V-(으)니까
explanation_zh: 表示原因或根据的连接词尾，相当于中文的“因为……”，后句常为命令、建议或推断。与-아/어서不同，-니까前句可以带时制词尾，后句也允许命令句和共动句。片段用“다른
  문제이니까”“생각이 없으니까”交代理由。
examples:
- text: 죽은 시체를 움직이는 것과, 살아 있는 사람을 움직이는 것은 완전히 다른 문제이니까.
  reading: ''
  annot: 죽은 시체를 움직이는 것과, 살아 있는 사람을 움직이는 것은 완전히 다른 문제이니까.
  translation_zh: 因为操纵死去的尸体和操纵活着的人，完全是两回事。
