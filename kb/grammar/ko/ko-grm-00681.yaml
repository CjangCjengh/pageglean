- text: 난 죽을 생각이 없으니까 소용없는 가정이지만.
  reading: ''
  annot: 난 죽을 생각이 없으니까 소용없는 가정이지만.
  translation_zh: 我没有想死的打算，所以这只是个没用的假设。
