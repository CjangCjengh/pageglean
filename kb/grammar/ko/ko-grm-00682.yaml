title: 「-는 것 같다：委婉的推测」
structure: 动词 + -는 것 같다（不太确定的推测）
structure_pattern: V-는 것 같다 / Adj-(으)ㄴ 것 같다
explanation_zh: 由依存名词것加形容词같다构成，表示没有十足把握的推测，相当于“好像……”。动词现在时接-는 것 같다，过去时接-(으)ㄴ 것 같다。片段用以揣测人物的内心状态与意图，语气委婉。
examples:
- text: 아무래도 그녀의 안에서 브룬의 명령과 본인의 의지가 뒤엉켜 혼란을 겪고 있는 것 같았다.
  reading: ''
