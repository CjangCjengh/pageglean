title: 「-아/어 버리다：彻底完成与情感色彩」
structure: 用言词干 + -아/어 + 보조 동사 '버리다'（보조 용언 구성）
structure_pattern: V/A + -아/어 버리다
explanation_zh: 学校语法中，这是连接词尾 -아/어 后接补助动词 '버리다' 构成的补助用言（분석적 표현）。表示动作彻底完成或状态完全实现，常附带遗憾、痛快、决心等情感。时态与阶位由补助动词体现，如过去
  '버렸다'、意志 '버려야겠다'。
examples:
- text: 맹종(盲從)의 소녀는 드디어, 자신에게 이어져 있던 꼭두각시 줄을 끊어 버렸다.
