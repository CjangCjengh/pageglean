title: -았/었을 것이다：对过去的肯定推测
structure: 用言词干 + -았/었을 것이다（理由形：-(으)ㄹ 테니까）
structure_pattern: V/A-았/었을 것이다; V/A-(으)ㄹ 테니까
explanation_zh: -(으)ㄹ 것이다表示说话人对情况的肯定推测，相当于「想必……」「应该会……」。与过去时制词尾结合成-았/었을 것이다，用于推测已经发生的事情；-(으)ㄹ
  테니까则以推测性理由解释原因。本段叙述者反复用它揣测过去的心思，语气笃定而带反省。
examples:
- text: 처음에는 그 말에 전적으로 동의했을 것이다.
  reading: ''
