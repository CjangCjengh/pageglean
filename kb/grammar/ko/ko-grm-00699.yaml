title: -(으)ㄹ 수 있다/없다：可能与不可能
structure: 동사 어간 + -(으)ㄹ 수 있다/없다
structure_pattern: V- + -(으)ㄹ 수 있다/없다
explanation_zh: 학교문법에서 '수'는 가능성을 나타내는 의존명사이며, 동사가 관형사형 어미 '-(으)ㄹ'로 체언을 수식하고 '있다/없다'가
  서술하는 구조이다. 중국어의 '能/会……''不能……'에 대응한다. '-(으)ㄹ 수 있었다'처럼 과거 선어말어미를 결합하면 '본래 ~할 수 있었다'는
  뜻을 나타낸다.
