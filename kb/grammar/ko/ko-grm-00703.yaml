title: -(으)ㄴ/는다는 것：间接引用修饰名词
structure: 용언 어간 + -(으)ㄴ/는다는 + 체언(의존명사 '것')
structure_pattern: V/A- + -(으)ㄴ다는/는다는 + 의존명사 것
explanation_zh: 인용 표현 '-(느)다고 하다'가 관형사형으로 바뀐 '-(으)ㄴ다는/는다는'이 의존명사 '것'이나 명사를 수식해 '~라고
  하는 것(말)'을 나타낸다. 규칙·발언 등을 간접 인용으로 중첩 전달할 때 쓰인다. 중국어로는 '~라는 (것/말)'로 옮길 수 있다.
examples:
- text: 아무래도 키이리에게 의식 없는 사람을 무조건 흔들고 보면 안 된다는 걸 교육시켜야 할 것 같다.
