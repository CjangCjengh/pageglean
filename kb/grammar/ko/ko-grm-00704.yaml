title: -았/었어야 하다：本该如此却未做的懊悔
structure: 동사 어간 + -았/었어야 하다
structure_pattern: V- + -았/었어야 하다
explanation_zh: 의무를 나타내는 '-아/어야 하다' 앞에 과거 선어말어미 '-았/었-'이 붙어 '본래 ~했어야 했다(그러나 하지 않았다)'는
  반사실적 후회를 나타낸다. 감탄형 '-았/었어야지'로 강한 유감·자책·책망을 드러낸다. 중국어의 '本来应该……才对啊'에 해당한다.
examples:
