id: ko-grm-00705
language: ko
type: grammar
level: TOPIK4
level_rank: 4
title: -더라고：回想亲历并转述
structure: 용언 어간 + -더라고（회상 선어말어미 -더- + 종결어미 -라고）
structure_pattern: V/A- + -더라고
explanation_zh: 회상 선어말어미 '-더-'에 종결어미가 결합한 것으로, 화자가 과거에 직접 겪거나 알게 된 사실을 상대에게 떠올려 전할
  때 쓴다. '(그때 보니/알고 보니) ~하더라'는 발견의 어감을 담으며, 단순 과거 시제와는 구별된다. 학교문법에서 '-더-'를 회상(회고) 선어말어미라
  부른다.
examples:
- text: 아, 그거. 엘레바도의 마왕이더라고.
  reading: ''
  annot: 아, 그거. 엘레바도의 마왕이더라고.
  translation_zh: 啊，那个啊。（我一想）原来就是艾利法度的魔王（我自己）啊。
