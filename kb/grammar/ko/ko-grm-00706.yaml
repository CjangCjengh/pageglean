title: -게 되다：状态与情况的转变
structure: 用言 + 副词形语尾 -게 + 补助动词 되다
structure_pattern: V/A-게 + 되다
explanation_zh: 副词形转成语尾「-게」接补助动词「되다」，表示情况发生变化，相当于中文的“变得……、……起来”。中文没有完全对应的形式，翻译时需补出变化义。过去时用「-게
  되었다」，也可再接推测形「-게 될 것이다」。
examples:
- text: 본모습을 드러낸 악마를 본 순간, 나는 악마라는 존재에 대하여 명확하게 이해하고 판단할 수 있게 됐다.
  reading: ''
  annot: 본모습을 드러낸 악마를 본 순간, 나는 악마라는 존재에 대하여 명확하게 이해하고 판단할 수 있게 됐다.
  translation_zh: 看到现出真身的恶魔的那一刻，我得以清晰地理解并判断“恶魔”这种存在。
