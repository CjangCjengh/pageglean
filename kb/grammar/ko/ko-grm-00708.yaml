title: -(느)ㄴ다는 것：间接引用名词化
structure: 句子 + 间接引用冠形词形 -(느)ㄴ다고 하는（缩约 -다는）+ 依存名词 것/뜻/점
structure_pattern: S-(느)ㄴ다는 것
explanation_zh: 「-다고 하는」缩约为「-다는」，把一整个陈述转成修饰体言的定语，意为“……这件事、……这一点”。是韩语书面语和新闻中的高频结构，也是读懂长句的关键。后接名词可以是
  것、뜻、점、희망 等。
examples:
- text: 어, 그 말은 계약이 끊어졌다는 뜻 아니야?
