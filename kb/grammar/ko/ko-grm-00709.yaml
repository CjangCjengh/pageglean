title: -아/어 있다：动作结果的持续
structure: 动词 + 副词形语尾 -아/어 + 补助动词 있다
structure_pattern: V-아/어 있다
explanation_zh: 补助动词「있다」接在副词形语尾后，表示动作完成后状态的持续，多与不及物动词搭配，如「살아 있다（活着）」「남아 있다（剩下）」。与表示动作进行的「-고
  있다」相对：前者是状态，后者是进行。
examples:
- text: 살아 있는 사람 약간을 제외하고 도시에 있던 사람들이 전부 흔적도 없이 증발해 버렸어요.
  reading: ''
