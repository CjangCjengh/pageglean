title: -아/어도 좋다：允许与让步
structure: 动词词干 + 连接词尾 -아/어도 + 좋다
structure_pattern: V-아/어도 좋다
explanation_zh: 让步连接词尾 -아/어도 与 좋다 搭配，表示「即使……也没关系」，用于允许或同意对方做某事。语气自然随意，与 -아/어도 괜찮다
  相近。中文可译为「……也可以」「尽管……」。
