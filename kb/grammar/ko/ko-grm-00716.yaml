title: 「-(느)ㄴ다는 것：间接引语的名词化」
structure: 用言词干 + 引用连接词尾 -다고 하- + 冠形形转成词尾 -(으)ㄴ + 依存名词 것
structure_pattern: V/A + -(느)ㄴ다는 + 것
explanation_zh: 学校文法把 -는/ㄴ다는 分析为间接引用「-다고 하-」后接冠形形转成词尾 -ㄴ，再由依存名词 것 使命词化，从而在句中充当主宾语。转述内容必须先经过这一套屈折，不同于汉语直接说「……的／……这件事」。注意时态配合：-는(现在)、-ㄴ(过去)、-(으)ㄹ(将来·推测)。
