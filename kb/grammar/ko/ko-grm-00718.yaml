title: 「-면서(도)：同时进行、让步与反驳」
structure: 用言词干 + 连接词尾 -면서 (+ 补助词 도)
structure_pattern: V/A + -면서(도)
explanation_zh: 连接词尾 -면서 基本义为动作同时进行（「一边……一边」）。加补助词 도 转为让步，意为「虽然……却」；在疑问句中则用于反驳、指责对方行为与情理不符。三种用法需依上下文辨别，本片段三种用法均有出现。
examples:
- text: 대체 남의 호위를 데리고 돌아다니면서 무슨 짓을 하고 있는 거죠?!
  reading: ''
