title: 「-치고는：就……而言、作为……来说」
structure: 体言/依存名词 것 + 依存名词 치 + 补助词 는
structure_pattern: N + 치는 / 것치고는
explanation_zh: 依存名词 치 表示「在某类对象当中」，与补助词 는 搭配意为「作为~来说、就~而言」，后文多接与对该类事物的一般预期不相符的内容，含对比评价的语气。片段中「그런
  것치고는」两次出现，起承转作用。对应汉语「就……而言／作为……来说」。
examples:
- text: 그런 것치고는 고급스러운 재질로 만들어진 것 같았다.
  reading: ''
  annot: 그런 것치고는 고급스러운 재질로 만들어진 것 같았다.
  translation_zh: 就那样看来，它似乎是用相当贵重的材质制成的。
