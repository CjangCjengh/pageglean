title: -았/었더니：回忆中的意外发现
structure: 动词词干 + -았/었더니
structure_pattern: V-어간 + -았/었더니
explanation_zh: 说话人回忆自己的亲身经历，后句引出与前情不同的发现或结果，主语限第一人称。本段"깨어났더니"即"醒来一看竟然……"，带有意外感。
examples:
- text: 깨어났더니 판타지 세계에 전생해 있었다……
