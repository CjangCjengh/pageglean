title: -아/어 보다：尝试"……看看"
structure: 动词词干 + -아/어 + 补助动词 보다
structure_pattern: V-어간 + -아/어 + 보다(보조동사)
explanation_zh: 补助动词"보다"接在"-아/어"之后表示尝试，相当于中文的"……试试看"。常与"-ㄹ까요?""-는 건 어떨까요?"等搭配，用于委婉提议或自言自语。
examples:
- text: ‘작가님도 그런 설정으로 한번 써 보시는 건 어떨까요?’ 하는 얘기를 하기도 했다.
