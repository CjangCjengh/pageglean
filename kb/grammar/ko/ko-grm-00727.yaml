title: -(으)ㄴ 채(로)：保持原状态
structure: 动词词干 + -(으)ㄴ 채(로)
structure_pattern: V-어간 + -(으)ㄴ 채(로)
explanation_zh: 依存名词"채"表示保持前一动作所形成的状态去做后一动作，相当于"保持着……的状态"。文中"앉은 채 잠들다"即"保持着坐姿入睡"。
examples:
- text: 컴퓨터를 하다가 의자에 앉은 채 잠들었던 것뿐인가?
  reading: ''
