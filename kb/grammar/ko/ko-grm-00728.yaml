title: -에도 불구하고：尽管……却……
structure: 体言(+이다) + -에도 불구하고
structure_pattern: 체언(+임) + -에도 불구하고
explanation_zh: 表示让步，相当于"尽管……却……"，接体言时用"-임에도 불구하고"。比"-는데도"更书面、语气更强。
examples:
- text: 마른 체형임에도 불구하고 가슴은 봉긋하게 솟아올라 있어
  reading: ''
