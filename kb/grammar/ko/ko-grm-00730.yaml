title: 「-는데」：背景、对比与欲言又止
structure: 동사 어간 + -는데；형용사·있/없·-았/었- 뒤 + -ㄴ/는데
structure_pattern: V-는데 / A-ㄴ/는데
explanation_zh: -는데 是表示背景说明、对比或留下余韵的词尾；动词后接 -는데，形容词、있다/없다 及 -았/었- 之后接 -ㄴ/는데。文中两次置于句末，以欲言又止的方式传达辩解与迟疑，是口语里极典型的用法。中文可译为“……（不过/可是）……”。
examples:
- text: ……아니, 난 딱히 레이나에게 고통을 줄 생각은 없는데.
