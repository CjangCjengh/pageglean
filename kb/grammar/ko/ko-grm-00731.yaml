  pointer: null
- text: 내가 설정해 놓긴 했지만, 실제 스토리상에서는 별로 중요하게 취급하지 않았기 때문에 기억에서 지워져 있었다.
  reading: ''
  annot: 내가 설정해 놓긴 했지만, 실제 스토리상에서는 별로 중요하게 취급하지 않았기 때문에 기억에서 지워져 있었다.
  translation_zh: 虽然是我设定好的，但在实际剧情里没被当回事，所以早已从记忆里抹掉了。
