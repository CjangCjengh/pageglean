id: ko-grm-00739
language: ko
type: grammar
level: TOPIK2
level_rank: 2
title: 「-(으)ㄴ/는：动词、形容词直接作定语」
structure: 용언 어간 + 관형사형 전성어미 -(으)ㄴ/-는 + 체언(명사)
structure_pattern: V/A-(으)ㄴ/는 + N
explanation_zh: 韩语不用从句而用词尾作定语：动词现在时用冠形词形转成词尾 -는、过去时用 -(으)ㄴ，形容词用 -(으)ㄴ，直接置于名词之前。片段中「지닌」「펼쳐진」「세워진」均为动词过去冠形词形修饰名词。中文母语者需注意修饰语永远在被修饰名词之前，翻译时要调整语序。
examples:
