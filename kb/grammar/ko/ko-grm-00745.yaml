title: -(으)ㄴ/는 듯이：仿佛……似的
structure: 谓词词干 + 冠形词形转词尾 -(으)ㄴ/는 + 依存名词 듯 + 助词 이
structure_pattern: V/Adj-(으)ㄴ/는 + 듯 + 이
explanation_zh: 依存名词 듯 表示"仿佛、像……似的"，后接助词 이 作副词性成分修饰谓词。形容词后用 -(으)ㄴ 듯이，动词后用 -는 듯이，也常见
  -다는 듯이（一副……的样子）这一引用式变体。多用于描写人物的神态与样子。
examples:
- text: 틸프가 조금 창피한 듯이 얼굴을 붉혔다.
  reading: ''
