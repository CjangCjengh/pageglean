  translation_zh: 蒂尔芙像是有点害羞似的涨红了脸。
  source_book: book-ko-015
  source_chapter: null
  pointer: null
- text: 마이시아가 이상하다는 듯이 나를 쳐다봤다.
  reading: ''
  annot: 마이시아가 이상하다는 듯이 나를 쳐다봤다.
  translation_zh: 希娅一副觉得莫名其妙的样子看着我。
