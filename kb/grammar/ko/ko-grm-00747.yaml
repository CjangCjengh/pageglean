title: 「-(으)ㄹ 뿐이다」：仅此而已
structure: 动词/形容词词干 + -(으)ㄹ 뿐이다
structure_pattern: V/A-(으)ㄹ 뿐 + 이다
explanation_zh: 依存名词 뿐 加 이다，表示『仅此而已、没有别的』。-(으)ㄹ 뿐이지 后接分句时，带『虽是如此，但……』的转折语气。名词后可直接接
  '명사일 뿐이다'。
examples:
- text: 자기재생 능력이 있을 뿐이다.
  reading: ''
  annot: 자기재생 능력이 있을 뿐이다.
  translation_zh: 只不过拥有自我再生能力罢了。
  source_book: book-ko-015
  source_chapter: null
  pointer: null
- text: 어렸을 때 친구였을 뿐이지 지금은 딱히 그런 게 아니야.
  reading: ''
  annot: 어렸을 때 친구였을 뿐이지 지금은 딱히 그런 게 아니야.
  translation_zh: 只是小时候的朋友罢了，现在倒也没什么特别的关系。
