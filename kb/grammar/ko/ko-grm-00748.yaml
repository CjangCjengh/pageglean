title: 「-잖다」：口语中提示已知理由
structure: 动词/形容词词干 + -잖아(요)
structure_pattern: V/A-잖다 (< -지 않다)
explanation_zh: '''-지 않다'' 的口语缩略形，作终结词尾使用。向听话人指出双方已知或现场可确认的事实，以此作为理由，常带强调或轻微责备的语气。书面语中相当于
  -지 않다 或 -니까。'
