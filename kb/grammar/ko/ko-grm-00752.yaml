title: -기 그지없다：程度至极
structure: 形容词词干 + 名词化词尾 -기 + 그지없다
structure_pattern: A- + -기 + 그지없다
explanation_zh: '''-기 그지없다''表示程度达到极点，相当于''……至极''''再……不过''，由名词化词尾''-기''加形容词''그지없다（无穷无尽）''构成，书面语色彩浓。''음침하기
  그지없는''作冠形语修饰''목소리''，即''阴森至极的声音''。'
examples:
- text: 음침하기 그지없는 목소리로, 클라우가 말했다.
