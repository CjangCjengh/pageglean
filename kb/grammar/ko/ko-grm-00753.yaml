title: -잖아(요)：强调显而易见的事实
structure: 谓词词干 + 终结词尾 -잖아(요)（口语）
structure_pattern: V/A- + -잖아(요)
explanation_zh: '''-잖아(요)''用于提示对方已知或显而易见的事实，带有强调、辩解或提醒的语气，中文近似''不是……嘛''。口语中使用极频繁，常与引用形式''-다고
  하다''连用，如''싫다고 했잖아''（我都说了不要嘛）。'
