title: -(으)ㄴ/는지：内包疑问
structure: 谓词 + 连接词尾 -(으)ㄴ/는지（构成内包疑问节）
structure_pattern: V-는지 / A-(으)ㄴ지 / 체언-인지
explanation_zh: 连接词尾-(으)ㄴ/는지把疑问内容内包进句中，相当于「是谁」「是否……」。后接알다、모르다、짐작하다等认知类谓词。本片段中누구인지、어떠한지等反复出现。
examples:
- text: 가장 왼쪽에 서 있는 여기사는 누구인지 짐작이 간다.
  reading: ''
