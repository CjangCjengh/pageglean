  translation_zh: 站在最左边的那位女骑士，我大致猜得到是谁。
  source_book: book-ko-015
  source_chapter: null
  pointer: null
- text: 하지만 나머지 두 사람은 누구인지 알 수 없었다.
  reading: ''
