title: 조차/마저：补助词「连……都……」
structure: 체언(名词) + 보조사 '조차/마저'
structure_pattern: N + 조차/마저 (보조사)
explanation_zh: 조차、마저是表示极端包含的补助词，相当于汉语“连……”，举出极端事例以加强语气。조차多用于消极语境，마저侧重“连最后的、剩余的也……”。片段中“连方向”“连一步”“连表情”反复出现，是渲染极端状态的高频手段。
examples:
- text: 나는 방향조차 가늠할 수 없는 길을 하염없이 걸었다.
  reading: ''
  annot: 나는 방향조차 가늠할 수 없는 길을 하염없이 걸었다.
  translation_zh: 我茫然地走在那条连方向都无法估量的路上。
