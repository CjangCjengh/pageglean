  pointer: null
- text: 머리끝부터 발끝까지 무채색인 데다 표정마저 얼음처럼 차가워 흡사 유령 같았다.
  reading: ''
  annot: 머리끝부터 발끝까지 무채색인 데다 표정마저 얼음처럼 차가워 흡사 유령 같았다.
  translation_zh: 不仅从头到脚一身无彩色，连表情也像冰一样冷，活像个幽灵。
