title: -(으)ㄴ 데다(가)：递进添加「不仅……而且……」
structure: 관형사형 전성 어미 '-(으)ㄴ' + 의존 명사 '데' + 보조사 '다(가)'
structure_pattern: V/A-(으)ㄴ 데다(가) / N-인 데다(가)
explanation_zh: 由冠形词形转成词尾 -(으)ㄴ 加依存名词 데 再加助词构成，表示在前一情况之上追加另一情况，多为同向递进，相当于“不仅……再加上……”。体言和
  이다 后接 -인 데다。片段用它把“无彩色”与“冰冷的表情”叠加，塑造少女的异样感。
examples:
- text: 머리끝부터 발끝까지 무채색인 데다 표정마저 얼음처럼 차가워 흡사 유령 같았다.
  reading: ''
  annot: 머리끝부터 발끝까지 무채색인 데다 표정마저 얼음처럼 차가워 흡사 유령 같았다.
  translation_zh: 不仅从头到脚一身无彩色，连表情也像冰一样冷，活像个幽灵。
