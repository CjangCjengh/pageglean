- text: 그녀를 찾기 위하여 이 기묘한 도시의 밤을 헤매며 돌아다니고 있었던 것이다.
  reading: ''
  annot: 그녀를 찾기 위하여 이 기묘한 도시의 밤을 헤매며 돌아다니고 있었던 것이다.
  translation_zh: 原来是为了找到她，我才在这座奇异城市的夜晚四处徘徊游荡。
  source_book: book-ko-026
