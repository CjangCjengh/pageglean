title: -(으)ㄹ 정도(로)：达到某种程度
structure: 用言 + -(으)ㄹ 정도다 / -(으)ㄹ 정도로
structure_pattern: V/A-(으)ㄹ 정도(로)
explanation_zh: 依存名词（의존명사）정도表示程度，前接定语形词尾-(으)ㄹ；作谓语说“-ㄹ 정도다”，加-로则作状语“-ㄹ 정도로”。相当于中文“……到某种程度”，用于强调程度之深。书面语和口语都常用。
examples:
- text: 직접 체험해 보니 날카롭기가 따를 검이 없을 정도다.
  reading: ''
