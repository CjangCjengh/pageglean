title: -(으)ㅁ에 따라：随着……
structure: 动词 + -(으)ㅁ에 따라
structure_pattern: V-(으)ㅁ에 따라
explanation_zh: 名词化词尾-(으)ㅁ把动词转为名词，再经助词에与따라（따르다的活用形）连接，表示“随着前项变化，后项也随之变化”。相当于中文“随着……”，语体正式，多见于书面叙述。
examples:
- text: 발치의 붉은 영역이 넓어짐에 따라 점점 한기가 몰려 왔다.
  reading: ''
  annot: 발치의 붉은 영역이 넓어짐에 따라 점점 한기가 몰려 왔다.
  translation_zh: 随着脚边那片殷红的血迹不断扩散，寒气也一阵阵袭来。
