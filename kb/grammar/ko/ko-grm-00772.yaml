title: -고 말다：终究还是……了
structure: 动词 + -고 말다
structure_pattern: V-고 말다
explanation_zh: 补助动词，表示经过某个过程最终出现（多为不如意或不可避免的）结果，相当于中文“终于还是……了”“……到最后”。常与끝내、결국等副词呼应，带有遗憾语气。
examples:
- text: 그 도시의 한복판에서, 가면 없는 남자는 끝내 주저앉고 말았다.
