title: 「-아/어 버리다：彻底完成（보조용언）」
structure: 동사 어간 + '-아/어' + 보조용언 '버리다' + 선어말어미 '-겠-' + 종결어미 '-어'
structure_pattern: V + -아/어 버리다 + -겠-
explanation_zh: 버리다 作보조용언，表示动作被彻底做完，常含如释重负或遗憾的语气。此处再叠加表意志的先末词尾 -겠-，强烈宣示说话者的决心。对应中文的“干脆……掉／完”。
