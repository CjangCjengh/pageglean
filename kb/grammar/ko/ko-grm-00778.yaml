id: ko-grm-00778
language: ko
type: grammar
level: TOPIK3
level_rank: 3
title: 「-ㄴ/는 듯：比喻与推测（의존명사 듯）」
structure: 용언 어간 + 관형사형 어미 '-ㄴ/는' + 의존명사 '듯'
structure_pattern: V/A + -ㄴ/는 듯
explanation_zh: 의존명사 듯 表示比喻或推测：过去接 -ㄴ 듯，现在或持续状态接 -는 듯。“찌는 듯한 더위” 以 -는 듯 构成比喻，“긴장한
  듯” 以 -ㄴ 듯 表示推测。相当于中文的“好像……”。
examples:
