title: 「-아/어 보다：尝试与经历」
structure: 动词词干 + 연결어미 -아/어 + 보조 용언 '보다'
structure_pattern: V-아/어 + 보다
explanation_zh: 学校文法视为连接词尾 -아/어 接补助动词 보다 的结构，表示尝试做某事或获得某种经历，相当于「试着……」「……过」。过去时用 -아/어
  보았다，片段中还搭配 -기도 하다 表示「也曾……」。是韩语表达体验与尝试的核心结构。
examples:
- text: 시골 축제에도 나서 보았고, 제법 큰 도시도 돌아다녀 보았고
  reading: ''
