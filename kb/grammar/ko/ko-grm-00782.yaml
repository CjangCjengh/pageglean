title: 「-(으)ㄹ 것이다：推测与展望」
structure: 谓词词干 + 관형사형 전성어미 -(으)ㄹ + 의존명사 '것' + 서술격 조사 '이다'
structure_pattern: V/A-(으)ㄹ + 것이다
explanation_zh: 由冠形词形转成词尾 -(으)ㄹ 修饰依存名词 것，再加叙述格调查 이다 构成，表示对情况的推测或展望，相当于「会……」「应该会……」。口语中常说成
  -(으)ㄹ 거다/거야。片段中多次用于说话人的自我推测。
examples:
- text: 최근 몇 달 사이 부대낀 사람들이 훨씬 더 많을 것이다.
  reading: ''
