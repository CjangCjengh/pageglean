title: 「-는커녕」：别说……，反而……
structure: 동사·형용사 어간 + 연결어미 -는커녕
structure_pattern: V/A-는커녕
explanation_zh: 连接词尾 -는커녕 表示后句与前句的期待完全相反，即「非但没能……反而……」；体言后则用 -은/는커녕。片段中「距离非但没拉近反而越来越远」是其典型用例。中文近似「别说……，反倒……」。
examples:
- text: 열심히 달려 보아도 거리가 좁혀지기는커녕 점점 멀어지자 초조해진 탓이다.
  reading: ''
  annot: 열심히 달려 보아도 거리가 좁혀지기는커녕 점점 멀어지자 초조해진 탓이다.
  translation_zh: 尽管拼命奔跑，距离非但没有拉近反而越来越远，这才让人焦急起来。
