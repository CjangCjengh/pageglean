title: -아/어 두다：结果状态的保留
structure: 动词 + 보조동사 두다（-아/어 두다 补助动词构成）
structure_pattern: V-아/어 + 두다
explanation_zh: 补助动词，表示某动作完成后其结果状态被保留下来，相当于汉语的“……着／……好”。与 -아/어 놓다 意义相近，두다 更侧重状态的维持。文中“창문을
  모두 열어 둔 방”即“窗户全都开着的房间”。
examples:
- text: 창문을 모두 열어 둔 방에서 하루 종일 뒹굴뒹굴하거나
  reading: ''
