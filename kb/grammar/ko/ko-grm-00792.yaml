title: -아/어 보다 与 -아/어 본 적 있다/없다：尝试与经历
structure: 动词 + 보조동사 보다；-아/어 본 적 + 있다/없다（의존명사 적）
structure_pattern: V-아/어 + 보다 + -ㄴ 적 있다/없다
explanation_zh: 补助动词 보다 表示尝试或经历某动作，“해 보다”即“试着做／做过”。与依存名词 적 搭配的“-아/어 본 적 있다/없다”表示有无某种经历。片段反复用此结构强调“第一次体验”。
