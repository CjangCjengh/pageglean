title: -(으)ㄹ 정도로：达到……的程度
structure: 用言冠形形 -(으)ㄹ + 의존명사 정도 + 부사격 조사 로
structure_pattern: V/A + -(으)ㄹ 정도로
explanation_zh: 依存名词 정도（程度）与助词 로 结合，接在用言冠形形之后，表示达到某种程度，相当于“到……的地步”。文中用以形容沙滩晒得“光脚踩下去都会烫”的程度。
examples:
- text: 맨발로 딛기에 뜨거울 정도로 달궈진 하얀 모래사장을 밟고 일렬로 서서
