title: -아/어 본 적 있다/없다：有没有过某种经历
structure: V-아/어(경험의 보조 동사 '보다') + 관형사형 전성어미 '-(으)ㄴ' + 의존명사 '적' + 있다/없다
structure_pattern: V-아/어 보다 + -(으)ㄴ 적 있다/없다
explanation_zh: 由经验补助动词 -아/어 보다 的冠词形 -(으)ㄴ 修饰依存名词 적，再加 있다/없다，表示有无某种经历，相当于中文「……过/没……过」。是口语中询问、陈述经历的典型结构，本片段多次出现。过去时制先语末词尾
  -았/었- 可插入其后（如 해 봤다）。
examples:
