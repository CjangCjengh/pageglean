title: -잖아：「不是……嘛」（提示显而易见的事实或理由）
structure: 종결어미 '-잖아'（'-지 않아'의 축약형, 해체/반말）
structure_pattern: V/Adj-잖아 (← -지 않다)
explanation_zh: 终结词尾 -잖아 是 -지 않아 的缩略，用于平语（해체）对话，向对方提示双方已知或显而易见的事实、理由，相当于中文「不是……嘛」「不是不能……吗」。语感比
  -잖아 요 更随意，是口语体小说对话的标志性表达，本片段出现三次。
examples:
- text: 그렇지만 공주님이 수영복 차림으로 사람 많은 바닷가를 활보할 수는 없잖아?
  reading: ''
