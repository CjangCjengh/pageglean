title: 「敬语阶位：-시-、-ㅂ니다、-드리다」
structure: 선어말어미 '-시-'（주체높임）+ 존댓말 종결어미 '-ㅂ니다'；보조동사 '-아/어 드리다'（객체높임）
structure_pattern: V/A + -시- + -ㅂ니다 / V + -아/어 드리다
explanation_zh: 韩语依说话者与听话者的关系选择敬语阶位：先语末词尾‘-시-’抬高主语，‘-ㅂ니다’是正式礼貌阶终结词尾，‘-드리다’是‘주다’的谦敬形式。本段中约娜始终使用敬语，与叙述者及少女们的半语形成对照，凸显其认真性格。
examples:
