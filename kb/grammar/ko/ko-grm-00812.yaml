title: 〜고 말다：终究……（结果与遗憾）
structure: 动词词干 + -고 말다（表终究/最终发生，多含遗憾、后悔）
structure_pattern: 용언 + -고 말다 (연결어미 -고 + 보조동사 '말다')
explanation_zh: '''-고 말다''接在动词后，表示动作最终不可避免地发生，多带遗憾、后悔或强调''终究……''的语气。过去时用''-고 말았다''。文中''부르…오고
  말았으니''''늦고 말았다''都强调事已至此、无法挽回。'
examples:
- text: 이미 돌이킬 수 없는 결과를 불러오고 말았으니―
