  pointer: null
- text: 거울 미로의 책임자로 보이는 남자는 내 죄를 사해 주기로 했다.
  reading: ''
  annot: 거울 미로의 책임자로 보이는 남자는 내 죄를 사해 주기로 했다.
  translation_zh: 那位像是镜子迷宫负责人的男人，决定宽恕我的罪过。
