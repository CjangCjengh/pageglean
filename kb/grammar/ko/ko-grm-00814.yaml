title: 〜기로 하다：决定做……（决意）
structure: 动词词干 + -기로 하다（表决定、约定，'决定做……'）
structure_pattern: 동사 어간 + 연결어미 -기로 + 하다 (결심·결정)
explanation_zh: '''-기로 하다''接在动词词干后，表示做出决定或下定决心，相当于''决定做……''。是表达决定、约定的典型句型，主语为第一人称时表自己的决定。文中''사용하기로
  했다''''사해 주기로 했다''都表示做出了决定。'
examples:
- text: 결국 나는 마법을 사용하기로 했다.
  reading: ''
  annot: 결국 나는 마법을 사용하기로 했다.
  translation_zh: 最终，我决定使用魔法。
