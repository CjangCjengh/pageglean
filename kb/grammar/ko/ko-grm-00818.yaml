  pointer: null
- text: 스트레이트가 아니라 스트레스라고 고쳐 주고 싶지만, 입을 다문다.
  reading: ''
  annot: 스트레이트가 아니라 스트레스라고 고쳐 주고 싶지만, 입을 다문다.
  translation_zh: 很想帮他纠正说不是"straight"而是"stress"，但我还是闭上了嘴。
