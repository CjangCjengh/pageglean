title: -아/어 버리다：彻底做完、干脆除掉（补助动词）
structure: 동사 어간 + -아/어 버리다
structure_pattern: 본용언(동사) + 연결어미 -아/어 + 보조동사 버리다
explanation_zh: 补助动词 버리다 表示动作彻底完成或把某物处置掉，常带"干脆……掉"的语感。片段中与 없애다/치우다 反复连用，强调主人公要彻底除掉硬币的决心。
