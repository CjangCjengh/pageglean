title: -시-：主体尊敬先词尾
structure: 동사 어간 + -시- + 어미
structure_pattern: 선어말어미 -시- + 종결어미/연결어미
explanation_zh: -시- 是表示主体尊敬的先词尾，插入在词干与词尾之间以抬高动作的主体。片段中用于抬高魔王与领主（터뜨려 주시고、지셨다는、때우셔야），其中对魔王的使用带有调侃语气。注意与尊敬格词尾
  께（에게 的敬语形）呼应。
examples:
