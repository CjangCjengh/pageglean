title: 「-며：伴随与同时进行」
structure: 动词词干 + -며（연결어미，'-면서'의 준말）
structure_pattern: V-며 (= -면서)
explanation_zh: 连接词尾 -며 是 -면서 的缩略形，表示两个动作或状态同时进行，相当于“一边……一边”，或前句作为后句的伴随状况。多用于书面叙述，本片段多处出现。口语中一般用
  -면서。
