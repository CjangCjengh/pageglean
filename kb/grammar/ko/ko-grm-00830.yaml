title: 「-(으)려다가：正想……却」
structure: 动词词干 + -(으)려다가（'-려고 하다가'의 준말）
structure_pattern: V-(으)려고 하다가 → -(으)려다가
explanation_zh: -(으)려고 하다가 的缩略，表示正要或正打算做某事时，中途发生了转折或中断，后句常出现与预期相反的结果。片段中“想挣断丝线却挣不断”“下意识想后退”均属此用法。
examples:
- text: 당황한 나는 힘으로 끊어내려 했지만, 실은 살갗을 파고들 뿐, 쉽게 끊어지지 않았다.
  reading: ''
  annot: 당황한 나는 힘으로 끊어내려 했지만, 실은 살갗을 파고들 뿐, 쉽게 끊어지지 않았다.
  translation_zh: 慌乱的我想要用力把它挣断，可丝线只是往皮肉里钻，轻易断不了。
