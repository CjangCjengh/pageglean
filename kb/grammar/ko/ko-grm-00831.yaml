title: 「-아/어 내다：做到底、使脱离」
structure: 动词词干 + -아/어 + 내다（보조용언）
structure_pattern: V-아/어 + 내다
explanation_zh: 补助动词结构，表示动作坚持进行到底并取得结果，强调“完成、达成”，常含用力使某物由内向外脱离的意味。片段中 뜯어내다、끊어내다、잘라
  내다 均表示用力掀开、挣断、斩开。
examples:
- text: 나는 브룬의 힘으로 부서진 바닥을 뜯어내어, 브룬을 향해 내던졌다.
