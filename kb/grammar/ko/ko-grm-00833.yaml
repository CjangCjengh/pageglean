  pointer: null
- text: 이명이 가시고, 여름의 풀벌레 소리가 희미하게 들리기 시작했을 무렵에야 나는 깨달았다.
  reading: ''
  annot: 이명이 가시고, 여름의 풀벌레 소리가 희미하게 들리기 시작했을 무렵에야 나는 깨달았다.
  translation_zh: 直到耳鸣消退、夏日的虫鸣开始隐约入耳时，我才察觉到。
