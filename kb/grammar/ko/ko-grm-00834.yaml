title: -든 … -든：无论哪种选择
structure: 用言词干 -든(지) … -든(지)（让步选择连接词尾）
structure_pattern: V-든 + V-든
explanation_zh: 连接词尾 -든(지) 前后并列，表示无论选择哪一项，后句结论都不受影响，“不管……还是……”。어쨌든 由 어찌하든 缩略而来，已固化为副词“反正、无论如何”。常与
  간에 搭配，加强让步语气。
examples:
- text: 브룬이 이겼든 내가 이겼든, 어쨌든 간에.
  reading: ''
  annot: 브룬이 이겼든 내가 이겼든, 어쨌든 간에.
  translation_zh: 不管是布伦赢了，还是我赢了，反正——
