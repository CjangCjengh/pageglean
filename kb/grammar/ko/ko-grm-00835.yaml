title: -(으)ㄴ 채：维持原状
structure: 用言词干 -(으)ㄴ + 依存名词 채(로)
structure_pattern: V-(으)ㄴ + 채
explanation_zh: 冠形词尾 -(으)ㄴ 修饰依存名词 채，表示保持前一状态进入后续动作或局面，“保持着……、……着（的状态）”。强调状态原样维持、未加改变。文中“이명만을
  남긴 채”即“只留下耳鸣（的状态下），轰鸣便消散了”。
examples:
- text: 주변에 먼지가 흩날리고, 거대한 굉음은 이명만을 남긴 채 다시 침묵이 내려앉았다.
  reading: ''
  annot: 주변에 먼지가 흩날리고, 거대한 굉음은 이명만을 남긴 채 다시 침묵이 내려앉았다.
  translation_zh: 四周尘土飞扬，巨大的轰鸣只留下耳鸣，四周便重归沉寂。
