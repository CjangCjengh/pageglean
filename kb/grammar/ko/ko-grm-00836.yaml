title: -(이)라도：举极端例子让步
structure: 体言 + 补助词 (이)라도
structure_pattern: N-(이)라도
explanation_zh: 补助词 라도 接在名词（体言）后，举出一个极端或非理想的例子进行让步，“哪怕是……也、就算……也”。文中“놀이라도 하는 것처럼”即“就好像哪怕是在玩游戏似的”。与
  부사 차라리 呼应时表达“宁可……（也好）”的取舍。
examples:
- text: 즐거운 놀이라도 하는 것처럼 브룬이 활짝 웃으며 말했다.
  reading: ''
  annot: 즐거운 놀이라도 하는 것처럼 브룬이 활짝 웃으며 말했다.
