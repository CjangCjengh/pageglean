title: 「-지 않아도 되다：不必……」
structure: 용언 어간 + 부정 보조사 '지' + 연결어미 '-아/어도' + 보조용언 '되다'
structure_pattern: V/A + -지 않아도 되다
explanation_zh: 否定形 -지 않다 与让步连接词尾 -아/어도 再结合补助动词 되다，表示没有必要做某事，相当于中文“不必……”“不用……”。与“더
  이상”连用时强调“再也不必”。片段中约娜说“해치지 않아도 되니까”，表达如释重负之感。
examples:
- text: 이제 더 이상 사람을…… 해치지 않아도 되니까…….
