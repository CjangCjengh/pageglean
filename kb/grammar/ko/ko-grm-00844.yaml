id: ko-grm-00844
language: ko
type: grammar
level: TOPIK2
level_rank: 2
title: 「-아/어 있다：结果状态的持续」
structure: 동사 어간 + 연결어미 '-아/어' + 보조용언 '있다'
structure_pattern: V + -아/어 있다
explanation_zh: -아/어 后接补助动词 있다，表示动作完成后其结果状态仍在持续，相当于中文“（已经）……着”。它与强调动作进行的 -고 있다 不同，着眼于状态的存续。片段中“각인되어
  있었다”“원상 복구되어 있었다”反复出现，描写事件过后遗留的状态。
examples:
- text: 이 감촉만은 어제의 일처럼 생생하게 손 안에 각인되어 있었다.
