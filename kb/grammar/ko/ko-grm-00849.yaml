title: -시-：主体尊敬先语末词尾
structure: 谓词词干 + 선어말어미 -시-（先语末词尾，주체높임／主体尊敬）+ 词尾
structure_pattern: V/A + -시-
explanation_zh: 主体尊敬先语末词尾 -시- 插于谓词词干与终结/连接词尾之间，表示尊敬动作或状态的主体，是韩语敬语体系的核心。片段里女仆约娜对主人全程使用尊敬形，如“싫으신”“필요하시다면”。与之呼应，名词加
  님、主语用 께서 等。
