title: แล้ว：动作完成
structure: กริยา/วิเศษณ์ + แล้ว (คำช่วยกริยาบอกความสำเร็จ)
structure_pattern: V + แล้ว
explanation_zh: แล้ว放在动词或形容词之后作助动词，表示动作已经完成或状态已经出现，相当于汉语的“已经……了”。片段中“บอกแล้ว”即“已经说过了”，“ใส่แล้ว”指“穿过的（衣服）”。句末的แล้ว还带有确认语气。
