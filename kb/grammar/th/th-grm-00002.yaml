id: th-grm-00002
language: th
type: grammar
level: L2
level_rank: 2
title: ที่：名词后的定语从句
structure: นาม + ที่ + อนุประโยค (คำสรรพนามเชื่อมความ ส่วนขยายตามหลังนาม)
structure_pattern: N + ที่ + clause
explanation_zh: ที่相当于汉语的“……的”，引导定语从句修饰前面的名词；泰语的定语一律后置，从句跟在名词之后。片段里描写人物、头发、衣物的长定语都由ที่引出，是书面泰语中最高频的结构之一。
examples:
- text: เธอ​คน​นี้​เป็น​เด็กผู้หญิง​ที่​ผม​รับ​มา​ดูแล​ชั่วคราว​ด้วย​เหตุผล​บางอย่าง
