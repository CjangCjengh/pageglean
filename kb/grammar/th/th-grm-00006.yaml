id: th-grm-00006
language: th
type: grammar
level: L3
level_rank: 3
title: 动词 + ขึ้น/ลง + มา/ไป：趋向补语
structure: กริยาหลัก + ขึ้น/ลง/เข้า/ออก + มา/ไป (คำช่วยกริยาบอกทิศทาง)
structure_pattern: V + (ขึ้น|ลง|ออก|เข้า) + (มา|ไป)
explanation_zh: 泰语在主要动词后加趋向动词作补语：ขึ้น/ลง表示向上、向下的方向，มา/ไป表示朝向或远离说话者。如“ขึ้นมา”＝“向上＋朝说话者”，“ลงไป”＝“向下＋远离说话者”。片段中“ยกขึ้นมา”“ใส่ลงไป”“อุ้มขึ้นมา”等反复出现，是该结构的密集用例。
