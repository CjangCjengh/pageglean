id: th-grm-00009
language: th
type: grammar
level: L1
level_rank: 1
title: ครับ：男性礼貌句尾助词
structure: ประโยค + ครับ (คำอุทานท้ายประโยคแสดงความสุภาพ)
structure_pattern: S + ครับ
explanation_zh: ครับ 是男性说话者用于句尾的礼貌助词（女性对应 ค่ะ），使语气恭敬客气。它既可接在完整句子之后，也可接在称呼语之后。在正式场合或对长辈、上级说话时一般不省略。
examples:
- text: คุณร​ชา​นนท์​ครับ วันนี้​รบกวน​ส่ง​บทความ 4 หน้า​ก่อน 6 โมง​เย็น​ด้วย​นะ​ครับ
  reading: ''
