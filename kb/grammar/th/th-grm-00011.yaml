id: th-grm-00011
language: th
type: grammar
level: L1
level_rank: 1
title: ว่า：引接内容从句的连词
structure: กริยา + ว่า + อนุประโยค (คำสันธานเชื่อมความ)
structure_pattern: V(คิด/ถาม/พบ/บอก) + ว่า + clause
explanation_zh: ว่า 是连接动词与其内容从句的连词（คำสันธานเชื่อมความ），用在คิด、ถาม、พบ、บอก 等言说、认知动词之后，相当于中文的「想（……）、问（……）、发现（……）」。本片段ถามว่า、คิดว่า、พบว่า
  反复出现，是叙述文的标志性结构。阅读长句时可先定位ว่า，再划分主句动词与从句内容。
examples:
- text: ถ้า​จะ​ถาม​ว่าความ​สัมพันธ์​ของ​ผม​กับ​เด็กผู้หญิง​ตัวเล็ก ๆ คน​นี้​เป็น​ยัง​ไง​น่ะ​เหรอ
