title: 连动式与趋向补语：动词 + ขึ้นมา/มา/ไป
structure: กริยาหลัก + กริยาเสริมบอกทิศทาง (ขึ้นมา/ออก…ไป/มา)
structure_pattern: V + ขึ้นมา/มา/ไป (+ V2)
explanation_zh: 泰语多用连动式（กริยาซ้อน）：主要动词后接表示趋向的补充动词，如ขึ้นมา（向上朝说话者移动）、ออก…ไป（向外离开）。还可继续串联后续动作，如อุ้ม…ขึ้นมาถือไว้（抱起……拿着）。มา
  表示朝向说话者、ไป 表示远离，方向标记比中文趋向补语更强制。
examples:
- text: อุ้ม​ตะกร้า​หวาย​ขึ้น​มา​ถือ​ไว้​ด้วย​สอง​มือ​ก่อน​จะ​เดิน​ออก​จาก​ห้องทำงาน​ของ​ผม​ไป
