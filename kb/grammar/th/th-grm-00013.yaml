id: th-grm-00013
language: th
type: grammar
level: L2
level_rank: 2
title: ได้ + 动词：过去／完成体标记
structure: ได้（คำกริยาช่วย，过去体助动词）+ V
structure_pattern: ได้ + V
explanation_zh: ได้ 置于主要动词之前，表示动作已经发生或完成，相当于汉语的“了／过”，属学校语法中的助动词（คำกริยาช่วย）表过去。与口语中常省略体标记相比，用
  ได้ 的叙述显得更书面、更正式。片段中“ผมได้ซื้อบ้าน”即“我买了一栋房子”。
examples:
- text: ผม​ได้​ซื้อ​บ้านเล็ก ๆ และ​ย้าย​มา​อยู่​บน​เกาะ​ล้าน​แห่ง​นี้​เพียงลำพัง
