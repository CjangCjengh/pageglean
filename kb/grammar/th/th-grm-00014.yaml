id: th-grm-00014
language: th
type: grammar
level: L2
level_rank: 2
title: ที่：关系代词，修饰语后置
structure: ที่（ประพันธสรรพนาม）：中心语 + ที่ + 修饰语／从句
structure_pattern: N + ที่ + modifier
explanation_zh: ที่ 是关系代词（ประพันธสรรพนาม），把后置的修饰语或从句连接到中心名词上，可译为“……的”。泰语修饰语后置，“疲惫的样子”要说成
  สภาพที่เหนื่อยล้า。它还可引导时间从句，如 ตอนที่ยังเป็นเด็ก“还是孩子的时候”，片段中出现多达六次。
examples:
- text: ผม​เป็น​เด็ก​ที่​ค่อนข้าง​เงียบ ๆ ไม่ค่อย​หา​เพื่อน​วัย​เดียวกัน​ออกไป​เล่นตาม​ประสา​เด็ก​เท่าไร​นัก
  reading: ''
  annot: ผม​เป็น​เด็ก​ที่​ค่อนข้าง​เงียบ ๆ ไม่ค่อย​หา​เพื่อน​วัย​เดียวกัน​ออกไป​เล่นตาม​ประสา​เด็ก​เท่าไร​นัก
