id: th-grm-00015
language: th
type: grammar
level: L2
level_rank: 2
title: ไม่…เลย：彻底否定「根本不……」
structure: ปฏิเสธ + เน้น：ไม่ + V/Adj + (อะไร) + เลย (+ แม้แต่…)
structure_pattern: ไม่ + V + เลย
explanation_zh: เลย 用于否定句句末加强否定语气，相当于“根本（不）、一点也（不）”。可与 อะไร 等疑问代词连用，如 ไม่พูดอะไรอีกเลย“再也没说什么”。与
  แม้แต่“连”搭配时，表示“甚至连……都……”。
examples:
