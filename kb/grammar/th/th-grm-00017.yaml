id: th-grm-00017
language: th
type: grammar
level: L3
level_rank: 3
title: การ / ความ + 动词、形容词：名词化
structure: อุปสรรค：การ + V ／ ความ + Adj/V → 名词短语
structure_pattern: การ/ความ + V/Adj
explanation_zh: การ 和 ความ 是学校语法中列于“อุปสรรค（名词化前缀）”的两个标记：การ 多接动词，ความ 多接形容词或心理动词，构成抽象名词。如
  การอ่านหนังสือ“读书这件事”、ความเป็นคนพูดไม่เก่ง“不善言辞这一点”。名词化后可充当主语、宾语或介词宾语。
examples:
