title: 连动式：动词连用与趋向
structure: กริยาเรียง（连动式）：V1 + (มา/ไป) + V2，无连词
structure_pattern: V1 + V2 (+ V3)
explanation_zh: 泰语常把多个动词直接连用（กริยาเรียง），词序与事件发生或位移的先后一致，中间不用连词。如 ย้ายมาอยู่“搬来住”、ออกไปเล่น“出去玩”。มา/ไป
  表示趋向，相当于汉语的“来／去”，โตขึ้นมา 即“长大起来”。
