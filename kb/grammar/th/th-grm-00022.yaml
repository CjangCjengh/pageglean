title: ทำให้+小句：使役结构「使／让……」
structure: ประธาน（主语）+ ทำให้ + กรรม（宾语）+ คำกริยา/คำวิเศษณ์（动词/形容词作补语）
structure_pattern: ประธาน + ทำให้ + กรรม + กริยา/วิเศษณ์
explanation_zh: ทำให้是使役结构：ประธาน（主语）+ ทำให้ + กรรม（宾语）+ กริยา/วิเศษณ์（补语），相当于中文“使／让……”。补语说明宾语产生的变化或结果，如ทำให้เราสองคนคุยกันมากขึ้น（使我们俩聊得更多）。可与ที่连用（…ที่ทำให้…）强调原因，常见于叙事。
examples:
- text: และ​นั่นก็​ทำให้​เรื่องราว​ของ​หนังสือ​ต่าง ๆ ได้​กลาย​มา​เป็นหัวข้อ
