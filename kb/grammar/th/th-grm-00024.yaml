title: ไม่ค่อย+动词：部分否定「不太……」
structure: ไม่（否定词）+ ค่อย（คำวิเศษณ์，限用于否定句）+ คำกริยา（动词）
structure_pattern: ไม่ + ค่อย + คำกริยา
explanation_zh: ค่อย是程度副词，表示程度轻，但几乎只用于否定句；ไม่ค่อย+动词/形容词表示“不太……、不怎么……”，属于部分否定。如รับไม่ค่อยได้＝“不太能接受”。它与完全否定ไม่ได้（没有／不能）形成对照，是中文母语者易忽略的细微差别。
examples:
- text: ในใจ​ตอนนั้น​มัน​จะ​รับ​ไม่ค่อย​ได้
