id: th-grm-00026
language: th
type: grammar
level: L2
level_rank: 2
title: 连动式（คำกริยาเรียง）：多动词连用表先后与目的
structure: คำกริยาเรียง（动词连用）：กริยา1 + กลับ/ไป/มา + กริยา2，不用连词，语序即动作顺序
structure_pattern: คำกริยา 1 + กลับไป/ไป + คำกริยา 2
explanation_zh: 泰语是分析语，多个คำกริยา（动词）可以直接连用而无需连词，构成คำกริยาเรียง（连动式），语序反映动作的先后或目的关系。如ย้ายกลับไปทำงาน＝搬→回去→工作。方向动词กลับ/ไป/มา常插在两个动作之间起衔接作用。
examples:
