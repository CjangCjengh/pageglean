id: th-grm-00028
language: th
type: grammar
level: L3
level_rank: 3
title: ถูก＋动词：被动句
structure: 受事主语 + ถูก + 动词（+ 施事）
structure_pattern: NP(受事) + ถูก + V
explanation_zh: 「ถูก + 动词」构成被动句，主语是动作的承受者，即传统文法所说的กรรมวาจก（被动语态）。ถูก 字句多用于不如意或非企盼的事情，此处指邮件“被发送来”。近义词โดน构成的被动更口语化。
examples:
- text: อีเมล​ฉบับ​หนึ่ง​ที่​ถูก​ส่ง​มา​เมื่อวาน​ตอนเย็น​อยู่​ใน​กล่อง​จดหมาย​ที่​ยัง​ไม่ได้​เปิด​อ่าน
  reading: ''
