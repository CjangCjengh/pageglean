title: ยังไม่ได้…：还没有……
structure: ยังไม่ได้ + 动词
structure_pattern: ยัง + ไม่ได้ + V
explanation_zh: 「ยังไม่ได้ + 动词」表示“还没有做某事”，强调动作到目前为止尚未实现。ได้ 表示动作的实现，被ยัง（还）否定后即“尚未”。与ไม่เคย（从未）不同，它暗示今后仍会做。
examples:
