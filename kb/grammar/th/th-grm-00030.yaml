id: th-grm-00030
language: th
type: grammar
level: L3
level_rank: 3
title: นึกว่า…ซะอีก：原以为……呢
structure: นึกว่า + 从句（+ ซะอีก）
structure_pattern: นึกว่า + Clause (+ ซะอีก)
explanation_zh: 「นึกว่า + 从句」表示“原以为……”，ว่า 引出宾语从句（ประโยคนามกรรม），且暗示实际情况与所想不同。句末ซะอีก是เสียอีก的口语形式，加强“本以为会如此”的语气。整体相当于中文的“我还以为……呢”。
examples:
- text: นึก​ว่า​จะ​ไม่ทัน​แล้ว​ซะ​อีก​นะ​เนี่ย
