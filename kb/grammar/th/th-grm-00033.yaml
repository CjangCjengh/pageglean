title: ไหม / หรือเปล่า：是非疑问句
structure: 动词/形容词 + ไหม；陈述句 + หรือเปล่า（句末疑问标记）
structure_pattern: คำกริยา/คำวิเศษณ์ + ไหม ; ประโยคบอกเล่า + หรือเปล่า
explanation_zh: 「ไหม」直接接在动词或形容词后构成是非问句，相当于中文的『……吗』。「หรือเปล่า」接在陈述句之后，表示『……还是不是／该不会是……吧』，常带有揣测、怀疑的语气。两者都是泰语句末疑问结构（ประโยคคำถาม）。
