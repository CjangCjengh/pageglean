title: ช่วย…หน่อย/สิ/นะ：请求与祈使语气
structure: ช่วย + 动词 + หน่อย / สิ / นะ（句末助词软化语气）
structure_pattern: ช่วย + คำกริยา + หน่อย/สิ/นะ (คำลงท้าย)
explanation_zh: 「ช่วย + 动词」表示请求对方帮忙做某事。句尾加「หน่อย」软化语气（……一下），加「สิ」带有恳请、催促意味，加「นะ」使语气亲切委婉。这些都是泰语祈使句常见的句末助词（คำลงท้าย）。
