title: 连动式与趋向动词：กลับมา / ขึ้นมา
structure: 动词1 + กลับ/ขึ้น/ลง + มา/ไป + 动词2（动作 → 方向 → 目的）
structure_pattern: คำกริยา + กลับ/ขึ้น/ลง + มา/ไป + คำกริยา (คำกริยาเรียง)
explanation_zh: 泰语连动式（คำกริยาเรียง）发达：主要动词后可接方向动词如 กลับมา（回来）、ขึ้นมา（上来），再接表示目的的第二个动词，形成『动作→方向→目的』的语序。这与中文趋向补语位置相似，但第二个动词放在最后，中文母语者需特别注意。
