title: จะ…ดีไหม：要不要做某事
structure: จะ + 动词 + ดีไหม（自问或商量是否该做某事）
structure_pattern: จะ + V + ดีไหม
explanation_zh: 「จะ」是表示意愿或将来的助动词（泰国学校文法称 คำกริยาช่วย）。「จะ+动词+ดีไหม」用来商量或自问“做……好吗、要不要……”。片段中主角犹豫要不要打电话，正是这种左右为难的用法。
