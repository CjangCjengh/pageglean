title: หรือเปล่า：是非疑问
structure: 陈述句 + หรือเปล่า（构成是非问句）
structure_pattern: S/มี… + หรือเปล่า
explanation_zh: 「หรือเปล่า」附在陈述句后构成是非问句，相当于中文“……吗、是不是……”。与疑问助词 ไหม 相比结构更完整、语气更正式，二者常可互换。片段中的
  “มีอะไรหรือเปล่า?” 即“有什么事吗？”
