title: กำลัง…อยู่：正在进行
structure: กำลัง + 动词 + อยู่（进行体框式结构）
structure_pattern: กำลัง + V + อยู่
explanation_zh: 泰语进行体用框式结构「กำลัง+动词（+อยู่）」，相当于“正在……”；กำลัง 置于动词前，อยู่ 收在句末，两者可单用也可呼应。片段中
  “กำลังพูดอยู่ค่ะ” 是电话用语，表示自己正是对方要找的人。
