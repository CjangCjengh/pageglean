title: ไม่ได้…ตั้ง…แล้ว：已经足足……没……
structure: ไม่ได้ + 动词 + ตั้ง + 时长 + แล้ว（否定＋强调历时）
structure_pattern: ไม่ได้ + V + ตั้ง + 时长 + แล้ว
explanation_zh: 「ไม่ได้+动词」表示该动作没有发生；「ตั้ง」放在数量词前强调“足足、多达”；句末 แล้ว 表示状态延续至今，相当于“已经……了”。片段中表达“已经足足十五年没见面了”。
examples:
