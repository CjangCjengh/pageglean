title: ครับ/ค่ะ/คะ：句末礼貌助词
structure: 句子 + ครับ（男）/ ค่ะ·คะ（女）（คำลงท้ายสุภาพ）
structure_pattern: S + ครับ/ค่ะ/คะ
explanation_zh: 泰语句末礼貌助词按说话人性别选用：男性用 ครับ，女性用 ค่ะ（陈述）和 คะ（疑问）。陈述与提问需换用不同形式，如片段中女方说
  “สวัสดีค่ะ” 与 “ขอสายใครคะ?”，男方则用 “ครับ”。
