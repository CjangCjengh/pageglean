title: กำลังจะ：即将发生的近将来
structure: กำลัง + จะ + 动词（กริยาช่วยบอกกาล）
structure_pattern: กำลัง + จะ + V
explanation_zh: 助动词（กริยาช่วย）กำลัง+จะ表示近将来，意为动作马上就要发生，相当于中文「快要……了」。句末可加语气助词แล้ว强调变化迫近。片段中「กำลังจะตาย(แล้ว)」反复出现，强调情况紧急。
