  source_chapter: null
  pointer: null
- text: รีบ​ทะยาน​ไป​ที่​ท่าเรือ​หน้าบ้าน​เพื่อที่จะ​ออก​เดินทาง​จาก​เกาะ​ล้าน
  reading: ''
  annot: รีบ​ทะยาน​ไป​ที่​ท่าเรือ​หน้าบ้าน​เพื่อที่จะ​ออก​เดินทาง​จาก​เกาะ​ล้าน
  translation_zh: （他）急忙冲向家门前的码头，以便从兰岛出发。
