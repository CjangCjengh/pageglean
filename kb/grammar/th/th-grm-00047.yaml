id: th-grm-00047
language: th
type: grammar
level: L2
level_rank: 2
title: ก่อน(ที่)จะ：先于……的时间从句
structure: ก่อน(ที่)จะ + 动词（วิเศษณานุประโยคบอกเวลา）
structure_pattern: ก่อน(ที่) + จะ + V
explanation_zh: ก่อน(ที่)จะ+动词是时间从句（วิเศษณานุประโยคบอกเวลา），表示「在做某事之前」或一事先于另一事发生，ที่可省略。片段中「ก่อนจะวางสาย」表示说完即挂电话；「ตีตั๋วก่อนที่จะเก็บเสื้อผ้า」则表示先买票、后收拾行李。
examples:
- text: เธอ​ตอบกลับ​มา​เพียง​เท่านั้น​ก่อน​จะ​วางสาย​ไป​ทันที
  reading: ''
  annot: เธอ​ตอบกลับ​มา​เพียง​เท่านั้น​ก่อน​จะ​วางสาย​ไป​ทันที
