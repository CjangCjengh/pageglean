id: th-grm-00048
language: th
type: grammar
level: L3
level_rank: 3
title: ก็：顺承与承接连词
structure: เมื่อ…ก็…；状语 + ก็ + 动词（สันธาน/คำเชื่อม）
structure_pattern: เมื่อ + Clause, … ก็ + V
explanation_zh: ก็是泰语使用频率最高的连接词（สันธาน/คำเชื่อม），表示前后动作、事件的顺承或结果，相当于中文「就、便」。常见框架「เมื่อ…ก็…」连接时间从句与主句；也可紧跟状语，如「ปุบปับก็ตัดบท」。片段大量使用ก็推进叙事，是地道泰语叙述的标志。
examples:
- text: คิด​ยังไง​มันก็​ประหลาด​จริง ๆ นั่น​ล่ะ
