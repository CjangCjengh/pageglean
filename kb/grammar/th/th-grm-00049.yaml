id: th-grm-00049
language: th
type: grammar
level: L4
level_rank: 4
title: V + ให้：结果补语结构
structure: 动词 + ให้ + 结果补语（บทเสริมผล）
structure_pattern: V + ให้ + V/Adj
explanation_zh: 「动词+ให้+结果补语」表示动作达到某种结果或目的，类似中文的结果补语「到、好、成」。「เก็บให้เรียบร้อย」即「收拾整齐」，「รู้ให้ได้」即「一定要弄清楚」。该结构在泰语中极高频，中文母语者需注意补语后置的语序。
examples:
- text: เก็บ​เสื้อผ้า​ข้าวของ​ตัวเอง​ให้​เรียบร้อย
