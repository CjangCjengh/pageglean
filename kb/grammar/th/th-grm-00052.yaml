title: 句末助词 นะ 与 สิ
structure: ประโยค + นะ / สิ
structure_pattern: Clause + นะ / สิ
explanation_zh: นะ置于句末使语气柔和，多用于请求、劝慰或叮嘱，近似中文的「吧／啊」。สิ表示招呼或催促，促使对方行动。「มาทางนี้สิ」是招呼「过来这边」，「ใจเย็น
  ๆ ก่อนนะ」是劝慰「先冷静一下」。
examples:
