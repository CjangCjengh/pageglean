title: V + จน + 结果：……到……的地步
structure: V + จน + 结果/程度补语
structure_pattern: V + จน + ผลลัพธ์
explanation_zh: 「V + จน + 结果」表示动作达到某种结果或程度，相当于「……到……的地步」。「ฟังจนเบื่อแล้ว」即「听到都烦了／听腻了」。结果成分作程度补语，说明前面动作造成的状态。
