id: th-grm-00055
language: th
type: grammar
level: L3
level_rank: 3
title: ฝาก + V + หน่อยได้ไหม：拜托……可以吗
structure: ฝาก + V +（宾语）+ หน่อย + ได้ไหม
structure_pattern: ฝาก + V + NP + หน่อย + ได้ไหม
explanation_zh: ฝาก本义是「托付、寄存」，后接动词表示「拜托对方做某事」。句末的หน่อย使语气柔和，ได้ไหม构成「可以吗」的委婉询问，整句是非常地道的托人句式。片段中是母亲郑重拜托对方照顾自己的女儿。
examples:
- text: ฝาก​ดูแลญาดา​ลูกสาว​ฉัน​หน่อย​ได้​ไหม
