title: อยู่ ๆ …ก็…：突然、无缘无故地
structure: อยู่ ๆ / อยู่ดี ๆ + ก็ + 小句
structure_pattern: อยู่ ๆ + ก็ + ประโยค
explanation_zh: อยู่ ๆ 是副词（คำวิเศษณ์），表示“突然、无缘无故地”，常与 ก็ 呼应，强调事情出乎意料。อยู่ดี ๆ 是其变体，意为“本来好好的，突然就…”。
