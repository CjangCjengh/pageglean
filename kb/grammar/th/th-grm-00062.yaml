id: th-grm-00062
language: th
type: grammar
level: L4
level_rank: 4
title: เกิด + V：「碰巧、竟然（发生）」
structure: เกิด (กริยาวิเศษณ์) + กริยาหลัก — เหตุการณ์ที่เกิดขึ้นโดยไม่คาดคิด
structure_pattern: เกิด + V
explanation_zh: 此处的เกิด不是实义动词「出生」，而是作副词（กริยาวิเศษณ์）置于其他动词前，表示「碰巧、竟然发生～」，强调出乎意料的事发生。片段中เกิดป่วยขึ้นมา（忽然病倒）、เกิดประสบอุบัติเหตุ（竟遭遇车祸）均用此法。口语色彩强，叙事中很常用。
examples:
- text: แต่​บังเอิญ​หนูดา​เกิด​ป่วย​ขึ้น​มา
