title: …ไหม：句末疑问助词「……吗／……知道吗」
structure: ประโยคบอกเล่า + ไหม (คำคำถามท้ายประโยค / คำเสริม)
structure_pattern: Clause + ไหม
explanation_zh: ไหม是句末疑问助词（คำเสริมคำถาม），附加在陈述句后构成征询对方确认或认同的反问，相当于中文「……吗／……知道吗」。语篇中常用เชื่อไหม「你信吗」、รู้ไหม「你知道吗」等固定附加问，常与语气词นะ连用，带有提醒、强调的语气。
examples:
- text: พ่อ​กับ​แม่​ฉัน​โกรธ​มาก​เลย​นะ​เชื่อ​ไหม
