id: th-grm-00066
language: th
type: grammar
level: L2
level_rank: 2
title: 句末语气助词 นะ/ล่ะ/ไหม
structure: ประโยค + นะ / ล่ะ / ไหม (คำลงท้าย)
structure_pattern: ประโยค + (นะ | ล่ะ | ไหม)
explanation_zh: นะ 置于句末，起软化语气、寻求认同或轻微叮嘱的作用，多用于亲密场合。ล่ะ 是 แหละ 的口语体，添加强调或催促回应的语气。ไหม
  是一般疑问助词，可与 ล่ะ 连用为 ใช่ไหมล่ะ「是吧、对吧」。本段为前任间的对话，句末大量出现这些助词，显得亲切而带试探。
examples:
