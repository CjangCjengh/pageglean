id: th-grm-00067
language: th
type: grammar
level: L2
level_rank: 2
title: ยัง(คง)…อยู่：状态的持续「仍然～着」
structure: คำวิเศษณ์ ยัง (＋คง) + คำกริยา/คำวิเศษณ์ + คำวิเศษณ์ อยู่
structure_pattern: ยัง + V/Adj + อยู่
explanation_zh: 泰语中副词 ยัง（还）置于动词或形容词之前、อยู่ 置于其后，构成「ยัง…อยู่」框架，表示状态或动作仍在持续，相当于中文「还～着」。加上
  คง 可加强「依旧、仍然」的语气。该结构在叙述中常用于描写心理状态的持续。
examples:
- text: ผม​ยังคง​งง​อยู่​ว่า​เธอ​พูด​อะไร​กัน​แน่
