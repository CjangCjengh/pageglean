title: ก็เลย：于是、所以（因果承接）
structure: คำสันธาน ก็เลย + คำกริยา (ส่วนผล)
structure_pattern: ก็เลย + VP
explanation_zh: ก็เลย 是口语中表示结果的连词，相当于「于是、所以」，前句说明原因，ก็เลย 引出结果或后续行动，也可单用 เลย。叙述文中高频出现，用于推进情节的因果衔接。
examples:
