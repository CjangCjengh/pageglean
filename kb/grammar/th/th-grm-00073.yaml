id: th-grm-00073
language: th
type: grammar
level: L2
level_rank: 2
title: 句末语气助词：ล่ะ・นะ・เหรอ・แฮะ
structure: ประโยค + คำลงท้าย (ล่ะ/นะ/เหรอ/แฮะ)
structure_pattern: VP + ล่ะ/นะ/เหรอ/แฮะ
explanation_zh: 泰语句末助词用以表达语气与情感色彩：ล่ะ 加强肯定、提示对方注意；นะ 使语气柔和、带有征询或亲昵；เหรอ 表示惊讶与疑问；แฮะ
  流露说话人的轻微惊讶或自嘲。助词本身无实义，却是口语自然度的关键。
