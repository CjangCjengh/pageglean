title: 「อยากให้：想让某人做某事」
structure: อยาก/ไม่อยาก + ให้ + 人 + 动词
structure_pattern: อยาก + ให้ + NP + VP
explanation_zh: อยากให้ 表示“想让某人做某事”，ให้ 引出动作的执行者，其后直接接动词，否定形式是 ไม่อยากให้。这是泰语最常用的使役—意愿句式，相当于中文的“想让/不想让……做……”。
examples:
- text: ฉัน​เลย​ไม่​อยาก​ให้​เธอ​ไป​กับ​ฉัน​ด้วย
