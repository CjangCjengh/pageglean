id: th-grm-00076
language: th
type: grammar
level: L3
level_rank: 3
title: 「V + ให้：使动作达到某种结果」
structure: 动词 + ให้ + 结果（形容词/动词）
structure_pattern: V + ให้ + V/Adj(结果)
explanation_zh: 在动词后加 ให้ 再接形容词或动词，表示动作要达到某种结果，如 รักษาให้หาย 即“治好、治到痊愈”。这与“อยากให้+人+动”不同：此处的
  ให้ 不引出新主语，只引出结果状态。
