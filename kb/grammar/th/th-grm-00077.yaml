id: th-grm-00077
language: th
type: grammar
level: L1
level_rank: 1
title: 「เคย：曾经（经历体）」
structure: เคย + 动词
structure_pattern: เคย + VP
explanation_zh: เคย 放在动词前，表示过去曾有过某种经历，相当于中文“曾经”，否定说 ไม่เคย（从未）。文中“ที่เคยพบเจอมา”即“我曾遇到过的”，句尾的
  มา 表示该经历延续到说话时。
examples:
- text: ผู้ป่วย​โรคมะเร็ง​คน​อื่น ๆ ที่​ผม​เคย​พบเจอ​มา
