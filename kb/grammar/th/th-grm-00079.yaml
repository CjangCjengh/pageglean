title: 「连动式：动词直接连用」
structure: V1 + V2（+ V3）动词连用，无需连词
structure_pattern: V + V (+ V) (连动)
explanation_zh: 泰语可以把几个动词直接连用构成连动式，中间不需要连词。如 กลับมาอยู่ 由“回＋来＋住”叠加，表示回来并住下；พูดออกมา（说出来）也是动词加方向补语的连动结构。
