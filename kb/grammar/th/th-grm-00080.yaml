title: 「名词 + 数词 + 量词：泰语量词结构与后置修饰」
structure: 名词 + 数词 + 量词（如 เด็กผู้หญิง＋หนึ่ง＋คน）
structure_pattern: N + จำนวน + ลักษณะนาม
explanation_zh: 泰语量词短语的语序是"名词＋数词＋量词"，与中文"数词＋量词＋名词"正好相反。如 เด็กผู้หญิงคนหนึ่ง＝เด็กผู้หญิง(女孩)＋หนึ่ง(一)＋คน(人，用于人的量词)，即"一个女孩"。不同名词搭配不同量词，คน
  用于人，หลัง 用于房屋建筑。
