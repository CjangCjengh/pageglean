title: V + ต่อ：动作的继续（续做体）
structure: V + ต่อ
structure_pattern: คำกริยา + ต่อ
explanation_zh: ต่อ 置于动词之后，表示动作继续或重新接续进行，相当于汉语的“继续做～、接着做～”。与汉语语序相反：汉语“继续”在动词前，泰语 ต่อ
  在动词后。片段中多次出现（เดินสำรวจต่อ、นั่งปั่นงานต่อ），是叙事中常见的衔接手段。
examples:
- text: ถัดจาก​เครื่อง​ชงกาแฟ ญาดาก็​เดิน​ไป​สำรวจ​ส่วน​อื่น​ภาย​ใน​บ้าน​ต่อ
