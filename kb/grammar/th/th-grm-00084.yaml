id: th-grm-00084
language: th
type: grammar
level: L2
level_rank: 2
title: V + เป็น：学会、会做（掌握性能力）
structure: V + เป็น (+ 宾语)
structure_pattern: คำกริยา + เป็น (ทำได้/ชำนาญ)
explanation_zh: เป็น 作助动词置于动词之后，表示经过学习而掌握、会做某事，如 ใช้เครื่องซักผ้าเป็น（会用洗衣机）、ทำอาหารเป็น（会做饭）。它与后置
  ได้ 的细微差别（เป็น 强调掌握，ได้ 强调当下能否做到）是中文母语者的常见难点。
examples:
- text: เด็ก​อายุ 12 ปี สามารถ​ใช้​เครื่อง​ซักผ้า​เป็น​ตั้งแต่​ครั้งแรก​เลย
