title: พอ…ก็… 与 หลังจากที่…แล้ว：时间小句
structure: พอ + V，(S) + ก็ + V；หลังจากที่ + S+V + แล้ว，S + ก็ + V
structure_pattern: พอ + คำกริยา , ประธาน + ก็ + คำกริยา | หลังจากที่ + ประโยค + แล้ว
  , ประธาน + ก็ + คำกริยา
explanation_zh: พอ + 动词 表示“刚一……就……”，主句常用 ก็ 呼应，强调两个动作紧接发生。หลังจากที่…แล้ว 表示“在……之后”，แล้ว
  位于小句末尾标记完成。两者在学校文法中都属于时间อนุประโยค（时间从句）结构。
