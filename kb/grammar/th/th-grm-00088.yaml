title: เดี๋ยว + 动词：马上就……
structure: เดี๋ยว（时间副词 กริยาวิเศษณ์บอกเวลา）+ กริยา（表即将发生）
structure_pattern: เดี๋ยว + V
explanation_zh: เดี๋ยว是时间副词，放在动词前表示动作很快就会发生，相当于“马上、一会儿就……”，比 จะ 更口语化，强调短时间内发生。固定说法
  เดี๋ยวก่อน 意为“等一下”。
