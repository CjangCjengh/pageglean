id: th-grm-00089
language: th
type: grammar
level: L2
level_rank: 2
title: กำลัง…อยู่：正在进行的动作
structure: กำลัง + คำกริยา + อยู่（กาลปัจจุบัน อาการกำลังดำเนินอยู่）
structure_pattern: กำลัง + คำกริยา + อยู่
explanation_zh: 「กำลัง…อยู่」相当于汉语“正在……”，表示动作或状态正在进行：กำลัง 置于动词前，อยู่ 常在句末呼应，二者可省略其一。片段中既描写心理状态（งง
  发懵），也描写具体动作（นั่งทำงาน 坐着工作）。
examples:
- text: บน​โต๊ะ​ที่​ผม​กำลัง​นั่ง​ทำงาน​อยู่
