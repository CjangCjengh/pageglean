title: ที่：引导名词的关系从句（修饰语后置）
structure: คำนาม + ที่ + อนุประโยคขยาย（คำเชื่อมความ）
structure_pattern: นาม + ที่ + ประโยคย่อย
explanation_zh: ที่ 相当于汉语“……的”、英语 that/which，引导小句后置修饰名词，是泰语“修饰语后置”的典型手段。片段中用它修饰“奇怪的名字”“我正坐着的桌子”“她提到的饭菜”等多个名词。
