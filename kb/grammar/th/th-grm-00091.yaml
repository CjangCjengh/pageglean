title: ทั้ง…และ…：既……又……
structure: ทั้ง + A + และ + B（คำสันธานเชื่อมความเพิ่ม）
structure_pattern: ทั้ง + คำ + และ + คำ
explanation_zh: 「ทั้ง…และ…」是并列连词（คำสันธาน），相当于“……和……（都）”“既……又……”。片段中指食材同时从储物柜和冰箱里拿出来。所连接的成分可以是名词、动词或形容词。
examples:
- text: ออกมา​จาก​ทั้ง​ตู้​เก็บ​ของ​และ​ตู้เย็น
