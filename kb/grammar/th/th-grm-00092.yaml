id: th-grm-00092
language: th
type: grammar
level: L3
level_rank: 3
title: 动词 + ออก/มา/ขึ้น：方向补语连动式
structure: คำกริยาหลัก + คำวิเศษณ์บอกทิศทาง（ออก/มา/ขึ้น）
structure_pattern: คำกริยา + ออกมา/ขึ้นมา/มา
explanation_zh: 泰语把 ออก（出）、มา（来）、ขึ้น（上）等方向词放在主要动词后作补语，构成连动式，类似汉语“说出来”“抱出来”“飘过来”。方向补语可以叠加，如“เป็นรูปเป็นร่างขึ้นมา（成形起来）”。这是泰语中心语在前、补语在后的典型语序。
examples:
- text: กลิ่น​หอม ๆ ของ​ครีม​สีขาว​ข้น​ใน​หม้อ​ใบ​เล็ก​ลอย​มา​เตะจมูก
