title: อย่าง + 形容词：方式状语“……地”
structure: คำกริยา + อย่าง + คำวิเศษณ์（วิเศษณ์บอกลักษณะ）
structure_pattern: คำกริยา + อย่าง + คำวิเศษณ์
explanation_zh: 「อย่าง＋形容词」置于动词之后作方式状语，相当于汉语“……地”，如“流畅地进行”“迅速地成形”。泰语方式状语一般位于动词之后，体现修饰语后置的语序特点。
