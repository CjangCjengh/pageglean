id: th-grm-00094
language: th
type: grammar
level: L3
level_rank: 3
title: การ-/ความ-：动词与形容词的名词化
structure: การ-/ความ- + คำกริยาหรือคำวิเศษณ์ → คำนาม
structure_pattern: การ/ความ + คำกริยา|วิเศษณ์ → คำนาม
explanation_zh: การ- 加在动词前使其名词化，表示“……这件事/行为”；ความ- 加在形容词或心理动词前构成抽象名词，相当于汉语“……性/……的习惯”。片段中“การทำอาหาร（做菜）”“การเคลื่อนไหว（动作）”“ความเคยชิน（习惯）”“ความคล่องแคล่ว（麻利）”反复出现。
examples:
- text: ไม่มี​การ​เคลื่อนไหว​ส่วน​ใด​ที่​เสียเปล่า​เลย​แม้แต่​น้อย
