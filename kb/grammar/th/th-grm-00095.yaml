id: th-grm-00095
language: th
type: grammar
level: L4
level_rank: 4
title: คง…มั้ง：不确定的推测
structure: คง + ประโยค + มั้ง（คำวิเศษณ์คาดคะเน + คำลงท้ายประโยค）
structure_pattern: คง + ข้อความ + มั้ง
explanation_zh: คง 表示“大概、多半”，句末助词 มั้ง 表示不太确定的推测或寻求认同，相当于汉语“……吧”。二者呼应，传达说话人没有十足把握的推断。
examples:
- text: คง​เป็น​เพราะ​ความ​เคยชิน​ล่ะ​มั้ง
