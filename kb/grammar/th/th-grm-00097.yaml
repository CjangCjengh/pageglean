title: 动词 + ออกมา/มา：趋向补语
structure: 动词 + ออก/เข้า/ขึ้น/ลง + มา/ไป
structure_pattern: V + ออก/เข้า/ขึ้น/ลง + มา/ไป
explanation_zh: 泰语把趋向动词 ออก/เข้า/ขึ้น/ลง 与 มา/ไป 接在主要动词后作补语，相当于中文的趋向补语「出来／进来」。มา 表示朝向说话人，ไป
  表示远离。片段中 พูดออกมา＝说出来、ทำออกมา＝做出来、ลอยมา＝飘过来。
examples:
