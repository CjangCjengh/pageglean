title: จน：直到……、以至于……
structure: 小句 + จน + 结果小句
structure_pattern: clause + จน + clause
explanation_zh: จน 连接两个小句，表示前一情况持续发展、累积到产生后面的结果，相当于中文的「直到……／以至于……」。其后的小句多为程度累积导致的结果。
examples:
- text: ลอย​มา​เตะจมูก​จน​กระเพาะ​จอม​เกเร​ของ​ผม​เริ่ม​ส่งเสียง​ประท้วง
