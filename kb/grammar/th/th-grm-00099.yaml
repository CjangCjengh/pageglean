title: ไม่ใช่เหรอ：不是……吗？
structure: 陈述内容 + ไม่ใช่เหรอ
structure_pattern: X + ไม่ใช่เหรอ
explanation_zh: 「ไม่ใช่」加疑问助词「เหรอ」（หรือ 的口语形式）构成确认性反问，相当于中文的「不是……吗？」。常带有惊讶或求证的语气，比一般疑问句更强调说话人已有判断。
examples:
