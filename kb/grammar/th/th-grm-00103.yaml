title: ลอง…ดู：试着……看
structure: คำกริยาช่วย「ลอง」+ คำกริยา +「ดู」（尝试义）+ คำท้ายประโยค「สิ」「คะ」
structure_pattern: ลอง + V + ดู (+ สิ + คะ)
explanation_zh: 「ลอง」作前置助动词、「ดู」紧跟动词后，构成「试着做……看」的尝试体。句末「สิ」表示劝诱、催促，「คะ」是女性使用的礼貌助词。整句是请对方尝试时的典型说法。
