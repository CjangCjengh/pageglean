title: 动词+趋向补语：ขึ้นมา / ออกมา / เข้า…ไป
structure: คำกริยาหลัก + คำบอกทิศทาง（ขึ้นมา/ออกมา/เข้า…ไป），连动式
structure_pattern: V + ออก/ขึ้น/เข้า + มา/ไป
explanation_zh: 泰语常把趋向动词放在主要动词后构成连动式，补充动作的方向与结果。「มา」表示朝向说话者，「ไป」表示背离说话者，如「ขึ้นมา」（向上拿起）、「ออกมา」（由内向外）。方向补语是本片段最高频的结构之一。
