title: อย่าง…／重叠副词：……地（方式状语）
structure: คำกริยา + อย่าง + คำวิเศษณ์（可重叠）；重叠式亦可直接作状语（ค่อย ๆ、เบา ๆ）
structure_pattern: V + อย่าง + Adj(REDUP) / V + Adv(REDUP)
explanation_zh: 「อย่าง＋形容词」构成方式状语，相当于中文「……地」；形容词重叠（ช้า ๆ）表示程度轻微或状态持续。重叠式也可直接作状语，如「ค่อย
  ๆ」（慢慢地）、「เบา ๆ」（轻轻地）。片段借此细腻描摹动作。
