id: th-grm-00107
language: th
type: grammar
level: L2
level_rank: 2
title: จนเกินไป：太……、过于……
structure: คำวิเศษณ์ + จนเกินไป（程度副词）；常见否定式 ไม่…จนเกินไป
structure_pattern: Adj + จนเกินไป
explanation_zh: 「เกินไป」是程度副词，表示超过适当限度，相当于「太、过于」。与「ไม่」连用表示「不太……、恰到好处」。片段以「ไม่…จนเกินไป」多角度评价食物的火候。
