title: ไหม / หรือเปล่า：是非问与疑惑语气
structure: คำกริยา/คำวิเศษณ์ + ไหม（是非问）；句末 + หรือเปล่า（是否）+ เหรอ/หว่า（疑惑）
structure_pattern: V/Adj + ไหม ; …หรือเปล่า + (เหรอ/หว่า)
explanation_zh: 「ไหม」置于句末构成是非问句，相当于「……吗」。「หรือเปล่า」表示「是否／是不是……」，带有不确定的语气。句末助词「เหรอ」「หว่า」加重疑惑、自言自语的语气。
