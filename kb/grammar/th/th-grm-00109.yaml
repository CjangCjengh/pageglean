id: th-grm-00109
language: th
type: grammar
level: L1
level_rank: 1
title: 「จะ + 动词：将来与未然」
structure: จะ（ช่วยกริยาบอกอนาคต）+ คำกริยา
structure_pattern: จะ + V
explanation_zh: จะ 置于动词前作助动词，表示尚未发生的动作或意愿，相当于汉语“会/要”。与疑问词连用可构成反问，如 จะ…ไปทำไม（干嘛还要…）。本段中男主用此结构自嘲“我干嘛还要去描述这番印象”。
examples:
- text: ผม​จะ​มา​บรรยาย​ความ​ประทับใจ...ไป​ทำไม​กันฟะ!
