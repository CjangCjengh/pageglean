id: th-grm-00110
language: th
type: grammar
level: L2
level_rank: 2
title: 「แล้ว：事态变化与感叹」
structure: คำกริยา/คุณศัพท์ + แล้ว（บอกความเปลี่ยนแปลงของเหตุการณ์）
structure_pattern: V/Adj + แล้ว
explanation_zh: แล้ว 置于句末或小句末，表示情况发生变化或出现新事态，相当于汉语的“了”。ไม่ได้การแล้ว 是口语固定感叹，意为“糟了、这下不妙了”。本段中แล้วย多次出现，还可起承上启下的连接作用（แล้วนี่ผมจะ…）。
examples:
