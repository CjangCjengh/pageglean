id: th-grm-00111
language: th
type: grammar
level: L3
level_rank: 3
title: 「动词 + ไว้：结果的留存与固定」
structure: คำกริยา + ไว้（บทเสริมบอกผลคงอยู่）
structure_pattern: V + ไว้
explanation_zh: ไว้ 接在动词后，表示动作的结果被留存、固定在某处或某种状态，相当于汉语“放好、留下、留着”。常与วาง（放置）、เก็บ（收存）等动词搭配。本段两处使用：วางครีม…ไว้（把沐浴露放在这儿）、วางของไว้บนชั้น（把东西放到架子上）。
examples:
- text: รีบ​วาง​ของ​ทั้งหมด​ใน​มือไว้​บน​ชั้น​ข้าง​ประตู
  reading: ''
  annot: รีบ​วาง​ของ​ทั้งหมด​ใน​มือไว้​บน​ชั้น​ข้าง​ประตู
