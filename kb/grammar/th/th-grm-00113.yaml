id: th-grm-00113
language: th
type: grammar
level: L2
level_rank: 2
title: 「อย่าง + 形容词：方式状语后置」
structure: คำกริยา + อย่าง + คำวิเศษณ์（กริยาวิเศษณ์วลี เรียงหลังกริยา）
structure_pattern: V + อย่าง + Adj
explanation_zh: อย่าง 置于形容词前构成方式状语，整体位于动词之后（泰语修饰语后置），相当于汉语“…地”。本段出现两处：เข้าอย่างจัง（目光）撞了个正着、ปิดประตูอย่างเร็ว（飞快地）关上门。是泰语副词化最典型的手段之一。
examples:
