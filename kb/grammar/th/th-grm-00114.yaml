id: th-grm-00114
language: th
type: grammar
level: L1
level_rank: 1
title: หรือเปล่า：是非疑问句
structure: ภาคแสดง + หรือเปล่า (+ คำลงท้าย คะ/ค่ะ)
structure_pattern: VP + หรือไม่ + (คะ|ค่ะ)?
explanation_zh: 「หรือเปล่า」置于陈述句之后构成是非问句，相当于汉语的“……吗”，口语中比「หรือไม่」更常用。句末可叠加礼貌助词คะ/ค่ะ，问句末尾用คะ、陈述句末尾用ค่ะ。回答时对句中谓词作肯定或否定即可。
examples:
- text: คุณ​ชา​เป็น​อะไร​หรือ​เปล่า​คะ?
