title: ให้：目的与结果补语
structure: กริยาหลัก + ให้ + กริยาเสริม (จุดประสงค์/ผลลัพธ์)
structure_pattern: V1 + ให้ + V2
explanation_zh: 「ให้」接在动词后引出目的或结果，相当于“以便……”“使得……”或“……到（某种结果）”。学校语法中此处「ให้」起连接作用，把动作与其目的/结果分句相连。「มองหน้าผมให้ได้」意为“设法看到我的脸”，「ทิ้งให้ผมยืนงง」意为“撇下我让我愣在原地”。
examples:
- text: พยายาม​ยืดตัว​ขึ้น​เพื่อ​มอง​หน้า​ผม​ให้​ได้
