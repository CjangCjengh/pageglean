title: เกินไป：程度过度
structure: คำวิเศษณ์/กริยา + เกินไป (คำวิเศษณ์บอกดีกรี)
structure_pattern: Adj/V + เกินไป
explanation_zh: 「เกินไป」置于形容词或动词之后，表示程度过分，相当于“太……、过于……”。学校语法中属程度副词（คำวิเศษณ์），修饰语位于中心词之后，体现泰语修饰后置的语序。片段中出现两处：身高相差太大、寂寞得过分。
examples:
- text: ดูท่าทาง​เรา​จะ​เหงา​เกินไป​แล้ว​ล่ะ​มั้ง
