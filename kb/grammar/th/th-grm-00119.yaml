id: th-grm-00119
language: th
type: grammar
level: L2
level_rank: 2
title: ที่：定语从句标记（相当于「……的」）
structure: 中心名词 + ที่ + 修饰小句
structure_pattern: นามบทหลัก + ประพันธสรรพนาม 'ที่' + อนุประโยคขยายนาม
explanation_zh: ที่ 是引导定语从句的关系词，相当于汉语的「的」，从句紧跟被修饰名词之后。泰语修饰成分后置，「名词＋ที่＋小句」是最典型的名词扩展结构。片段中สถานที่、อาราม等名词后均以此方式扩展。
examples:
- text: สถานที่​ท่องเที่ยว​ชื่อดัง​อีก​แห่งหนึ่ง​ของ​กรุง​มอสโก​ที่​ผม​เคย​ไป​เที่ยว​เมื่อ​สี่​ปีก่อน
  reading: ''
