id: th-grm-00120
language: th
type: grammar
level: L2
level_rank: 2
title: เคย：经历体「曾经……」
structure: เคย + 动词
structure_pattern: คำช่วยกริยา 'เคย' + คำกริยาหลัก (ประสบการณ์ในอดีต)
explanation_zh: เคย 为助动词，置于动词前表示过去有过某种经历，相当于「曾经」。否定形式为ไม่เคย。片段中出现两次：เคยเอาไปเขียน、เคยไปเที่ยว。
examples:
- text: ผม​เคย​ไป​เที่ยว​เมื่อ​สี่​ปีก่อน
  reading: ''
  annot: ผม​เคย​ไป​เที่ยว​เมื่อ​สี่​ปีก่อน
  translation_zh: 我四年前曾经去游玩过。
  source_book: book-th-009
  source_chapter: null
  pointer: null
- text: ที่​คุณ​ชา​เคย​เอาไป​เขียน​ใน​นิยาย​นั่น​ล่ะ
  reading: ''
  annot: ที่​คุณ​ชา​เคย​เอาไป​เขียน​ใน​นิยาย​นั่น​ล่ะ
