title: กำลัง：进行体「正在……」
structure: กำลัง + 动词/形容词
structure_pattern: คำช่วยกริยา 'กำลัง' + คำกริยา/คำวิเศษณ์ (เหตุการณ์กำลังดำเนิน)
explanation_zh: กำลัง 置于动词前表示动作正在进行，相当于「正在」。片段中后接นิด ๆ（一点点）与英语借词เฮิร์ท（hurt），描写当时情绪低落的状态。
