title: ค่ะ/คะ：女性礼貌句末助词
structure: ประโยค + ค่ะ/คะ (คำลงท้ายสุภาพของสตรี)
structure_pattern: S + … + ค่ะ/คะ
explanation_zh: ค่ะ/คะ是女性专用的礼貌句末助词，男性对应使用ครับ。ค่ะ用于陈述、肯定语气，คะ用于疑问或呼唤。片段中女仆雅妲对主人说话时语气谦恭，全部使用ค่ะ/คะ。
