id: th-grm-00126
language: th
type: grammar
level: L1
level_rank: 1
title: 修饰语后置：定语放在中心语之后
structure: 中心名词 + 形容词/修饰语；领属：名词1 + ของ + 名词2
structure_pattern: N + Adj ; N1 + ของ + N2
explanation_zh: 泰语的定语放在中心语之后，形容词修饰名词时要后置，「ชายหาดสวย ๆ」直译是「海滩漂亮的」，意为「美丽的海滩」。领属或限定关系用「ของ」连接，如「สถานที่เติบโตของพวกเรา」（我们成长的地方）。这与汉语语序相反，是中文母语者需要最先适应的基本规则。
examples:
- text: ผม​จำได้​ว่าที่​รัสเซียก็​มี​ชายหาด​สวย ๆ อยู่​หลายที่​เหมือน​กัน​นี่​นา
