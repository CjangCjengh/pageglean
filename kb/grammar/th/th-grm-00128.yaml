title: ทำไมถึง…：追问原因的疑问句
structure: ทำไม + ถึง + 动词/形容词？
structure_pattern: ทำไม + ถึง + VP
explanation_zh: 「ทำไม」意为「为什么」，加「ถึง」后强调追问原因，带有意外或不解的语气，相当于「怎么会、为何竟然」。回答时常用「เพราะ…」（因为……）引出原因，问句末尾可加「ล่ะ」缓和语气。
