title: 量词结构：名词与量词的语序
structure: 名词 + 量词 + 形容词 + 数量（หลาย + 量词）
structure_pattern: N + CL + Adj ; หลาย + CL
explanation_zh: 泰语量词丰富，数量短语通常放在名词之后。「เหงื่อเม็ดโตหลายเม็ด」中「เม็ด」是颗粒状物的量词，直译「汗珠—大—好几颗」，即「好几颗豆大的汗珠」。动量词「ครั้ง」（次）同理，如「อีกครั้ง」（再一次）、「ครั้งแรก」（第一次）。
