id: th-grm-00130
language: th
type: grammar
level: L1
level_rank: 1
title: 句末语气助词：ค่ะ / ล่ะ / นี่นา
structure: 句子 + ค่ะ（女性）/ ล่ะ / นี่นา
structure_pattern: S + (ค่ะ | ล่ะ | นี่นา)
explanation_zh: 「ค่ะ」是女性用的礼貌语气词（男性对应 ครับ），使话语礼貌柔和。「ล่ะ」（= แหละ）表示提示、确认或轻微催促；「นี่นา」提醒对方注意显而易见的事实，相当于「明明……嘛、你看」。
