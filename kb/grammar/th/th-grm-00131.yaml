id: th-grm-00131
language: th
type: grammar
level: L2
level_rank: 2
title: 「กว่า」：比较级
structure: คำวิเศษณ์ + กว่า + สิ่งเปรียบเทียบ (รูปขั้นกว่า)
structure_pattern: ADJ + กว่า + 基准
explanation_zh: 形容词后加กว่า再引出比较对象，构成比较级（ขั้นกว่า），相当于“比……更……”。泰语的比较语序是“性质词＋กว่า＋基准”，与汉语“比”字句相反，中文母语者需特别注意。片段中“แรงกว่าปกติ”“เย็นกว่าปกติ”均属此结构。
examples:
- text: ใน​ห้อง​ของ​เธอ​เปิด​แอร์​แรง​กว่า​ปกติ
