title: 「หรือเปล่า」：是非问句
structure: ประโยคบอกเล่า + หรือเปล่า (คำคำถาม)
structure_pattern: 陈述句 + หรือเปล่า
explanation_zh: 在陈述句后加หรือเปล่า，构成是非问句，相当于汉语“……吗”。它比ไหม更突出“是不是”的求证与关切语气。片段中丈夫问妲“ร้อนหรือเปล่า”（热吗）。
examples:
- text: ขอโทษ​นะ​คุณดา ร้อน​หรือเปล่า?
