title: 「ค่ะ / นะ / ล่ะ」：句末礼貌与语气助词
structure: 'คำลงท้ายประโยค: ค่ะ (คำรับ หญิง) / นะ, ล่ะ (คำเสริม)'
structure_pattern: 句末 + ค่ะ/นะ/ล่ะ
explanation_zh: ค่ะ是女性说话人用的礼貌语气词，用于陈述或应答；นะ使语气柔和亲切；ล่ะ常用于疑问，缓和追问的口吻。三者都位于句末，是泰语口语交际中不可缺少的成分。
