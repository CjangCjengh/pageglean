id: th-grm-00134
language: th
type: grammar
level: L3
level_rank: 3
title: 「แม้ว่า…ก็…」：让步复句
structure: แม้ว่า + อนุประโยค + ก็/ก็ตาม/ก็เถอะ (คำสันธานเชื่อมความขัดแย้ง)
structure_pattern: แม้(ว่า) + 从句, (แต่)ก็ + 主句
explanation_zh: แม้(ว่า)…ก็…是让步连词，表示“即使/虽然……也……”，在泰语学校语法中归为表转折让步的คำสันธาน。主句常用ก็、ก็ตาม、ก็เถอะ呼应，也可加แต่。片段中两种变体都出现了。
examples:
- text: แม้​จะ​รู้สึก​บ้าง​ว่า​ใน​ห้อง​ของ​เธอ​เปิด​แอร์​แรง​กว่า​ปกติ แต่​ก็​ไม่​ได้​เก็บ​มา​ใส่​ใจ​อะไร
  reading: ''
