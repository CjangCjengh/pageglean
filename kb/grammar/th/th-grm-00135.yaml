title: ยัง…อยู่เลย：持续「还在〜着呢」
structure: ยัง + กริยา + อยู่ + เลย
structure_pattern: ยัง + V + อยู่ + เลย
explanation_zh: ยัง 置于动词前表示状态或动作持续，意为“还、仍在”；อยู่ 紧跟动词后作持续貌标记，句末 เลย 加强语气。注意泰语的体貌词
  อยู่ 位于动词之后，此处还嵌套连动结构 นั่งทำงาน（坐着工作）。
examples:
- text: ก็​ยัง​เห็น​คุณ​ชา​นั่ง​ทำงาน​อยู่​เลย
  reading: ''
  annot: ก็​ยัง​เห็น​คุณ​ชา​นั่ง​ทำงาน​อยู่​เลย
  translation_zh: （她）还是看到茶先生坐着工作呢。
