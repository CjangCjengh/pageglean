title: กำลังจะ…แล้ว：即将「快要〜了」
structure: กำลังจะ + กริยา + แล้ว
structure_pattern: กำลังจะ + V + แล้ว
explanation_zh: กำลังจะ 表示动作即将发生，意为“正要、快要”，常与句末 แล้ว 呼应。疑问句 จะ…แล้ว? 可加 เหรอ 表示惊讶或确认，相当于“就要〜了吗？”，比
  หรือ 更口语。
