title: ไหม + คะ：是非问句与礼貌句末助词
structure: 述语（คำกริยา/วิเศษณ์）+ ไหม（疑问助词）+ คะ/ครับ（礼貌คำลงท้าย）
structure_pattern: V/Adj + ไหม + คะ/ครับ
explanation_zh: 泰语把「ไหม」放在句末，把陈述句变成是非问，相当于汉语的"……吗"。句末再加「คะ」（女性用）或「ครับ」（男性用）表示礼貌。「เหรอ」则是带惊讶或求确认语气的疑问助词。
examples:
