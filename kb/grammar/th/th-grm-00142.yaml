title: อย่าง + 形容词：……地（方式状语）
structure: อย่าง（คำบุพบท/วิเศษณ์）+ 形容词，构成方式状语
structure_pattern: อย่าง + Adj
explanation_zh: 「อย่าง + 形容词」构成方式状语，相当于汉语的"……地"，用来修饰前面的动词。是书面叙述中描写动作情态的高频手段。
