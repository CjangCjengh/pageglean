id: th-grm-00143
language: th
type: grammar
level: L2
level_rank: 2
title: เคย + 动词：曾经（经历体）
structure: เคย（คำช่วยกริยา）+ 动词，表示过去的经历
structure_pattern: เคย + V
explanation_zh: 「เคย」是助动词，表示曾经有过某种经历，相当于"曾经"。常与「ตั้งแต่…มา」（自从……以来）搭配，强调从过去到现在为止的经验。
examples:
- text: นับตั้งแต่​ผม​เคย​เห็น​มา
  reading: ''
