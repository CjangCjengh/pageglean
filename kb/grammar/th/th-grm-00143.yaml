  source_chapter: null
  pointer: null
- text: เธอ​เลย​ใช้​ศิลปะ​ป้องกันตัว​ที่​เคย​เรียน​มา​จัดการ​กับ​พวก​ที่​เข้ามา​รุม​เธอ​และ​เอาตัวรอด​มา​ได้
  reading: ''
