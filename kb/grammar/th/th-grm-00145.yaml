title: หรอก 与 ล่ะ／เลย：句末语气助词
structure: ประโยค + หรอก（缓和否定）/ ล่ะ、เลย（加强语气）
structure_pattern: S + หรอก / ล่ะ / เลย
explanation_zh: 「หรอก」用于否定句末，缓和否定语气；「ล่ะ」「เลย」用于句末加强肯定或提示语气。这些คำลงท้าย使口语显得柔和自然、富有情感。
