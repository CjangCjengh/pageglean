title: 「ค่ะ / คะ」：女性句末礼貌助词的分工
structure: 陈述句 + ค่ะ；疑问句 + คะ
structure_pattern: … + ค่ะ / … + คะ
explanation_zh: ค่ะ和คะ都是女性使用的句末礼貌助词，但分工严格：陈述句、回答句用ค่ะ，疑问句及呼唤语用คะ（男性对应使用ครับ）。片段中回答用“ดีค่ะ”，提问用“ได้ไหมคะ”“ด้วยค่ะ”，正体现了这一规则。
