title: 「จะ」：将要、会（将来标记）
structure: 主语 + จะ + 动词
structure_pattern: S + จะ + V
explanation_zh: จะ置于动词前，表示动作将要发生或询问打算，相当于汉语的“要、会”。它也常出现在“ก่อนจะ…”等结构里，引出紧接着发生的下一个动作。语序与汉语“要＋动词”一致，中文母语者容易掌握。
examples:
- text: คุณ​ชา วันนี้​เรา​จะ​ไป​ไหน​กัน​เหรอ?
