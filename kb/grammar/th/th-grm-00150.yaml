- text: ดา​อยาก​ไป​ไชน่า​ทาว เสร็จ​ธุระ​แล้ว​พาไป​หน่อย​ได้​ไหมคะ?
  reading: ''
  annot: ดา​อยาก​ไป​ไชน่า​ทาว เสร็จ​ธุระ​แล้ว​พาไป​หน่อย​ได้​ไหมคะ?
  translation_zh: 我想去唐人街，你办完事后带我去一下，好吗？
