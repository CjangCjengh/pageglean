id: th-grm-00151
language: th
type: grammar
level: L2
level_rank: 2
title: 「อยู่」：动作或状态的持续
structure: 动词 + อยู่（＋处所）
structure_pattern: V + อยู่ (+ สถานที่)
explanation_zh: อยู่置于动词后，表示动作或状态正在进行、持续，相当于汉语的“在……／……着”。片段用“นั่งอยู่”“นั่งนึกอยู่”描写人物当时的姿态。อยู่本身也可作动词，表示“位于、待在（某处）”。
examples:
