title: 「ให้」：使役与受益（让／为某人做）
structure: V + ให้ + 人 + V
structure_pattern: V1 + ให้ + NP + V2
explanation_zh: ให้本义为“给”，常用在动词后构成使役或受益结构，“V＋ให้＋人＋V”表示“让／叫某人做某事”或“为某人做某事”。片段中“บอกให้เธอคาดเข็มขัดนิรภัย”（让她系好安全带）是使役，“แจกลายแทงร้านอร่อยให้ลูกสาว”（把美食地图给女儿）是受益。主语或宾语常可省略。
examples:
