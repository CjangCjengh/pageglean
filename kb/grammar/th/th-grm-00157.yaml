id: th-grm-00157
language: th
type: grammar
level: L2
level_rank: 2
title: 「…ๆ」重叠式：程度轻微、随意或泛指
structure: 形容词/名词 + ๆ（或重复书写）
structure_pattern: X + ๆ
explanation_zh: 泰语常将形容词或名词重叠，表示程度轻微、模糊不定或泛指「……之类的」。如 ต่าง ๆ「各种各样」（复数泛指）、ลุย ๆ「有点随性粗犷」、น่ารัก
  ๆ「可爱之类的」。
examples:
- text: ตาม​สถานที่​ต่าง ๆ คน​เดียว​แบบ​ลุย ๆ หน่อย
