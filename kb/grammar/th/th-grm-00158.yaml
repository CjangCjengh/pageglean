title: 「V + กัน + ดีกว่า」：咱们……吧
structure: 动词 + กัน + ดีกว่า
structure_pattern: V + กัน + ดีกว่า
explanation_zh: ดีกว่า 字面为「更好」，接在动词后表示建议，相当于「还是……比较好／咱们……吧」。加 กัน 表示包括听话人在内的共同行动，是口语中典型的提议句式。
