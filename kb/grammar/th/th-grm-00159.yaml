title: 「V + มา + ได้ + 时段 + แล้ว」：已经……（持续）一阵子了
structure: 动词 + มา + ได้ + 时段 + แล้ว
structure_pattern: V + มา + ได้ + 时段 + แล้ว
explanation_zh: 表示某动作从过去持续到现在已有某段时间：มา 表示「从过去一直延续至今」，ได้ + 时段表示已达到的量，แล้ว 表示「已经」。整体相当于汉语「已经……了（一段时间）」，是非常地道的口语表达。
examples:
- text: ดา​กับ​แม่นัน​ตาม​อ่าน​คอลัมน์​ที่​คุณ​ชา​เขียน​มา​ได้​สักพัก​ใหญ่ ๆ แล้ว​ค่ะ
