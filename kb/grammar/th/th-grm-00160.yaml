title: 「ไหม」是非疑问句
structure: 动词/形容词短语 + ไหม
structure_pattern: คำกริยาวลี + คำลงท้ายคำถาม "ไหม"
explanation_zh: 句末疑问助词，把陈述句变成是非问句，相当于中文的「吗」。语调上扬，期待对方作肯定或否定回答。是泰语最基本的提问手段。
