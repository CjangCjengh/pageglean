title: 「เคย」经验体：曾经做过
structure: เคย + 动词（否定：ไม่เคย）
structure_pattern: คำช่วยกริยา "เคย" + คำกริยา
explanation_zh: 体貌助动词，表示过去有过的经历或习惯，相当于「曾经」。否定形式 ไม่เคย 表示「从来没有」，常用来回答 เคย…ไหม 的提问。
