title: 「กัน」共同与交互
structure: 动词 + กัน
structure_pattern: คำกริยา + "กัน"
explanation_zh: 副词性成分，表示动作由多人共同进行或相互施加，相当于「一起」「互相」。在邀请、建议句型「…กันไหม?」中尤为常见。
