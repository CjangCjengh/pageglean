title: 「พลาง」两个动作同时进行
structure: 动词1 + พลาง + 动词2
structure_pattern: คำกริยา + "พลาง" + คำกริยา
explanation_zh: 副词，表示两个动作同时进行，相当于「一边……一边……」。多用于书面语和小说叙述，可单用也可成对使用。
