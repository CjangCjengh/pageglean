title: 「มา」动作持续至今
structure: 动词 + (时长) + มา
structure_pattern: คำกริยา + ระยะเวลา + "มา"
explanation_zh: 体貌助词，表示动作从过去某时开始一直延续到现在，相当于「……以来」。常与 ตั้งแต่（自从）搭配，标记时间的起点。
