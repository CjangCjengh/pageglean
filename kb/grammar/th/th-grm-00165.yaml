id: th-grm-00165
language: th
type: grammar
level: L3
level_rank: 3
title: 「เรียกว่า」称作、叫做
structure: เรียก + 宾语 + ว่า + 名称
structure_pattern: คำกริยา "เรียก" + กรรม + "ว่า" + ชื่อ
explanation_zh: 命名结构，เรียก…ว่า… 表示「把……叫做……」，ว่า 引出所称的名称。客观叙述或省略施事者时，可直接说 เรียกว่า…（被称为……）。
examples:
