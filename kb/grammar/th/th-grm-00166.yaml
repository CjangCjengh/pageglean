title: 「ยิ่ง…เข้าไปใหญ่」越来越……
structure: ยิ่ง + 形容词/动词 + เข้าไปใหญ่
structure_pattern: '"ยิ่ง" + คำวิเศษณ์ + "เข้าไปใหญ่"'
explanation_zh: 程度递进结构，表示某种情况因新条件出现而进一步加剧，相当于「越发……了」「更……了」。多用于不如意或夸张的语境。
examples:
- text: และ​ยิ่ง​หนัก​เข้าไป​ใหญ่​เมื่อ​เข้าสู่​ถนน​สุขุมวิท
