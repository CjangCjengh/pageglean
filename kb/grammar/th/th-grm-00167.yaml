id: th-grm-00167
language: th
type: grammar
level: L1
level_rank: 1
title: อย่าง + 形容词/副词：方式状语标记
structure: อย่าง + คำคุณศัพท์/คำวิเศษณ์（修饰动词，表方式）
structure_pattern: อย่าง + ADJ/ADV
explanation_zh: อย่าง 置于形容词或副词前，把其转化为修饰动词的方式状语，相当于汉语的「……地」或英语的 -ly。片段中「อย่างรวดเร็ว」（迅速地）与「อย่างอารมณ์ดี」（心情很好地）均用于描写动作的状态。这是泰语书面与口语都高频的状语化手段。
