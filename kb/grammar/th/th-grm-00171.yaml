title: ถึง(แม้)…ก็เถอะ：让步结构
structure: ถึง/แม้แต่ + อนุประโยค … ก็ + เถอะ/ก็ตาม
structure_pattern: ถึง(แม้) + Clause … ก็ + เถอะ/ก็ตาม
explanation_zh: ถึง或ถึงแม้引导让步从句，相当于汉语「虽然/即使……也……」，主句或句尾以ก็เถอะ、ก็ตาม呼应，带有迁就、让步、姑且承认的语气。片段中出现两次：「ถึงส่วนใหญ่จะดูโตเกินวัยไปหน่อยก็เถอะ」和「ถึงแม้ในช่วงก่อสร้างมันจะทำให้รถติดทั้งบ้านทั้งเมืองก็เถอะนะ」。其中「ทั้งบ้านทั้งเมือง」（全国各地、满城）也是惯用搭配。
examples:
- text: ถึง​ส่วนใหญ่​จะ​ดู​โต​เกิน​วัย​ไป​หน่อยก็​เถอะ
  reading: ''
