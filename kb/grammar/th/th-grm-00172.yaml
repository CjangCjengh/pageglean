title: สิ/นะ/ค่ะ：句末助词与礼貌应答
structure: คำกริยา/ประโยค + สิ/นะ; ค่ะ（女性应答助词）
structure_pattern: V/Clause + สิ/นะ; ค่ะ
explanation_zh: 句末助词สิ用于催促、建议对方做某事，语气熟稔而不客气，如「ไปซื้อตั๋วสิ」（快去买票呀）。นะ用于柔化语气、提醒或请求认同，如「2
  คนนะ」（2个人哦）。ค่ะ是女性使用的礼貌应答词，表示应答「是的/好的」，与男性用语ครับ相对。
examples:
- text: เอ้า คุณดา​ไป​ซื้อตั๋ว​สิ บอก​เขา​ว่า​ไป​สยาม 2 คน​นะ
