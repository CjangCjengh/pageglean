id: th-grm-00173
language: th
type: grammar
level: L1
level_rank: 1
title: ลักษณนาม：量词与数量短语后置
structure: นาม（名词）+ จำนวน（数词）+ ลักษณนาม（量词）
structure_pattern: N + จำนวน + ลักษณนาม
explanation_zh: 泰语计数必须用量词（ลักษณนาม），但数量短语整体放在名词之后，即先说名词再说“数词+量词”，如“แบงก์ร้อย…หนึ่งใบ”＝一张百元钞。量词按名词类别搭配：纸币、票用ใบ，人用คน，硬币用เหรียญ。
