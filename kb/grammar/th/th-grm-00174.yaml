title: คำลงท้าย：句末助词ค่ะ/คะ与สิ/นะ/ล่ะ
structure: ประโยค（句子）+ คำลงท้าย（句末助词）
structure_pattern: S + V + คำลงท้าย (ค่ะ/คะ, สิ, นะ, ล่ะ)
explanation_zh: 泰语在句尾加助词表示礼貌或语气：女性陈述句用ค่ะ，疑问、呼唤用คะ。สิ表示催促、劝诱（“快去……吧”），นะ使语气柔和、带叮嘱，ล่ะ带提醒或恍然的口吻。它们都位于全句最末尾。
