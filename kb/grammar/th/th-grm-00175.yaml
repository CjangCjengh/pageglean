id: th-grm-00175
language: th
type: grammar
level: L1
level_rank: 1
title: 疑问结构：ไหม是非问与ทำไม…ถึง…原因问
structure: 陈述句 + ไหม？／ทำไม + ประธาน（主语）+ ถึง + กริยา（谓语）？
structure_pattern: S + V + ไหม / ทำไม + S + ถึง + V
explanation_zh: 一般是非问直接在句末加ไหม，相当于汉语“……吗”，如“เห็น…ไหม”＝“看到……了吗”。问原因用ทำไม，常与副词ถึง呼应构成“ทำไม…ถึง…”，强调追问“为什么会……”。
examples:
- text: ทำไม​เขา​ถึง​ให้​เหรียญ​กลับ​มาคะ?
