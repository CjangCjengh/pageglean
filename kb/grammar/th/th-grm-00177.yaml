title: คำบุพบทด้วย：用、带着（方式与手段）
structure: กริยา（动词）+ คำบุพบท（介词）ด้วย + นาม（名词），介词短语后置作状语
structure_pattern: V + ด้วย + N
explanation_zh: บุพบทด้วย表示手段、方式或伴随，相当于汉语“用、以、带着”，如“ด้วยรอยยิ้ม”＝“带着笑容”。泰语的方式状语位于动词之后，与汉语语序相反。“ด้วยตัวเอง”即“靠自己、亲自”。
examples:
- text: อยาก​ให้คุณดา​ลอง​ซื้อตั๋ว​ด้วย​ตัวเอง​ดู​ไง
