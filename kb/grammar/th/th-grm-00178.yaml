id: th-grm-00178
language: th
type: grammar
level: L3
level_rank: 3
title: 连动式：动词连用与趋向补语มา/ไป/กลับ
structure: กริยา连用：คำกริยา1（+ กรรม 宾语）+ คำกริยา2 + คำบอกทิศทาง（มา/ไป/กลับ）
structure_pattern: V1 + (O) + V2 + มา/ไป/กลับ
explanation_zh: 泰语允许多个动词直接连用（连动式），按动作发生先后排列，如“หยิบ…ส่งกลับมาให้”＝“取出……转身递回来给”，一句话里五个动词一气呵成。มา/ไป/กลับ等趋向词紧跟动词作趋向补语，表示动作朝向，其中มา朝说话人、ไป背离说话人。
examples:
- text: พนักงานก็​หยิบ​เหรียญ​สิบ​บาท​จำนวน 10 เหรียญ​ส่งกลับ​มา​ให้
