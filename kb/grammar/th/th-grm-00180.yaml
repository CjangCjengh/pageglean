id: th-grm-00180
language: th
type: grammar
level: L3
level_rank: 3
title: เอาแต่ + V：只顾着…、一个劲儿地…
structure: เอาแต่ + กริยา（动词）
structure_pattern: เอาแต่ + V
explanation_zh: เอาแต่ 放在动词前，表示“只顾着～”“一个劲儿地～”，强调某一动作或状态持续不断、不受干扰。常带有说话人的主观情绪（无奈、心疼、责备等）。与
  เพียงแต่（只是）不同，เอาแต่ 侧重“只做这一件事”。
examples:
