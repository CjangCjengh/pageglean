id: th-grm-00181
language: th
type: grammar
level: L2
level_rank: 2
title: เคย：经历体「曾经／有过…的体验」
structure: เคย / เพิ่งเคย + กริยา（动词，กริยานุเคราะห์ 用法）
structure_pattern: เพิ่ง + เคย + V
explanation_zh: เคย 是表经历的助动词（กริยานุเคราะห์），置于动词前，表示“曾经～”。与 เพิ่ง 连用构成 เพิ่งเคย，强调“还是头一次体验”。它能直接嵌入
  ที่ 引导的名词修饰语（如“ที่เคยนั่งที่มอสโก”），这是中文母语者需要适应的修饰语后置结构。
examples:
