id: th-grm-00184
language: th
type: grammar
level: L1
level_rank: 1
title: ค่ะ/คะ：女性礼貌句末助词
structure: ประโยค + ค่ะ (ประโยคบอกเล่า) / คะ (ประโยคคำถาม, คำลงท้ายแสดงความสุภาพ)
structure_pattern: Clause + ค่ะ/คะ
explanation_zh: 女性说话者在陈述句、祈使句末加ค่ะ（降调），在疑问句、呼唤语末加คะ（升调）以示礼貌，男性对应使用ครับ。片段中เหรอ后接คะ构成礼貌疑问，ค่ะ用于陈述句末。
examples:
