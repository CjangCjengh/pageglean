id: th-grm-00185
language: th
type: grammar
level: L2
level_rank: 2
title: คำซ้ำ（叠语）：语义弱化与强调
structure: คำวิเศษณ์/คำคุณศัพท์ ซ้ำกันทำหน้าที่ส่วนขยาย (คำซ้ำ)
structure_pattern: Adj/Adv + Adj/Adv（การซ้ำคำ）
explanation_zh: 泰语常将形容词、副词重叠使用（คำซ้ำ），表示程度减弱、模糊或加强语气。片段中เบา ๆ（轻轻地）、คร่าว ๆ（粗略地）、คล้าย
  ๆ（相似）、คุ้น ๆ（似曾相识）、แน่ ๆ（肯定）均属此类，语义倾向需依语境判断。
examples:
- text: ญาดา​ตอบ​พลาง​หัวเราะ​เบา ๆ อีกครั้ง
  reading: ''
