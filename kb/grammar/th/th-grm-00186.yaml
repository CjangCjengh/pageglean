title: ต้อง + 动词：义务助动词「必须」
structure: 'คำกริยานุเคราะห์ ต้อง + กริยาหลัก (รูปปฏิเสธ: ไม่ต้อง)'
structure_pattern: 'ต้อง + V（ปฏิเสธ: ไม่ต้อง/จะตอง）'
explanation_zh: ต้อง是义务助动词，表示「必须、得」，置于主要动词之前，否定式为ไม่ต้อง（不必）。口语中常用「ใช่…จะตอง…ซะเมื่อไหร่」构成反问，表示「根本不是需要……的事」。
examples:
- text: พล๊อต​มัน​ซ้ำ​กัน ต้อง​ไม่สนุก​แน่​เลย
