id: th-grm-00189
language: th
type: grammar
level: L2
level_rank: 2
title: 「ก่อนจะ：先后动作的衔接」
structure: คำกริยา + ก่อนจะ + คำกริยา（先发生的动作 + ก่อนจะ + 后发生的动作）
structure_pattern: VP1 + ก่อน(ที่)จะ + VP2
explanation_zh: ก่อน 是表示“在……之前”的时间连词（คำเชื่อม），与未实现体标记 จะ 连用，引出随后发生的动作，整体表示“先A，之后才B”。注意泰语语序：先发生的动作在前，ก่อนจะ
  引导的动作在后。片段中三次出现，是叙事中衔接动作先后的高频结构。
examples:
- text: ผู้การ​มอง​หน้า​ผม​อยู่​ครู่หนึ่ง​ก่อน​จะ​หันกลับ​ไป​หาญาดา​อีกครั้ง​แล้ว​พูด​ว่า
