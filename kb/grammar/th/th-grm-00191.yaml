- text: ทั้งสอง​คนก็​มอง​กลับ​มาหา​ผม​พลาง​ถอนหายใจ​ออกมา​พร้อมกัน​เบา ๆ
  reading: ''
  annot: ทั้งสอง​คนก็​มอง​กลับ​มาหา​ผม​พลาง​ถอนหายใจ​ออกมา​พร้อมกัน​เบา ๆ
  translation_zh: 两人也回过头来看我，同时轻轻地一起叹了口气。
