id: th-grm-00191
language: th
type: grammar
level: L3
level_rank: 3
title: 「พลาง：两个动作同时进行」
structure: คำกริยา1 + พลาง + คำกริยา2
structure_pattern: VP1 + พลาง + VP2
explanation_zh: พลาง 是副词，表示两个动作同时进行，相当于“一边……一边……”。可用“ว่าพลาง＋动作”（一边说着，一边……），也可直接放在主要动词后表示伴随动作。片段中出现两次，是书面叙述中描写同步动作的常用词。
examples:
- text: ผู้การ​ว่า​พลาง​โบกมือ​ไล่​เบา ๆ
  reading: ''
