id: th-grm-00192
language: th
type: grammar
level: L3
level_rank: 3
title: 「ยิ่ง…ก็ยิ่ง…：越……越……」
structure: ยิ่ง + คำกริยา/คำวิเศษณ์1 + ก็ + ยิ่ง + คำกริยา/คำวิเศษณ์2
structure_pattern: ยิ่ง + VP1 + ก็ + ยิ่ง + VP2
explanation_zh: ยิ่ง…ก็ยิ่ง… 是前后呼应的递进结构，表示程度随条件增加，相当于“越A越B”。两个 ยิ่ง 分别修饰前后谓词，ก็ 起连接作用。片段中“ยิ่งพูดก็ยิ่งงง”即“越说越糊涂”，口语常加
  ไปหมด 强调“完全、彻底”。
examples:
