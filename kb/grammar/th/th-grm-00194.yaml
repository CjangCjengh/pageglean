id: th-grm-00194
language: th
type: grammar
level: L2
level_rank: 2
title: 「การ + 动词：名词化与 ของ 后置定语」
structure: การ + คำกริยา (+ ของ + คำนาม)
structure_pattern: การ + V (+ ของ + NP)
explanation_zh: การ 是名词化前缀（คำอุปสรรค การ-），加在动词前使其变成名词，如 การสนทนา（谈话）、การทำ（做）。名词化短语后可用
  ของ 引出后置定语，如“การทำอะไรอ้อมโลกของผู้การ”（局长绕弯子的做法），体现泰语修饰语后置的语序。
examples:
