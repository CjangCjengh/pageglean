title: 「ที่：定语从句的引导词」
structure: คำนาม + ที่ + อนุประโยค（ส่วนขยาย）
structure_pattern: NP + ที่ + Clause
explanation_zh: ที่ 相当于关系代词（英语的 that/which），放在被修饰名词之后引出说明性从句，体现泰语“中心语在前、修饰语后置”的语序。“ไม่ใช่เรื่องที่…”即“不是……的事”，“ของส่วนตัวที่อยู่บนโต๊ะ”即“放在桌上的私人物品”。
examples:
