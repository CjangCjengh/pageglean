id: th-grm-00197
language: th
type: grammar
level: L2
level_rank: 2
title: ที่：修饰语后置的定语从句
structure: นาม + ที่ + อนุประโยค（ส่วนขยายนามอยู่หลังนาม）
structure_pattern: N + ที่ + 从句
explanation_zh: ที่ 是คำสรรพนามเชื่อมความ（关系代词），引导อนุประโยค（从句）置于名词之后作定语，相当于中文的"的"。如"นิยายที่เขาเขียน"（他写的小说），整个修饰从句后置于名词。这种修饰语后置的语序是泰语与中文的一大差异。
examples:
- text: แล้วก็​เอา​นิยาย​ที่​เขา​เขียน​มา​ให้ดา​ลอง​อ่าน​ด้วย
