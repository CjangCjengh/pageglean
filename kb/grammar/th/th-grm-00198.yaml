id: th-grm-00198
language: th
type: grammar
level: L3
level_rank: 3
title: ให้＋人＋动词：使役与受益
structure: คำกริยา + ให้ + บุคคล + คำกริยา（บทกรรมผู้รับ）
structure_pattern: V + ให้ + NP + V
explanation_zh: ให้ 引出动作的受益者，构成"ให้＋人＋动词"结构（บทกรรมผู้รับ，接受者宾语），表示"给/让某人做某事"。"มาให้ดาลองอ่าน"即"拿来给达试着读"。该结构兼具使役与受益性质，是泰语最高频的句型之一。
examples:
- text: แล้วก็​เอา​นิยาย​ที่​เขา​เขียน​มา​ให้ดา​ลอง​อ่าน​ด้วย
  reading: ''
  annot: แล้วก็​เอา​นิยาย​ที่​เขา​เขียน​มา​ให้ดา​ลอง​อ่าน​ด้วย
  translation_zh: 然后还把他写的小说拿来给达试读。
  source_book: book-th-009
