  pointer: null
- text: ยื่น​ไลท์โนเวล​เล่ม​เล็ก​สอง​เล่ม​ที่​ผู้การ​เป็น​คน​เขียน​ให้​ผม​ดู
  reading: ''
  annot: ยื่น​ไลท์โนเวล​เล่ม​เล็ก​สอง​เล่ม​ที่​ผู้การ​เป็น​คน​เขียน​ให้​ผม​ดู
  translation_zh: （雅达）递给我两本小开本的轻小说，是ผู้การ本人写了给我看的。
