id: th-grm-00199
language: th
type: grammar
level: L3
level_rank: 3
title: ก่อน(จะ)/ก่อนที่：做某事之前
structure: ก่อนที่ + ประธาน + จะ + คำกริยา / ก่อน + จะ + คำกริยา
structure_pattern: ก่อน(ที่) + (S) + จะ + VP
explanation_zh: ก่อนที่ 是คำสันธาน（连词），引导时间อนุประโยค，表示"在做某事之前"。从句主语与主句一致时可用"ก่อน＋จะ＋动词"的省略形式，จะ
  为表将然的คำช่วยกริยา。片段中两种形式各出现一次，可对照学习。
examples:
- text: ผม​แอบ​บ่น​เพื่อน​ในใจ​เล็กน้อย​ก่อน​จะ​พาญาดา​เดิน​ออกจาก​ร้าน​สตาร์บัคส์
  reading: ''
  annot: ผม​แอบ​บ่น​เพื่อน​ในใจ​เล็กน้อย​ก่อน​จะ​พาญาดา​เดิน​ออกจาก​ร้าน​สตาร์บัคส์
  translation_zh: 我在心里暗暗吐槽了朋友几句，然后才带着雅达走出星巴克。
