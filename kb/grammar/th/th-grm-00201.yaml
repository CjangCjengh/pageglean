id: th-grm-00201
language: th
type: grammar
level: L2
level_rank: 2
title: ลักษณนาม：量词与语序
structure: นาม + ลักษณนาม + (คำวิเศษณ์) + จำนวน
structure_pattern: N + CL (+ Adj) + Num
explanation_zh: 泰语名词计数时必须搭配ลักษณนาม（量词），语序为"名词＋量词（＋修饰语）＋数词"，如"ไลท์โนเวล＋เล่ม＋เล็ก＋สอง＋เล่ม"。表示"另一……"时用"อีก＋量词＋หนึ่ง"，如"อีกแห่งหนึ่ง"（另一处）、"อีกอย่างหนึ่ง"（另一件事）。不同名词搭配不同量词，需逐一记忆。
examples:
- text: ไลท์โนเวล​เล่ม​เล็ก​สอง​เล่ม​ที่​ผู้การ​เป็น​คน​เขียน​ให้​ผม​ดู
