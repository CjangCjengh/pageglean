title: คือ 判断句与疑问语气 เหรอ(คะ)
structure: A + คือ + B；提问：อะไร + เหรอ + คะ
structure_pattern: A คือ B; อะไร…เหรอ(คะ)
explanation_zh: คือ 是判断动词「是」，用于对事物下定义或解释，构成「A คือ B」结构。询问「……是什么」直接用疑问代词 อะไร，句尾加 เหรอ
  表示疑问；คะ 是女性使用的礼貌句末助词，使问句显得客气。
examples:
