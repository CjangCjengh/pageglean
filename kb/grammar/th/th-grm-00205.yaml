title: เอา…มา/ไป…：拿取类连动式
structure: เอา + 宾语 + มา/ไป + V
structure_pattern: เอา + O + มา/ไป + V
explanation_zh: เอา 意为「拿、取、带」，构成泰语典型的连动结构「เอา + 宾语 + มา/ไป + 动词」，表示把某物拿来做某事，对应中文的「把……拿来／拿去做……」。มา
  表示朝说话人方向，ไป 表示离开；宾语可省略，直接说 เอาไป/เอามา + 动词。
examples:
