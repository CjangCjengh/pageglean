title: V + จน：结果补语
structure: V + จน + 结果（形容词/状态动词）
structure_pattern: V + จน + Resultative
explanation_zh: จน 用在动词之后引出动作达到的结果或程度，意为「直到……／到……的程度」，对应中文「……到……」。如 ต้มจนสุก「煮到熟」。结果成分通常是形容词或状态动词。
examples:
- text: ก่อน​จะ​เอาไป​ต้ม​จน​สุก​แล้ว​ทาน​กับ​น้ำกะทิ​หรือ​น้ำขิง​น่ะ
