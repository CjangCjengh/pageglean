title: 疑问与说明语气词 เหรอ / ไง
structure: 陈述句 + เหรอ（疑问）/ ไง（说明）+（คะ/ค่ะ）
structure_pattern: S + เหรอ / V + ไง (+ คะ/ค่ะ)
explanation_zh: เหรอ（= หรือ）置于句末构成是非问句，相当于中文「吗」；ไง（= ไงล่ะ）带说明语气，意为「不是……嘛」。两者都可与礼貌助词
  คะ/ค่ะ 连用，如片段「ขึ้นฝั่งเหรอคะ?」。口语中 เหรอ 还说成 เรอะ。
examples:
- text: ขึ้นฝั่งเหรอคะ?
