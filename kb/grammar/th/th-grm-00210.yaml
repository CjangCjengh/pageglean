title: ให้ + 动词：使役与许可（การิตวาจก）
structure: กริยา1 + ให้ + กรรม + กริยา2
structure_pattern: V1 + ให้ + O + V2
explanation_zh: 泰语学校语法称之为การิตวาจก（致使句）：在动词后用「ให้」引出对象和第二个动词，表示允许或致使某人做某事，与汉语“让/使”字句对应。「ยอมให้」是“允许……做”，「ปลอบให้」是“安抚使之……”。语序为
  V1 + ให้ + 对象 + V2。
examples:
- text: ผม​จะ​ไม่ยอม​ให้​เธอ​กอด​มัน​โดย​เด็ดขาด
