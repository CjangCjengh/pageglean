title: คำซ้ำ（- ๆ）：重叠表程度与复数
structure: คำ + ๆ (คำซ้ำ)
structure_pattern: X + ๆ (คำซ้ำ)
explanation_zh: 泰语用「 ๆ」（ไม้ยมก）构成重叠词（คำซ้ำ）。形容词重叠表示程度，「หงอย ๆ」是有点蔫蔫的，「มาก ๆ」是非常；名词或量词重叠表示复数，如「อื่น
  ๆ」是其他那些。重叠使语气柔和或带有强调，是口语中极常见的手段。
