id: th-grm-00212
language: th
type: grammar
level: L3
level_rank: 3
title: เพื่อ(ว่า)…จะได้：目的从句
structure: เพื่อ(ว่า) + จะได้ + กริยา
structure_pattern: เพื่อ(ว่า) + จะได้ + V
explanation_zh: 「เพื่อ」引导表示目的的วิเศษณานุประโยค（状语从句），相当于汉语“为了/为的是”。「เพื่อที่ว่า」是较口语化的完整形式，常与「จะได้」（就能够）搭配，表示“为的是能……”。句末「เสียก่อน」补充“先……再说”的语气。
examples:
- text: เพื่อ​ที่ว่า​จะ​ได้​ไม่​ไป​รบกวน​ผู้โดยสาร​คน​อื่น
