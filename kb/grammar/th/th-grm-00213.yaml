title: V+ไปมา：动作来回反复
structure: V + ไปมา
structure_pattern: V + ไปมา
explanation_zh: 「ไปมา」接在动词后，表示动作来回反复进行，相当于汉语的“来回……”。本段「แกว่ง/ตะปบ/กลิ้งตัว ไปมา」反复出现，是描写动态场景的高频结构。
examples:
- text: มัน​เอา​เท้า​ไล่​ตะปบ​ตัว​ล่อ​ที่​เป็น​รูป​ลูกหนู​ตัวเล็ก ๆ ไป​มา​ด้วย​ท่าทาง​สนุกสนาน
  reading: ''
