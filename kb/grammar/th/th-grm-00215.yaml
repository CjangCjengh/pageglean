title: V+ออกมา：结果补语“……出来”
structure: V + ออกมา
structure_pattern: V + ออกมา
explanation_zh: 「ออกมา」作动词补语，表示动作由内向外发出或显露，相当于汉语的“……出来”，如「ยิ้มออกมา」＝笑出来、「ร้องออกมา」＝叫出来。它必须紧跟在主要动词之后，不能像汉语那样插在动词和宾语之间。
