id: th-grm-00220
language: th
type: grammar
level: L2
level_rank: 2
title: ก่อนจะ…：一个动作之后才做另一个动作
structure: V1 + ก่อน + จะ + V2（时间连接词，表动作先后）
structure_pattern: V + ก่อน(ที่) + จะ + V
explanation_zh: 「ก่อนจะ+V2」接在第一个动作V1之后，表示V1完成后才做V2，相当于中文「……之后才……」。在学校文法中ก่อน分析为时间连接词，是本片段叙事中出现频率极高的顺序表达。语序与中文「在……之前」正好相反，需要特别注意。
examples:
- text: มัน​เงยหน้า​ขึ้น​มา​มอง​ผม​เล็กน้อย​ก่อน​จะ​หันกลับ​ไป​สนใจ​อาหาร​ของ​ตัวเอง​ต่อ
