title: 趋向补语：动词 + ขึ้น/ลง + มา/ไป
structure: V + ขึ้น/ลง + มา/ไป（方向补语，มา朝向说话者、ไป远离说话者）
structure_pattern: V + (ขึ้น/ลง) + (มา/ไป)
explanation_zh: 泰语把ขึ้น（上）、ลง（下）等方向成分放在主要动词之后作趋向补语，再叠上มา（朝说话者）或ไป（远离说话者），如ขึ้นมา、ลงไป。片段中กระโดด、ก้ม、ไหล等动词都与这类补语搭配表示空间方向。该结构组合能力强、出现频率极高，是动词学习的重点。
