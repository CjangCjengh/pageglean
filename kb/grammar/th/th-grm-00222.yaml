title: พลาง：一边做甲一边做乙
structure: V1 + พลาง + V2（กริยาวิเศษณ์，表两个动作同时进行）
structure_pattern: V + พลาง + V
explanation_zh: พลาง是表示两个动作同时进行的副词（กริยาวิเศษณ์），结构为「V1+พลาง+V2」，相当于中文的「一边……一边……」。多见于叙述性文字，语气比口语的ไปด้วย…ไปด้วย…更为文雅。片段中两次用来描写「我」与猫互动的场景。
examples:
- text: ผม​ว่า​พลาง​ลูบ​หัว​เจ้า​เหมียว​เบา ๆ
