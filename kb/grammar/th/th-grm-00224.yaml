title: รึไง？/ หน่อยไหมล่ะ：口语中的确认与反问
structure: VP + รึ(หรือ) + ไง；…เกินไป + หน่อย + ไหม + ล่ะ（疑问助词连用）
structure_pattern: VP + รึ/หรือ + ไง
explanation_zh: รึ是หรือ的口语形式，与ไง（=อย่างไร）构成「VP+รึ+ไง」，表示「……还是怎么的？」，用于带有惊讶语气的确认问句。另一口语反问格式「…เกินไป+หน่อย+ไหม+ล่ะ」意为「未免有点太……了吧」，常与句末助词เนี่ย连用，表达说话人的感叹式反问。
examples:
- text: ว่า​ไง​เรา หิว​รึไง?
