id: th-grm-00225
language: th
type: grammar
level: L2
level_rank: 2
title: 重叠式เบา ๆ、แตะ ๆ：轻微与反复
structure: 单音节词重叠 + ๆ（คำซ้ำ，作กริยาวิเศษณ์状语）
structure_pattern: X ๆ (คำซ้ำ)
explanation_zh: 泰语可把单音节形容词或动词重叠并加 ๆ，构成คำซ้ำ（重叠词）充当状语，表示程度轻微或动作反复，如เบา ๆ（轻轻地）、แตะ ๆ（一下下地轻碰）、แผล่บ
  ๆ（快速地）。重叠式在片段中反复出现，使动作描写更加细腻生动。
