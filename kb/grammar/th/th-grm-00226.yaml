  pointer: null
- text: ทั้งที่​อากาศ​ร้อน​ตับ​แตก​ขนาดนั้น​แต่​คุณดา​กลับ​ใส่เสื้อ​แขน​ยาว​มา
  reading: ''
  annot: ทั้งที่​อากาศ​ร้อน​ตับ​แตก​ขนาดนั้น​แต่​คุณดา​กลับ​ใส่เสื้อ​แขน​ยาว​มา
  translation_zh: 天热成那个样子，达小姐却反倒穿着长袖来。
