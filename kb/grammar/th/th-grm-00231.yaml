title: คิดว่า…จะ…เสียอีก：我还以为……呢
structure: คิดว่า + จะ + 动词 + เสียอีก
structure_pattern: คิดว่า + จะ + V + เสียอีก
explanation_zh: 「คิดว่า + จะ + V + เสียอีก」表示与事实相反的揣测，意为「我还以为会……呢（结果并非如此）」。语气成分 เสียอีก
  强调实际情况与说话人预期不符。相当于汉语的「我还当是……呢」。
examples:
- text: ผม​นึก​ว่า​ผู้การ​จะ​จีบ​คุณดา​เสีย​อีก...
