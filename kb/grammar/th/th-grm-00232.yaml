title: ก่อน / ก่อนที่：「先……」与「在……之前」
structure: กริยาหลัก + ก่อน / ประโยคหลัก + ก่อนที่ + ประโยคย่อย
structure_pattern: V + ก่อน / V1 + ก่อนที่ + S + V2
explanation_zh: 「ก่อน」置于动词前表示先做某事，接小句时用「ก่อนที่＋小句」表示「在……之前」，学校语法归为表时间的接续词（คำสันธาน）。泰语语序是先前发生的动作在前，「ก่อน(ที่)」引出的后发动作在后。「ก่อน」还可单独放在动词后或句末表示「先……」，如「ดากลับก่อนนะ」。
