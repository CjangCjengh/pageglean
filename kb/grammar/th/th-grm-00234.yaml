title: ลักษณนาม：量词「คน」与「名＋数＋量」语序
structure: คำนาม + จำนวน + ลักษณนาม (คน)
structure_pattern: N + Num + CLF(คน)
explanation_zh: 泰语表示数量时必须使用量词（ลักษณนาม），学校语法将其归为名词的附类；指人的量词是「คน」。语序为「名词＋数词＋量词」，如「คุณครูคนหนึ่ง」（一位老师）、「ทั้งสองคน」（两人），与汉语「一＋量＋名」正好相反。
