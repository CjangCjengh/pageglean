title: 疑问句与句末语气词：หรือเปล่า / ครับ / ค่ะ / นะ / จ้ะ
structure: ประโยค + หรือเปล่า + ครับ/ค่ะ；ประโยค + นะ + จ้ะ/ค่ะ
structure_pattern: …หรือเปล่า + ครับ/ค่ะ ; …นะ + จ้ะ/ค่ะ
explanation_zh: 「หรือเปล่า」置于句末构成是非问句，相当于「……吗」，与疑问词「อะไร」连用表示「是不是出什么事了」。句末常叠加礼貌助词：ครับ（男性用）、ค่ะ（女性用）表尊敬，นะ、จ้ะ
  使语气柔和，多用于长辈对孩子或关系亲近者。女性老师说「ก่อนนะคะ」正是礼貌与亲切的叠用。
examples:
