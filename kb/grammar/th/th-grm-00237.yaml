id: th-grm-00237
language: th
type: grammar
level: L3
level_rank: 3
title: แม้ว่า…แต่…：虽然……但是……
structure: แม้ว่า（让步连词，引导อนุประโยก）+ 从句，แต่（转折连词）+ 主句
structure_pattern: แม้ว่า + อนุประโยก, แต่ + อนุประโยก
explanation_zh: แม้ว่า 引导让步从句，相当于“虽然/尽管”，主句前常用 แต่ 呼应，构成完整的让步—转折结构。与英语 although 和
  but 不能并用不同，泰语两者成对出现是常态，与中文一致。书面色彩较强，适合叙述与议论。
examples:
- text: แม้ว่า​ผม​จะ​ไม่รู้​ว่า​มัน​เกิด​อะไร​ขึ้น แต่​จาก​ท่าที​ของญาดา​เมื่อครู่​แล้ว​มัน​ต้อง​ไม่ใช่​เรื่องเล็ก​แน่
    ๆ
  reading: ''
  annot: แม้ว่า​ผม​จะ​ไม่รู้​ว่า​มัน​เกิด​อะไร​ขึ้น แต่​จาก​ท่าที​ของญาดา​เมื่อครู่​แล้ว​มัน​ต้อง​ไม่ใช่​เรื่องเล็ก​แน่
    ๆ
  translation_zh: 虽然我不知道发生了什么事，但从刚才雅妲的态度来看，这肯定不是小事。
