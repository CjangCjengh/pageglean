title: ความ- + 动词/形容词：抽象名词化前缀
structure: ความ-（คำอุปสรรค，名词化前缀）+ คำกริยา/คำวิเศษณ์ → คำนาม（抽象名词）
structure_pattern: ความ + V/Adj → N
explanation_zh: ความ- 是泰语最高产的构词前缀（อุปสรรค），加在动词或形容词前构成抽象名词，相当于中文的“……感/……性/……的状态”。如
  ความสงสัย（疑惑）、ความเคยชิน（习惯）。阅读中大量出现，是扩大词汇量的重要手段。
examples:
