id: th-grm-00241
language: th
type: grammar
level: L4
level_rank: 4
title: V + อยู่หรอก，แต่…：……倒是……，可是……
structure: คำกริยา + อยู่（持续助词）+ หรอก（让步语气助词），但 + 转折句
structure_pattern: V + อยู่หรอก, แต่ + …
explanation_zh: “V + อยู่หรอก”先承认某一事实（“倒是确实……”），随后用 แต่ 引出转折或限制，相当于中文“……是……，可是……”。口语色彩浓厚，与书面让步结构
  แม้ว่า…แต่… 形成语体对照，是地道泰语对话的标志之一。
examples:
- text: ก็​พูด​ภาษาไทย​อยู่​หรอก แต่​กับ​เด็ก​คน​อื่น ๆ แล้ว​เธอ​ไม่​พูด​ภาษาไทย​เลย
