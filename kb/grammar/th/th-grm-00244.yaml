title: ก่อนที่จะ：在……之前
structure: ประโยคหลัก + ก่อนที่ + จะ + กริยา
structure_pattern: ก่อนที่ + จะ + กริยา
explanation_zh: 「ก่อนที่ + จะ + 动词」表示「在做某事之前」，จะ 提示该动作尚未发生。时间从句位于主句之后，与中文「在……之前先做某事」语序相反，汉译时需调整。
examples:
- text: ผม​ลูบ​หัว​ปลอบใจ​เธอ​พักหนึ่ง​ก่อน​ที่​จะ​ถาม​เธอ​ต่อ
