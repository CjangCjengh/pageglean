title: 句末助词 นะ/ค่ะ/คะ：礼貌与语气
structure: ประโยค + นะ / ค่ะ / คะ (คำลงท้ายแสดงมารยาท/น้ำเสียง)
structure_pattern: ประโยค + นะ/ค่ะ/คะ
explanation_zh: ค่ะ 是女性用于陈述句末的礼貌助词；คะ 为升调，用于疑问或呼唤，与 นะ 连用写作 นะคะ。นะ 缓和语气，添亲近、安慰或劝诱色彩，不限性别。片段中男性用
  ผม 只用 นะ，女性ญาดา 用 ค่ะ/นะคะ，体现性别与语气的配合。
examples:
