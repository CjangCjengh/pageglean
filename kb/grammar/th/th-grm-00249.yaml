title: ถูก + 动词：被动与不如意
structure: ถูก + คำกริยา（กรรมวาจก：被动语态）
structure_pattern: ถูก + V
explanation_zh: 在泰语学校语法中属กรรมวาจก（被动句），结构为 ถูก + 动词，主语是动作的承受者。ถูก多用于不如意的事，如被欺负、被禁止；施事者可出现但常省略。片段中『ถูกแกล้ง』（被欺负）反复出现，是叙事文本的高频结构。
