id: th-grm-00251
language: th
type: grammar
level: L2
level_rank: 2
title: การ + 动词：动词名词化
structure: การ + คำกริยา → คำนาม（อาการนาม）
structure_pattern: การ + V
explanation_zh: การ 加在动词前构成名词性短语，相当于汉语「……的事／行为」，可作主语、宾语或介词宾语。片段中有 การแสดงฝีมือ、การทำอาหาร、การนัดหมาย、การถูกสั่งห้าม
  等。注意区分：ทำงาน 中的 การ 是「工作」一词，与本构词前缀同形。
examples:
- text: ความ​พยายาม​ใน​การ​แสดง​ฝีมือ​การ​ทำอาหาร​ของ​ผมก็​เป็นอัน​ต้อง​มลาย​หายไป
  reading: ''
