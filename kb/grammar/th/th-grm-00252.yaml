id: th-grm-00252
language: th
type: grammar
level: L1
level_rank: 1
title: หรือเปล่า / เหรอ：是非问句
structure: 陈述句 + หรือเปล่า / เหรอ（คำถาม ใช่-ไม่ใช่）
structure_pattern: S + V + หรือเปล่า / เหรอ
explanation_zh: 在陈述句末尾加 หรือเปล่า 构成是非问句，相当于汉语「……吗」；口语中常说成หรือเปล่า、ไหม。片段中老师反问时用了更口语的เหรอ：『ถูกแกล้งเหรอคะ?』。疑问句末的女性礼貌助词用คะ，男性用ครับ。
examples:
- text: คุณครู​ทราบเรื่อง​ที่อ​นาส​ตา​เซีย​ถูก​แกล้ง​หรือเปล่า​ครับ?
  reading: ''
  annot: คุณครู​ทราบเรื่อง​ที่อ​นาส​ตา​เซีย​ถูก​แกล้ง​หรือเปล่า​ครับ?
  translation_zh: 老师，您知道安娜斯塔西娅被欺负的事吗？
