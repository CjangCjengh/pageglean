title: ครับ / ค่ะ / คะ / นะ：句末礼貌与语气助词
structure: 句子 + ครับ（男）/ ค่ะ（女·陈述）/ คะ（女·疑问）/ นะ（柔化）
structure_pattern: ประโยค + ครับ/ค่ะ/คะ/นะ
explanation_zh: 泰语句末礼貌助词按说话人性别选择：男性用ครับ，女性陈述、祈使用ค่ะ，女性提问用คะ，正式场合几乎每句必带。นะ是柔化语气的助词，表示亲切、安抚，如『ไม่เป็นไรนะ』。片段中男女说话人交替出现，可对比观察。
examples:
- text: สวัสดี​ค่ะ​คุณร​ชา​นนท์ เชิญ​นั่ง​ก่อน​ค่ะ
