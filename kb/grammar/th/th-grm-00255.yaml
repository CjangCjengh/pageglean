id: th-grm-00255
language: th
type: grammar
level: L2
level_rank: 2
title: ถูก/โดน：被动与遭受
structure: ประธาน(受事主语) + ถูก/โดน(คำช่วยกริยา) + คำกริยา
structure_pattern: N + ถูก/โดน + V
explanation_zh: 在泰语学校文法中，ถูก 与 โดน 本是『碰到、遭受』义的คำกริยา（动词），后接另一动词时表示主语遭受该动作，相当于汉语『被／挨』，多用于不如意的事。施事者通常省略，直接以ประธาน＋ถูก＋กริยา组句。阅读时要注意：句子的主语是受事者而非施事者。
