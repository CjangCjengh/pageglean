title: ไหม / หรือเปล่า：是非疑问句
structure: ประโยคคำถาม：陈述句 + ไหม？/ 陈述句 + หรือเปล่า?
structure_pattern: S + V + O + ไหม? / S + V + O + หรือเปล่า?
explanation_zh: 泰语的ประโยคคำถาม（疑问句）不用前置的『吗』，而是在陈述句末尾加疑问语气词ไหม，或用正反选择式หรือเปล่า，两者都相当于汉语『……吗』。หรือเปล่า带有要求对方确认的语气。ได้ไหม即『可以吗』，用于请求许可。
examples:
