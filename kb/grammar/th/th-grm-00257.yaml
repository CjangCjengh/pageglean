id: th-grm-00257
language: th
type: grammar
level: L2
level_rank: 2
title: ให้：使役・目的与对象
structure: คำกริยา + ให้ + (กรรม) + คำกริยา
structure_pattern: V1 + ให้ + (O) + V2
explanation_zh: ให้本义是『给』（คำกริยา），接在动词后有两种常见用法：一是使役／目的『让、为了』，如บอกให้เธอเล่า（让她讲）、ถามให้แน่ใจ（问个明白）；二是对象／受益『给某人做某事』，如เล่าเรื่องราวให้ครูฟัง。区分的关键是看ให้后动作的执行者是否是主语自己。
examples:
- text: ผม​พยักหน้า​ให้​เธอ​เบา ๆ เป็น​เชิง​บอก​ให้​เธอ​เล่า​ไป​เลย
