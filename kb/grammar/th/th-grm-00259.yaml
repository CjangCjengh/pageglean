title: ลอง…ดู：试着……看看
structure: ลอง + 动词 + ดู（+ ให้）
structure_pattern: ลอง + V + ดู (+ ให้)
explanation_zh: ลอง表示「尝试」，ดู表示「看看结果」，前后呼应包住主要动词，构成泰语典型的连动结构，对应汉语「试着……看看」。句中จะ表示即将发生。句末的ให้表示动作是为对方而做（替、给）。
examples:
