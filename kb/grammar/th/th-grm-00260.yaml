id: th-grm-00260
language: th
type: grammar
level: L3
level_rank: 3
title: คงจะ…อยู่：恐怕……吧（推测与保留）
structure: คงจะ + 动词/形容词 (+ อยู่)
structure_pattern: คงจะ + V/Adj (+ อยู่)
explanation_zh: คง是表推测的副词（คำวิเศษณ์），将是能愿动词，合起来表示「大概、恐怕」，用于有依据的推断。句尾อยู่表示「仍然、还是」，让判断留有余地、语气委婉。也可不带อยู่，配合แน่「肯定」加强语气。
examples:
