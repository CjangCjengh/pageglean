id: th-grm-00261
language: th
type: grammar
level: L1
level_rank: 1
title: หรือเปล่า：是非问句「是不是……／……吗」
structure: 陈述句 + หรือเปล่า？
structure_pattern: VP + หรือเปล่า
explanation_zh: 在陈述句末尾加上หรือเปล่า，构成「是不是……／……吗」的是非问句，语气委婉，期待对方确认。回答可用ใช่/ไม่ใช่，或直接用动词的肯定/否定形式。与ไหม、ใช่ไหม功能相近，但거나
  หรือเปล่า 保留了「……还是不……」的选择意味。
examples:
- text: มี​อะไร​หรือเปล่าคะ​ครู?
  reading: ''
