title: ค่ะ／คะ：女性句末礼貌助词
structure: 句末 + ค่ะ（陈述）／คะ（疑问、呼唤）
structure_pattern: S + ... + ค่ะ/คะ
explanation_zh: ค่ะ和คะ都是女性使用的句末礼貌助词，男性对应的是ครับ。ค่ะ（降调）用于陈述句末，คะ（升调）用于疑问句末或呼唤对方。学生对老师说话时必须加上这类助词，否则会显得粗鲁。
