id: th-grm-00263
language: th
type: grammar
level: L2
level_rank: 2
title: ถูก + 动词：被动与遭受「被……」
structure: 受事主语 + ถูก +（施事）+ 动词
structure_pattern: NP + ถูก + (Agent) + V
explanation_zh: ถูก+动词表示被动，相当于中文的「被……」，多用于不如意、遭受义的事情。主语是动作的承受者，施事者放在ถูก与动词之间，也可省略。如「ถูกรุมแกล้ง」即「被（一群人）欺负」。
