title: ซิ（สิ）：催促、建议语气助词
structure: 动词／祈使句 + ซิ
structure_pattern: V + ซิ(สิ)
explanation_zh: ซิ（标准写法为สิ）是句末语气助词，用于祈使、建议、催促，语气亲切随意，相当于中文的「……呀／……吧」。老师说「มาทางนี้ซิ」即「到这边来呀」。带有随便色彩，对长辈或正式场合不宜使用。
examples:
