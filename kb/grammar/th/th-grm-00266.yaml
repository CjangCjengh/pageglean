title: V + ให้ + 人 + V：使令与连动
structure: 言说/使令动词 + ให้ + 宾语 + 第二动词
structure_pattern: V + ให้ + NP + V2
explanation_zh: 言说、使令类动词后接ให้+宾语+第二动词，表示「让/叫/请某人做某事」，类似中文的「让、叫」。片段中บอกให้ญาดาเข้าไปพัก即「让雅妲进去休息」。ให้后可接连动动词组如เข้าไปพัก，是泰语典型的连动式。
examples:
- text: ผม​บอก​ให้ญาดา​เข้าไป​พัก​ใน​ห้อง​ของ​ตัวเอง​ก่อน
  reading: ''
