title: ดังนั้น…จึง…：因果连接
structure: ดังนั้น + 分句，（主语）+ จึง + V
structure_pattern: ดังนั้น...จึง...
explanation_zh: ดังนั้น用于句首承接上文原因，จึง置于动词前引出结果，相当于中文的「所以…就…」。是书面与口语中常用的因果连接格式，语气较正式。
examples:
