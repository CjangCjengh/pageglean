title: ต่อให้…ก็…：让步假设
structure: ต่อให้ + 分句，ก็ + 分句
structure_pattern: ต่อให้...ก็...
explanation_zh: ต่อให้引出让步假设，相当于中文的「即使/就算…也…」，主句用ก็呼应，表示结论不随条件改变。片段中与疑问词ขนาดไหน连用，表示「无论欺负到什么程度都不会还手」。
examples:
- text: ต่อ​ให้​รังแก​ไป​ขนาด​ไหนก็​จะ​ไม่​สวนกลับ​มา
  reading: ''
