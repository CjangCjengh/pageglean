title: ไหม/ใช่ไหม/หรือเปล่า：是非问句
structure: 陈述句 + ไหม / ใช่ไหม / หรือเปล่า?
structure_pattern: '...ไหม / ...ใช่ไหม / ...หรือเปล่า'
explanation_zh: 句末加ไหม构成是非问句；ใช่ไหม用于求证说话人的推测，相当于中文的「…对吧/是吗」；หรือเปล่า则询问「是否…」，语气较中性。三者是泰语最基本的疑问结构。
