title: อย่า…สิ：禁止与催促语气
structure: อย่า + V（+ สิ）
structure_pattern: อย่า + V (+ สิ)
explanation_zh: อย่า置于动词前表示禁止，相当于中文的「别/不要…」。句末语气助词สิ增添催促、强调的色彩，带有埋怨或敦促的口吻。片段中อย่าตอบสั้น
  ๆ สิ即「别回答得这么简短啊」。
