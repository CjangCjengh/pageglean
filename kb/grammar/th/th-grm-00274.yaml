title: V＋ไป／มา＋V：趋向连动式
structure: กริยาหลัก + ไป/มา (บอกทิศทาง) + กริยาจุดมุ่งหมาย
structure_pattern: V1 + ไป/มา + V2
explanation_zh: 泰语连动式常在主要动词后加 ไป（远离说话人）／มา（朝向说话人）表示趋向，再接第二个动词表示目的，如 ลากไปคุย＝拖去谈。语序与中文相反：中文说「去／来＋V」，泰语说「V＋ไป/มา」。
examples:
- text: กลุ่ม​หัวหน้า​ห้องก็​มา​ดัก​เรียก​ไป​คุย​ด้วย
