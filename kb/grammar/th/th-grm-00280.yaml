title: ได้ (dâi)：能力与可能
structure: 动词（＋宾语）+ ได้，表示“能、会、可以”
structure_pattern: V + ได้
explanation_zh: 在泰语学校文法中，ได้ 置于主动词之后作补语，表示能力或可能性，相当于汉语“能V／V得了”。其声调为降调（dâi），与前置的完成体助动词
  ได้（dâai）不同。文中“แก้ปัญหาเองได้”即“能自己解决问题”。
