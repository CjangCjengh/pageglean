id: th-grm-00281
language: th
type: grammar
level: L2
level_rank: 2
title: ก่อนที่จะ：在……之前
structure: 主句 + ก่อนที่จะ + 动词（先做前件，后做后件）
structure_pattern: V1 + ก่อนที่ + จะ + V2
explanation_zh: ก่อนที่จะ 引导时间状语从句，表示主句动作发生在另一动作之前，相当于汉语“在……之前”。จะ 标示从句动作即将发生。文中“ยิ้มก่อนที่จะตอบ”即“先微笑，然后才回答”。
examples:
- text: ผม​ยิ้ม​บาง ๆ ก่อน​จะ​ตอบกลับ​ไป​ว่า
