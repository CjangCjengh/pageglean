title: ที่สุด：最高级“最……”
structure: 形容词／心理动词 + ที่สุด
structure_pattern: Adj + ที่สุด
explanation_zh: ที่สุด 置于形容词或心理动词之后构成最高级，相当于汉语“最……”。文中“ดีที่สุด”即“最好”，“อยากเห็นมากที่สุด”即“最想看到”。
examples:
- text: สิ่ง​ที่​ผม​อยาก​เห็น​มาก​ที่สุดก็​คือ​รอยยิ้ม​แบบนี้​ล่ะ​นะ
  reading: ''
