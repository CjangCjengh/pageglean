title: เอง/ด้วยตัวเอง：亲自、自己
structure: 动词 + เอง；ด้วย + ตัวเอง（独自、亲自）
structure_pattern: V + เอง / ด้วย + ตัวเอง
explanation_zh: เอง 附于动词或名词后，强调动作由本人完成；ด้วยตัวเอง 作状语，意为“靠自己、亲自”。文中反复出现“แก้ปัญหาเอง”“ด้วยตัวเอง”“จัดการเอง”，一再强调雅达想独自承担一切。
