id: th-grm-00285
language: th
type: grammar
level: L1
level_rank: 1
title: 进行体 กำลัง…อยู่：正在做某事
structure: กำลัง + 动词（+ อยู่）
structure_pattern: กำลัง + กริยา (+ อยู่) — คำช่วยกริยาแสดงเหตุการณ์กำลังดำเนิน
explanation_zh: 「กำลัง」置于动词前表示动作正在进行，相当于汉语的「正在／在」。「อยู่」可加在动词后加强持续意味，二者呼应构成进行体。泰语进行体须显式标记，不能像中文那样仅靠语境省略。
