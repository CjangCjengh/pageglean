id: th-grm-00286
language: th
type: grammar
level: L2
level_rank: 2
title: ก่อนจะ + 动词：在做……之前
structure: ก่อน + จะ + 动词
structure_pattern: ก่อน + จะ + กริยา — กริยาวิเศษณ์บอกลำดับเหตุการณ์
explanation_zh: 「ก่อน」意为「之前」，后接「จะ+动词」构成时间状语，表示主句动作先于另一动作发生。泰语没有动词变位，动作先后顺序靠这类标记词表达。本段两次出现，是叙述中衔接连续动作的常用手段。
