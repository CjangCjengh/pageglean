title: 动词 + ได้ยังไง：怎么……的／怎么会……
structure: 动词 + ได้ยังไง（+ กัน）
structure_pattern: กริยา + ได้ + ยังไง — คำถามวิธีการ/ความเป็นไปได้ (รูปพูดของ อย่างไร)
explanation_zh: 「ได้ยังไง」是「ได้อย่างไร」的口语形式，置于动词后询问方式或表示难以置信，相当于「怎么……的／怎么会……」。句尾可加「กัน」加强反问。比单纯提问多一分惊讶或不服的情绪。
examples:
- text: ไม่งั้น​ผม​จะ​ทำงาน​เป็น​นักเขียน​ได้​ยังไง​กัน
