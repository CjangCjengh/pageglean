title: ไหม / เหรอ 是非问与女性礼貌助词 คะ/ค่ะ
structure: 陈述句 + ไหม/เหรอ（+ คะ/ค่ะ）
structure_pattern: ประโยค + ไหม/เหรอ + (คะ/ค่ะ) — คำเสริมท้ายคำถาม/ความสุภาพ
explanation_zh: 「ไหม」是句尾是非疑问助词，相当于「……吗？」；「เหรอ」为「หรือเปล่า」的口语缩略，带意外或求证语气。女性说话人常在句尾加「คะ」（疑问/呼唤）或「ค่ะ」（陈述）以示礼貌。
