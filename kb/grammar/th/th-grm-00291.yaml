title: ครับ/ค่ะ/คะ：句末礼貌助词
structure: 小句 + ครับ（男性）/ ค่ะ・คะ（女性）
structure_pattern: Clause + ครับ/ค่ะ/คะ
explanation_zh: ครับ 是男性说话人用的句末礼貌词，ค่ะ、คะ 是女性用的：ค่ะ 用于陈述，คะ 用于疑问或呼唤。礼貌词由说话人的性别决定，与听话人无关。省略不算语法错误，但在正式或对陌生人场合会显得生硬。
