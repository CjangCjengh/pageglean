title: อะไร/ไหน/เหรอ：特指疑问句
structure: 疑问词（อะไร/ไหน）原位 + (เหรอ/คะ)（句末）
structure_pattern: … + อะไร/ไหน + (เหรอ/คะ)?
explanation_zh: 泰语特指疑问句不用倒装：疑问词 อะไร（什么）、ไหน（哪）放在答句中答案所在的位置，如“เขียนอะไร”＝写了什么、“ถึงไหน”＝到哪儿。句末可加
  เหรอ/หรือ 表示疑问或求证，相当于汉语的“呢/吗”。女性疑问句末的 คะ 兼表礼貌。
examples:
- text: อ่าน​ไป​ถึง​ไหนคะ?
