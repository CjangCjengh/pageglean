title: เผื่อ（ว่า）：以防、万一
structure: เผื่อ(ว่า)/เผื่อเวลา + 小句（主句说做法，从句说防备的情况）
structure_pattern: เผื่อ(ว่า) + Clause
explanation_zh: เผื่อ(ว่า) 是目的/条件连词（สันธาน），意为“以防、万一、为了……”，主句先说做法，เผื่อ 小句再说为之预作准备的情况。“เผื่อเวลา
  + 小句”即“以备……的时候”。它强调“为可能的情况预先准备”，与汉语“以免”方向不同。
