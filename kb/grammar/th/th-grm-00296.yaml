title: หรือเปล่า / เหรอ：是非问与确认
structure: 动词/形容词 + หรือเปล่า；陈述句 + เหรอ?
structure_pattern: VP + หรือเปล่า / เหรอ
explanation_zh: 「หรือเปล่า」接在动词或形容词之后构成是非问句，相当于中文『……吗／……没有』。「เหรอ」是「หรือ」的口语形式，用于句末表示确认或略带惊讶的反问，如『จริงเหรอ?』（真的吗？）；也可构成『งั้นเหรอ?』（那样吗？）。
