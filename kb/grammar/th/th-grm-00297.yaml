title: นะ / ค่ะ-คะ / สิ：句末语气助词
structure: 句子 + นะ / สิ / ค่ะ / คะ
structure_pattern: S + นะ / สิ / ค่ะ / คะ
explanation_zh: 泰语句末有丰富的语气助词：「นะ」缓和语气、表示叮嘱或征求认同；「ค่ะ/คะ」是女性礼貌助词，ค่ะ用于陈述、คะ用于疑问或呼唤，男性对应「ครับ」；「สิ」强调理所当然，如『แน่นอนสิ!』（当然了！）。片段中女性角色答话均带ค่ะ/คะ。
examples:
