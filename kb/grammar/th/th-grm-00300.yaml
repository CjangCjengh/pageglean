title: 为什么会……：ทำไม…ถึง…
structure: ทำไม + 主语 + ถึง + 动词短语
structure_pattern: ทำไม + NP + ถึง + VP
explanation_zh: 泰语询问原因常用“ทำไม…ถึง…”框架：ทำไม（为什么）提出疑问，ถึง引出结果性谓语，语气比单用ทำไม更强调原因与意外感。属于泰语典型的疑问词呼应结构。
examples:
- text: ทำไมญานัน​ถึง​ทัก​และ​โกรธ​เรื่อง​ที่​ผม​เรียกชื่อ​ของ​ญา​ดาว่า​คุณดา
  reading: ''
