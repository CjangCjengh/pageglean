title: 连动式：去……来……（ไป…มา…）
structure: ไป + 动词1 … มา + 动词2（多动词依序排列，不用连词）
structure_pattern: ไป + V1 … มา + V2
explanation_zh: 泰语连动结构把多个动词按时间与逻辑顺序直接排列，中间不用连词。ไป/มาเป็น趋向动词，标示动作朝向：“ไปจ้าง…มาช่วย”即“去雇……来帮忙”。句末ไหม构成是非问句。
examples:
- text: ผม​ต้อง​ไป​จ้าง CS* มา​ช่วยด้วย​ไหม​เนี่ย​หา?
