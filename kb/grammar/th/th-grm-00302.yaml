title: 一……就……：พอ…ก็…
structure: พอ + 先行动作，ก็ + 紧接动作
structure_pattern: พอ + VP1 + ก็ + VP2
explanation_zh: พอ…ก็…表示“一……就……”：前一分句以พอ引出刚发生的动作，后一分句用ก็引出紧接着发生的动作。强调两个动作在时间上紧密衔接。
