title: 比……还要……：มากกว่า…ซะอีก
structure: 性质/状态 + มากกว่า + ที่ + 参照句 + ซะอีก
structure_pattern: Adj/V + มากกว่า + ที่ + S + ซะอีก
explanation_zh: 比较结构用“形容词/动词 + กว่า”表示“更……”。本句以มากกว่า引出比较基准从句，句末ซะอีก加强语气，整体意为“比……还要……”，强调超出对方预想。
examples:
- text: เหมือน​ฉัน​มากกว่า​ที่​คุณ​ชา​คิด​ซะ​อีก
  reading: ''
