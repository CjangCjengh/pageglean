title: 「ไม่เคย + 动词：从未……过」
structure: คำช่วยกริยา（助动词）：ไม่ + เคย + 动词
structure_pattern: ไม่ + เคย + V
explanation_zh: เคย是คำช่วยกริยา（助动词），表示曾经有过某种经历，否定式ไม่เคย意为『从来没有……过』。它置于主要动词之前，与汉语经历体的否定『没……过』对应。与ยังไม่เคย（还没有过）相比，ไม่เคย的否定更为绝对。
examples:
- text: ไม่เคย​เข้าใจ​ความรู้สึก​ของ​คน​รอบ ๆ ตัว
