title: 「动词 + เป็น：会（做某事）」
structure: กริยา + ส่วนเติมเต็ม（补语）：动词 + เป็น（能力义）
structure_pattern: V + เป็น
explanation_zh: 动词后加เป็น表示通过学习而掌握的技能，相当于『会（做）』，与表示客观条件允许的ได้有所区别。片段连用ทำอาหารไม่เป็น、อ่านบรรยากาศไม่เป็น，逐条数落对方『压根不会』。否定形式为ไม่เป็น。
