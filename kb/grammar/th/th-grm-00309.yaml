id: th-grm-00309
language: th
type: grammar
level: L4
level_rank: 4
title: 「พลาง…พลาง…：一边……一边……」
structure: คำเชื่อม（连接词）：（พลาง）+ 动作A + พลาง + 动作B
structure_pattern: VP + พลาง + VP
explanation_zh: พลาง是表示同时进行的คำวิเศษณ์／คำเชื่อม，连接两个同时发生的动作，相当于『一边……一边……』。可出现一个或两个พลาง，位置比汉语『一边……一边……』灵活，常置于后一动作之前。多用于叙述性描写，能细腻呈现并行动作。
examples:
- text: พลาง​ยื่นมือ​มา​เกาะ​ชาย​เสื้อ​ผม​แล้ว​กระตุก​เบา ๆ พลาง​ช้อนตา​ขึ้น​มา​มอง​ผม​ด้วย​สีหน้า​กังวล
