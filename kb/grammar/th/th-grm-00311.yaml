id: th-grm-00311
language: th
type: grammar
level: L2
level_rank: 2
title: กว่า：比较句“比……更……”
structure: 形容词 + กว่า + 比较对象 (+ มาก)
structure_pattern: ADJ + กว่า + NP/Clause
explanation_zh: 比较句基本结构为“形容词 + กว่า + 比较对象”，相当于“比……更……”，比较对象后置。表示差距很大时可在句尾补 มาก（……得多）。比较对象还可以是
  ที่ 引导的从句，如“比……想的还……”。
examples:
