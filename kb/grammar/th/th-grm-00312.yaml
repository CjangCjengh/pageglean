id: th-grm-00312
language: th
type: grammar
level: L3
level_rank: 3
title: เกินไป：“太……、过于……”
structure: 形容词/动词 + เกินไป (+ สำหรับ + 对象)
structure_pattern: ADJ/V + เกินไป (+ สำหรับ + NP)
explanation_zh: 形容词或动词后加 เกินไป 表示程度过分，相当于“太……、过于……”，可用 สำหรับ 引出“对……而言”。句尾加 หน่อย
  可缓和语气，表示“有点太……”。
examples:
- text: แต่​ผม​ว่า​เรื่อง​นี้​มัน​ยัง​เร็ว​เกินไป​สำหรับ​คุณดา
  reading: ''
  annot: แต่​ผม​ว่า​เรื่อง​นี้​มัน​ยัง​เร็ว​เกินไป​สำหรับ​คุณดา
  translation_zh: 但我觉得这件事对达小姐来说还太快了。
