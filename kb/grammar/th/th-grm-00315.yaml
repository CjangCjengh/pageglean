title: ไม่…สักหน่อย：一点儿也不
structure: ไม่ + 动词 + สักหน่อย
structure_pattern: ไม่ + V + สักหน่อย
explanation_zh: ไม่ + 动词 + สักหน่อย 表示“一点儿也不……、根本不……”，สักหน่อย 在否定句中加强否定语气。同形结构在肯定句中则表示“稍微、一点”，需注意语境区分。
