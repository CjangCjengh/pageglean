title: แล้วแต่：随……、看……
structure: แล้วแต่ + จะ + 动词
structure_pattern: แล้วแต่ + จะ + V
explanation_zh: แล้วแต่ 表示“取决于、随……”，后接动词时常加 จะ。如 ก็แล้วแต่จะคิด 即“怎么想随你”，语气冷淡或带有赌气。句尾的
  สิ 加强“本来如此、随它去”的口吻。
examples:
- text: ก็แล้วแต่จะคิดสิ
