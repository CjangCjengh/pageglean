id: th-grm-00317
language: th
type: grammar
level: L2
level_rank: 2
title: เคย/ไม่เคย…เลย：曾经与从未
structure: เคย + V（曾经/向来）；ไม่เคย + V + เลย（从未……）
structure_pattern: เคย + VP; ไม่เคย + VP + เลย
explanation_zh: เคย 置于动词前，表示过去曾经发生或一贯如此，相当于“曾经、向来”。否定式 ไม่เคย…เลย 表示“从来没有……”，เลย 强化否定语气。片段里的
  เหมือนเคย（一如既往）是高频固定搭配。
examples:
- text: ยัง​คิด​เร็ว​ทำ​เร็ว​ไม่​รอ​ให้​คน​อื่น​พูด​จบ​อยู่​เหมือนเคย
