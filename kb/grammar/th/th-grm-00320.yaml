title: 连动式：ไป + V 与趋向补语
structure: ไป/มา + V；V + ลง/ขึ้น (+ ไป/มา) + V
structure_pattern: ไป/มา + VP; VP + ลง/ขึ้น + ไป/มา + VP
explanation_zh: 泰语常用连动式：ไป/มา + 动词表示“去/来做某事”，如 ไปคุย（去谈）。动词还可与趋向补语串联，如 ทิ้งตัว ลง
  ไป นอน（倒下去躺下），多个动词依次排列表达完整动作链。语序与汉语连动式大体一致，易于迁移。
examples:
- text: เดี๋ยว​หลังจากนี้​ฉัน​จะ​ไป​คุย​กับ​หนูดา​ต่อ​เอง
