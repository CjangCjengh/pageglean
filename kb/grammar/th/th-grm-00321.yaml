title: ไม่ยอม＋V：不肯、不服输
structure: ไม่（否定副词）＋ ยอม（คำช่วยกริยา／辅助动词）＋ 主要动词
structure_pattern: ไม่ + ยอม + V
explanation_zh: 「ยอม」是辅助动词（คำช่วยกริยา），置于主要动词前表示「愿意、肯」。否定式「ไม่ยอม」强调主观上不肯、拒绝或不服输，语气强于单纯的「ไม่＋V」。
examples:
- text: ดา​ไม่ยอมแพ้​แม่นัน​หรอก​นะคะ
