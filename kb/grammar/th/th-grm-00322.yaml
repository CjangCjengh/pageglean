title: 连动式与趋向补语：V＋ขึ้น/ออก/ไป/มา
structure: 主要动词 ＋ 趋向动词（ขึ้น／ออก／เข้า／ลง）＋（จาก＋处所）＋ ไป／มา
structure_pattern: V + ขึ้น/ออก/เข้า/ลง + (จาก + N) + ไป/มา
explanation_zh: 泰语用连动式表达移动方向：趋向动词ขึ้น／ออก／เข้า／ลง置于主要动词后作补语，还可再叠加ไป／มา表示离去或趋近。语序与汉语「动词＋趋向补语」大致对应，如「ลุกขึ้น」站起来、「เดินออกจากห้องไป」走出房间去。
examples:
- text: พอ​พูด​จบ​เธอก็​ลุกขึ้น​แล้ว​เดิน​ออกจาก​ห้อง​ไป​อย่าง​รวดเร็ว
