title: V＋จนได้：终究还是……了
structure: 动词／小句 ＋ จนได้（补语小句，表示最终结果）
structure_pattern: VP + จนได้
explanation_zh: 「จนได้」附于动词或小句之后，表示经过一番周折，某事终究还是发生了，常带不情愿或无奈的语气。文中与表被动的「โดน」连用，表达「到底还是被算计了」。
