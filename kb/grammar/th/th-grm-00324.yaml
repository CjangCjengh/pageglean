title: V＋ได้หรือเปล่า：能不能……？
structure: 动词 ＋ ได้（可能）＋ หรือเปล่า（正反疑问）
structure_pattern: V + ได้ + หรือเปล่า
explanation_zh: 「หรือเปล่า」是正反疑问结构；与可能补语「ได้」连用，构成对「能否做到某事」的提问。与「V＋ได้ไหม」意思相近，但并列疑问的语气更完整。
examples:
- text: เธอ​เป็นห่วง​ว่า​ฉัน​จะ​หา​ใคร​มา​ดูแล​หนูดา​ได้​หรือเปล่า
