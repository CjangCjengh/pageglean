title: จะ…ก็แล้วกัน：那就……吧
structure: （จะ＋）动词短语 ＋ ก็แล้วกัน（＋นะ）（口语收尾惯用语）
structure_pattern: VP + ก็แล้วกัน (+ นะ)
explanation_zh: 「แล้วกัน」是口语收尾语，表示「就这样吧、姑且如此」；与「ก็」「จะ」搭配，带暂且放下、听其发展的意味。文中表达「那就等着瞧吧」。
examples:
- text: ผม​จะ​รอดู​ก็แล้วกัน​นะ ว่า​ต่อจากนี้​เธอ​จะ​ทำ​ยัง​ไง​พิชิต​ใจ​ผม
  reading: ''
  annot: ผม​จะ​รอดู​ก็แล้วกัน​นะ ว่า​ต่อจา
  translation_zh: 那我就拭目以待吧，看从今往后她要怎样赢得我的心。
