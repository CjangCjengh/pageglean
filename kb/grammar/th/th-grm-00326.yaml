id: th-grm-00326
language: th
type: grammar
level: L2
level_rank: 2
title: แล้ว：完成体与动作接续
structure: 动词／形容词 ＋ แล้ว（เสร็จสิ้น）；แล้ว ＋ 后续动词（เชื่อมลำดับ）
structure_pattern: V/Adj + แล้ว ; แล้ว + V
explanation_zh: แล้ว 跟在动词或形容词后表示动作已完成或状态已经达成，相当于「了／已经」，如「ดีแล้ว」（已经好了吗）。它还能衔接前后两个事件，「…แล้วมาโดน…」即「先……之后又遭到……」。与汉语不同，แล้ว
  紧跟所修饰的词，不出现在句末。
examples:
- text: คุณ​ตั้งใจทำ​งาน​อย่าง​เต็มที่​แล้ว​มา​โดน Toxic ใส่​แบบนี้
  reading: ''
