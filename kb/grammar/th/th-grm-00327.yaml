id: th-grm-00327
language: th
type: grammar
level: L2
level_rank: 2
title: ได้：实现与机会
structure: ได้ ＋ 动词หลัก（คำช่วยกริยาบอกผลสำเร็จ/โอกาส）
structure_pattern: ได้ + V ; ยังไม่ + ได้ + V ; จะ + ได้ + V
explanation_zh: ได้ 置于动词前有两种常见用法：一是表示动作已经完成或实现，否定式「ยังไม่ได้＋V」意为「还没有做」；二是表示获得机会，相当于「得以／能」。片段中「ยังไม่ได้ย้าย……」与「จะได้พบ……」恰好分别对应这两种用法，需靠语境区分。
examples:
- text: ผม​ยัง​ไม่ได้​ย้ายสัมมะโนครัว​เข้า​ไป​ใน​บาง​ขวาง
  reading: ''
