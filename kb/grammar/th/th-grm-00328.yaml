id: th-grm-00328
language: th
type: grammar
level: L2
level_rank: 2
title: ต้อง：必要与义务
structure: ต้อง ＋ 动词หลัก（คำช่วยกริยาบอกความจำเป็น）
structure_pattern: ต้อง + V ; ต้อง + ขอ + V
explanation_zh: ต้อง 是表示必要或义务的助动词，相当于「必须／不得不」，如「ต้องถามตัวเอง」（不得不问自己）。惯用搭配「ต้องขอ＋动词」（如
  ต้องขอขอบคุณ）语气礼貌客气，常见于后记、致辞等正式客套场合。
examples:
- text: ผล​งาน​เรื่อง​นี้​ทำเอา​ผม​ต้อง​ถาม​ตัวเอง
