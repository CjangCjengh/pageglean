id: th-grm-00329
language: th
type: grammar
level: L1
level_rank: 1
title: ไหม：是非问句
structure: 陈述句 ＋ ไหม（คำช่วยท้ายประโยคคำถาม ใช่/ไม่ใช่）
structure_pattern: S + V + … + ไหม
explanation_zh: ไหม 置于句末构成是非问句，相当于汉语的「吗」，句子语序与陈述句完全一致。回答可用 ใช่/ไม่ใช่，也可重复谓语动词。片段中以「จะ……ไหม」询问某种情况是否会发生。
examples:
- text: มา​โดน Toxic ใส่​แบบนี้​จะ​มี​กำลังใจ​ทำงานต่อ​ไหม
