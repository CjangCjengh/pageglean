title: đã：过去/完成标记
structure: đã + 动词/形容词（表示动作已完成或情况已成过去）
structure_pattern: đã + V/A (phó từ chỉ thể hoàn thành)
explanation_zh: đã 是置于动词、形容词前的副词（phó từ），表示动作已完成或状态已成为过去，相当于中文的“已经……了”。诗中 dùng đã
  mất、đã cho 表达爱情已逝、无法挽回。
