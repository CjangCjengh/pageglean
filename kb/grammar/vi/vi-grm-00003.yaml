id: vi-grm-00003
language: vi
type: grammar
level: L1
level_rank: 1
title: chưa：尚未（未实现）
structure: chưa + 动词（表示到说话时某事尚未发生）
structure_pattern: chưa + V (phó từ phủ định, thể chưa hoàn thành)
explanation_zh: chưa 表示“还没有”，强调到目前为止尚未发生，但隐含将来可能发生，与单纯否定 không 不同。文中指母亲当时还没有生下妹妹。
examples:
