id: vi-grm-00004
language: vi
type: grammar
level: L2
level_rank: 2
title: hơn…nhiều：比较级与程度加强
structure: 形容词 + hơn + 比较对象 + nhiều（比……得多）
structure_pattern: A + hơn + NP + nhiều (cấu trúc so sánh hơn)
explanation_zh: 越南语比较级用“形容词 + hơn + 比较对象”表示“比……更……”，句末加 nhiều 表示程度大，相当于“……得多”。文中两次以此比较今昔，突出变化之大。
examples:
