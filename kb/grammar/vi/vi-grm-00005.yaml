id: vi-grm-00005
language: vi
type: grammar
level: L3
level_rank: 3
title: chỉ có…mới…：唯有……才……
structure: chỉ (có) + 条件，… mới + 结果（只有……才……）
structure_pattern: chỉ (có) + điều kiện, ... mới + kết quả (phó từ hạn định + phó
  từ)
explanation_zh: chỉ (có) 表“只有”，mới 与之呼应，表示条件达成后结果才出现，构成“只有……才……”结构。文中说只有长大后，才染上面对女性局促的毛病。
examples:
- text: Chỉ có sau này, khi lớn lên, tôi mới mắc cái tật lóng nga lóng ngóng trước
    phụ nữ.
  reading: ''
  annot: Chỉ có sau này, khi lớn lên, tôi mới mắc cái tật lóng nga lóng ngóng trước
    phụ nữ.
  translation_zh: 只是到了后来，长大了之后，我才落下在女性面前手足无措的毛病。
