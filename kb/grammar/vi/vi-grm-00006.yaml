title: cứ：持续、只顾地做某事
structure: cứ + 动词（表示不顾外界情况、持续不断地做）
structure_pattern: cứ + V (phó từ chỉ sự tiếp diễn liên tục)
explanation_zh: cứ 是副词，表示动作不顾外界情况、持续不断地进行，含“一直”“只顾”之意。文中写小女孩没察觉有人靠近，仍埋头挖沙堆沙。
examples:
