title: hả / gì vậy：疑问句与疑问词
structure: 陈述句 + hả？（是非问）；疑问词 gì + vậy？（特指问）
structure_pattern: mệnh đề + hả (câu hỏi có-không); từ để hỏi (gì) + vậy (câu hỏi
  có từ nghi vấn)
explanation_zh: hả 置于句末，把陈述句变成是非问句，语气口语化；gì 是疑问代词“什么”，句末的 vậy 使语气更柔和自然。文中是小男孩问小女孩的两句话。
