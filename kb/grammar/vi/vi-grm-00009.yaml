title: 人称与称谓：anh-em 与 tao-mày 的语体转换
structure: 人称代词（đại từ xưng hô）借亲属称谓指代双方：anh-em（哥-妹，礼貌）、tao-mày（我-你，亲昵或粗率）、nó（他/她）
structure_pattern: anh-em | tao-mày | nó
explanation_zh: 越南语的人称代词（đại từ xưng hô）没有统一形式，须按双方年龄、性别、亲疏选用亲属称谓。礼貌或初识用 anh（哥/你）-em（妹/我），熟稔后可转用
  tao（我）-mày（你），后者亲昵但较粗率。片段中两人从 anh-em 转为 tao-mày，正体现关系由生疏变亲密。
