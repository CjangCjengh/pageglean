title: 体貌助词 đã / rồi：完成与变化
structure: đã + 动词（已完成/已成过去）；动词 + rồi（已经……/情况变化）
structure_pattern: đã + V ; V + rồi
explanation_zh: đã 和 rồi 都是表『体』（thể）的副词（phó từ）：đã 置于动词前，表动作已完成或已成过去；rồi 常居句末，表『已经……』或情况发生变化。两者常呼应使用，相当于中文的『已经……了』。
