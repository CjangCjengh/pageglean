id: vi-grm-00011
language: vi
type: grammar
level: L2
level_rank: 2
title: 助词 mới：刚刚 / 才（方）
structure: mới + 动词（刚发生不久；也可表条件承接『才/方能』）
structure_pattern: mới + V
explanation_zh: mới 是副词（phó từ），置于动词前表动作刚发生不久，相当于『才/刚』。它还常表条件承接，意为『才、方能』（你先答应消气我才放手）。中文的『才』恰好兼有这两种意味，可帮助理解。
