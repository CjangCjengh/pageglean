title: 疑问语气词 hả、hén、vậy
structure: 陈述句 + 句末语气词（tình thái từ）hả / hén / vậy 构成疑问
structure_pattern: S + V … + hả / hén / vậy ?
explanation_zh: hả、hén、vậy 属语气词/情态词（tình thái từ），附在句末即可构成疑问，无需改变语序。hả 表一般是非问或求证（相当于『吗』），hén
  表征询同意（相当于『……对吧』），vậy 用于特指问以加强语气。
