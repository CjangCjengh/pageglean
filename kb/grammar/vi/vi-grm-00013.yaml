title: 强调否定：đâu có + V
structure: đâu có + 动词（才没有……，带反驳语气）
structure_pattern: đâu có + V
explanation_zh: đâu có + 动词 是带反驳、辩解语气的强调否定，意为『才没有/哪有的事』，否定力度强于单纯的 không。常用于否认对方的指控或说法。片段中女孩即用『Em
  đâu có nhìn lén!』否认偷看。
