title: 持续语气：cứ + V
structure: cứ + 动词（只管/一个劲儿地……）
structure_pattern: cứ + V
explanation_zh: cứ 是副词（phó từ），置于动词前，表示『只管/一个劲儿地』做某事，强调动作持续或不顾他人。可译为『只顾、尽管』。如『Nó cứ
  cắm cúi bươi cát』即『她只顾埋头扒沙』。
