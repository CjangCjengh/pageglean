title: 叠音词（từ láy）：摹状与弱化
structure: 叠音构词：A → AA，增添『有点儿、微微』的口语色彩
structure_pattern: 'từ láy: AA (quê quê, hay hay)'
explanation_zh: 叠音词（từ láy）是越南语极富特色的构词法，通过重叠音节来摹状或弱化语气，如 quê quê（有点尴尬）、hay hay（挺好玩）。重叠后常带『有点儿、微微』的意味，比单用更生动、更口语化。
