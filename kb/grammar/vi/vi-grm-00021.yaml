id: vi-grm-00021
language: vi
type: grammar
level: L3
level_rank: 3
title: không chỉ… mà ngay cả… cũng…：不仅……就连……也……
structure: không chỉ + A, mà ngay cả + B + cũng + V/Adj
structure_pattern: không chỉ… mà (ngay cả)… cũng…（cặp quan hệ từ tăng tiến）
explanation_zh: 递进复句，“không chỉ… mà…”表“不仅……而且……”，插入“ngay cả”（甚至连）举出更极端的例子，再以“cũng”呼应。对应中文“不仅……就连……也……”。学校语法归为表tăng
  tiến（递进）的成对关联词结构。
examples:
- text: không chỉ ánh mắt, nụ cười, mái tóc mà ngay cả cái tên Việt An đối với tôi
    cũng trở nên gần gũi
  reading: ''
  annot: không chỉ ánh mắt, nụ cười, mái tóc mà ngay cả cái tên Việt An đối với tôi
