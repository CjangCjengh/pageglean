title: Adj + nhất：最高级（最……）
structure: Adj + nhất (+ là + mệnh đề)
structure_pattern: tính từ + nhất（so sánh hơn nhất）
explanation_zh: 越南语最高级用“形容词 + nhất”表示，相当于中文“最……”，属学校语法比较范畴（so sánh hơn nhất）中的最高级形式。文中“Khổ
  nhất là…”作话题性主语，引出“最要命的是……”的内容。
examples:
- text: Khổ nhất là ngay từ lần đầu tiên trông thấy Việt An
