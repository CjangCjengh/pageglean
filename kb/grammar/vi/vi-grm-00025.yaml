id: vi-grm-00025
language: vi
type: grammar
level: L2
level_rank: 2
title: vừa…vừa…：一边…一边…／既…又…
structure: vừa + V/Adj + vừa + V/Adj
structure_pattern: vừa + V/Adj + vừa + V/Adj
explanation_zh: 「vừa A vừa B」表示两个动作或状态同时进行，相当于汉语的“一边…一边…”或“既…又…”。两个位置可接动词（边走边讨论），也可接形容词（既愧疚又高兴）。片段中多次出现，是描写并行状态的高频结构。
examples:
- text: Tôi đi bên cạnh, trống ngực đập thình thịch, trong lòng vừa áy náy vừa sung
    sướng.
