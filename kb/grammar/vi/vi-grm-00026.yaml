title: bị / được：不如意与如意的被动遭遇
structure: S + bị / được + V
structure_pattern: S + bị/được + V
explanation_zh: “bị”引出不利、不情愿的遭遇，相当于“被／挨”；“được”引出有利、令人庆幸的遭遇，相当于“得以／能”。后接动词时主语是动作的承受者，如“bị
  mẹ la”（被妈妈骂）、“được đi chung”（得以同行）。这是越南语表达被动与遭遇的核心手段，动词本身不变形。
examples:
