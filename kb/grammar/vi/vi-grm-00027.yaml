id: vi-grm-00027
language: vi
type: grammar
level: L2
level_rank: 2
title: hơn 比较句：A + 形容词 + hơn + B
structure: A + Adj + hơn + B
structure_pattern: Adj + hơn + NP/小句
explanation_zh: 越南语比较句的语序是“主语 + 形容词 + hơn + 比较对象”，“hơn”置于形容词之后，相当于汉语“比”字句但不用前置词。比较对象可以是名词，也可以是小句，如“hơn
  tôi tưởng”（比我想象得更……）。
examples:
- text: Áy náy vì thấy Việt An lo lắng về cái áo hơn tôi tưởng.
