title: đã：已然／过去助词
structure: đã + V/Adj
structure_pattern: đã + V/Adj
explanation_zh: “đã”是完成／过去助词，置于动词或形容词之前，表示动作已经发生或状态已经实现，相当于“已经……了”。它只是前置虚词，不改变动词形态，可与时间状语配合标示过去。片段中多次用于追述已发生的事。
examples:
- text: Biết ơn tôi về việc tôi đã quan tâm đến cái áo của nó
