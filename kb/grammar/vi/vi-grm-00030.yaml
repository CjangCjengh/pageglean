id: vi-grm-00030
language: vi
type: grammar
level: L1
level_rank: 1
title: sẽ：将来助词
structure: sẽ + V/Adj
structure_pattern: sẽ + V/Adj
explanation_zh: “sẽ”是将来时助词，置于动词或形容词之前，相当于“会、将”，动词本身不变形。片段连用多个“sẽ”，铺陈主人公对第二天情景的想象与期待。可与“hẳn／chắc”连用表示推测语气（hẳn
  sẽ = 肯定会）。
examples:
- text: Việt An sẽ chào tôi bằng một nụ cười đầy cảm tình.
  reading: ''
  annot: Việt An sẽ chào tôi bằng một nụ cười đầy cảm tình.
  translation_zh: 越安会带着满脸好感的笑容来向我打招呼。
