id: vi-grm-00032
language: vi
type: grammar
level: L3
level_rank: 3
title: chưa kịp…đã…：还没来得及…就…
structure: chưa kịp + V1，… đã + V2
structure_pattern: chưa kịp + V … đã + V
explanation_zh: “kịp”意为“来得及”，“chưa kịp V”即“还没来得及做某事”。后句与“đã”呼应，表示“还没来得及……就已经……”，强调后一动作来得极快、令人猝不及防，叙事中极具表现力。
examples:
- text: 'Tôi chưa kịp mở miệng, nó đã chỉ tay vô trán tôi, dọa:'
