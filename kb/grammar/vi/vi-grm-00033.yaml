id: vi-grm-00033
language: vi
type: grammar
level: L1
level_rank: 1
title: đã…rồi：标记过去与完成
structure: đã（时间副词/phó từ）+ 动词 …（rồi）
structure_pattern: đã + V (+ rồi)
explanation_zh: đã 是置于动词前的副词（虚词），表示动作已经发生或完成，相当于汉语的“了／已经”。越南语动词不变位，时态全靠这类虚词表达。句尾的
  rồi 常与 đã 呼应，加强已然语气。
examples:
- text: Ông bà đã dạy rồi!
  reading: ''
  annot: Ông bà đã dạy rồi!
  translation_zh: 老一辈（爷爷奶奶）已经这样教导过了！
