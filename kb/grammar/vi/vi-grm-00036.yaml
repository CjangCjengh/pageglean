id: vi-grm-00036
language: vi
type: grammar
level: L3
level_rank: 3
title: mới…đã…：刚……就已经……（比预期来得早）
structure: （chỉ） mới + V1 … đã + V2
structure_pattern: (chỉ) mới + V1 … đã + V2
explanation_zh: mới 表示动作刚发生或数量很少，đã 表示后续情况已然出现，前后呼应构成“刚／只……就已经……”，强调事情比预期来得早，常含惊讶语气。片段中两处均为此结构。
examples:
- text: Chỉ mới thoáng nghĩ tới chuyện xui xẻo đó, tôi đã thấy lạnh cả người
