id: vi-grm-00037
language: vi
type: grammar
level: L3
level_rank: 3
title: chỉ đến khi…mới…：直到……才……
structure: Chỉ đến khi + 小句（前置时间状语），主语 + mới + V
structure_pattern: chỉ đến khi + Clause , S + mới + V
explanation_zh: 时间状语（trạng ngữ）前置以示强调：chỉ đến khi… 限定时间条件，主句中的 mới 表示“才”，相当于汉语“直到……才……”。段首也可换用
  cho tới…，意义相近。
examples:
- text: Chỉ đến khi tiếng trống vào học vang lên, tôi mới lò dò ôm cặp vô lớp
