title: đi、hả：句末祈使与反诘语气词（情态词）
structure: 祈使句（câu cầu khiến）+ đi ／ 疑问句（câu nghi vấn）+ hả
structure_pattern: Clause + đi! / Clause + hả?
explanation_zh: đi 是祈使句的情态词（tình thái từ），置于句末表示催促、鼓励对方行动，接近汉语的“吧”。hả 是疑问情态词，表示质问或带有惊讶的反诘，口语色彩强、语气直接。
examples:
- text: Ông lại đây nói chuyện với Việt An đi!
