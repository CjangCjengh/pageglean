title: 分类词（量词）：cuốn/câu
structure: 数词/疑问词 + 分类词 + 名词
structure_pattern: NUM/WH + CL(cuốn, câu) + N
explanation_zh: 越南语名词前须搭配分类词（量词），类似中文的“本”“句”：书、册用“cuốn”，诗句、句子用“câu”。即使说“什么书”也要说“cuốn
  gì”，量词不可省略。这是越南语名词短语的基本结构。
