id: vi-grm-00042
language: vi
type: grammar
level: L1
level_rank: 1
title: 特指疑问句：gì…vậy?（……呢/呀？）
structure: 疑问词(gì/đâu…) + … + vậy?
structure_pattern: WH-word(gì/đâu/sao) + … + vậy
explanation_zh: 越南语特指疑问句常在句末加语气词“vậy”，使语气自然、口语化，相当于中文“……呢？/……呀？”。疑问词（如 gì=什么）保持原位，不需前置。本片段两次出现，是日常口语高频问法。
examples:
