id: vi-grm-00043
language: vi
type: grammar
level: L2
level_rank: 2
title: rồi：动作先后承接（然后/了）
structure: V₁ + rồi + V₂
structure_pattern: V1 + rồi + V2
explanation_zh: “rồi”放在前一动词后，表示该动作完成或先于后一动作发生，相当于中文“然后/……了”。片段用它叙述连续动作（点头然后低头继续看）。是越南语表示动作先后顺序的核心时态虚词。
examples:
- text: Việt An gật đầu rồi cúi xuống đọc tiếp.
