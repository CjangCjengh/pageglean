title: chưa 与 đã…chưa（还没……/……了吗）
structure: chưa + V（还没）；đã + V + chưa?（……了吗/没有）
structure_pattern: chưa + V ; đã + V + chưa?
explanation_zh: “chưa”表示“还没（做某事）”，与表一般否定的“không”相对。疑问形式用“đã…chưa”，问某事发生了没有，相当于中文“……了吗？/……没有？”。这是越南语体貌否定的重要区分。
examples:
- text: Hóa ra nó chưa quên "tội ác" của tôi hôm nào.
