title: 是非问：Adj + không? / …hay không
structure: 形容词/小句 + (hay) không?
structure_pattern: ADJ/CL + (hay) không
explanation_zh: 形容词或句子后加“không”构成是非问，如“Hay không?”（好看吗？）；“hay không”也可表“……与否/是否”。片段两种用法均出现。分别对应中文的“……吗？”与“是否……”。
