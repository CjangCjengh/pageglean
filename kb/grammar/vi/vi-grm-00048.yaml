title: 语气词 nghen：请求/叮嘱（南方口语）
structure: 句末 + nghen（请求、叮嘱、商量）
structure_pattern: S + V + … + nghen
explanation_zh: “nghen”是南方口语常用的句末语气词，表示请求、叮嘱或商量，语气亲切，相当于中文“……哦/……呗/……好吗”。片段中“cho tôi
  mượn nghen!”（借我看看呗）、“nhớ giữ cẩn thận nghen!”（记得好好保管哦）为典型用法。
examples:
- text: Chừng nào coi xong Việt An cho tôi mượn nghen!
  reading: ''
