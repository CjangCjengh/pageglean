- text: Chẳng lẽ cuốn sách bị rách chỗ nào, Việt An không chịu nhận chăng?
  reading: ''
  annot: Chẳng lẽ cuốn sách bị rách chỗ nào, Việt An không chịu nhận chăng?
  translation_zh: 莫非书哪里被撕破了，越安不肯收下吗？
