id: vi-grm-00050
language: vi
type: grammar
level: L3
level_rank: 3
title: 「nếu…thì…」条件复句：假设与虚拟
structure: Nếu + điều kiện + thì + kết quả（câu ghép chính phụ；虚拟语气配 đã…rồi）
structure_pattern: nếu + clause + thì + clause (+ đã…rồi)
explanation_zh: 「nếu…thì…」是越南语条件复句（câu ghép chính phụ）的关联词对，相当于汉语「如果……就……」；「có…thì」为强调变体。配合完成体助词「đã…rồi」可表示与事实相反的虚拟，如「Nếu
  có thể chui được xuống đất thì tôi đã chui rồi」。
examples:
- text: Nếu có thể chui được xuống đất thì tôi đã chui rồi.
  reading: ''
