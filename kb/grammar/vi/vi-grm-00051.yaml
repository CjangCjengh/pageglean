title: 句末祈使语气词「đi」
structure: V + đi!（tình thái từ cầu khiến cuối câu）
structure_pattern: V + đi
explanation_zh: 句末语气词「đi」使句子构成祈使句（câu cầu khiến），表示请求、催促或建议，语气亲切而不生硬，相当于汉语「……吧」「快……」。片段中两次出现于同学对话。
