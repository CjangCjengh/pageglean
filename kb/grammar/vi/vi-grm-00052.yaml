title: 是非问句：「…không?」与「có…hay không?」
structure: …không?／Có + V + (hay) không?（câu nghi vấn có–không）
structure_pattern: V + không / có + V + hay không
explanation_zh: 越南语是非问句（câu nghi vấn）不用「吗」，而是在谓语后加「không」，或用框式结构「có…(hay) không」表示「是否」。后者追问、责问语气更强。
