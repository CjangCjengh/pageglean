title: 「chẳng lẽ…chăng」揣测反问
structure: Chẳng lẽ + P + chăng?（câu nghi vấn tu từ – phỏng đoán）
structure_pattern: chẳng lẽ + clause + chăng
explanation_zh: 「chẳng lẽ」置于句首，相当于「难道／莫非」，与句末文言语气词「chăng」呼应，构成揣测性反问，表示说话人自己也不敢确定的猜测。属较文的书面语体。
examples:
- text: Chẳng lẽ cuốn sách bị rách chỗ nào, Việt An không chịu nhận chăng?
  reading: ''
