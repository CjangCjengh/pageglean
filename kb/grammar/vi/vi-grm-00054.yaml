title: 「hết…này đến…khác」遍指列举
structure: hết + X này + đến + X khác（cấu trúc liệt kê kế tiếp）
structure_pattern: hết + X này + đến + X khác
explanation_zh: 「hết＋名词＋này＋đến＋名词＋khác」表示「一个……又一个……」，强调遍历、数量多，相当于汉语「这个……那个……」。「lùng
  hết hiệu sách này đến hiệu sách khác」即找遍一家又一家书店。
examples:
- text: Chiều hôm đó, tôi phóng xe đi lùng hết hiệu sách này đến hiệu sách khác.
