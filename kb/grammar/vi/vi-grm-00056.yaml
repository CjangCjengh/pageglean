title: 是非问句：句末「không」与「có…không」
structure: Có + V/Adj + không? 或 Adj + không?
structure_pattern: có + V + không（câu nghi vấn，疑问句）
explanation_zh: 句末加疑问虚词「không」构成是非问，相当于汉语「……吗」；更完整的框架是「có + 动词 + không」，其中「có」为强调动作/情况存在的焦点副词。回答可用「có
  / không」。
