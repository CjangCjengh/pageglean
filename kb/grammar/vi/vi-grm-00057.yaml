title: 句末助词「rồi」：新状态的出现
structure: 小句 + rồi（句末）
structure_pattern: clause + rồi（trợ từ cuối câu，句末助词）
explanation_zh: 句末「rồi」表示情况出现变化或新状态，相当于汉语语气词「了」；也常与「lắm」连用加强肯定语气。注意区别于动词前表完成的副词「đã」：「đã」侧重动作已然，「rồi」侧重当前已成的状态。
