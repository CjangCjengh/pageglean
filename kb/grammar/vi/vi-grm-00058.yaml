title: 结果补语「được」＋数量＋分类词「cái」
structure: V + được + 数词 + cái；cái thứ + 数词（第…下）
structure_pattern: V + được + số từ + cái（补语 + 分类词）
explanation_zh: 动词后的「được」作结果补语，表示动作得以实现或达到某一数量。计数动作次数时用分类词「cái」：「nhảy được bảy cái」＝跳成了七下；序数说「cái
  thứ + 数词」。语序与汉语不同（动词＋được＋数量＋cái），须注意。
