title: 不如意被动：bị + V
structure: 主语 + bị + V（不利遭遇）
structure_pattern: bị + V（câu bị động，被动句）
explanation_zh: 「bị + 动词」构成表不如意的被动，主语遭受不利之事；表有利遭遇则用「được + V」。「ăn đòn」为口语「挨打」。本句还套用反问框架「Bộ…hả」加强责备语气。
examples:
- text: Bộ mày muốn tao bị ăn đòn hả?
