title: 「vừa A vừa B」：两个动作同时进行
structure: vừa + V1，vừa + V2
structure_pattern: vừa + V + vừa + V（并列关联结构）
explanation_zh: 「vừa…vừa…」表示两个动作或状态同时发生，相当于汉语「一边……一边……」，属并列关联结构。句中「luôn miệng」表示不停地、一个劲儿地。
examples:
- text: Vừa làm, nó vừa xuýt xoa luôn miệng.
