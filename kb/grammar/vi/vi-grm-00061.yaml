title: 反问句式「Cần gì + V/NP」
structure: Cần gì + 名词/动词！（＝何必……！／用不着……！）
structure_pattern: cần gì + NP/V（câu hỏi tu từ，反问句）
explanation_zh: 「Cần gì…」是反问句，意为「哪用得着……／不需要……」，带轻蔑、不服或逞强的语气，功能上等于陈述句「không cần…」，但语用色彩更强。口语中常省略主语，单独成句。
