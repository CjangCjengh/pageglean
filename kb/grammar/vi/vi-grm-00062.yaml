title: 比较结构「như thể…ấy / làm như…vậy」：仿佛、好像
structure: 如 thể + NP + ấy；làm như + 小句 + vậy
structure_pattern: như thể + NP + ấy; làm như + clause + vậy（cấu trúc so sánh，比较结构）
explanation_zh: 「như thể…ấy」「làm như…vậy」都表示「好像……一样／仿佛……似的」，属比较结构；「ấy」「vậy」为句末呼应的指示词。此类说法常用于表达不满或夸张的指责，而非客观比较。
