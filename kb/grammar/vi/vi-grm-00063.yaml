id: vi-grm-00063
language: vi
type: grammar
level: L1
level_rank: 1
title: 分类词（量词）：sợi / cái / con / hòn
structure: 数词/不定词 + 分类词 + 名词
structure_pattern: Num + 分类词(sợi/cái/con/hòn) + N
explanation_zh: 越南语名词计数时必须搭配合适的分类词（loại từ），类似中文量词但搭配不同。sợi 用于细长条状物（sợi dây thun 一根橡皮筋），cái
  用于一般器物（cái ná 一个弹弓），con 用于动物（con chim 一只鸟），hòn 用于圆块状物（hòn sỏi 一颗石子）。需按名词类别逐个记忆搭配。
examples:
