title: 介词 bằng：表示工具与手段
structure: V + bằng + 工具/材料名词
structure_pattern: V + bằng + N(工具)
explanation_zh: bằng 引出动作所凭借的工具、材料或手段，相当于中文的“用、以”。“chơi nhảy dây bằng dây thun”即“用橡皮筋跳绳”。与汉语语序一致，介词短语放在动词之后作补语。
examples:
- text: Với lại người ta chơi nhảy dây bằng dây thun chứ ai nhảy dây bằng dây thừng!
  reading: ''
  annot: Với lại người ta chơi nhảy dây bằng dây thun chứ ai nhảy dây bằng dây thừng!
  translation_zh: 再说，人家玩跳绳用的都是橡皮筋，哪有人用粗绳来跳的！
