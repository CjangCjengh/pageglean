id: vi-grm-00065
language: vi
type: grammar
level: L2
level_rank: 2
title: 助词 thì：标记话题—评述结构
structure: 话题成分 + thì + 评述/态度
structure_pattern: 话题 + thì + 评述
explanation_zh: thì 把前置成分立为话题，后接说话人的判断或态度，是越南语典型的话题化标记。“Dây thun thì kệ mày”意为“至于橡皮筋嘛，随你”。它也可连接先后相承的分句，如“Biết
  rồi thì chạy đi”（知道了那就快去）。
examples:
