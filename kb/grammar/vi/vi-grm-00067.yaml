title: Vừa… vừa…：两个动作同时进行
structure: Vừa + V1, vừa + V2
structure_pattern: Vừa + V1, vừa + V2
explanation_zh: 表示两个动作同时发生或交替进行，相当于汉语“一边……一边……”。常用于叙述中描写伴随动作，两个分句之间常用逗号停顿。
