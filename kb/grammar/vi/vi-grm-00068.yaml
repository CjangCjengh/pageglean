title: 强调否定：đâu có + V 与 có… đâu
structure: đâu có + V ／ có + V + đâu
structure_pattern: đâu có + V / có + V + đâu
explanation_zh: 两种同义的强调否定格式，表示“根本没……、哪会……”，带有反驳或申辩语气。đâu có 置于动词前（đâu có biết＝哪会知道），có…
  đâu 则把动词夹在中间（có té đâu＝根本没摔）。口语中出现频率极高。
