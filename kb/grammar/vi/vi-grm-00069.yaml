id: vi-grm-00069
language: vi
type: grammar
level: L3
level_rank: 3
title: 结果补语：V + được 表示达成与可能
structure: V + được (+ 宾语)；否定：không + V + được
structure_pattern: V + được (＋O)
explanation_zh: được 紧跟动词后作结果补语，表示动作成功实现或能够做到，类似汉语补语“到、着、成”。“lựa được bốn, năm hòn”即“挑出了四五颗”。否定式
  không V được 表示“没能、无法做到”，如“không bắn được con chim nào”（一只鸟也没打着）。注意此处是结果/可能用法，而非被动义。
examples:
- text: Trong đống sỏi của nó, tôi lựa được bốn, năm hòn
