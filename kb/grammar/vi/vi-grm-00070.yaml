title: chẳng… là gì：反问确认「不是说过……吗」
structure: chẳng + V …… + là gì
structure_pattern: chẳng + V … là gì
explanation_zh: 用否定词 chẳng 加句末的 là gì 构成反问，提醒对方确认已说过的事实，相当于汉语“不是（说过）……吗”。常用于引述对方先前话语，带有提醒、嗔怪的口吻，口语色彩浓。
examples:
- text: Thì anh chẳng bảo khi nào có trò chơi nhớ rủ anh là gì!
