id: vi-grm-00071
language: vi
type: grammar
level: L2
level_rank: 2
title: 量词（loại từ）：con、cái、cuốn、cây、tụi
structure: 数词/指示词 + 量词（loại từ）+ 名词（danh từ）
structure_pattern: Num/Dem + CL + N
explanation_zh: 越南语名词在计量或指称时必须加量词（分类词）。动物用 con（con chim 鸟），一般器物用 cái（cái ná 弹弓），书用
  cuốn，细长物用 cây（cây kẹo 一颗糖）。tụi 表群体复数，相当于「们／那帮」（tụi chim 那些鸟）。
examples:
