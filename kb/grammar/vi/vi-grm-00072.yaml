title: 亲属称谓代词（đại từ xưng hô）：anh / em / tao / mày / tôi
structure: 以亲属称谓充任人称代词，随对象与亲疏关系变换
structure_pattern: anh/em/tao/mày/tôi（作主语或宾语）
explanation_zh: 越南语日常人称代词多用亲属称谓：称年长男性为 anh，年幼者为 em。关系亲密或带居高语气时可用 tao（我）/ mày（你），平静自述则用
  tôi。对同一对象可因语境换用，体现亲疏与地位差异。
