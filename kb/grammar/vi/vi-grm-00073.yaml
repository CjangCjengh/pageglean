title: không + V + được：没能做成某事
structure: 副词 không + 动词 + 结果/可能补语 được（bổ ngữ）
structure_pattern: không + V + được
explanation_zh: được 置于动词之后作补语，表示动作得以实现或具备可能性。否定式 không V được 相当于汉语「没能／不能……」，强调结果未达成。
examples:
- text: Nhưng suốt ba ngày liên tiếp, tôi không bắn được con chim nào.
