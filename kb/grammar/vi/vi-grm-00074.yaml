title: không…nữa：不再……
structure: 副词 không + 动词 + 副词 nữa
structure_pattern: không + V + nữa
explanation_zh: 句末副词 nữa 与前头的否定词 không 呼应，表示某动作或状态从此停止，相当于汉语「不再……」。
