id: vi-grm-00075
language: vi
type: grammar
level: L2
level_rank: 2
title: Vừa…vừa…：一边……一边……／又……又……
structure: 连接词（kết từ）vừa + A, vừa + B
structure_pattern: vừa + A + vừa + B
explanation_zh: 用于连接同时发生的两个动作或并存的状态。接心理状态相当于「又……又……」，接具体动作相当于「一边……一边……」。
examples:
- text: Vừa mắc cỡ, vừa bực mình, tôi gắt
  reading: ''
  annot: Vừa mắc cỡ, vừa bực mình, tôi gắt
  translation_zh: 我又害羞又恼火，没好气地嚷道。
