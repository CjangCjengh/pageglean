title: Sao…(vậy)?：为什么……？
structure: 疑问词 sao + 小句 +（语气词 vậy）
structure_pattern: sao + S + (vậy)
explanation_zh: sao 置于动词或小句之前表示「为什么」。句尾可加语气词 vậy，使疑问语气更自然，相当于「怎么……呢」。口语中 vậy 常可省略。
