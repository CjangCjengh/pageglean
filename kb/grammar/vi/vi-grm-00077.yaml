title: mới：刚、才与「直到……才……」
structure: 副词 mới + V；时间状语 + mới + V
structure_pattern: mới + V / 时间状语 + mới + V
explanation_zh: mới 表示动作刚发生或数量尚少，相当于「刚／才」；置于时间词语之后则强调耗时之久、事情终于实现，相当于汉语「（到……）才……」。
