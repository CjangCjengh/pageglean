title: có…không：是非疑问句
structure: có + V + (O) + không?（疑问句：câu hỏi có–không）
structure_pattern: có + V + không
explanation_zh: 「có…không」是越南语最典型的是非问句：có 置于动词前提出肯定可能，không 在句末承担疑问，相当于汉语「……吗／有没有……」。无需再加其他疑问词。回答时直接用
  có 或 không，或重复动词的肯定/否定形式。
examples:
- text: Trước giờ nó có tặng mày cái gì không?
