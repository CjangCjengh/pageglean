id: vi-grm-00079
language: vi
type: grammar
level: L1
level_rank: 1
title: đã…rồi：动作已然完成
structure: đã + V + rồi（副词 phó từ đã + 句末助词 rồi）
structure_pattern: đã + V + rồi
explanation_zh: đã 是置于动词前的副词（phó từ），表示动作已经发生或完成；句末再加 rồi 强调「已经、已了结」的语气，两者构成越南语最常见的完成体表达。相当于汉语「已经……了」，动词本身不变形，全靠虚词标示时体。位置固定：đã
  紧贴动词前，rồi 位于句末。
examples:
