title: thì：连接话题与评述
structure: 话题（khởi ngữ）/条件 + thì + 评述分句（连词 quan hệ từ）
structure_pattern: Khởi ngữ + thì + mệnh đề
explanation_zh: thì 是越南语的连词（quan hệ từ），连接前置的话题或条件与后面的评述，相当于汉语「（说到）……嘛／……的话就」。片段中「Mượn
  sách thì…」用 thì 提顿话题，后句表明说话人的态度；也可表顺承「那么」。口语中使用频率极高，是越南语句读节奏的重要标记。
examples:
- text: Mượn sách thì nói làm quái gì!
