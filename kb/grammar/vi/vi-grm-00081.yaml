id: vi-grm-00081
language: vi
type: grammar
level: L2
level_rank: 2
title: đâu có：强调否认
structure: S + đâu (có) + V（否定句 câu phủ định 中的强调否定副词）
structure_pattern: S + đâu có + V
explanation_zh: đâu (có) 是用于否定句（câu phủ định）的强调否定副词（phó từ phủ định），带有反驳或认为某事不言而喻不会发生的语气，比单纯
  dùng không 否定更强烈。相当于汉语「哪（里）有／根本没」。常用于口语争辩，片段中反复用来否认「爱」这一事实。
examples:
