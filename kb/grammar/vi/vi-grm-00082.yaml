title: không/chẳng…gì hết：全盘否定
structure: không/chẳng + V + gì hết / đâu hết（句末助词 hết 加强否定）
structure_pattern: không/chẳng + V + gì hết
explanation_zh: 「không/chẳng + V + gì hết」是口语化的全盘否定式，句末的 hết 加强语气，相当于汉语「一点也（没）／什么都（没）」。gì
  hết 否定事物，đâu hết 否定依据或处所；chẳng 是否定词 không 的变体，语气略重。该结构在片段中两度出现，口语色彩浓。
