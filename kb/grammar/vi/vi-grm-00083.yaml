id: vi-grm-00083
language: vi
type: grammar
level: L2
level_rank: 2
title: chỉ (có)…thôi：限定范围「只、仅」
structure: chỉ (có) + V/N + (thôi)（范围副词 + 句末助词 trợ từ thôi）
structure_pattern: chỉ có + V/N + thôi
explanation_zh: chỉ (có) 是限定范围的副词，相当于汉语「只、仅仅」；句末可加助词（trợ từ）thôi，强化「仅此而已」的语气，合起来对应汉语「只……罢了／而已」。片段中「只喜欢你的是你」「只写一句话」均用此结构。是口语表达「只有」的高频手段。
