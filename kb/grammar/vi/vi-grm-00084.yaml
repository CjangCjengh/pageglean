id: vi-grm-00084
language: vi
type: grammar
level: L3
level_rank: 3
title: cho：允让与受益
structure: cho + O + V（允让）／ V + cho + O（受益方向，连动结构）
structure_pattern: cho + O + V / V + cho + O
explanation_zh: cho 有两种常见用法：「cho + 人 + V」表示允许、让某人做某事；动词后接「cho + 人」表示动作的受益方向，相当于汉语「给（某人）……」。这是越南语典型的连动结构，cho
  的位置因表允让还是表受益而不同。片段中「cho tao mượn sách」（让我借书）与「mua cho mày」（买给你）两种用法并存。
examples:
