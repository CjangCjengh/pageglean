title: 句末语气词 đi：祈使与催促
structure: 动词短语 + đi（祈使、劝诱、催促）
structure_pattern: VP + đi
explanation_zh: đi 作句末语气词时使祈使、劝诱或催促的语气变得亲切随和，相当于汉语的"吧"。片段中反复出现，用于小伙伴之间的招呼与驱赶。注意与动词性成分中的
  đi（如 trò đi trốn đi tìm"捉迷藏"）区分，后者是构词语素。
