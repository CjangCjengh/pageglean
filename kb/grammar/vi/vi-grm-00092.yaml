id: vi-grm-00092
language: vi
type: grammar
level: L3
level_rank: 3
title: không có V / đâu có：口语强调否定
structure: không có + 动词；đâu có + 动词/形容词（句末可加 đâu 呼应）
structure_pattern: không có + V; đâu có + V/A (+ đâu)
explanation_zh: 南方口语常用"否定词 + có"的结构：không có + V 否认某事发生，语气比单用 không 更重、更辩解。đâu có
  + V/A 以反问口气否认，含"哪里、根本"的意味，句末可再用 đâu 呼应加强。两句都体现说话人强烈撇清的口吻。
examples:
