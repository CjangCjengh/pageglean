id: vi-grm-00093
language: vi
type: grammar
level: L4
level_rank: 4
title: chưa kịp V…đã V：还没……就……
structure: chưa kịp + 动词1 …… đã + 动词2
structure_pattern: chưa kịp + V1 … đã + V2
explanation_zh: kịp 意为"来得及"，chưa kịp V 表示还没来得及做某事，后接 đã V2 表示另一动作已抢先发生，相当于汉语"还没……就已经……"。片段两次使用该框架，中间可用
  thì 连接，构成紧凑的时间反差句式。
examples:
- text: Tao định nói nhưng chưa kịp nói thì mày đã nói mất.
