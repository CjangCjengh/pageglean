id: vi-grm-00094
language: vi
type: grammar
level: L1
level_rank: 1
title: chưa：「还没」与完成疑问「V chưa?」
structure: 副词（phó từ）chưa + V（尚未）；V + chưa?（……了吗）
structure_pattern: chưa + V / V + chưa
explanation_zh: chưa 是否定副词，表示「尚未」，置于动词前，与汉语「还没」语序一致。动词后直接加 chưa 构成常用的完成疑问句，相当于「……了吗？」，简短回答可只说
  Chưa（还没有）。与 không（不）不同，chưa 预设动作今后会发生。
examples:
- text: Tao chưa ăn sáng. Mày ăn sáng chưa?
