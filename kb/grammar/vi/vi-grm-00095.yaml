id: vi-grm-00095
language: vi
type: grammar
level: L1
level_rank: 1
title: đã / rồi：完成与事态变化
structure: đã + V（已然，前置）；V + rồi（已然/变化，后置）
structure_pattern: đã + V / V + rồi
explanation_zh: đã 是表完成/过去的副词，放在动词前；rồi 放在动词或句末，表示「已经……了」或事态出现变化。两者常可呼应使用。对应汉语「已经……了」，但语境清楚时越南语可省略
  đã。
examples:
