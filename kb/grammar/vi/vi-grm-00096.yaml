title: 结果补语 xong / lại / ra
structure: V + xong / lại / ra（结果补语，bổ ngữ kết quả）
structure_pattern: V + xong|lại|ra
explanation_zh: 越南语把表示结果的补语放在动词之后：xong（完成）、lại（合拢、固定下来）、ra（出来、弄明白）。与汉语「洗完、盖好、想明白」的动补结构一一对应，对中文母语者是正迁移点。注意补语一律后置，与汉语一致。
examples:
- text: Rửa mặt xong, nghe đói bụng, tôi mò xuống nhà bếp.
  reading: ''
  annot: Rửa mặt xong, nghe đói bụng, tôi mò xuống nhà bếp.
  translation_zh: 洗完脸，觉得肚子饿，我摸到厨房去。
  source_book: book-vi-003
