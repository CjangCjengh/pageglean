title: đâu có：口语中的辩驳否定
structure: đâu có + V/Adj（否定副词短语，反驳对方说法）
structure_pattern: đâu có + (V/Adj)
explanation_zh: đâu có + 动词/形容词 是口语否定结构，用于反驳对方的说法，相当于「哪有、才不是」。这里的 đâu 不是疑问词「哪里」，而是否定副词。可单独成句：Đâu
  có!（才不是呢！）。
examples:
- text: Đâu có! Anh chỉ nói kẹo thôi.
  reading: ''
  annot: Đâu có! Anh chỉ nói kẹo thôi.
  translation_zh: 才不是呢！哥哥只说了糖果而已。
  source_book: book-vi-003
