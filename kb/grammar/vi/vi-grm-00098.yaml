id: vi-grm-00098
language: vi
type: grammar
level: L3
level_rank: 3
title: mới：「才」的迟实现
structure: 时间/条件小句 + mới + V（副词，表示动作迟或经过程后才实现）
structure_pattern: '[clause] + mới + V'
explanation_zh: 副词 mới 置于动词前，表示动作发生得晚、或须经过前文所述过程才得以实现，相当于汉语「才」。前面常有时间或条件小句铺垫（睡到晌午→才起床；留一会儿→才吃）。另有「新、刚」义，须依语境区分。
examples:
- text: Tôi ngủ một mạch đến trưa trờ trưa trật mới lồm cồm bò dậy đi rửa mặt.
  reading: ''
  annot: Tôi ngủ một mạch đến trưa trờ trưa trật mới lồm cồm bò dậy đi rửa mặt.
  translation_zh: 我一觉睡到大晌午，这才慢腾腾地爬起来去洗脸。
