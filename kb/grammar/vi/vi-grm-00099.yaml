id: vi-grm-00099
language: vi
type: grammar
level: L1
level_rank: 1
title: 量词（类词）：tô / chén / ổ / con
structure: 数词 + 量词（danh từ chỉ đơn vị）+ 名词
structure_pattern: Num + CL + N
explanation_zh: 越南语数词修饰名词一般须加量词（类词），语序「数词＋量词＋名词」与汉语相同。片段中：tô（大碗，如 cơm chiên）、chén（小杯盏，如
  nước mắm）、ổ（面包专用量词，một ổ bánh mì）、con（用于动物及指小孩、姑娘，如 con nhỏ này）。量词选择取决于名词的类别，须逐个记忆。
examples:
- text: Trên bàn ăn, mẹ tôi đã để sẵn cho tôi một tô cơm chiên và một chén nước mắm
    đậy dưới lòng bàn.
  reading: ''
  annot: Trên bàn ăn, mẹ tôi đã để sẵn cho tôi một tô cơm chiên và một chén nước mắm
