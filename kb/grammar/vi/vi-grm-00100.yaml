id: vi-grm-00100
language: vi
type: grammar
level: L1
level_rank: 1
title: có … không：是非疑问句
structure: có + V + (O) + không?
structure_pattern: có + V + … + không
explanation_zh: có … không 是越南语最典型的是非问句框架：có 置于动词前强调动作的发生或实现，không 位于句末构成提问，相当于中文「……吗」。嵌入
  không biết（不知道）等动词后即构成间接问句，语序保持不变。
examples:
- text: không biết ngày mai Tiểu Li có được mẹ nó mua cho ổ bánh mì nào nữa không.
  reading: ''
  annot: không biết ngày mai Tiểu Li có được mẹ nó mua cho ổ bánh mì nào nữa không.
