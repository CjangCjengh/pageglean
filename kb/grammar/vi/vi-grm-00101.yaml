title: nè / nghen / đi：句末语气词
structure: 句子 + nè / nghen / đi
structure_pattern: … + nè / nghen / đi
explanation_zh: 越南语靠句末语气词传递细腻语气：nè 表示递示、提醒（「给你哦」）；nghen 征求对方同意，近似「……好吗」；đi 使命令、劝诱语气更自然随意。口语中使用频率极高，是说地道越南语的关键。
