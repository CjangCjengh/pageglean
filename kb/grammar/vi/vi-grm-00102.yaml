id: vi-grm-00102
language: vi
type: grammar
level: L2
level_rank: 2
title: như / y như … vậy：比喻与比较
structure: V / Adj + như + NP；y như + NP + vậy
structure_pattern: V/Adj + như / y như … vậy
explanation_zh: như 用于动词或形容词之后引出比喻、比较的对象，相当于「像……一样」。y như 语气更强，意为「简直跟……一模一样」，常与句末的
  vậy 呼应。表示差比则用 hơn，如「vẫn còn hơn phân nửa」（还剩一半以上）。
examples:
