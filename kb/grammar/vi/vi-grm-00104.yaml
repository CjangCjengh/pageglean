title: không dám + V：「不敢做某事」
structure: không dám + 动词
structure_pattern: không dám + V
explanation_zh: dám 是能愿动词「敢」，否定式 không dám + 动词表示「不敢做某事」，在片段中反复出现，凸显人物的怯生生与隐忍。句末可加
  nữa，表示「不敢再……」。
