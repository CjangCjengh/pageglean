id: vi-grm-00107
language: vi
type: grammar
level: L1
level_rank: 1
title: có...không / không biết...：嵌入式是非疑问句
structure: 主句谓语（hỏi / biết / hiểu…）+ có + 谓语成分 + （nữa）+ không
structure_pattern: S + V[主句] + có + XP + không
explanation_zh: 越南语的是非疑问句基本格式是在谓语前加虚词 có、句末加 không，相当于汉语'……吗/有没有……'。当整个疑问句充当 biết、hỏi、hiểu
  等心理动词的宾语时，语序不变、句末语气词可省略，形成间接问句。句中'chẳng hiểu...không nhỉ'还叠加了语气词 nhỉ，表示自言自语式的揣测。
examples:
- text: không biết ngày mai Tiểu Li có được mẹ nó mua cho ổ bánh mì nào nữa không
