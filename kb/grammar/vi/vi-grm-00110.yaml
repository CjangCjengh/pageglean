title: V + lại：结果/方向补语 lại
structure: 动词 + lại（+ 宾语）
structure_pattern: V + lại
explanation_zh: lại 作补语紧跟动词之后，表示动作的收拢、闭合或完成，如 nhắm mắt lại（闭上眼）。它还可表示'反向、回向'，如 yêu
  lại 指'（爱）回过来、回爱'，即对方对自己回报同样的感情。两种用法都由'回到原处'的基本义引申而来。
