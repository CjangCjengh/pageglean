id: vi-grm-00113
language: vi
type: grammar
level: L2
level_rank: 2
title: 「Nếu…thì…：条件复句」
structure: Nếu + 条件分句，(thì / tức là) + 结果分句
structure_pattern: Nếu + vế₁ (điều kiện), (thì/tức là) + vế₂ (kết quả); câu ghép chính
  phụ
explanation_zh: nếu引导条件分句，结果分句可用thì或tức là引出，也可省略。片段用“nếu…tức là…”表示“如果A，就意味着B”。还可用còn连接两个并列条件分句，对比两种不同结果。
examples:
- text: Nếu nó chịu đi chung với mày tức là nó có yêu mày, còn nếu nó từ chối tức
    là mày outside!
  reading: ''
