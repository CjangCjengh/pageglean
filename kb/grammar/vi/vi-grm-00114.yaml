id: vi-grm-00114
language: vi
type: grammar
level: L1
level_rank: 1
title: 「……không?：是非问句」
structure: (Có) + V/Adj + không?
structure_pattern: (Có) + V + không?; câu hỏi với tình thái từ nghi vấn “không” cuối
  câu
explanation_zh: 动词或形容词后加语气词không构成是非问，相当于汉语“……吗”。动词前可加có强调动作的发生或存在。这是越南语口语中最常用的问句格式之一。
