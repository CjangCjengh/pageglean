title: 「chưa：“尚未”与确认问」
structure: chưa + V；V + chưa?
structure_pattern: chưa + V (phủ định, chưa thực hiện) / V + chưa? (câu hỏi)
explanation_zh: chưa表示动作尚未实现，意为“还没”。置于句末则构成问句，询问某事是否已经发生，相当于“～了没有”。片段还出现“chưa kịp…đã…”（还没来得及……就已经……）的对照句式。
