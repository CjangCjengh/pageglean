title: 「V + được：可能补语」
structure: V + được (+ O)
structure_pattern: V + được; bổ ngữ chỉ khả năng
explanation_zh: được紧跟动词后作可能／结果补语，表示动作能够实现或达成，相当于汉语“能、可以”。片段中“chứng minh được”即“能证明”。注意được还可表被动义或受益义，需依语境区分。
