title: 「bị + V：不如意被动」
structure: bị + V（主语为承受者）
structure_pattern: bị + V; câu bị động mang nghĩa bất lợi
explanation_zh: bị加动词构成被动结构，主语承受的多是不希望发生、对自己不利的事，与表受益的được相对。片段中“bị ra rìa”意为“被排挤到一边、被冷落出局”。
examples:
- text: Outside tức là bị ra rìa, tức là đứng ngoài cuộc, hiểu chưa?
