title: 「Để…：目的与提议」
structure: Để + 分句（目的／提议）
structure_pattern: Để + clause; kết từ chỉ mục đích / câu cầu khiến
explanation_zh: để引导目的分句，意为“为了”。口语中置于句首还可表示主动提议，相当于汉语“让我来……／我来……”。片段中两种用法均出现。
examples:
