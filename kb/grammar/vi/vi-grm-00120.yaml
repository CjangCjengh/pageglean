title: Rồi：完成体语气词
structure: V/Adj + rồi（phó từ 置于句末，表示已然、完成）
structure_pattern: V/Adj + rồi
explanation_zh: rồi 是体貌副词（phó từ），置于动词之后或句末，表示事情已经发生或完成，相当于汉语的「了／已经……了」。与形容词连用时表示状态已经形成。越南语表达完成只需在句末加
  rồi，不必同时出现 đã。
