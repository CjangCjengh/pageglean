title: Sẽ：将来时副词
structure: sẽ + V（phó từ 表示将来，置于动词前）
structure_pattern: sẽ + V
explanation_zh: sẽ 是时态副词（phó từ），放在动词前表示动作将要发生，相当于「会、将」。越南语动词无形态变化，时态全靠 đã、đang、sẽ、rồi
  这类虚词表达。本段中两次出现，表示说话人对后续行动的打算。
