title: Đâu có：口语强调否定
structure: S + đâu có + V/Adj（câu phủ định 强调式，口语）
structure_pattern: S + đâu có + V/Adj
explanation_zh: đâu có 是口语中的强调否定结构，相当于「哪有／并没有／根本不」，用于反驳对方看法，语气比单纯用 không 强烈得多。还可与
  như 搭配，表示「一点也不像……那样」。
