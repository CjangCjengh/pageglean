title: Vì… nên…：因果关联词
structure: Vì + 原因分句, nên + 结果分句（cặp quan hệ từ 因果）
structure_pattern: Vì + mệnh đề, nên + mệnh đề
explanation_zh: vì… nên… 是表示因果的一对关联词（quan hệ từ），相当于「因为……所以……」，原因分句在前、结果分句在后。句中的 chưa
  是副词，意为「还没有」。因果语序与汉语一致，中文母语者容易掌握。
examples:
- text: 'Vì chưa xem phim này nên tôi không biết cái đoạn kết nó ra làm sao, bèn hỏi
    dò:'
