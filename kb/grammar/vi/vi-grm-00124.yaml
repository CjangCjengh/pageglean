id: vi-grm-00124
language: vi
type: grammar
level: L1
level_rank: 1
title: Câu nghi vấn：用「không」与疑问词提问
structure: V/Adj + không?（câu nghi vấn 是非问；疑问词 nào/sao/đâu）
structure_pattern: V/Adj + không
explanation_zh: 越南语是非问句常把 không 直接放在动词或形容词后构成「……吗／……不……」式提问，无需系词或倒装。也可用 nào、sao、đâu
  等疑问词提问，如「Bằng cách nào?」（用什么办法？）。该结构口语性强，在对话中使用频繁。
