id: vi-grm-00129
language: vi
type: grammar
level: L3
level_rank: 3
title: 「vừa mới…đã」：刚……就……
structure: vừa mới + V1 + (thì) đã + V2
structure_pattern: vừa_mới + V1 + đã + V2
explanation_zh: 「vừa mới」表“刚刚”，「đã」在此表“已经”而非过去。两个动作紧密衔接，表示前一个刚发生，后一个紧接着就出现。相当于中文“刚……就……”。
examples:
- text: Nhưng tôi vừa mới bước ra ngoài hiên đã nghe tiếng hú cất lên trong nhà.
  reading: ''
