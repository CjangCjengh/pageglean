title: 「Adj hơn…gấp N lần」：比……N倍
structure: Adj + hơn + 比较对象 + gấp + 数字 + lần
structure_pattern: Adj + hơn + NP + gấp + Num + lần
explanation_zh: 越南语比较级用「形容词＋hơn＋比较对象」表示“比……更……”。要表达倍数时，在句末加「gấp＋数字＋lần」（……倍）。注意倍数部分置于比较对象之后，与中文语序不同。
examples:
