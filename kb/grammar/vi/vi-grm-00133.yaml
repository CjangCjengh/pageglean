title: 「được」：得以、求得（进入某种如愿状态）
structure: muốn/được + Adj 表示得以进入某种状态
structure_pattern: được + Adj/State
explanation_zh: 「được」本义“得到”，此处接形容词表“得以进入某种（如愿的）状态”。「được yên tĩnh」即“图个清静、得以安静”。它与表被动的「bị/được」同源，但此处强调获得理想状态。
examples:
- text: Tôi đang muốn được yên tĩnh, không muốn gặp bất cứ ai
