title: V đi V lại：动作反复进行
structure: V + đi + V + lại
structure_pattern: V + đi + V + lại
explanation_zh: 同一动词以「V đi V lại」的形式重叠使用，表示动作一遍遍地反复进行，相当于中文「翻来覆去地……」「一遍遍地……」。常与「hai
  ba lần」等次数短语呼应。
examples:
- text: Tôi mở mắt thao láo, miệng nhắc đi nhắc lại hai ba lần, Tiểu Li vẫn im re.
