title: bị + V：不如意被动
structure: bị + V（被动虚词，表遭受不利）
structure_pattern: bị + V
explanation_zh: 「bị」是被动句的核心虚词（hư từ bị động），加在动词前构成被动式，强调主语遭受不利或不情愿的事情，相当于中文「被……」。与表示获益的「được」相对，如「bị
  mắc lừa」即「被骗、上当」。
examples:
- text: Bấy giờ, Tiểu Li mới biết là mình bị mắc lừa.
