id: vi-grm-00136
language: vi
type: grammar
level: L3
level_rank: 3
title: mới + V：条件满足后「才……」
structure: 条件/时间分句 + mới + V
structure_pattern: (clause) + mới + V
explanation_zh: 「mới」表示事情发生得晚，或须满足某条件之后才发生，相当于中文「才……」。常与时间短语、数量短语或条件分句呼应，强调等待之久或结果来之不易。
examples:
- text: Đợi cho nó năn nỉ cả chục lần, tôi mới chịu chơi tiếp.
  reading: ''
