title: ……phải không?：是非问句求证
structure: 陈述句 + phải không?（疑问情态词）
structure_pattern: S + V + phải không
explanation_zh: 「phải không」是置于陈述句末尾的疑问情态词（tình thái từ nghi vấn），构成是非问句，相当于中文「……是吗？」「……是不是？」。说话人已有一定猜测，借此向对方求证。
