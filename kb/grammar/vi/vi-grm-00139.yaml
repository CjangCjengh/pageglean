title: thì：条件与话题标记
structure: 条件分句/起语（đề tài） + thì + 结果/评述分句
structure_pattern: Clause1(điều kiện/khởi ngữ) + thì + Clause2
explanation_zh: thì 是越南语高频虚词（quan hệ từ），连接条件句与结果句，或前置话题与评述，相当于汉语“……的话，就……”或话题结构“说到……”。片段对话中反复出现，如“Chơi
  thì ra chơi!”（要玩就出来玩！），使口语节奏明快。
