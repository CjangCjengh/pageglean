id: vi-grm-00140
language: vi
type: grammar
level: L2
level_rank: 2
title: mà：转折连词
structure: 前项 + mà + 后项（语义相反或出乎意料）
structure_pattern: Clause1/AdjP + mà + Clause2(tương phản)
explanation_zh: 连词 mà 连接语义相对、转折的两个成分，相当于汉语“却、可是”。如“Gần vậy mà ném không trúng!”（这么近却扔不中！）。片段中又用“không
  còn… mà…”表示“不再……而是……”。
examples:
- text: Gần vậy mà ném không trúng!
  reading: ''
  annot: Gần vậy mà ném không trúng!
