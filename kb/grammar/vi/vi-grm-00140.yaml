- text: Lúc này, nó không còn đứng ngay trước cửa mà men ra ngoài mé hiên, sát về
    phía nhà tôi.
  reading: ''
  annot: Lúc này, nó không còn đứng ngay trước cửa mà men ra ngoài mé hiên, sát về
    phía nhà tôi.
