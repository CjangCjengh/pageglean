title: V + được：可能与结果补语
structure: 动词 + được（bổ ngữ chỉ khả năng/kết quả）；否定：không + V + được
structure_pattern: V + được / không + V + được
explanation_zh: được 放在动词后作补语，表示动作得以实现或有能力做到，相当于汉语“得、到、住”。片段中“kềm lại được”是“忍住了”，“không
  lay chuyển nó được”是“没法让她动摇”。否定式把 không 放在动词之前。
examples:
- text: Thấy không lay chuyển nó được, tôi đạp chân lên cái lon
