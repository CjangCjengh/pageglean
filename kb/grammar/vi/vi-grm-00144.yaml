id: vi-grm-00144
language: vi
type: grammar
level: L1
level_rank: 1
title: 分类词 cái / chiếc
structure: 分类词（loại từ）+ 名词（cái/chiếc 用于无生命事物）
structure_pattern: cái/chiếc + N
explanation_zh: 越南语名词被指称或计数时通常要带分类词（danh từ chỉ loại）。cái 是无生命事物的通称分类词，chiếc 强调单个、可分离的物件。片段中“cái
  lon”（易拉罐）、“chiếc dép”（拖鞋）反复出现；同一个罐子也偶见说“chiếc lon”，可见文学语言中选择有弹性。
examples:
- text: Nói xong, tôi bước ra sân vẻ một vòng tròn rồi đặt cái lon vào chính giữa.
  reading: ''
  annot: Nói xong, tôi bước ra sân vẻ một vòng tròn rồi đặt cái lon vào chính giữa.
  translation_zh: 说完，我到院子里画了一个圈，把易拉罐放在正中间。
