id: vi-grm-00145
language: vi
type: grammar
level: L2
level_rank: 2
title: chẳng… đâu：全然否定
structure: chẳng + 动词 (+ đâu)（phó từ phủ định）
structure_pattern: chẳng + V (+ đâu)
explanation_zh: chẳng 是否定副词，与 không 义近而语气更重、更书面或带情绪。与 đâu 呼应表示“哪儿也不、根本找不到”，如“chẳng
  thấy Tiểu Li đâu”（哪儿也见不到小丽）。片段中“cũng chẳng nghe nó đáp lại”表示叫了好几声都没回应。
examples:
- text: Chiều hôm đó, tôi thơ thẩn ngoài sân cả buổi, chẳng thấy Tiểu Li đâu.
  reading: ''
  annot: Chiều hôm đó, tôi thơ thẩn ngoài sân cả buổi, chẳng thấy Tiểu Li đâu.
  translation_zh: 那天下午，我在院子里徘徊了半天，哪儿也见不到小丽。
  source_book: book-vi-003
