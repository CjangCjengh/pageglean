  source_chapter: null
  pointer: null
- text: Vừa nói tôi vừa liếc chừng Việt An, trong lòng thấp thỏm sợ nó từ chối.
  reading: ''
  annot: Vừa nói tôi vừa liếc chừng Việt An, trong lòng thấp thỏm sợ nó từ chối.
