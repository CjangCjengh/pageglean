title: mà…thì…：假设条件句
structure: 主语 + mà + 条件，(thì) + 结果
structure_pattern: S + mà + điều kiện, (thì) + kết quả
explanation_zh: mà 在句中引出假设性条件，thì 引出相应的结果，常带有警告、推测的语气，多用于设想不利的情况。「Mẹ mà biết thì chết!」是极地道的口语警告句，相当于「要是妈妈知道了就完了！」。
examples:
- text: Không được đâu! Mẹ mà biết thì chết!
