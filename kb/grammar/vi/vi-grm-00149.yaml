title: vì…mà…：强调原因的因果句
structure: vì + 原因 + mà + 结果
structure_pattern: vì + nguyên nhân + mà + kết quả
explanation_zh: vì 引出原因，mà 起连接并强调作用，共同构成因果句，突出「正是因为…」的语气。与汉语「因为…而…」对应，但 mà 不可省略，否则句子不自然。
examples:
- text: Thấy vì tôi mà nó bị phạt, bụng tôi đâm ra áy náy.
