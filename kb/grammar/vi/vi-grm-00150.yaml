title: đang：进行体标记「正在」
structure: 主语 + đang + 动词/形容词
structure_pattern: S + đang + V/A
explanation_zh: đang 表示动作或状态正在进行，是越南语最基本的体貌虚词之一，相当于汉语「正在」。它直接置于谓词之前，无需任何形态变化。
examples:
- text: Tiểu Li đang ngồi buồn xo trên đi-văng, nhác thấy tôi, nó tươi tỉnh hẳn lên
    và nhe răng cười.
