title: cho tới：时间终点「直到」
structure: 动作 + cho tới + 时间点
structure_pattern: V + cho tới + thời điểm
explanation_zh: cho tới（也可说 đến）表示动作或状态延续到某个时间点为止，相当于「直到」。常与表示持续、等待的动词搭配，划定时间的终点。
examples:
- text: Mẹ bắt em ngồi trên đi-văng cho tới giờ cơm, không được bước chân xuống đất.
