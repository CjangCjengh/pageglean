title: đã vậy…lại…：「已经这样…还…」
structure: đã vậy, 主语 + lại + 情况
structure_pattern: đã vậy, S + lại + V/A（kết cấu tăng tiến）
explanation_zh: đã vậy 承接上文，表示前一种情况已然如此（多为不如意），lại 再叠加一层更甚的情况，相当于「已经这样了…还…」。是语篇层面的递进结构，带有无奈、抱怨的语气。
examples:
- text: 'Đã vậy, Hải gầy lại cứ đi theo tôi tò tò, hỏi gặng:'
