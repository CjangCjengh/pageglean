title: không thể V (được)：不能／无法……
structure: không thể + V（+ được）
structure_pattern: không thể + V + (được)
explanation_zh: 「không thể＋动词」表示“不能、无法做某事”。句末再加「được」构成「không thể V được」，进一步强调客观上办不到，否定语气更完整。
examples:
- text: Chuyện tình yêu không thể đoán mò được!
