title: chẳng khác gì：跟……没什么两样
structure: A + chẳng khác gì + B
structure_pattern: A + chẳng khác gì + B
explanation_zh: 「chẳng khác gì」意为“跟……没什么两样、无异于”，用于比喻性比较。「chẳng」是「không」的强调形式，带有书面或感叹语气。
examples:
- text: Tự ái trong tình yêu chẳng khác gì vụ lợi trong tình bạn!
