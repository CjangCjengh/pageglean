title: thử V coi：试着……看看
structure: thử + V + coi（xem）
structure_pattern: thử + V + coi
explanation_zh: 「thử＋动词＋coi」是口语祈使结构，意为“试着……看看”，劝对方尝试或换位体验。「coi」是南方话的“看”，相当于北方话的「xem」。
examples:
- text: Mày thử ở trong trường hợp tao coi!
  reading: ''
  annot: Mày thử ở trong trường hợp tao coi!
  translation_zh: 你试着换成我的处境看看！（你设身处地为我想想！）
