title: để + V：为了……（目的）
structure: 行动分句 + để + 目的动词短语
structure_pattern: V + để + V
explanation_zh: 「để＋动词」表示目的，相当于“为了……／……来（做某事）”，置于行动分句之后说明意图。本片段两处引用他人话语时都用「để」引出目的。
