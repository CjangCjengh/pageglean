id: vi-grm-00161
language: vi
type: grammar
level: L1
level_rank: 1
title: đã…rồi：完成体与「已经」
structure: đã + V/Adj（+ rồi）
structure_pattern: đã + V/Adj + (rồi)
explanation_zh: đã 置于动词或形容词前，表示动作已完成或状态已实现，相当于汉语「已经/了」。句末常加 rồi 呼应，强调「已经如此」。也可用于疑问句询问状态是否已经变化。
examples:
- text: Nó đã từ chối thẳng thừng những đề nghị của tôi bao nhiêu lần rồi!
  reading: ''
