id: vi-grm-00162
language: vi
type: grammar
level: L1
level_rank: 1
title: chưa：「尚未」与完成疑问
structure: đã + V/Adj + chưa?／chưa + V
structure_pattern: (đã) + V/Adj + chưa / chưa + V
explanation_zh: chưa 表示「还没有」，指动作至今未发生或状态未达成，可单独置于动词前。与 đã 搭配构成「đã…chưa」问句，询问某事是否已经完成，是越南语最常用的完成疑问格式。
examples:
