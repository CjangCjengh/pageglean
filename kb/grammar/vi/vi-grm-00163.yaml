title: có…không：是非问句框架
structure: có + （主语）+ V + không?
structure_pattern: có + ... + không
explanation_zh: có…không 构成是非问句，có 位于谓语前，强调动作是否发生或情况是否存在，句末以 không 收束。本片段用「có ai…không」询问是否有人做过某事，相当于「有没有人……」。
examples:
- text: Mấy bữa nay có ai chép bài giùm Việt An không?
