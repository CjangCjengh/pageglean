title: V + giùm：为别人做某事（帮忙体）
structure: V + giùm（+ cho）
structure_pattern: V + giùm (+ cho)
explanation_zh: giùm 置于动词之后，表示替某人、帮某人做某事，相当于「帮/代……做」，是南部口语常用形式（与 giúp 同源）。可与句末 cho
  呼应构成「V + giùm + cho」，使请求语气更委婉。
examples:
- text: Việt An đưa tập tôi chép bài giùm cho!
  reading: ''
