id: vi-grm-00166
language: vi
type: grammar
level: L2
level_rank: 2
title: Nếu…（thì）…：假设条件句
structure: Nếu + 条件，（thì）+ 结果（+ sẽ…）
structure_pattern: Nếu + mệnh đề, (thì) + mệnh đề (sẽ...)
explanation_zh: Nếu 引导假设条件分句，主句可用 sẽ 表示将会出现的结果，构成「如果……就……」。主句可省略 thì 直接接续；句末加 đâu
  可加强断言语气。
examples:
- text: Nếu không có một tình cảm đặc biệt, Việt An sẽ không cho mày chép bài giùm
    đâu!
