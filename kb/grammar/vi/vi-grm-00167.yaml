id: vi-grm-00167
language: vi
type: grammar
level: L2
level_rank: 2
title: hơn 与 so với：比较结构
structure: Adj + hơn（+ 比较基准）；Adj + so với + NP
structure_pattern: Adj + hơn (+ NP) / Adj + so với + NP
explanation_zh: 越南语比较级把基准放在形容词之后：Adj + hơn 表示「比……更」，不用「比」字前置。so với 意为「跟……相比」，常用于说明与平日、常态的差异。
examples:
