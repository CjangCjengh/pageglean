id: vi-grm-00168
language: vi
type: grammar
level: L1
level_rank: 1
title: 量词（danh từ đơn vị）：con、chiếc、cây、cuốn
structure: 数词 + 量词（分类词）+ 名词
structure_pattern: Num + classifier (danh từ đơn vị) + N
explanation_zh: 越南语名词前通常要用量词（学校语法称 danh từ đơn vị），按事物类别选择：con 用于动物（con ong 蜜蜂）、chiếc
  用于单个物件（chiếc lá 叶子）、cây 用于细长物（cây viết 笔）、cuốn 用于卷册类（cuốn tập 笔记本）。与汉语量词类似，但用法更强制，“một
  + 量词 + 名词”中量词一般不可省略。
