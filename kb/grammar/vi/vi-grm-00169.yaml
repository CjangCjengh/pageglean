title: 疑问句：sao（为什么）、đâu（在哪里）、gì（什么）
structure: Sao + 分句？／名词 + đâu?／……gì?
structure_pattern: Sao + clause? / N + đâu? / …gì?
explanation_zh: 越南语疑问句不用汉语“吗”类语气词，而是直接用疑问代词：sao 问原因（为什么）、đâu 问处所（在哪里）、gì 问事物（什么）。句中的
  mà 表示转折，相当于“却”。“Sao…mà…”连用常带“怎么竟然……”的反诘语气。
