id: vi-grm-00171
language: vi
type: grammar
level: L2
level_rank: 2
title: nếu…(thì)…(sẽ)…：假设条件句
structure: Nếu + 条件分句，（thì）+ 主句 + sẽ + 动词
structure_pattern: Nếu + clause, (thì) + S + sẽ + V
explanation_zh: nếu 引导条件分句，相当于“如果、要是”，主句常用 thì 承接，并用将来虚词 sẽ 表示结果；也可与 chắc（想必）呼应，表示对未来结果的推测。“sẽ
  không…đâu”中句末的 đâu 加强否定与反驳语气。
examples:
- text: Nếu không có một tình cảm đặc biệt, Việt An sẽ không cho mày chép bài giùm
    đâu!
  reading: ''
