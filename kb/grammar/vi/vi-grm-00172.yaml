id: vi-grm-00172
language: vi
type: grammar
level: L3
level_rank: 3
title: 定语后置：名词 + 修饰语（của 领属、省略 mà 的关系从句）
structure: 名词 + 形容词/介词短语/（của + 领属者）/（省略 mà 的）从句
structure_pattern: N + modifier; N + của + possessor; N + clause (mà 省略)
explanation_zh: 越南语定语位于名词之后：形容词作定语（cuốn tập bê bối 乱七八糟的笔记本）、介词短语（bộ cờ bằng ngà 象牙制的棋）、用
  của 表示领属（tập của tôi 我的本子）。关系从句同样后置，关系代词 mà 常可省略，如“bộ cờ …(mà) nó đang mượn của
  tôi”。
examples:
- text: Cô lặng lẽ kiểm tra tiếp cuốn tập bê bối của tôi.
