title: khởi ngữ + thì：话题化与对比强调
structure: 话题（khởi ngữ）+ thì + 评述分句
structure_pattern: Topic (khởi ngữ) + thì + clause
explanation_zh: 把要谈论的对象提到句首作话题（学校语法称 khởi ngữ），再用 thì 连接评述部分，相当于汉语“……嘛”“至于……”，常含对比意味。片段用该结构把“我的本子”与“课文”提出来，突出对照并加强语气。
examples:
- text: Tập vở của tôi thì tôi nhét kỹ trong cặp, từ đầu giờ đến cuối giờ chẳng thèm
    lôi ra lấy một lần.
  reading: ''
