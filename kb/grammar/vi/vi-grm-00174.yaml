title: chưa kịp…thì…đã…：还没来得及……就……
structure: ……chưa kịp + 动1 + thì + ……đã + 动2
structure_pattern: S + chưa kịp + V1 + thì + S + đã + V2
explanation_zh: chưa kịp 意为“还没来得及”，与表示已然的 đã、连接词 thì 搭配，强调前一动作尚未完成，后一动作已突然发生，相当于汉语“还没……就……”。chưa、đã
  均属副词（phó từ）。
examples:
- text: 'Tôi chưa kịp hiểu ra chuyện gì thì cô Hường đã đọc to lên:'
