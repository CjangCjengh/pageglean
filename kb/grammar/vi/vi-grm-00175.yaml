title: V + đến + 补语：程度/结果补语
structure: 动词 + đến + 结果/程度补语
structure_pattern: V + đến + result complement (bổ ngữ)
explanation_zh: 动词后用 đến 引出结果或程度补语（bổ ngữ），相当于汉语“……到……”，如“chép đến rả cả tay”（抄到手发酸）。“rả
  cả tay”中的 cả 强调整个、全部；句末语气词 mất 表示担心或不希望发生的结果。
examples:
- text: như một con ong thợ chăm chỉ, tôi lao vào chép bài đến rả cả tay.
