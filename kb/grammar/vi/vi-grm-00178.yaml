title: mà：转折连词（却、但）
structure: V1 + mà + (không) + V2
structure_pattern: VP1 + mà + VP2
explanation_zh: 关系词 mà 连接两个动词短语或小句，表示转折，相当于汉语「却、但」。本句表示与预期相反的情况（坐着上课却不敢看人）。mà 还可作关系代词引导定语，注意区分。
examples:
- text: tôi ngồi học mà không dám nhìn ai, kể cả Hải gầy.
  reading: ''
  annot: tôi ngồi học mà không dám nhìn ai, kể cả Hải gầy.
  translation_zh: 我坐着听课，却不敢看任何人，连瘦子 Hải 也不敢看。
