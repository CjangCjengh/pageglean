title: 句末语气词 mà：申明与不服
structure: 小句 + mà！
structure_pattern: S + V + mà
explanation_zh: 句末的 mà 是语气词，表示事情显而易见或要求对方认同，带解释、不服气的口吻，相当于汉语句末的「嘛」。与作转折连词的 mà 是不同的词。例中动词后的
  được 为可能补语，表示「能、可以」。
examples:
