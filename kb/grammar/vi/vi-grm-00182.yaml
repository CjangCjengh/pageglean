title: 语气助词 rồi：已然与新情况
structure: S + V/A + rồi（句末）；分句1 + rồi + 分句2
structure_pattern: S + V + rồi / clause + rồi + clause
explanation_zh: 句末助词 rồi 表示动作完成或情况发生变化，相当于中文的“……了”，如 biết rồi（知道了）。rồi 也可作连词连接先后发生的两个动作，相当于“然后”。越南语用独立虚词而非动词形态变化表示体貌，是中文母语者最先要适应的一点。
