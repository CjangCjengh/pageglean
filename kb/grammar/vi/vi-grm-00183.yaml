id: vi-grm-00183
language: vi
type: grammar
level: L1
level_rank: 1
title: 分类词（量词）：cây / cục / con / đứa / lọ
structure: （数词）＋分类词＋名词
structure_pattern: (Num) + loại từ (cây/cục/con/đứa/lọ) + N
explanation_zh: 越南语名词一般不能直接受数词修饰，须加分类词：动物用 con，小孩用 đứa，细长物/植物用 cây，块状物用 cục，瓶罐类用 lọ。结构与中文“数词＋量词＋名词”相似，但搭配习惯不同，如笔说
  cây viết、墨块说 cục mực。分类词还兼有指称与确定名词的作用，是名词短语的核心成分。
