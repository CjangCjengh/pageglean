title: 是非问句：phải … không？
structure: phải + 命题 + không?
structure_pattern: phải + clause + không
explanation_zh: “phải … không”是典型的是非问框架：phải 引出待确认的命题，句末 không 表疑问，相当于中文“……是不是／……吗”。语气中性，期待对方证实。文中
  coi thử phải ý mẹ anh là như vậy không 即“看看你妈妈的意思是不是这样”。
examples:
- text: Để chiều nay em về hỏi lại mẹ anh coi thử phải ý mẹ anh là như vậy không.
  reading: ''
  annot: Để chiều nay em về hỏi lại mẹ anh coi thử phải ý mẹ anh là như vậy không.
  translation_zh: 今天下午我回去再问问你妈妈，看她是不是这个意思。
