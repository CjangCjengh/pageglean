title: 祈使与禁止：đừng + V 与 V + đi
structure: đừng + V（禁止）；V + đi（祈使、催促）
structure_pattern: đừng + V ; V + đi
explanation_zh: 禁止祈使用“đừng + 动词”，相当于中文“别／不要做某事”。祈使句末加语气词 đi 则表催促、建议或缓和语气，相当于中文“……吧”。两者在口语对话中高频出现，如
  đừng hỏi（别问）、đổ thêm nước vô đi（再加点水进去吧）。
