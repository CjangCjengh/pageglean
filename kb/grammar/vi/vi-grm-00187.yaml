title: 被动标记：bị 与 được
structure: bị / được + V（表被动或遭遇）
structure_pattern: bị / được + V
explanation_zh: bị 和 được 是越南语最主要的被动／遭遇标记：bị + V 多指不如意的事（bị mắng 被骂），được + V 指如愿、受益或获得机会（được
  giúp đỡ 得以帮助）。两者也可实义使用，分别相当于“遭受”和“得到”。与中文“被”字句对应，但褒贬分工更明确。
examples:
- text: Không dám nói mẹ, sợ bị mắng, tôi đành phải chấm chung lọ mực của Tiểu Li.
