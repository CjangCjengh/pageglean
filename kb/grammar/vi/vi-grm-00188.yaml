title: 比喻结构：y như 与 giống hệt
structure: y như + NP/VP；giống hệt + NP
structure_pattern: y như / giống hệt + NP
explanation_zh: y như 意为“简直像、就像”，多用于动作或情状的比方；giống hệt 意为“一模一样”，强调外形酷似。两者都直接带比较对象，中间不需要连接词，相当于中文的“跟……一模一样／活像”。
examples:
- text: Chấm mực y như chấm nước lã, thiệt chán!
  reading: ''
  annot: Chấm mực y như chấm nước lã, thiệt chán!
