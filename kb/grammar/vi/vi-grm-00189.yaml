title: 假设条件句：… mà … là …
structure: S + mà + V，là + 结果分句
structure_pattern: S + mà + V + là + clause
explanation_zh: “主语 + mà + V，là + 结果”表示假设条件，相当于中文“要是……就……”。mà 把话题提前并标记假设，使句子带有强调与警告语气，口语中常用于威胁、打赌。如
  Mày mà hỏi là tao nghỉ chơi…（你要是敢问，我就不跟你玩了）。
examples:
- text: Mày mà hỏi là tao nghỉ chơi mày ra liền!
