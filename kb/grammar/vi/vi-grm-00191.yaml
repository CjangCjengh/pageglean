title: 时态虚词：đang（进行体与背景从句）
structure: đang + 动词/形容词（可前置于句首作背景从句）
structure_pattern: đang + VP/AP
explanation_zh: đang 表示动作或状态正在进行，相当于「正在」。它可直接放在句首作背景从句，相当于「正…的时候」，随后主句引出另一动作，是叙事中常见的铺垫句式。
examples:
- text: Đang rầu rĩ, tôi nóng tiết bặm môi rảy mạnh một cái.
  reading: ''
