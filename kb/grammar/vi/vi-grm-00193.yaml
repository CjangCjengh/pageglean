id: vi-grm-00193
language: vi
type: grammar
level: L2
level_rank: 2
title: 被动句：bị + V（不如意被动）
structure: 受事 + bị +（施事）+ 动词
structure_pattern: S + bị + (Agent) + V
explanation_zh: bị 构成对主语不利或不情愿的被动句，相当于汉语「被」，施事紧跟在 bị 之后（bị cô giáo hỏi「被老师问」）。与之相对，表示得益、如愿的被动要用
  được。本段「被问」「挨罚」都用 bị。
examples:
- text: Nhưng tôi không bị cô giáo hỏi.
  reading: ''
  annot: Nhưng tôi không bị cô giáo hỏi.
  translation_zh: 不过我没有被老师问到。
