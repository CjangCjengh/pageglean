title: 疑问结构：疑问词（gì / đâu / chi）+ vậy
structure: Gì/Chi + vậy?；疑问词置于介词/动词之后提问
structure_pattern: Q-word (+ vậy)? / S + Q-word + VP?
explanation_zh: 越南语疑问词（gì「什么」、đâu「哪里」）可置于介词或动词之后提问（Mực ở đâu…?「墨水从哪儿…？」）；追问情况时常用「疑问词
  + vậy」，如 Gì vậy?（怎么了？）。chi 是中部方言的 gì，vô 是南方口语的 vào（进、到）。
