title: 可能补语：V + không được（做不了）
structure: 动词 + không được
structure_pattern: V + không được
explanation_zh: 动词后加 không được 表示该动作无法实现或不合适，相当于汉语可能补语的否定式「～不了」（viết không được「写不了」），语序与汉语一致。肯定式为
  V + được（做得到）。
examples:
