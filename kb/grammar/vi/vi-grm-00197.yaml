title: chưa 疑问句：问「……了吗」
structure: 主 + 动/形 + chưa?
structure_pattern: S + V/Adj + chưa?
explanation_zh: 句末加 chưa 构成疑问句，询问动作或状态是否已经实现，相当于中文“……了吗”。否定回答用 chưa（还没有）。句中 "Anh đợi
  lâu chưa?" 是非常典型的日常问候用法。
