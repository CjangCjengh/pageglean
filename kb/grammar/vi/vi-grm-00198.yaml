title: 句末语气词 đi / nghen：催促与请求
structure: V + đi! / V + nghen!
structure_pattern: V + đi / V + nghen
explanation_zh: 句末语气词 đi 用于祈使、催促句，使命令语气变得柔和，相当于中文的“吧”。nghen 是南方口语语气词，相当于 nhé，用于征询对方同意或叮嘱，语气亲切。两者在口语对话中都极常用。
