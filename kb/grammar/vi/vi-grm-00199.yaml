title: 比较结构：Adj + hơn + B
structure: A + Adj + hơn + B (+ nhiều)
structure_pattern: A + Adj + hơn + B (+ nhiều)
explanation_zh: hơn 放在形容词之后构成比较级，意为“比……更……”。句末可补加 nhiều 说明程度差距大，如 "cứng hơn trái cam
  nhiều"（比橙子硬得多）。最高级则用 nhất。
examples:
- text: Nhưng trái ổi cứng hơn trái cam nhiều.
