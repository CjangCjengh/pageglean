title: vừa…đã…：刚……就……
structure: vừa + V1…, đã + V2…
structure_pattern: vừa + V1, đã + V2
explanation_zh: 时态虚词 vừa 表示前一动作刚刚发生或正要发生，đã 表示后一动作随即到来，强调两个动作紧接相继，相当于中文“刚……就……”。文中
  "vừa dợm bước…đã gọi giật" 即刚要迈步就被叫住。
examples:
- text: Nhưng tôi vừa dợm bước, Việt An đã gọi giật
