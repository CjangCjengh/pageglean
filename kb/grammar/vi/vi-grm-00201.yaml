title: bị 被动：不如意被动句
structure: bị + 施事 + V
structure_pattern: bị + NP + V
explanation_zh: bị 引出施事者构成被动结构，多表示不如意、受损的事情，相当于中文表示不利的“被”。顺利用或受益则用 được。文中 "bị Hồng
  Hoa và Chiêu Minh phá đám" 即“被红花和照明一直搅局”。
examples:
- text: khó vì bị Hồng Hoa và Chiêu Minh phá đám liên miên
  reading: ''
  annot: khó vì bị Hồng Hoa và Chiêu Minh phá đám liên miên
  translation_zh: 难就难在总被红花和照明搅局
