title: đâu có：强调否定「哪有的事」
structure: đâu (có) + V/Adj
structure_pattern: đâu (có) + V
explanation_zh: 副词 đâu（可加 có）表示强调否定，意为“哪里、哪会、根本没有”，常带反驳、辩解的口吻。可独语句使用："Đâu có!"（哪有！）。本片段中两种用法各出现一次。
examples:
