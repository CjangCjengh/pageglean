title: 是非问句「… không?」：…吗？
structure: 形容词/动词 + không?
structure_pattern: A/V + không（trợ từ tình thái nghi vấn）
explanation_zh: 越南语最简是非问句，在形容词或动词后加疑问助词 không，相当于中文「…吗」。片段中「Phim hay không?」即「电影好看吗？」。与
  có…không、phải không 同属疑问结构体系，语气直接、口语常用。
