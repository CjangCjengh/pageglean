title: không chịu + V：拒绝做、不肯做
structure: không chịu + V
structure_pattern: không chịu + VP
explanation_zh: không chịu 表示主观上「不肯、拒绝」做某事，区别于客观不能（không thể）。片段中常与连词 mà 连用，表示「不肯…而是…」，拒绝之后紧接另一动作。中文可译为「不肯/偏不」。
examples:
- text: Việt An không chịu vào ngay theo mà đứng lại bên ngoài
