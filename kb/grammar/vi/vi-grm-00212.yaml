title: 完成体虚词 rồi：已经……了
structure: 动词 + rồi（置于动词后或句末，表示已然）
structure_pattern: V + rồi
explanation_zh: rồi 放在动词后或句末，表示动作已经完成或情况已经实现，相当于汉语的「了／已经……了」。与汉语「了」的位置不同，它紧跟在动词或整个句子之后，如「Tao
  làm mất rồi」（我弄丢了）。
examples:
