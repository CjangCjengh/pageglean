id: vi-grm-00213
language: vi
type: grammar
level: L2
level_rank: 2
title: 未然否定 chưa：还没
structure: chưa + 动词（表示尚未发生、预期会发生）
structure_pattern: chưa + V
explanation_zh: chưa 否定尚未发生但预期会发生的动作，意为「还没」，与单纯否定主观意愿或事实的 không 形成对照。单独回答问句时，chưa
  相当于「还没有」。「Tao chưa xin mẹ tao」意为还没向妈妈开口（以后会开口）。
examples:
- text: Tao chưa xin mẹ tao.
  reading: ''
  annot: Tao chưa xin mẹ tao.
  translation_zh: 我还没向我妈要（钱）呢。
