title: 禁止祈使句 Đừng … nữa：别再……了
structure: Đừng + 动词 + nữa（劝止对方停止某动作）
structure_pattern: Đừng + V + nữa
explanation_zh: đừng 加动词构成否定祈使句，表示「别／不要～」；句末再加 nữa（再、再……）强调停止正在持续的动作，相当于汉语「别再……了」。片段中「Đừng
  khóc nữa！」即「别哭了！」，是日常劝慰的高频句式。
examples:
