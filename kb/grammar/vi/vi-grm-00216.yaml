id: vi-grm-00216
language: vi
type: grammar
level: L2
level_rank: 2
title: 类别词（量词）：viên / cái / tiếng
structure: 数词 + 类别词 + 名词；动词 + một + 动量词
structure_pattern: Num + CL + N ; V + một + CL
explanation_zh: 越南语计数名词必须带类别词（即量词，loại từ）：小而圆的物体用「viên」（viên mực 墨锭、viên bi 弹珠），容器用「chén」（chén
  cơm），呼吸用「hơi」。动作也能计量：“看一眼”说 nhìn một cái，“哼一声”说 “hứ” một tiếng，与汉语动量词“一下、一声”相当。
examples:
