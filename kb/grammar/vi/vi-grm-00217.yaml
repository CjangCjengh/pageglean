title: 句末疑问语气词：hả / nghen / vậy
structure: 小句 + hả？/ vậy？；动词短语 + nghen？
structure_pattern: Clause + hả / vậy ; V + nghen
explanation_zh: 越南语疑问句常靠句末语气词而非语序变化：「hả」追问原因或情况，略含惊讶；「vậy」常与疑问代词搭配（如 làm sao vậy）。「nghen」（nhé
  的南部说法）用于提醒、请求并期待对方答应，相当于“哦、好吗”。简略否定回答可用「Dạ, không có.」（不，没有）。
examples:
