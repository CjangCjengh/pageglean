id: vi-grm-00218
language: vi
type: grammar
level: L3
level_rank: 3
title: 被动标记 bị / được：不如意与如愿
structure: 受事主语 + bị / được +（施事）+ 动词
structure_pattern: S + bị / được + (Agent) + V
explanation_zh: 越南语被动用虚词标记：「bị」引出不如意的被动态，相当于“被”；「được」引出如愿、得益的被动态。两者后面可带施事（bị cô giáo
  phạt），也可省略（bị mất）。「được」另可作补语表示动作达成，如“tích góp được”（攒到）。
examples:
- text: Nhưng để dép trong lớp lại thường bị mất nên tụi tôi phải nhờ Lợi sứt giữ.
