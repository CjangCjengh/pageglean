title: 否定态度：không hề / không thèm / không chịu
structure: không hề / không thèm / không chịu + 动词
structure_pattern: không hề / thèm / chịu + V
explanation_zh: 在动词前叠加副词可表达不同的否定态度：「không hề」强调完全没有（“压根没”）；「không thèm」表示不屑、懒得；「không
  chịu」表示不肯（“怎么也不肯”，如“nhất định không chịu làm lành”）。另有「chẳng…chút nào」表示“一点也不”。
