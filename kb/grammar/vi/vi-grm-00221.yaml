id: vi-grm-00221
language: vi
type: grammar
level: L4
level_rank: 4
title: 惯常条件句：hễ（cứ）…lại…
structure: hễ（cứ）+ 条件小句，主语 + lại + 结果小句
structure_pattern: hễ (cứ) + Clause , S + lại + Clause
explanation_zh: 「hễ」（加强为「hễ cứ」）构成惯常条件复句：某情况每次出现，另一情况就规律性地随之发生，后句以「lại」呼应，相当于“每当……就又……”。本段另有「cứ…bao
  giờ…cũng…」（每次……总是……）表达同样的惯常意义。
examples:
- text: Bởi vì, hễ cứ tích góp được kha khá, nó lại đem ra chơi và bị tụi tôi ăn lại
    hết.
