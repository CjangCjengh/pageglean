id: vi-grm-00222
language: vi
type: grammar
level: L3
level_rank: 3
title: vừa... đã...：刚发生就紧接发生
structure: vừa + V1 …, đã + V2
structure_pattern: vừa + V1 … đã + V2
explanation_zh: 表示前一动作刚完成，后一动作随即发生，相当于汉语「刚……就……」。đã 强调 V2 已然发生、出乎意料地快。片段中「Tôi vừa
  ngồi xuống, Tiểu Li đã hỏi」即「我刚坐下小梨就发问」。
