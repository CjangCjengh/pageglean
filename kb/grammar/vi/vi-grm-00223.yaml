title: bị 被动句：不如意语气的被动
structure: bị + 施事者 + 动词
structure_pattern: bị + N（施事） + V
explanation_zh: bị 引出不利或不如意的被动关系，相当于汉语「被」，施事者紧跟在 bị 之后；与表示获益的 được 相对。片段中「bị Tiểu
  Li bắt gặp」即偷看时「被小梨撞见」。
examples:
- text: Đang nhìn trộm bị Tiểu Li bắt gặp, tôi thấy quê quê, tính bỏ vô nhà.
