title: 是非疑问句：句末 không 与语气词 hả
structure: 陈述语序 + không? ／ … rồi + hả?
structure_pattern: S + V + không? / S + V + rồi + hả?
explanation_zh: 是非问句用句末的 không 构成，相当于汉语「……吗／……不……」。句末语气词 hả 表示求证、确认，口语色彩强，常与 rồi 连用构成「已经……了吗」。片段两处问话正好各举一例。
