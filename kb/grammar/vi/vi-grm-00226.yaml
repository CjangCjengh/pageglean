title: 最高级 nhất 与 nhất là
structure: 形容词 + nhất ／ Nhất là + 分句
structure_pattern: Adj + nhất / nhất là + 分句
explanation_zh: nhất 置于形容词之后表示最高级，相当于「最……」；nhất là 则引出最值得强调的一项，意为「最……的是／尤其是」。片段中「Sung
  sướng nhất là…」用形容词前置以加强语气。
examples:
- text: Sung sướng nhất là Tiểu Li chủ động làm hòa trước.
  reading: ''
  annot: Sung sướng nhất là Tiểu Li chủ động làm hòa trước.
  translation_zh: 最让我高兴的是小梨主动先来和好。
