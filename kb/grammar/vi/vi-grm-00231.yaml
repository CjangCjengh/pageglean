id: vi-grm-00231
language: vi
type: grammar
level: L3
level_rank: 3
title: vừa…đã…（…liền）：刚一…就…
structure: vừa + V1，đã + V2（+ liền）（成对副词表紧接）
structure_pattern: vừa + V1 + đã + V2 (+ liền)
explanation_zh: 副词 vừa 与 đã 前后呼应，表示前一动作刚发生，后一动作随即发生，相当于「刚一……就……」。句末的 liền 同样表示「立刻」，与
  vừa 配合。
examples:
- text: sáng hôm sau vừa gặp tôi, Hải gầy đã nhăn nhở ca vọng cổ liền
