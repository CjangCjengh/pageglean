title: được + V：被动标记（被…）
structure: N + được + V（被动式，施事居后）
structure_pattern: 受事 + được + V
explanation_zh: 越南语用 bị/được 构成被动，学校语法视其为被动标记：bị 多用于不如意的事，được 多用于如意或中性之事。「người được
  yêu」即「被爱的人」。同句还用了使役结构 làm cho + 宾语 + trở thành（使……成为）。
examples:
- text: Tôi yêu nhưng không làm cho mình trở thành người được yêu.
  reading: ''
  annot: Tôi yêu nhưng không làm cho mình trở thành người được yêu.
  translation_zh: 我爱着，却无法让自己成为被爱的人。
