title: 句末 đã：先…再说
structure: V/A + đã（句末语气词）
structure_pattern: V/A + tình thái từ đã
explanation_zh: 这里的 đã 不是表过去的时态副词，而是句末语气词（tình thái từ），表示先做某事再说，相当于「先……（再说）」。如「Từ
  từ đã」即「先别急、慢慢来」。
examples:
- text: Từ từ đã! chờ một chút!
