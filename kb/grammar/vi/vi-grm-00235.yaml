title: mặc dù…vẫn…：尽管…还是…
structure: Mặc dù + 从句，主句 + vẫn + V（让步复句）
structure_pattern: mặc dù + 从句, S + vẫn + V
explanation_zh: mặc dù…vẫn… 是构成让步复句（câu ghép nhượng bộ）的成对关联词，相当于「尽管……还是……」。原文写作 Mặt
  dù，是 Mặc dù 的笔误。另有近义的 mặc cho，意为「任凭」，如「tôi mặc cho nó ca」（我由着他唱）。
examples:
- text: Mặt dù tôi không hỏi, Hải gầy vẫn cứ giải đáp.
  reading: ''
  annot: Mặt dù tôi không hỏi, Hải gầy vẫn cứ giải đáp.
  translation_zh: 尽管我没有问，瘦海还是一个劲儿地解答。
