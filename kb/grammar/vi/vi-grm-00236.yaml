title: đã / đang / sẽ / rồi：时体虚词
structure: phó từ chỉ thời-thể（时体副词）đã / đang / sẽ + 动词；句末可带 trợ từ（助词）rồi
structure_pattern: đã/đang/sẽ + V (+ rồi)
explanation_zh: 越南语动词不变位，时态与体貌由虚词（hư từ）承担：đã 表已然，đang 表进行，sẽ 表未然，均直接置于动词之前。句末助词 rồi
  常与 đã 呼应，强调动作已经实现或情况已发生变化。其位置与汉语副词相近，便于中文母语者迁移。
examples:
