id: vi-grm-00238
language: vi
type: grammar
level: L2
level_rank: 2
title: nếu… thì…：条件复句
structure: quan hệ từ（关联词）nếu 引导条件分句，thì 引导结果分句
structure_pattern: nếu + clause1, (thì) + clause2
explanation_zh: nếu… thì… 是越南语条件复句的基本关联词（quan hệ từ），nếu 引出假设条件，thì 引出结果，其中 thì 可以省略。与汉语“如果……就……”一一对应，中文母语者易掌握。注意
  thì 后必须接结果小句。
examples:
- text: Nếu mày để Việt An và tụi bạn của nó bắt gặp mày nhìn trộm thì kế hoạch của
    tụi mình sẽ phá sản ngay lập tức.
