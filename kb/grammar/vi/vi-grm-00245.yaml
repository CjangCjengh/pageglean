title: chẳng ... gì (hết)：根本不……
structure: chẳng + V + gì (hết) / đâu
structure_pattern: chẳng + V + gì (hết)
explanation_zh: chẳng 是否定副词，与 không 同义但口语色彩更重。与 gì (hết) 搭配构成完全否定“一点也不……”，片段中也有 chẳng
  ... đâu 的变体。
