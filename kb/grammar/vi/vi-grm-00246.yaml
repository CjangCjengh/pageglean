level: L3
level_rank: 3
title: đành phải：只好、不得不
structure: đành phải + V
structure_pattern: đành phải + V
explanation_zh: đành 表示不情愿地接受，đành phải V 即“只好、不得不做某事”，强调无奈与勉强。与仅表义务的 phải 相比，多了“别无选择、只得如此”的意味。
examples:
- text: Trước lý lẽ của nó, tôi đành phải chôn chặt tình cảm vào đáy lòng
  reading: ''
