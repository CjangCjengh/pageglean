title: Phải ... không?：是不是……？
structure: Phải + VP + không?
structure_pattern: Phải + VP + không?
explanation_zh: phải ... không 是一般疑问句框架：phải 提出肯定性推测，không 请求对方证实，相当于中文“是不是……？”。口语中也可只用
  “... không?”。
