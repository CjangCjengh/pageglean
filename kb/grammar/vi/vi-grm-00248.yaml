title: 别～：禁止祈使「Đừng + V」
structure: Đừng + V（+ 语气词）
structure_pattern: Đừng + V
explanation_zh: 相当于汉语「别／不要～用于劝阻」，是最基本的否定祈使式，动词前直接加 đừng 即可。片段中海瘦连续三次用此结构劝慰主人公，可见其在日常口语中的高频与自然。语气需要缓和时可在句尾加
  nữa、nhé 等。
