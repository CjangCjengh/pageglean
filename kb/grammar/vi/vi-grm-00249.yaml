title: 给动作计数：「V + 数词 + cái」
structure: V + 数词 + cái
structure_pattern: V + Num + cái
explanation_zh: cái 是越南语最通用的分类词（量词），口语中可放在动词后为该动作的出现次数计数，如 liếc một cái（瞟了一眼）、liếc
  hai cái（瞟了两眼）。与汉语「看一下」相似但计数成分在动词之后。语气随意生动，口语使用频率很高。
