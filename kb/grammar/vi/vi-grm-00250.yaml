title: 照这样去做：方式接续「cứ … mà + V」
structure: cứ + 方式 + mà + V
structure_pattern: cứ + X + mà + V
explanation_zh: cứ 表示「只管／尽管」，不加顾虑地维持某种方式；mà 为连接词，衔接方式与动作，整体意为「就照这样去～」。片段中「Cứ vậy mà
  làm」先是朋友的叮嘱，后被主人公原样引用，成为贯穿性语句。
examples:
