title: 快要……了：将然体「sắp sửa … rồi」
structure: sắp sửa + V + rồi
structure_pattern: sắp sửa + V + rồi
explanation_zh: sắp sửa 表示「快要／即将」，指动作情况马上就要发生；句尾语气词 rồi 加强「眼看就要」的语气。相当于汉语「就要……了」。片段中主人公幽默地借用英语
  outside，自嘲即将「出局」。
examples:
- text: Hôm trước liếc hai cái, hôm nay còn có một, như vậy là sắp sửa outside rồi!
  reading: ''
  annot: Hôm trước liếc hai cái, hôm nay còn có một, như vậy là sắp sửa outside rồi!
  translation_zh: 前天瞟了两眼，今天只剩一眼，这样下去就要出局了！
