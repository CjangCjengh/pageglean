title: 懒得／不屑：嫌弃否定「không thèm + V」
structure: không / chẳng + thèm + V
structure_pattern: không/chẳng + thèm + V
explanation_zh: thèm 本义为「馋、渴望」，与 không／chẳng 连用表示「懒得／不屑于做～」，强调主语对该动作毫无兴趣或不放在眼里。片段中把「爱情」拟人化，说它连「一步」都懒得跟随主人公，语带自嘲，生动幽默。
examples:
- text: Nhưng lúc này, tôi không thèm quan tâm đến sự tính toán của nó.
  reading: ''
  annot: Nhưng lúc này, tôi không thèm quan tâm đến sự tính toán của nó.
  translation_zh: 不过这时候，我懒得去理会他的盘算。
  source_book: book-vi-003
