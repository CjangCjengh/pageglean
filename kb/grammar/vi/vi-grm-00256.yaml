id: vi-grm-00256
language: vi
type: grammar
level: L2
level_rank: 2
title: 时态助词 đã 与句末助词 rồi：已然与延续至今
structure: đã + V/Adj（已然）；V + rồi（情况延续至今）
structure_pattern: đã + V/Adj; V + rồi
explanation_zh: 「đã」是完成体助词，置于动词或形容词前，表示动作已经实现或状态已经形成，「thì đã muộn」即「那时就已经晚了」。句末的「rồi」表示某种情况一直持续到现在，相当于中文「已经……了」。两者合用时对应中文的「已经……了」。
examples:
- text: lúc đó mình hối hận quay lại thì đã muộn.
  reading: ''
  annot: lúc đó mình hối hận quay lại thì đã muộn.
  translation_zh: 那时候我再后悔、想回头，就已经晚了。
