title: chưa 疑问句：……了没有？
structure: V + chưa?（问是否已经……）；Chưa.（还没有）
structure_pattern: V + chưa?; Chưa.
explanation_zh: 「chưa」意为「还没（有）」，表示动作尚未实现；「V + chưa?」是常用问句，相当于中文的「……了没有」。单个「Chưa.」即可构成完整回答，表示「还没有」。片段中「Anh
  đọc chưa mà biết hay?」还用 chưa 与 mà 连用，追问对方没有经历作依据。
