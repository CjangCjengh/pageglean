title: 倍数比较 gấp mấy 与最高级引出 nhất là
structure: Adj + gấp mấy + 基准；nhất là + NP
structure_pattern: Adj + gấp mấy + NP; nhất là + NP
explanation_zh: 「gấp mấy」表示倍数比较，意为「（比……）高出好几倍」，如「lạnh gấp mấy tôi」即「比我冷好几倍」。「nhất
  là」意为「尤其、特别是」，用于在同类中举出最突出的成员。书名「Một ngày dài hơn thế kỷ」中的「hơn」则是基本比较标记，形容词直接加 hơn
  再接比较对象。
