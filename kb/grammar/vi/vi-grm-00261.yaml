title: Đâu phải là…：反问式否认
structure: Đâu phải (là) + 被否定的说法
structure_pattern: Đâu phải (là) + XP
explanation_zh: 「Đâu phải (là)…」是反问式否认，意为「哪是……、并不是……」，用反问形式驳斥对方或前文的说法。其中的「đ đâu」是表反诘的副词，并非询问地点。语气比平铺直叙的「không
  phải」更强烈，常用于辩解。
examples:
