id: vi-grm-00264
language: vi
type: grammar
level: L1
level_rank: 1
title: chưa：还没——未然否定
structure: 主语 + (vẫn) + chưa + 动词/形容词（否定副词）
structure_pattern: S + (vẫn) + chưa + V/A
explanation_zh: 「chưa」否定到目前为止尚未发生的动作或状态，相当于“还没……”，隐含以后会实现，与单纯否定「không」不同。常与「vẫn」（仍然）连用为「vẫn
  chưa」。也可单独成句作答，表示“还没有”。
examples:
