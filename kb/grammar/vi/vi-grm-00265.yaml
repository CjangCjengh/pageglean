title: hả：求证式疑问语气词
structure: 陈述句 + hả?（句末疑问情态词 tình thái từ nghi vấn）
structure_pattern: S + V + hả?
explanation_zh: 「hả」位于句末，表示求证或略带惊讶的发问，相当于汉语“……吗？”，说话人往往已有一定预设。语气随意，多用于平辈、晚辈及口语场合，对长辈宜换用更客气的问法。
