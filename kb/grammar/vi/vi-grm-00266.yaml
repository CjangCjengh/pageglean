title: bị：遭受义被动句
structure: 主语 + bị + 动词/名词（被动句 câu bị động，多表不如意）
structure_pattern: S + bị + V/N
explanation_zh: 「bị」构成被动/遭受句，主语是动作的承受者，且多指不如意的事：bị đuổi học（被开除）、bị phạt（被罚）、bị té（摔倒）、bị
  sốt（发烧）。它与表“获得、受益”的「được」相对，是越南语被动句（câu bị động）的两大标记之一。本片段高频出现，值得重点掌握。
