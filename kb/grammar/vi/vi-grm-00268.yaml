title: Tự + V：自己——强调自主发出
structure: Tự + 动词（副词性修饰，强调施事者本人）
structure_pattern: Tự + V
explanation_zh: 「Tự」置于动词前，强调动作由当事人自己发出、与他人无关，相当于“自己、亲自”。本段中小 Li 用「Tự em té」辩称无人推她，是澄清责任归属的常用说法。汉语“自己”位置灵活，越南语「tự」须紧贴动词之前。
examples:
- text: Tự em té. Không có ai xô hết.
