id: vi-grm-00271
language: vi
type: grammar
level: L2
level_rank: 2
title: nếu…thì：假设条件句
structure: nếu + 条件小句，（thì）+ 结果小句
structure_pattern: nếu + S + thì + S
explanation_zh: nếu 引导假设条件，thì 引出结果，相当于汉语「如果……就……」。结果句常与将来助词 sẽ 搭配，表示在该条件下将会发生什么。thì
  可以省略，条件小句也可直接以 nếu 开头。
examples:
- text: Nếu yêu mày, nó sẽ không đem thư mày ra bêu riếu trước thiên hạ.
