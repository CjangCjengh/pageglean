id: vi-grm-00272
language: vi
type: grammar
level: L2
level_rank: 2
title: đã…rồi 与 chưa：已然与「尚未」
structure: đã + V + rồi（已经……了）／chưa + V（还没……）
structure_pattern: đã + V + rồi / chưa + V
explanation_zh: đã + 动词（+ rồi）表示动作已经完成，相当于「已经……了」；chưa + 动词否定到目前为止的发生，意为「还没……」，与一般否定
  không 不同。越南语时态助词系统还包括 đang（正在）、sẽ（将）、vẫn（仍然）等。本片段中「đã viết sẵn…rồi」与「chưa nói gì」恰好构成完成与否的对照。
examples:
- text: Có khi nó đã viết sẵn một lá thư trả lời rồi không chừng.
