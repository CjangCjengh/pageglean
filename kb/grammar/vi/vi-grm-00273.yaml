title: bằng：手段方式与「bằng cách nào」
structure: V + bằng + 名词；bằng cách nào?（凭什么方式？）
structure_pattern: V + bằng + NP / bằng cách nào
explanation_zh: bằng 引出动作凭借的手段、工具或方式，相当于汉语「用、以、通过」。疑问形式 bằng cách nào 用于询问「怎么、用什么办法」。如「bày
  tỏ bằng lời」即「用言语表达」。
examples:
