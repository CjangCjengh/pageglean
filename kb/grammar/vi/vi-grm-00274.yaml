title: V + không? 与 Có…không?：是非问句
structure: 谓语 + không?／Có + 谓语 + không?
structure_pattern: V + không? / Có + V + không?
explanation_zh: 越南语是非问句把 không 置于谓语之后构成「V + không?」，或采用 Có…không 框架。口语中常用极省略的形式，如「Viết
  không?」（写不写？），语调与语境补足其余成分。
