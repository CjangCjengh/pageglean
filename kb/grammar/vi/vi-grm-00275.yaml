title: 话题结构：话题 + thì 与双主语句
structure: 话题 + thì + 说明；名词短语 + 代词复指 + 谓语
structure_pattern: Topic + thì + Comment / NP + Pron + VP
explanation_zh: 越南语是话题优先型语言：话题常置于句首，用 thì 提顿（如「còn viết sao thì tùy mày」，至于怎么写就随你）。也可以在谓语部分用代词（如
  nó）复指前面的话题，构成双主语句（如「tụi con gái nó khó mở miệng lắm」）。còn…thì 则表示「至于……则……」。
examples:
- text: Tao chỉ gợi ý vậy thôi, còn viết sao thì tùy mày!
