title: để：目的从句
structure: 主句 + để + 目的小句
structure_pattern: Clause + để + Clause
explanation_zh: để 连接目的从句，表示前一分句的动作是「为了」后一分句的目的，相当于汉语「为了、以便」。常与 khỏi (phải) 搭配，表示「免得（费心/辛苦）做某事」。
examples:
- text: Để chờ mày gởi qua là nó gởi lại liền.
