title: đừng (có) + V：禁止祈使
structure: đừng + V／đừng có + V
structure_pattern: đừng (có) + V
explanation_zh: đừng 加动词表示祈使性的禁止，相当于「别、不要」。口语中常说 đừng có + 动词，语气更重，带有「别给我……」的意味，如「đừng
  có trù ẻo tao」。
