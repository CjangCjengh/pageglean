title: Đừng + 动词：禁止与劝阻
structure: Đừng + V（tình thái từ cầu khiến 祈使情态词）(+ nữa)
structure_pattern: Đừng + V (+ nữa)
explanation_zh: 「đừng」是表禁止、劝阻的祈使情态词（tình thái từ cầu khiến），置于动词前，相当于「别、不要」。句末加「nữa」表示「别再……了」，要求停止已在进行或持续的行为。
examples:
- text: Đừng mơ tưởng đến nó nữa!
