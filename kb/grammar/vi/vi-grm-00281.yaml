title: Hay là：提出替代建议
structure: Hay là + V／分句（liên từ đề xuất 提议连词）？
structure_pattern: Hay là + mệnh đề ?
explanation_zh: 「Hay là」用于提出另一个建议或备选方案，意为「要不……？还是……吧？」，常置于句首构成疑问句。是口语中协商、商量时的高频说法。
examples:
