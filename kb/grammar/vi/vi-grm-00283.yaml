id: vi-grm-00283
language: vi
type: grammar
level: L3
level_rank: 3
title: Cứ + 动词：执意、持续做某事
structure: S + cứ + V（phó từ 副词，表执意／持续）
structure_pattern: S + cứ + V
explanation_zh: 「cứ」是副词，表示动作不顾情况地执意进行或反复持续，意为「一个劲儿地……、老是……」。本段两处「cứ」分别写两人各执己见，语气生动。
examples:
- text: Hải gầy cứ bắt tôi kêu Việt An là "em" cho nó tình tứ.
  reading: ''
