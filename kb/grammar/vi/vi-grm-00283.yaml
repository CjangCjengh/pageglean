  translation_zh: Hải gầy非要我叫Việt An作「em」，说这样才显得亲昵。
  source_book: book-vi-003
  source_chapter: null
  pointer: null
- text: Tôi cứ kêu là Việt An là... Việt An, như thường ngày tôi vẫn xưng hô.
  reading: ''
