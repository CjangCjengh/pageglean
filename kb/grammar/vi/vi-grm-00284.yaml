id: vi-grm-00284
language: vi
type: grammar
level: L4
level_rank: 4
title: Ai lại：反问表不以为然
structure: Ai lại + V (+ bao giờ)!（câu nghi vấn dùng để bác bỏ 否定性反问句）
structure_pattern: Ai lại + V (+ bao giờ)
explanation_zh: 「Ai lại + V」用反问形式表示否定、批评或惊讶，意为「哪有人……的？才不会……呢」。句末可加「bao giờ」加强「从未见过这样」的语气，口语常用。
examples:
