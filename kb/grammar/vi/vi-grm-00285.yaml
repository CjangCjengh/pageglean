id: vi-grm-00285
language: vi
type: grammar
level: L4
level_rank: 4
title: Mới…đã…：事情来得比预期早
structure: Mới + 分句（thời điểm 时间点），S + đã + V（phó từ thời thể 时体副词）
structure_pattern: Mới + mệnh đề, S + đã + V
explanation_zh: 「mới」强调时间早、动作刚发生，「已」对应的「đã」表示另一情况已然出现，搭配使用表达「才刚……就已经……」，带惊讶其进展过早的语气。句末的「liền」（南方口语）进一步强化「马上、立刻」。
examples:
- text: Mới mở đầu mà "độp" một phát "yêu quí" liền, tao thấy nó sỗ sàng quá!
