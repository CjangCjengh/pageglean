id: vi-grm-00286
language: vi
type: grammar
level: L2
level_rank: 2
title: đã…rồi：已然与完成
structure: đã + V/A（动词前副词）；… + rồi（句末语气/体貌词）
structure_pattern: đã + V ; V/A + rồi
explanation_zh: 「đã」是动词前的副词（phó từ），表示动作已发生或状态已实现，相当于中文的“了、过”。句末的「rồi」表示动作完成或情况已经变化，相当于句末“了”。两者可分别使用，也可呼应出现，口语中常只用「rồi」表示完成。
