title: V + giùm：请对方帮忙做某事
structure: V + giùm（+ 宾语）
structure_pattern: V + giùm (+ O)
explanation_zh: 「giùm」是南部口语中「giúp」的说法，置于动词之后，表示请求对方帮忙做某事，相当于“替（我）…、帮忙…”。结构为 V + giùm（+
  宾语），语气比正式说法更随意。
examples:
