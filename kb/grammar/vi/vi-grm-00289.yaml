title: đâu có + V：强调否定
structure: đâu có + V/A
structure_pattern: đâu + có + V
explanation_zh: 「đâu có + V/形容词」是强调否定，用「đâu」加重语气，相当于“根本没…、哪会…”，带有反驳或意外的口气。口语中也常说「Đâu
  có được!」，意为“那可不行！”。
