title: làm cho + 补语：致使结构
structure: làm cho + 宾语 + Adj/V
structure_pattern: làm cho + O + A/V
explanation_zh: 「làm cho + 宾语 + 形容词/动词」是致使结构，表示使某人/某物达到某种状态或产生某种结果，相当于“弄得…、让…变得…”。本段中还与比较级「hơn」和可能补语「được」连用。
