title: phải…mới…：必要条件
structure: phải + 条件，… mới + 结果
structure_pattern: phải + điều kiện … mới + kết quả
explanation_zh: 「phải + 条件」提出必要条件，「mới + 结果」表示只有满足该条件才会出现后面的结果，相当于“要（等到）…才…”。其中「mới」是副词，强调事情发生得晚或来之不易。
examples:
- text: Nhưng phải vài tháng nữa tóc em mới đủ dài.
