title: Thiếu gì + N：有的是、不乏
structure: Thiếu gì + 名词
structure_pattern: Thiếu gì + N
explanation_zh: 「Thiếu gì + 名词」是口语惯用语，字面为“哪会缺”，实际表示“有的是…、不乏…”，用反问形式强调数量多、选择多。语气随意，常用来劝对方不必拘泥于一种办法。
examples:
- text: Không gửi thì vứt vào sọt rác! Thiếu gì cách giải quyết!
