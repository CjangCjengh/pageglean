title: 「chỉ … thôi」：只、仅仅
structure: chỉ + V/N + thôi
structure_pattern: chỉ + V/N + thôi
explanation_zh: 「chỉ … thôi」前后呼应，表示「只……而已」，用于限定范围或数量。thôi 收束语气，相当于「罢了」，口语中可只保留 chỉ
  或 thôi 之一。
