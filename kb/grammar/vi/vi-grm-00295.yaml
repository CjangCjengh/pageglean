title: 「có … không」与「phải không」：是非问句
structure: có + V/adj + không？；陈述句 + phải không？
structure_pattern: có + V/adj + không | … + phải không
explanation_zh: 「có … không」是典型是非问句，có 置于谓语前、không 置于句末，询问「是否……」。「phải không」置于陈述句末，相当于「……对吗／是不是」，寻求对方确认。
