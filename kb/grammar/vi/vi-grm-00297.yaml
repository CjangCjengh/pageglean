title: 「càng ngày càng」与「mỗi … mỗi …」：越来越
structure: càng ngày càng + V/adj；mỗi + ngày + mỗi + adj
structure_pattern: càng ngày càng + X | mỗi + ngày + mỗi + adj
explanation_zh: 两者都表示程度随时间递增，相当于中文「越来越……」。「càng ngày càng」后接动词或形容词；「mỗi ngày mỗi +
  形容词」用两个 mỗi 前后呼应，强调逐日变化。
