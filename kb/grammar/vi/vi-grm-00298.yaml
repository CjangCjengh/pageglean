title: 「Dù vậy … vẫn」：尽管如此……仍然
structure: Dù vậy, S + vẫn + V
structure_pattern: dù vậy, S + vẫn + V
explanation_zh: 「dù vậy」承接上文表示让步，「vẫn」强调情况不因此改变，合起来相当于「尽管如此……仍然……」。也可扩展为「dù … nhưng
  … vẫn …」。
examples:
- text: Dù vậy, Tiểu Li vẫn không bỏ ý định để tóc dài.
