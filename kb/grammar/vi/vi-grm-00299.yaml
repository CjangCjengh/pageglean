title: cứ + 动词：「只管」与「不停地」
structure: cứ + 动词 (+ 语气词 đi)
structure_pattern: cứ + V (+ đi)
explanation_zh: cứ 是情态副词，置于动词之前。一是鼓励对方放心去做，相当于汉语「只管、尽管」；二是表示动作、状态持续不断或反复出现，有「一个劲儿地」之意。与语气词
  đi 连用时催促、应允的意味更浓。
