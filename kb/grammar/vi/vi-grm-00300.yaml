title: thì 话题句：「提它干什么」
structure: 话题 + thì + 评述（本句为反问 nói làm gì）
structure_pattern: Topic + thì + Comment
explanation_zh: thì 是话题标记虚词，置于被提前的成分之后，引出评述，相当于汉语「（至于）……嘛」。本句话题是 Chuyện hôm qua（昨天的事），评述部分用反问
  nói làm gì（说来干什么），表示不值一提。
examples:
