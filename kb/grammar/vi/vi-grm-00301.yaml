title: đã / đang：已然与进行
structure: đã（已然）/ đang（进行）+ 动词或谓语
structure_pattern: đã/đang + V
explanation_zh: đã 与 đang 是越南语最基本的体貌虚词：đã 表示动作已发生或状态已然，đang 表示动作正在进行，分别相当于汉语的「已经」「正在」。这类标记在越南语中通常须显性出现，中文母语者容易遗漏。
