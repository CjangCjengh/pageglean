id: vi-grm-00303
language: vi
type: grammar
level: L3
level_rank: 3
title: mỗi ngày một + 形容词：越来越……
structure: mỗi + 时间名词 + một + 形容词
structure_pattern: mỗi ngày + một + Adj
explanation_zh: 「mỗi ngày một + 形容词」表示程度逐日加深，相当于汉语「一天比一天……、越来越……」。由 mỗi + 时间名词与「một
  + 形容词」组合而成，是叙述中描写渐变的高频句式。
examples:
- text: Tôi rượt theo một quãng, thấy khoảng cách giữa tôi với nó mỗi ngày một xa,
    bèn đứng lại thở dốc.
  reading: ''
  annot: Tôi rượt theo một quãng, thấy khoảng cách giữa tôi với nó mỗi ngày một xa,
    bèn đứng lại thở dốc.
  translation_zh: 我追了一段路，眼看我和他之间的距离越来越远，只好停下来喘粗气。
