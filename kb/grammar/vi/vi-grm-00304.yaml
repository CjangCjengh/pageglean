title: như：明喻比较（“像……一样”）
structure: V/Adj + như + N（像……一样）
structure_pattern: Adj/V + như + N
explanation_zh: như是比较关系词（quan hệ từ so sánh），构成“动词/形容词＋như＋名词”的明喻结构，相当于“像……一样”。越南语喜用固定的动物喻体，本片段两用其例：nhanh
  như ngựa（快如马）、lẩn nhanh như chạch（溜得像泥鳅）。
examples:
- text: Nhưng Lợi sứt chạy nhanh như ngựa.
  reading: ''
  annot: Nhưng Lợi sứt chạy nhanh như ngựa.
  translation_zh: 可是阿缺跑得像马一样快。
