id: vi-grm-00305
language: vi
type: grammar
level: L3
level_rank: 3
title: được：能性与结果补语（“得、到”）
structure: V + được（能实现）；否定：chưa/không + V + được
structure_pattern: V + được
explanation_zh: được置于动词后作结果补语/可能补语（bổ ngữ chỉ kết quả/khả năng），表示动作得以实现或有实现的可能，相当于汉语补语“得、到、成”。否定式用chưa/không＋V＋được，如chưa
  “trả thù” được（还没能报仇）。注意与动词được（获得）及褒义被动标记được区分。
examples:
- text: 'Từ đó đến khi về tới nhà, tôi chỉ nói với Tiểu Li được mấy câu:'
