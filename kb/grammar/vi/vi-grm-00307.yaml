title: có…cũng…：让步假设（“即使……也……”）
structure: có + V + cũng + (chẳng/không) + V
structure_pattern: có + V + cũng + V
explanation_zh: 让步复句结构（câu ghép nhượng bộ）：“có＋动词”先退一步提出假设，“cũng”引出无论如何都不变的结论，相当于“即使/就算……也……”。常与chẳng/không等否定词连用，比dù…cũng…更口语化。
examples:
- text: Tôi biết có đuổi cũng chẳng kịp.
