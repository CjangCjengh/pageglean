id: vi-grm-00310
language: vi
type: grammar
level: L3
level_rank: 3
title: khiến：使、弄得（使役）
structure: S + khiến + O + V/Adj
structure_pattern: chủ ngữ + động từ gây khiến 'khiến' + tân ngữ + vị ngữ
explanation_zh: 「khiến」是使役动词（động từ gây khiến），相当于中文的「使、弄得」，主语通常是某件事，使宾语产生某种心理或行为。文中「khiến
  Tiểu Li đâm ngại đi chung với tôi」意为「使得 Tiểu Li 开始不好意思跟我一起走」。与中文「让」不同，「khiến」一般不用于祈使语气。
examples:
- text: Nó cứ lặp đi lặp lại cái trò bỉ ổi đó khiến Tiểu Li đâm ngại đi chung với
    tôi.
  reading: ''
  annot: Nó cứ lặp đi lặp lại cái trò bỉ ổi đó khiến Tiểu Li đâm ngại đi chung với
    tôi.
  translation_zh: 它老是重复那个卑鄙的把戏，弄得 Tiểu Li 都不好意思跟我一起走了。
