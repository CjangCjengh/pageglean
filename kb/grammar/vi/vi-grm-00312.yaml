title: V＋ra：结果补语「发现、明白」
structure: V + ra（结果补语）
structure_pattern: động từ + bổ ngữ kết quả 'ra'
explanation_zh: 「ra」作结果补语接在认知类动词后，表示「认出、明白、发现」等结果的实现，如 hiểu ra（明白过来）、phát hiện ra（发现）。这与表方向的「ra」（向外）不同，如同段中的「xông
  ra」（冲出去）。对应中文「看出来、想明白」一类结果补语。
examples:
- text: Một lát sau, Tiểu Li mới phát hiện ra sự mất tích của tôi.
  reading: ''
