id: vi-grm-00316
language: vi
type: grammar
level: L2
level_rank: 2
title: 比较句 hơn：A 比 B 更……
structure: 形容词 + hơn + 比较对象
structure_pattern: Adj + hơn + N/Pron
explanation_zh: 越南语比较句把 hơn（更、比）放在形容词之后，语序恰与汉语「比……更……」相反，翻译时需整体调序。比较对象可以省略，如「gắn bó
  với nhau hơn」（彼此更加亲密）。
examples:
- text: Nhưng Lợi sứt vốn khỏe hơn tôi.
  reading: ''
