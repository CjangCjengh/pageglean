title: càng… càng…：越……越……
structure: càng + 动词/形容词，càng + 动词/形容词
structure_pattern: càng + V/Adj , càng + V/Adj
explanation_zh: càng 意为「越发」，两个分句连用表示两个动作或程度同步递增，即汉语的「越……越……」。càng 直接放在动词或形容词之前，不需要其他虚词。
examples:
