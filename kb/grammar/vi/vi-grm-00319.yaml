title: đã vậy… còn…：这还不算，居然还……
structure: đã vậy + 主语 + còn + 动词短语
structure_pattern: Đã vậy + S + còn + V
explanation_zh: đã vậy 承接前文已然的（多为负面的）情况，引出变本加厉的行为，相当于「这还不算、居然还……」。còn 与 đã vậy 呼应，加强递进语气。
examples:
