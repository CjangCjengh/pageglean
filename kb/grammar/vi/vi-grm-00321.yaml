id: vi-grm-00321
language: vi
type: grammar
level: L3
level_rank: 3
title: 后置助词 được：动作成功与可能性
structure: V + được（得以做到）；không thể + V + được（无法做到）
structure_pattern: V + được ; không thể + V + được
explanation_zh: được 作助动词后置时表示动作得以实现或成功，相当于汉语的「到、成、得了」，如 vùng dậy được（挣扎着起来了）。否定可能用「không
  thể…được」框架，前后呼应，强调「没法……」。
examples:
