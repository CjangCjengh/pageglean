title: so với：与……相比
structure: 形容词/动词短语 + so với + 比较基准
structure_pattern: Adj/V + so với + N
explanation_zh: so với 意为「与……相比」，引出比较的基准，多用于书面语或抒情语体。「không thấm gì so với…」表示「跟……比起来根本不算什么」，是权衡轻重的常用句式。
examples:
- text: Nhưng những "nỗi đau" nhỏ nhoi này thật không thấm gì so với nỗi hân hoan
    choáng ngợp trong lòng tôi
