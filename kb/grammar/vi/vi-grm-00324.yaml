id: vi-grm-00324
language: vi
type: grammar
level: L2
level_rank: 2
title: 分类词 cái / con / lá
structure: 数词 + 分类词（danh từ chỉ đơn vị）+ 名词
structure_pattern: Num + CL (cái/con/lá) + N
explanation_zh: 越南语名词计数或指称时一般须带分类词（danh từ chỉ đơn vị，相当于汉语量词），搭配相对固定：“cái”多用于无生命具体物（cái
  ngã ba 三岔路口），“con”用于动物及道路、河流等延伸物（con đường、con hẻm），“lá”用于薄片状物（lá thư 信）。具体搭配需逐一积累，不能与中文量词一一对应。
examples:
- text: có một cái ngã ba, nơi gặp nhau giữa con đường lớn chạy ngang trường tôi và
    một con hẻm nhỏ
