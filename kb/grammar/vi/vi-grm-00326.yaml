title: mà：关系从句标记
structure: 名词 + mà（quan hệ từ）+ 关系从句
structure_pattern: N + mà + Clause
explanation_zh: “mà”是引导关系从句（mệnh đề quan hệ）的关系词，把修饰成分接在名词之后，相当于中文“……的……”。越南语定语后置，“mà”是从句开始的重要信号；从句中与先行词重复的成分可以省略。
examples:
- text: Đó là những bước phát triển mà tôi đã hình dung và bố trí sẵn trong... đầu.
