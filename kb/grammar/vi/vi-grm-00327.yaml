title: có… hay không：是否问句
structure: có + V + hay không（是非问格式）
structure_pattern: có + V + hay không
explanation_zh: “có… hay không”是越南语典型的是非问结构，表示“……还是不……/是否……”，常嵌入“biết”等动词之后作间接问句。文中“không
  biết người ta có yêu lại mình hay không”即“不知道人家是否也喜欢自己”。
examples:
