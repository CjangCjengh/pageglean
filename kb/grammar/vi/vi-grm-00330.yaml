title: 「V + khỏi：离开、脱离某处」
structure: V（rời/chui/đi…）+ khỏi + 处所名词（趋向补语）
structure_pattern: V + khỏi + NP
explanation_zh: khỏi 表示“离开、脱离”，常紧跟在动词之后作补语并引出处所，如 rời khỏi（离开）、ra khỏi（出来）、đi khỏi（走开）。它与汉语“离、出”对应，但位置在主要动词之后，属越南语的补语结构。
