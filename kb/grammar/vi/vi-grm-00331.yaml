id: vi-grm-00331
language: vi
type: grammar
level: L3
level_rank: 3
title: 「sắp sửa：即将、眼看就要」
structure: sắp sửa + V（时态虚词表将然，常与 thì 呼应）
structure_pattern: sắp sửa + V
explanation_zh: sắp sửa 是表示“即将、正要”的时态虚词（phụ từ），是 sắp 的强调形式。它常与 thì 呼应，构成“正要……忽然……”的叙事句式。与
  đã（已然）、đang（进行）、sẽ（将然）同属越南语体貌虚词系统。
examples:
- text: Khi sắp sửa từ bỏ ý định rình rập thì bất chợt tôi nhìn thấy một chiếc xe
    đò đỗ trên bãi đất trống ven đường.
