title: 「bị：不如意/受损义被动」
structure: N + bị + V/Adj（被动句，主语受影响且不如意）
structure_pattern: N + bị + V
explanation_zh: bị 是越南语被动句的主要标记之一，专指对主语不利、不如意的事，与表受益的 được 相对。片段中 đang bị hỏng 即“（不巧）正坏着”，bị
  可与进行体 đang 连用。bị 也可表遭受，如 bị phạt（挨罚）。
examples:
- text: Có lẽ chiếc xe đang bị hỏng một bộ phận nào đó.
