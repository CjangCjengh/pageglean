id: vi-grm-00335
language: vi
type: grammar
level: L1
level_rank: 1
title: 时体副词 đã / đang / sẽ：已然、进行与将来
structure: 时体副词（phó từ thời thể）đã / đang / sẽ + 动词
structure_pattern: đã/đang/sẽ + V
explanation_zh: 越南语动词不变位，时态与体貌靠动词前的副词（phó từ）表达：đã 表已然或完成，đang 表进行，sẽ 表将来。三者在片段中反复出现，是叙事的时间骨架。它们可与其他副词叠加连用。
examples:
- text: cuộc trò chuyện diễn ra khá tự nhiên và suôn sẻ, đúng như tôi đã dự kiến.
  reading: ''
