title: Càng … càng …：越……越……
structure: 递进关联词（quan hệ từ tăng tiến）càng … càng … 前后呼应
structure_pattern: Càng + X, càng + Y
explanation_zh: 成对使用的关联词，表递进关系，相当于汉语“越……越……／越来越……”。“Càng lúc, … càng …”是叙事常用框架，表示随时间推移程度不断加深。
examples:
- text: Càng lúc, Hải gầy và Việt An càng tiến gần lại chỗ tôi nấp.
  reading: ''
  annot: Càng lúc, Hải gầy và Việt An càng tiến gần lại chỗ tôi nấp.
  translation_zh: 时间越久，瘦海和越安就越靠近我躲藏的地方。
