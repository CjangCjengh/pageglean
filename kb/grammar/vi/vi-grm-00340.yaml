title: được：得以与能够
structure: 情态助动词 được：置于动词前表“得以、有机会”；置于动词（短语）后作补语表“能、可以”
structure_pattern: được + V / V + được
explanation_zh: được 的基本义是“得到”，虚化后表示动作得以实现或具备可能性。前置如“không được chứng kiến”（无缘见证），后置如“chẳng
  làm gì được”（毫无办法）。中文母语者可类比“得／能”来理解。
examples:
