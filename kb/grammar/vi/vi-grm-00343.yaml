title: 「đã」：过去/已然时态助词
structure: S + đã + V（已经……）
structure_pattern: đã + V (+ O)
explanation_zh: 「đã」是标示过去或已然的时间副词（phó từ thời gian），置于动词前，表示动作已完成或情况已经出现，相当于汉语“已经”。叙述往事时高频出现；语境明确时也可省略。
examples:
- text: Tôi bàng hoàng hiểu ra mình đã đi khỏi thành phố khá xa.
