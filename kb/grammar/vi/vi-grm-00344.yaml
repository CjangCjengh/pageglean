id: vi-grm-00344
language: vi
type: grammar
level: L1
level_rank: 1
title: 量词（loại từ）与复数标记「những」
structure: (数词/những) + 量词 + 名词（chiếc/đàn/cái/tờ…）
structure_pattern: (num/những) + loại từ + N
explanation_zh: 越南语名词前一般须加量词（类词）：交通工具用「chiếc」，禽兽群体用「đàn」，一般器物用「cái」，薄片物用「tờ」。「những」为复数标记，相当于“这些/那些”。
examples:
