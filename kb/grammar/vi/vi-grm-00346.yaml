title: 「trước khi… kịp V」：在……来得及之前
structure: trước khi + S + kịp + V（趁……还没来得及……）
structure_pattern: trước khi + S + kịp + V
explanation_zh: 「trước khi」表“在……之前”；「kịp」意为“来得及、赶得上”。两者连用强调抢在对方来得及做某事之前行动，带紧迫感。
examples:
- text: giấu mình sau cánh cửa gió trước khi Việt An kịp nhìn thấy
