id: vi-grm-00349
language: vi
type: grammar
level: L3
level_rank: 3
title: không V nổi：…不了／不堪
structure: không / chẳng + V + nổi
structure_pattern: không + V + nổi
explanation_zh: nổi 放在动词后，表示凭体力或心力「能胜任、做得到」。否定式 không/chẳng V nổi 相当于汉语可能补语「V不了、吃不消、没法V」。例句意为连做梦都想不出这样的话。
examples:
- text: Và biết đâu Việt An còn gửi "kèm" tới tôi những lời hẹn hò không mơ thấy nổi!
