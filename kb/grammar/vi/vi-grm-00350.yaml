title: 语气词 hả、vậy：是非问与特指问
structure: 陈述句 + hả？；含疑问词的句子 + vậy？
structure_pattern: … + hả / … + vậy
explanation_zh: 越南语是非问句常用句末语气词构成。hả 表示带有惊讶、求证语气的提问，近似汉语「吗、啊」。vậy 用于特指问句末尾，近似「呢、啊」，使语气更自然。
