title: từ… đến…：从…到…
structure: từ + X + đến + Y
structure_pattern: từ + X + đến + Y
explanation_zh: từ… đến… 表示时间或空间的起点与终点，相当于汉语「从……到……」。既可作状语（从早到现在），也可作补语修饰动词（从头到脚地打量）。
