title: đã V sẵn：早已…好了
structure: đã + V + sẵn
structure_pattern: đã + V + sẵn
explanation_zh: đã 表示动作完成或状态已然，sẵn 表示「预先、现成地」。两者连用强调动作早已完成、状态已经就绪，相当于汉语「早就……好了／在那儿了」。
examples:
- text: Hải gầy đã ngồi đợi sẵn trong phòng học của tôi.
  reading: ''
  annot: Hải gầy đã ngồi đợi sẵn trong phòng học của tôi.
  translation_zh: Hải gầy早就坐在我的书房里等着了。
