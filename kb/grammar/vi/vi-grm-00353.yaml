id: vi-grm-00353
language: vi
type: grammar
level: L1
level_rank: 1
title: 分类词 chiếc、con 与复数标记 những
structure: 数词/指示词 + 分类词 + 名词；những + 分类词 + 名词
structure_pattern: số từ / chỉ từ + loại từ + danh từ; những + loại từ + danh từ
explanation_zh: 越南语名词与数词或指示词连用时，中间须加分类词（loại từ）：叶子、器物等无生命物用 chiếc，动物用 con。những 置于分类词前表示复数“那些”。语序与汉语量词一致，但名词与分类词的搭配需逐个记忆。
