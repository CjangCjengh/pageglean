title: 程度强调：quá / lắm / ghê
structure: 形容词 + quá / lắm / ghê
structure_pattern: tính từ + quá / lắm / ghê
explanation_zh: quá 和 lắm 都表示“很、太”，紧跟在形容词之后；ghê 是南方口语，语气近似“真……啊、……得很”，三者都是程度副词（phó
  từ chỉ mức độ）。它们在片段中反复出现，是口语中最常用的强调手段。
