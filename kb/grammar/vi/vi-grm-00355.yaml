title: 将来时助词 sẽ
structure: sẽ + 动词（表示将来）
structure_pattern: sẽ + động từ
explanation_zh: sẽ 置于动词前表示动作尚未发生，相当于“将、要”，常与 ngày mai 等时间词呼应。越南语动词本身不变形，时态由此类副词（phó
  từ）承担。
