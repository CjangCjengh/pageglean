title: 完成与已然：đã 与 rồi
structure: đã + 动词；动词后 / 句末 + rồi
structure_pattern: đã + động từ; động từ + rồi
explanation_zh: đã 置于动词前表示动作已经发生；rồi 置于动词后或句末表示“已经、完成”。两者可单独使用，简短答句常用“动词 + rồi”。大致对应汉语的“了、过、已经”。
