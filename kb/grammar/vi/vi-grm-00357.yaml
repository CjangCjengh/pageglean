title: 进行时助词 đang
structure: đang + 动词（表示进行）
structure_pattern: đang + động từ
explanation_zh: đang 置于动词前表示动作正在进行，相当于“正在”。它可出现在分句之首，如 “Đang nói” 即“正说着”。
