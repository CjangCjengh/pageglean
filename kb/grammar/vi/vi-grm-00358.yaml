title: 是非问句：có…không 与 V+chưa
structure: có + 动词 + không？；动词 + chưa？
structure_pattern: có + động từ + không; động từ + chưa
explanation_zh: có…không 是最基本的是非问框架（câu nghi vấn），có 强调动作的发生；句末加 chưa 则问“已经……了吗”，回答用
  rồi。片段中还出现附加问句“…phải không”，同样表示求证。
