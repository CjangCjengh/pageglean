title: 目的连词 để
structure: để + 动词 / 小句（表示目的）
structure_pattern: để + động từ / mệnh đề (trạng ngữ chỉ mục đích)
explanation_zh: để 引导目的状语，相当于“为了、用来”，可单独成句作答。置于句首时引出目的小句；与 khỏi 搭配表示“免得、以免”。
