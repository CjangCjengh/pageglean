title: 不如意被动：bị
structure: bị + 动词（被动，多指不如意）
structure_pattern: bị + động từ (câu bị động)
explanation_zh: bị 表示被动且多指不如意的事，与表示获益的 được 相对；此处指蝴蝶“被压扁”。同句的 “làm sao…được” 是反问格式，表示“怎么可能……”。
examples:
- text: Bị đè bẹp dí làm sao sống được!
