title: 疑问语气词 không / hả / hén：一般疑问与求证
structure: 陈述句 + không? / hả? / hén?
structure_pattern: S + V/O + không / hả / hén?
explanation_zh: 越南语一般疑问句常在句末加 không，相当于汉语的「吗」。hả 用于口语中的追问、求证或表示惊讶，语气更随意。hén 则带有征询对方认同的意味，相当于「……对吧」。
