id: vi-grm-00363
language: vi
type: grammar
level: L2
level_rank: 2
title: V + được：结果实现与可能性
structure: 动词 + được（表示做到/能做到）
structure_pattern: V + được; không + V + được
explanation_zh: được 置于动词之后，表示动作达到结果或具备可能性，相当于汉语的「到」「成」「能」。否定时说 không + V + được，即「没能……」。如
  thực hiện được lời hứa（兑现诺言）、mở miệng được（开得了口）。
examples:
- text: Nhưng mùa hè năm đó, tôi không thực hiện được lời hứa với Tiểu Li.
  reading: ''
