id: vi-grm-00364
language: vi
type: grammar
level: L2
level_rank: 2
title: chỉ … thôi：只是……而已
structure: chỉ + 动词 …（句末加 thôi 呼应）
structure_pattern: chỉ + V … + thôi
explanation_zh: chỉ 意为「只」，置于动词之前；句末常加语气词 thôi 与之呼应，表示「只是……而已/罢了」。thôi 也可省略，基本意思不变。
examples:
- text: Em không ăn đâu. Em chỉ ép nó vào tập thôi.
  reading: ''
  annot: Em không ăn đâu. Em chỉ ép nó vào tập thôi.
  translation_zh: 我不吃的。我只是把它压进本子里罢了。
  source_book: book-vi-003
