id: vi-grm-00366
language: vi
type: grammar
level: L1
level_rank: 1
title: 分类词：viên、cái、cục、con、cọng
structure: 数词/数量词 + 分类词 + 名词（如 viên bi / cái bóng / cục đá / con lừa / cọng râu）
structure_pattern: Num/Quant + CL + N
explanation_zh: 越南语与汉语一样，数词或数量词修饰名词时须加分类词（量词），按事物的形状、类别选择。本片段可见：viên 用于小而圆的颗粒（viên
  bi 弹珠），cái 用于一般无生命物（cái bóng 影子），cục 用于块状物（cục đá 石头），con 用于动物（con lừa 驴），cọng 用于细长条状物（cọng
  râu 胡须）。
examples:
- text: Đụng phải viên bi, tôi lấy ra cho Tiểu Li
