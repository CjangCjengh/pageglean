id: vi-grm-00367
language: vi
type: grammar
level: L2
level_rank: 2
title: không/chẳng… nữa：不再…
structure: không/chẳng + V + nữa
structure_pattern: không/chẳng + V + nữa
explanation_zh: nữa 置于句末，与前面的否定词配合表示动作或状态的终止，相当于汉语“不再…”。chẳng 与 không 同义，语气更口语或书面化。片段中“không
  buồn mắng… nữa”意为“懒得再骂／不再骂”，“buồn + V”表示“有兴致/愿意做某事”，多用于否定。
examples:
- text: Nhưng lần này, Hải gầy không buồn mắng tôi là con lừa nữa.
