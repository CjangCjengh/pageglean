id: vi-grm-00368
language: vi
type: grammar
level: L2
level_rank: 2
title: 句末“chứ”：征询确认的反问
structure: 陈述小句 + chứ?
structure_pattern: Clause + chứ
explanation_zh: chứ 放在句末构成附加疑问，说话人心中已有较肯定的预期，只求对方确认，相当于汉语“…吧？／…是吧？”。片段中“mày phải ở
  lại học nốt năm học này chứ?”满怀侥幸地求证“你得留下来念完这学期吧？”。在答句“A chứ B nào!”中则表强调取舍，“是A，还能是哪个B！”。
examples:
- text: Nhưng mày phải ở lại học nốt năm học này chứ?
