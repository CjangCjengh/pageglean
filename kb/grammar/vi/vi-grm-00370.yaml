id: vi-grm-00370
language: vi
type: grammar
level: L3
level_rank: 3
title: “bị”被动句：表不如意
structure: 受事 + bị +（施事）+ V
structure_pattern: N + bị + (N) + V
explanation_zh: 越南语被动常用 bị / được 标记：bị 多接不如意的事，接近汉语带贬义的“被”；được 多接有益、可喜的事。施事可紧跟在
  bị 之后，也可省略。片段两处 bị 均表受挫：“bị từ chối thẳng thừng”（被断然拒绝）、“bị Hải gầy… giễu cợt”（被瘦海嘲笑）。
examples:
- text: lại còn bị Hải gầy suốt ngày giễu cợt
  reading: ''
  annot: lại còn bị Hải gầy suốt ngày giễu cợt
  translation_zh: 还整天被瘦海（阿瘦）嘲笑。
