title: không sao… được：怎么也…不了
structure: không sao + V + được
structure_pattern: không sao + V + được
explanation_zh: sao 在此义为“设法、以某种方式”，“không sao V được”表示“无论如何也没法 V”，语气比单纯的“không V
  được”更强，强调尝试无果。được 为可能补语。片段中“trằn trọc hoài không sao ngủ được”即“翻来覆去怎么也睡不着”。
examples:
- text: Tối đó, tôi trằn trọc hoài không sao ngủ được.
  reading: ''
  annot: Tối đó, tôi trằn trọc hoài không sao ngủ được.
  translation_zh: 那天晚上，我翻来覆去怎么也睡不着。
