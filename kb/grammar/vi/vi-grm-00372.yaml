id: vi-grm-00372
language: vi
type: grammar
level: L4
level_rank: 4
title: “đã”的虚拟用法：本来早就会…
structure: 假设条件小句, 主语 + đã + V
structure_pattern: (Gặp/Nếu...) + 条件, S + đã + V
explanation_zh: đã 通常表示已然或过去，但与未实现的条件搭配时，表示与事实相反的假设结果，相当于汉语“（要是…）早就…了”。片段“Gặp lúc
  khác, tôi đã xấu hổ quay mặt đi”意为“换了别的场合，我早就羞得转过脸去了”，下句以“Nhưng lúc này”（可此刻）转回现实，形成虚实对照。
examples:
- text: Gặp lúc khác, tôi đã xấu hổ quay mặt đi.
