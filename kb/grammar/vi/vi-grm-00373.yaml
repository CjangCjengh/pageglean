id: vi-grm-00373
language: vi
type: grammar
level: L1
level_rank: 1
title: 分类词 lá / con / cái：名词的量词搭配
structure: 分类词（loại từ）+ 名词
structure_pattern: Cl + N
explanation_zh: 越南语名词计量或指称时通常须加分类词（loại từ），类似汉语量词但搭配严格：lá 用于扁平薄片物（lá thư“信”），con
  用于动物（con cừu“绵羊”），cái 用于一般无生命物（cái bảng“黑板”）。分类词加名词也可单独起指称作用。
examples:
- text: Nó đã ném trả lá thư vô mặt mình thì mình phải biết điều mà rút lui chứ sao!
