id: vi-grm-00377
language: vi
type: grammar
level: L4
level_rank: 4
title: Có V thì V cho…：歌谣式“要做就做彻底”
structure: Có + V + thì + V + cho + 补语
structure_pattern: có + V + thì + V + cho + Adj/V
explanation_zh: 此为民间歌谣（ca dao）对举句式：“có V thì V cho + 补语”表示要做就做到彻底，cho 引出结果补语（cho chắc＝实实在在地，cho
  luôn＝干脆到底）。叙述者随后把歌谣格式套进叙述（“Tôi trục trặc cho luôn bằng cách lờ hẳn Việt An”），产生诙谐效果。该格式口语中常用于表达决断或调侃。
examples:
- text: 'Có thương thì thương cho chắc

    Còn như trục trặc thì trục trặc cho luôn!'
