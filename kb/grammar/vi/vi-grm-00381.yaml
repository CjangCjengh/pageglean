title: 「V + một cái」：给动作计量的「一下」
structure: 动词短语 + 补语 một cái（数词 + 单位名词，计量一次动作）
structure_pattern: cụm động từ + bổ ngữ chỉ số lần 'một cái' (số từ 'một' + danh từ
  chỉ đơn vị 'cái')
explanation_zh: 越南语用「数词 + 分类词（danh từ chỉ đơn vị）」给动作计量，分类词「cái」把动作事物化，「nhìn một cái」即「看一眼」，与汉语「看一下、掐一下」对应。这是越南语分类词系统的典型用法，片段中多次出现。
examples:
