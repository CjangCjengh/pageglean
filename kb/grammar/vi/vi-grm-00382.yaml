title: 「không hề…」：一点也不……
structure: 否定副词 không hề + 谓语（动词短语）
structure_pattern: phó từ phủ định 'không hề' + vị ngữ (cụm động từ)
explanation_zh: 「hề」与「không」连用加强否定，表示动作完全没有发生，语气比单用「không」强烈，相当于「一点也不／根本没有」。后接动词短语，句中常与并列动词（liếc
  ngang liếc dọc）搭配。
examples:
- text: tôi nhìn chăm chăm lên bảng, không hề liếc ngang liếc dọc
