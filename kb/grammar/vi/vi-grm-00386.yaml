title: 句末助词 thôi：限定与缓和语气
structure: V / VP + thôi
structure_pattern: V + thôi
explanation_zh: thôi 是句末情态词（tình thái từ），表示「只是、不过」，限定范围或缓和祈使语气，相当于汉语「……就好、罢了」。片段中两次出现，是口语高频用法。
