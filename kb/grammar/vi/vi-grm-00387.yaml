title: sẽ：将来时副词
structure: S + sẽ + V
structure_pattern: S + sẽ + V
explanation_zh: sẽ 是时体副词（phó từ），表示动作或情况尚未发生但将要发生，相当于汉语「将、会」。片段中反复用于主人公对未发生之事的揣测与放狠话。
examples:
- text: Lúc đó, tôi sẽ cứng họng và đực mặt ra như phỗng.
