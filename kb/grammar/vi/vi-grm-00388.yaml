title: thì：条件复句关联词
structure: （省略 nếu 的）条件句 + thì + 结果句
structure_pattern: A + thì + B
explanation_zh: thì 是关联词（quan hệ từ），连接条件分句与结果分句，相当于汉语「那么、就」。口语中常省略 nếu，只用 thì 标记条件—结果关系。片段此句是典型的口语条件句。
examples:
- text: Hết tiền thì tôi cho mượn.
