title: bị：不如意被动句
structure: S + bị + 施事 + V
structure_pattern: bị + N + V
explanation_zh: bị 构成被动句（câu bị động），引出施事者，表示对主语而言不利或不情愿的动作，与表示获益的 được 相对。「bị tôi
  chê lên chê xuống」即「被我挑三拣四地嫌弃」。
examples:
- text: Nó làm quân sư cho tôi, bị tôi chê lên chê xuống
