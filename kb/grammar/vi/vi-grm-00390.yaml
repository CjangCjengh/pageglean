title: càng...càng：递进结构
structure: càng + V/Adj, càng + V/Adj
structure_pattern: càng + V + càng + V
explanation_zh: càng…càng… 是递进关联结构，表示两种情况按比例同步发展，相当于汉语「越……越……」。「Càng nghĩ càng lo」是叙事中常用的高频固定说法。
examples:
