title: đừng ... nữa：否定祈使
structure: 主语 + 情态副词 đừng + 动词（câu cầu khiến 否定式）+ 语气词 nữa
structure_pattern: S + đừng + VP (+ nữa)
explanation_zh: 副词 đừng 置于动词前，构成否定祈使句，表示“别、不要”。句末加 nữa（再、还）呼应中文“别再……了”，强调要求对方停止正在持续的状态。
examples:
- text: Ngày mai anh đừng giở bộ mặt đưa đám ra nữa!
