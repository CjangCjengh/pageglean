title: cứ ... hoài：动作的反复与持续
structure: 副词 cứ + 动词 + 句末 hoài（表示重复、持续的体貌）
structure_pattern: S + cứ + VP + hoài
explanation_zh: 副词 cứ 表示动作、状态不断重复或持续不变，句末再加 hoài 强调“没完没了”，常带无奈、嗔怪的语气。整体相当于中文“老是……个不停”。
examples:
- text: 'Thấy tôi cứ "tôi, tôi" hoài, Việt An nhắc giùm:'
