title: chứ gì：揣测性确认问句
structure: 陈述小句 + 句末语气词 chứ gì（câu nghi vấn，表有把握的猜测）
structure_pattern: S + VP + chứ gì
explanation_zh: 句末语气词 chứ gì 构成疑问句，表示说话人已有所猜测、只待对方确认，相当于中文“……是吧/是想说……吧”。常用于替对方道破心思的场合。
examples:
- text: Anh định nói chuyện lá thư chứ gì?
