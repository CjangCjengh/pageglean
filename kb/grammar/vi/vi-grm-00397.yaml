title: Adj + hơn：比较句
structure: 形容词 + 比较连接词 hơn + 比较对象（可带数量差补语）
structure_pattern: S + Adj + hơn + NP (+ 数量补语)
explanation_zh: 越南语比较句的基本结构是“形容词 + hơn + 比较对象”，hơn 相当于“比……更”。差距可用数量短语直接补出，如 lớn hơn
  tôi vài ba tuổi（比我大两三岁），无需介词。
examples:
