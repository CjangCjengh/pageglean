title: không thể nào ... được：不可能
structure: không thể nào + 动词 + 结果/可能补语 được（câu phủ định 表无法实现）
structure_pattern: S + không thể nào + V + được
explanation_zh: “không thể nào + V + được”表示“怎么也……不了、根本无法”，其中 được 作补语表示动作能够实现或达成。同类结构还有
  V + nổi（做得了、受得住），如片段中的 không làm quen nổi。
examples:
- text: Tôi không thể nào hình dung được tôi sống mà không có nó
