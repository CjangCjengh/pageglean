title: 「rồi」：完成与事态变化
structure: 动词/形容词 + rồi
structure_pattern: V + rồi (phó từ hoàn thành)
explanation_zh: 越南语学校语法将 rồi 归为表示完成的副词（phó từ），用在动词后表示动作已完成，或置于句末表示情况已发生变化，相当于中文“了”。与
  đã 不同，rồi 侧重“已然如此”的现状，可单独使用而不与 đã 同现。片段中“đi rồi”“bán mất rồi”“xin rồi”反复出现，是口语中最高频的完成表达。
