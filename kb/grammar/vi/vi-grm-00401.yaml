title: 「lại」：动作的重复
structure: lại + 动词
structure_pattern: lại (phó từ lặp lại) + V
explanation_zh: lại 是学校语法中的重复副词（phó từ chỉ sự lặp lại），置于动词前表示动作再次发生或反复出现，相当于中文“又/再”。片段中“lại
  đi rồi”“lại cười”均表示动作的重复。注意 lại 另有“相反/却”的语气用法，此处为重复义。
examples:
- text: Mẹ em lại đi rồi.
  reading: ''
  annot: Mẹ em lại đi rồi.
  translation_zh: 我妈妈又走了。
