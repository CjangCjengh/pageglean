title: 「vừa…vừa…」：两个动作同时进行
structure: vừa + V1 + vừa + V2
structure_pattern: vừa + V + vừa + V (quan hệ từ đồng thời)
explanation_zh: vừa…vừa… 是学校语法中表示并列同时性的关联结构（quan hệ từ），连接两个同时进行的动作或状态，相当于中文“一边…一边…”。片段中“vừa
  đáp vừa cười”意为“边回答边笑”。两个动词短语共享同一主语，描述并行动作。
examples:
