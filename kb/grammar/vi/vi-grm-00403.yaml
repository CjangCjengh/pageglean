title: 「mất」：表示失去的结果补语
structure: 动词 + mất (+ rồi)
structure_pattern: V + mất (bổ ngữ kết quả)
explanation_zh: mất 作结果补语（bổ ngữ kết quả）置于动词后，表示动作导致事物消失、不再拥有，带有“失去”的语义，相当于中文“…掉了/…没了”。片段中“bán
  mất rồi”指房子被卖掉、不复拥有。与表积极结果的 được 相对，mất 含消极/失去意味。
examples:
- text: Nhà mày bán mất rồi, mày về đây mày ở đâu?
  reading: ''
  annot: Nhà mày bán mất rồi, mày về đây mày ở đâu?
