title: 「hơn」：比较结构
structure: 形容词 + hơn (+ 比较对象)
structure_pattern: Tính từ + hơn (câu so sánh hơn)
explanation_zh: 越南语比较级（cấu trúc so sánh hơn）由形容词加后置的 hơn 构成，比较对象可省略或用 hơn + 名词引出，相当于中文“比…更…”。片段中“dài
  hơn hôm trước”即“比之前更长”。越南语无形态变化，比较意义全靠虚词 hơn 表达。
examples:
