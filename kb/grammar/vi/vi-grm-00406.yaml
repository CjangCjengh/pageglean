id: vi-grm-00406
language: vi
type: grammar
level: L3
level_rank: 3
title: 「chưa…được」：尚未能实现
structure: chưa + 动词 + được
structure_pattern: chưa + V + được (bổ ngữ khả năng)
explanation_zh: chưa 是表示“尚未”的否定副词（phó từ），được 作可能补语（bổ ngữ khả năng）表示动作能够实现，两者配合表示某事目前还没有能力或条件做到。片段中“chưa
  che được vết sẹo”即“还遮不住伤疤”。chưa 暗示将来可能实现，与单纯否定的 không 不同。
examples:
- text: Dài hơn, nhưng chưa che được vết sẹo.
