title: 「hoài」：持续不停（南方口语）
structure: 动词 + hoài
structure_pattern: V + hoài (phó từ kéo dài)
explanation_zh: hoài 是南方口语中的持续副词（phó từ），置于动词后表示动作长时间持续或反复不停，常暗含“徒劳”的意味，相当于中文“一直…/老是…”。片段中“sờ
  hoài chả thấy”即“摸了半天也没找到”。该词具南方方言色彩，与 mãi 意义相近。
examples:
