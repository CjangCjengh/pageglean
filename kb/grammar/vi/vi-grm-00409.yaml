id: vi-grm-00409
language: vi
type: grammar
level: L3
level_rank: 3
title: thế nào…cũng…：总会／肯定会……
structure: thế nào + (主语) + cũng + V
structure_pattern: thế nào + cũng + V
explanation_zh: 固定格式 thế nào…cũng… 表示「不管怎样总会……、肯定会……」，用于有把握的推断或预测。thế nào 在此是疑问代词的任指用法（无论如何），副词
  cũng 表示无条件一致。口语中十分常用。
examples:
- text: Bây giờ đến hè, thế nào tóc mày cũng dài ra.
