title: đang：进行体标记「正在」
structure: đang + 动词
structure_pattern: đang + V（体副词 phó từ chỉ thể tiếp diễn）
explanation_zh: đang 置于动词前，表示动作正在进行，相当于汉语的「正在」。它是越南语表进行体的虚词（体副词）。本段两处用它描写梦初醒时的身体状态。
