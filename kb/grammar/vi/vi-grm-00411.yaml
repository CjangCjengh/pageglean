title: đã…rồi：完成体「已经…了」
structure: đã + 动词 + rồi
structure_pattern: đã + V + rồi（体副词 phó từ chỉ thể hoàn thành）
explanation_zh: đã 置于动词前表示动作已经发生（完成体），句末常加 rồi 加强「已经/了」的语气，二者呼应。相当于汉语的「已经…了」。句尾的 rồi
  可省略，但带上更自然完整。
examples:
- text: Trước khi quen tôi, anh đã quen mấy người rồi?
