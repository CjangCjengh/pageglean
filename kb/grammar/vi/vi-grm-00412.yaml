title: chẳng thèm + V：不屑于做某事
structure: chẳng thèm + 动词
structure_pattern: chẳng thèm + V（否定副词 + 动词）
explanation_zh: chẳng 是书面语/北方色彩的否定词（相当于 không），thèm 本义为「嘴馋、渴望」。二者合用表示「不屑、懒得去做」，带赌气或委屈的情绪。本段连用五句，极力渲染小丽的「狠心」。
examples:
