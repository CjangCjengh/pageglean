title: N + nào + cũng：任何…都…
structure: 名词 + nào + cũng + 动词/形容词
structure_pattern: N + nào + cũng + V/Adj（任指结构）
explanation_zh: nào 用在名词后表任指（「任何一个」），与副词 cũng 呼应，构成「任何…都…」的周遍句，表示无一例外。相当于汉语的「每个/凡是…都」。
