title: được：被动/受益标记
structure: được + 动词
structure_pattern: được + V（被动句 câu bị động）
explanation_zh: được 作虚词置于动词前，可表被动（多指称心、中性或受益），相当于汉语的「被/得以」。它与表不如意被动的 bị 相对。「được
  đúc ra từ một khuôn」即「从同一个模子里被铸出来」。
examples:
- text: hình như đều được đúc ra từ một khuôn
