title: nhất：最高级；mà：关系从句标记
structure: 形容词 + nhất + mà + 从句
structure_pattern: Adj + nhất + mà + clause（最高级 + 关系从句标记）
explanation_zh: nhất 置于形容词后表最高级（「最…」）。mà 是引导关系从句的虚词，连接被修饰名词与从句，相当于汉语的「…的」。本句把「最悲伤的事实」与「我所知道的」衔接起来。
examples:
