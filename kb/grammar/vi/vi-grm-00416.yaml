title: nếu…：假设条件句「如果」
structure: nếu + 从句，（thì）+ 主句
structure_pattern: nếu + clause, (thì) + clause（条件复句）
explanation_zh: nếu 引导假设从句，表「如果」，主句的关联词 thì 可省略。此处用假设语气表达男孩的幻想：若小丽回来，绝不会让他受欺负。常与 không
  bao giờ（从不）等搭配。
examples:
- text: nếu Tiểu Li về thật, không bao giờ nó để cho Lợi sứt "làm chả" tôi
  reading: ''
  annot: nếu Tiểu Li về thật, không bao giờ nó để cho Lợi sứt "làm chả" tôi
  translation_zh: 如果小丽真的回来，她绝不会让阿缺把我“做成肉饼”（欺负我）
