title: mới：才（条件达成后才发生）
structure: 条件/时间 + mới + 动词
structure_pattern: … + mới + V（副词，表“才”）
explanation_zh: mới 作副词表「才」，强调某事在某条件满足或经过一段时间后才终于发生。常与「Phải…」（必须/得…）呼应。本句即「过了好一会儿我才意识到」。
examples:
- text: Phải mất một lúc lâu tôi mới nhận ra mình đang nằm trên giường
