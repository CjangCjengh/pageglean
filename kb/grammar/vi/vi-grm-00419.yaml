id: vi-grm-00419
language: vi
type: grammar
level: L3
level_rank: 3
title: thôi + 动词：动作中止
structure: thôi + 动词（不再……）
structure_pattern: thôi + V
explanation_zh: thôi 置于动词前表示停止、不再进行某一正在进行的动作，带有动作中止的意味。文中连用三个 thôi（thôi nhảy múa /
  thôi đuổi bắt nhau / thôi bốc cháy）构成排比，渲染万物骤然静止、时间凝固的氛围。
examples:
- text: những tia nắng thôi nhảy múa, những làn gió thôi đuổi bắt nhau trên những
    tàng cây
  reading: ''
  annot: những tia nắng thôi nhảy múa, những làn gió thôi đuổi bắt nhau trên những
