title: những + 名词：复数标记
structure: những + 名词（那些/一些……）
structure_pattern: những + N
explanation_zh: những 是表示复数的限定词（từ chỉ số nhiều），置于名词或数量短语前，相当于汉语的"那些、一些"。文中反复出现，如
  những tia nắng（一缕缕阳光）、những làn gió（阵阵微风）。
