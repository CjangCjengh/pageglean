title: chẳng… gì hết：强烈否定
structure: chẳng + 动词 + gì hết（一点也/什么都不……）
structure_pattern: chẳng + V + gì hết
explanation_zh: 这是加强否定结构：chẳng 是否定词，gì hết 置于动词后加强语气，意为"一点也（不）……、什么都不……"。文中 chẳng
  nhớ gì hết 表达"什么都不记得"的强烈语气，比单纯用 không 更具感情色彩。
examples:
