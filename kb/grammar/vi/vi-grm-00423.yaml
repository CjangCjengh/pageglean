title: càng…càng…：越……越……
structure: càng + A/V，càng + A/V（成对关联结构 quan hệ từ sóng đôi，表递进比较）
structure_pattern: càng + X, càng + X
explanation_zh: 「càng…càng…」是成对使用的关联结构（quan hệ từ sóng đôi），表示“越……越……”，前后两个分句平行递进。形容词、动词都可进入此格式。本段用它构成“女孩越大越聪明，男孩越大越笨”的俏皮对照。
examples:
- text: Phải chăng con gái càng lớn càng khôn, còn con trai càng lớn càng ngu?
  reading: ''
