title: phải chăng：莫非、难道（揣测疑问）
structure: phải chăng + câu（疑问语气结构 tình thái từ nghi vấn，表揣测）
structure_pattern: phải chăng + S + V ?
explanation_zh: 「phải chăng」是表揣测的疑问语气结构（tình thái từ nghi vấn），相当于“莫非/难道”，提出说话人有所猜测但不敢肯定的问题，语体偏书面。本段在人物内心独白中两次使用，营造将信将疑的心理。
