title: như／hệt như：比喻结构「像……」
structure: A + (hệt / y / giống) như + B
structure_pattern: X + như + Y
explanation_zh: 关系词 như 相当于汉语「像、如同」，连接本体与喻体。加强形式 hệt như、y như、giống như 强调「一模一样、宛如」。描写与叙述中均可使用。
