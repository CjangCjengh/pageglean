title: không… mà…：不是……而是……
structure: không + V1 + mà + V2
structure_pattern: không + V1 + mà + V2
explanation_zh: 先否定前一分句，再用连接词 mà 引出相反或替代的事实，相当于汉语「不是……而是……」。mà 在此标记转折与对照，是越南语最常用的转折连接手段之一。
examples:
- text: tôi không bay lượn chung quanh Việt An mà lặng lẽ và hồi hộp đi vòng tới trước
    mặt nó
  reading: ''
  annot: tôi không bay lượn chung quanh Việt An mà lặng lẽ và hồi hộp đi vòng tới
