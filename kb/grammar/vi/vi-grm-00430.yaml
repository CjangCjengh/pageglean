title: càng… càng…：越……越……
structure: càng + V/Adj，càng + V/Adj
structure_pattern: càng + X + càng + Y
explanation_zh: 程度副词 càng 前后呼应，构成「越……越……」的递进结构，表示两种性质随条件同步增减。第二个 càng 有时可省略。口语和俗语中都很常用，如「càng
  lớn càng khôn（越大越懂事）」。
examples:
- text: đúng là càng lớn nó càng khôn!
