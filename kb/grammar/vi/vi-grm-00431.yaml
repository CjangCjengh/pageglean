title: đến nỗi：程度之深引出结果
structure: V/Adj + đến nỗi + 结果分句
structure_pattern: X + đến nỗi + clause
explanation_zh: đến nỗi 引出由程度之深导致的结果，相当于汉语「……到……地步／以至于……」；近义形式有 đến mức。本段「quen thuộc
  đến nỗi…（熟悉到……）」强调对疤痕印象之深。
