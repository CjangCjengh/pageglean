title: càng... càng...：越…越…
structure: càng + 形/动, càng + 形/动
structure_pattern: càng + A/V , càng + A/V
explanation_zh: 表示两个程度同步变化，相当于中文「越…越…」。前后两个 càng 呼应，前项为伴随变化，后项为结果。可用于同一或不同主语。
examples:
