title: 形容词 + nhất：最高级「最…」
structure: 形 + nhất (+ 范围)
structure_pattern: Adj + nhất (+ N/phạm vi)
explanation_zh: nhất 置于形容词之后表示最高级「最…」，后可接比较范围（如 lớp tôi）。越南语最高级为后置，不需前置标记。
