id: vi-grm-00435
language: vi
type: grammar
level: L3
level_rank: 3
title: mỗi lần... đều...：每当…总是…
structure: mỗi lần + 情境, (主语) + đều + 动
structure_pattern: Mỗi lần + mệnh đề, S + đều + V
explanation_zh: mỗi lần 引出反复出现的情境「每当…」，后句用 đều（都）呼应，表示每次结果都一致「总是…」。用于描述习惯性、规律性的行为。
examples:
- text: Mỗi lần tụi con trai tìm cách bắt chuyện với nó, nó đều trả lời đàng hoàng.
  reading: ''
