title: không... một... nào：一点也不…/没有任何…
structure: không + 动 + một + (量) + 名 + nào
structure_pattern: không + V + một + N + nào
explanation_zh: 强调彻底否定，相当于「一点…也不/没有任何…」。không 否定动词，句末加 nào 呼应构成完全否定。类似结构还有 không...
  gì（…也不）。
