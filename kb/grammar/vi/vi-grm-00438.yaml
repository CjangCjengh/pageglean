title: tụi/bọn 群体复数与 đứa/con 量词
structure: tụi/bọn + 名（指人群）；đứa/con + 名（指人）
structure_pattern: tụi/bọn + N ; đứa/con + N
explanation_zh: tụi、bọn 置于名词或代词前表示「这群/这伙」，构成群体复数（tụi con gái=女孩们）。đứa、con 是用于人的量词，常指小孩或带随意、亲昵乃至轻蔑色彩（một
  đứa con gái、con nhỏ Việt An）。
examples:
