id: vi-grm-00439
language: vi
type: grammar
level: L2
level_rank: 2
title: mày/tao/nó：非正式人称代词
structure: mày（你）/ tao（我）/ nó（他、她、它）
structure_pattern: mày/tao/nó (ngôi 2/1/3, thân mật)
explanation_zh: 越南语人称代词分正式与非正式。mày/tao/nó 是极随意的第二/第一/第三人称，用于亲密朋友、长辈对晚辈或带轻视的场合。叙述中
  dùng tôi（我）较中性，对话里用 mày/tao 显示关系亲密或居高临下。
