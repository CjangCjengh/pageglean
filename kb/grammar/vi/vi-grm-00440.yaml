title: 「đi」：祈使与催促语气
structure: V + đi!（句末）
structure_pattern: V + đi (tình thái từ cầu khiến, cuối câu)
explanation_zh: 「đi」是句末语气词（tình thái từ cầu khiến），放在动词后表示催促、鼓励或请求对方做某事，语气亲切自然。相当于中文祈使句尾的「吧／啊」，「Ăn
  đi!」即「吃吧！」。
