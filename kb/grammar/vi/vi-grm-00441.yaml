title: 「rồi」：句末的完成与已然
structure: S + V + rồi（句末）
structure_pattern: V + rồi (phó từ chỉ thể hoàn thành, cuối câu)
explanation_zh: 「rồi」作句末语气副词（phó từ chỉ thể），表示动作已经完成或情况已经变化，相当于中文句末的「了」。与动词前的「đã」不同，句末「rồi」侧重「已经如此」的既成事实。
examples:
- text: Tôi quên chuyện đó rồi!
