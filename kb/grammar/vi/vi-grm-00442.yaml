title: 「lại」：重复与出乎意料
structure: S + lại + V
structure_pattern: lại (phó từ) + V
explanation_zh: 「lại」是多义副词（phó từ）：一是表示动作重复或接续，「nó lại lấy cho tôi một cây kẹo khác」（她又拿了一颗糖给我）；二是表示与预期相反，「tôi
  lại nói tránh đi」（我反而避开了没照实说）。在反问句中还能加强不以为然的语气，如「Đói ai lại ăn kẹo!」（饿了谁还吃糖！）。
examples:
- text: Nói xong, nó lại lấy cho tôi một cây kẹo khác
