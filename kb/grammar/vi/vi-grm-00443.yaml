title: 「chứ」：强调与反问语气
structure: …chứ! / …chứ đâu! / …chứ ai!
structure_pattern: chứ (tình thái từ khẳng định, cuối câu)
explanation_zh: 句末语气词（tình thái từ），强调事情显而易见、理所当然，常与疑问代词连用构成反问。「Mua chứ đâu!」（当然是买的，还能哪儿来的）、「Anh
  chứ ai!」（是你，还能是谁）。中文没有对应虚词，需按语境译为「还能……／当然是……」。
