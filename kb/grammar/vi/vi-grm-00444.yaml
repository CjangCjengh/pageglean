title: 「V + xong」：完成后的接续
structure: V + xong, + 后续分句
structure_pattern: V + xong (thành tố phụ chỉ kết quả hoàn tất) + mệnh đề tiếp nối
explanation_zh: 「xong」作补语（thành tố phụ）跟在动词后表示动作完成，相当于「……完／……之后」。「Nói xong」即「说完之后」，后续句描述紧接着的动作，是越南语叙述中衔接先后事件的常用手段。
examples:
