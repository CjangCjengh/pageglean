title: 「vừa…(lại) vừa…」：两种状态并存
structure: vừa + Adj/V + (lại) vừa + Adj/V
structure_pattern: vừa…(lại) vừa… (cặp quan hệ từ song song)
explanation_zh: 「vừa…(lại) vừa…」是并列关联词（cặp quan hệ từ song song），连接两个同时存在的状态或动作，相当于中文「又……又……／既……又……」。中间可加「lại」以加强语气。
examples:
- text: Tôi thở phào, vừa nhẹ nhõm lại vừa thất vọng.
