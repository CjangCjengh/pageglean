title: 「đừng…nữa」：不要再……
structure: đừng + V + nữa
structure_pattern: đừng (phó từ phủ định cầu khiến) + V + nữa (cuối câu)
explanation_zh: 「đừng」是否定副词，用于祈使句（câu cầu khiến）表示劝阻或禁止，相当于「别、不要」。与句末的「nữa」搭配，表示「不要再……了」，要求停止或不再重复某一行为。
examples:
- text: Vậy ngày mai trở đi Việt An đừng mua nữa!
