id: vi-grm-00447
language: vi
type: grammar
level: L3
level_rank: 3
title: 「…nào…cũng」与「cứ」：惯常与无一例外
structure: 时间词 + nào…cũng…；cứ + 时间/条件, S + V
structure_pattern: lúc nào/ngày nào…cũng…; cứ… (phó từ chỉ thói quen)
explanation_zh: 「时间词 + nào…cũng…」表示「每……都……」，强调无一例外，如「lúc nào anh cũng nhớ」（他一直记得）、「ngày
  nào trong túi tôi cũng đầy kẹo」（每天我口袋里都装满糖）。「cứ」为副词，表示每到某一时间或条件就规律性地发生某事，两者常配合叙述习惯性、反复出现的场景。
examples:
- text: Tôi tưởng lúc nào anh cũng nhớ chứ!
  reading: ''
  annot: Tôi tưởng lúc nào anh cũng nhớ chứ!
  translation_zh: 我还以为你一直都记得呢！
  source_book: book-vi-003
  source_chapter: null
  pointer: null
- text: Cứ đến giờ ra chơi hoặc trên đường về, thừa lúc vắng người, tôi vội vã giúi
    vào tay Việt An.
  reading: ''
