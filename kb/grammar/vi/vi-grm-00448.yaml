id: vi-grm-00448
language: vi
type: grammar
level: L2
level_rank: 2
title: 疑问代词 + cũng：无一例外
structure: 疑问代词（ngày nào / thứ gì / ai…）+ cũng + V/A
structure_pattern: Wh-word + cũng + V/Adj
explanation_zh: 疑问代词（ngày nào、thứ gì、ai、gì…）+ cũng 表示「每一……都……」，强调无一例外，相当于中文「天天都……」「什么都……」。cũng
  是副词（phó từ），位于动词或形容词之前。本段反复出现（ngày nào…cũng đầy kẹo、thứ gì cũng phải chia ba / mua
  gấp ba），是高频周遍句式。
examples:
- text: Kể từ hôm đó, ngày nào trong túi tôi cũng đầy kẹo.
