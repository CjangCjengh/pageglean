title: kệ：随它去吧
structure: （疑问代词小句）+ kệ + 人称代词
structure_pattern: Wh-clause + kệ + Pron
explanation_zh: kệ 是动词，意为「任凭、不管」；口语中「疑问代词小句 + kệ + 人称代词」表示「……随它去／不用你管」，语气生硬、带情绪。本段
  kệ mày / kệ tao 出现四次，是青少年斗嘴的高频回应。中文可译「随你」「关你什么事」。
examples:
