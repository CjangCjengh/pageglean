title: 时态助词 đã / đang / sẽ：过去、进行、将来
structure: 时态副词（phó từ chỉ thời gian）：đã / đang / sẽ + 动词
structure_pattern: phó từ (đã / đang / sẽ) + V
explanation_zh: 越南语动词不变形，时态由动词前的虚词表示：đã 表已完成（过去），đang 表进行，sẽ 表将来，大致对应汉语的“了／正在／会”。语境时间明确时这些助词可以省略。
examples:
