title: chưa 与 rồi：“尚未”与“已经”
structure: 体貌副词（phó từ chỉ thể）：chưa + V（还没）；V + rồi（已经）
structure_pattern: chưa + V / V + rồi
explanation_zh: chưa + 动词表示“还没（做）”，强调至今未发生但将来可能发生；动词 + rồi 表示“已经”，强调完成。文中我说“Tôi chưa
  xem phim này”，越安回“Tôi xem phim này rồi!”，构成鲜明对照。注意与 không 的区别：chưa 是“尚未”，không 是一般否定。
