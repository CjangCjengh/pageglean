title: có…không 与 V + không：是非问句
structure: 疑问句（câu nghi vấn）：có + 名/动 + không？ 或 动词短语 + không？
structure_pattern: có + X + không / V + không
explanation_zh: 越南语是非问最典型的格式是在谓语前后嵌有…không，或直接在句末加 không，如“Anh có vé không?”“Việt
  An đi xem phim nữa không?”。肯定回答可用 có（如“Có đây!”），否定用 không。
