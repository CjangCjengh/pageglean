id: vi-grm-00460
language: vi
type: grammar
level: L2
level_rank: 2
title: nếu…thì：条件复句
structure: 成对关联词（cặp quan hệ từ）表条件：nếu + 条件分句，thì + 结果分句
structure_pattern: nếu + Clause, thì + Clause
explanation_zh: nếu 引出条件，thì 引出结果，对应汉语“如果……就……”。文中被拆成三个话轮：“Nếu Việt An không tin thì...”——“Thì
  sao?”——“Thì rồi Việt An sẽ tin.”，thì 可在后续句首单独承接。结果句可加 sẽ 表将来。
examples:
- text: Tôi nói thật đó! Nếu Việt An không tin thì...
  reading: ''
  annot: Tôi nói thật đó! Nếu Việt An không tin thì...
  translation_zh: 我说的是真的！如果越安不相信的话，那……
