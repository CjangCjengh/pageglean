- text: Lời từ chối khéo của Việt An chẳng khác nào quả đấm thôi sơn giáng vào ngực
    tôi.
  reading: ''
  annot: Lời từ chối khéo của Việt An chẳng khác nào quả đấm thôi sơn giáng vào ngực
    tôi.
