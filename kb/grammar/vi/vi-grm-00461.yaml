title: 分类词（量词）：tấm / quả / cái 等
structure: 分类词（loại từ）：数词/指示词 + 分类词 + 名词
structure_pattern: Num/Dem + loại từ + N
explanation_zh: 越南语分类词（量词）丰富，数词或指示词与名词之间通常须加分类词，如“tấm giấy mời”（一张请柬）、“quả đấm”（一拳）。选择依名词的形状或属性而定：tấm
  用于扁平片状物，quả 用于圆形或瓜果类事物，cái 最通用。
examples:
