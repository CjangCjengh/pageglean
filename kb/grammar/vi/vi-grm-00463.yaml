id: vi-grm-00463
language: vi
type: grammar
level: L3
level_rank: 3
title: Nào là…：又是……又是……（列举）
structure: Nào là + 事项一，nào là + 事项二，……
structure_pattern: Nào là + NP/VP [, nào là + NP/VP …]
explanation_zh: 用于展开一连串列举，相当于汉语「又是……」「什么……啦」，常带夸张、抱怨或戏谑色彩。可连续使用“nào là A，nào là B”逐项罗列。本段用它铺陈“军师”列出的长长计划，很有代表性。
examples:
- text: Nào là những lúc tôi lên bảng trả bài, nó sẽ quan sát ánh mắt của Việt An
