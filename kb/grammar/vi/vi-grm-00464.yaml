title: sẽ：将来时助词「会、将」
structure: 主语 + sẽ + 动词／形容词
structure_pattern: S + sẽ + V/Adj
explanation_zh: sẽ 是表示将来的时态虚词，置于动词、形容词之前，相当于汉语“会、将要”。与 đã（已经）、đang（正在）等同属越南语核心时态虚词体系。本段人物畅想行动计划时反复出现。
examples:
- text: nó sẽ phân tích và rút ra những kết luận có giá trị để vạch đường đi nước
    bước cho tôi.
