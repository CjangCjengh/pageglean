title: Có…không：是非问「……吗」
structure: 主语 + có + 动词（+ 宾语）+ không?
structure_pattern: S + có + V + (O) + không
explanation_zh: có + 动词 + không 构成是非问句，相当于汉语“……吗／是否……”。có 紧贴谓语之前，không 置于句末。该结构也可嵌入主句作间接疑问，如
  coi thử… có… không（看看是否……）。
examples:
- text: nó sẽ rình coi Việt An có cười với tôi không
