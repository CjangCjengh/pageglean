title: mấy：不定数量与疑问「几」
structure: mấy + 量词／名词（mấy lần, mấy cái, mấy kiểu…）
structure_pattern: mấy + (clf/N)
explanation_zh: mấy 表示不定的小数量或疑问“几”，置于量词、名词之前，如 mấy lần（几次）、mấy cái（几下）、mấy kiểu（几种）。疑问用法与不定用法同形，靠语境区分。与汉语“几”语序相似，但须注意其与量词的搭配。
