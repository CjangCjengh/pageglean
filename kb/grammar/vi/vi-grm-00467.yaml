title: chẳng…đâu：强调否定「根本不……」
structure: chẳng + 动词（+ 宾语）+ đâu
structure_pattern: chẳng + V + (O) + đâu
explanation_zh: chẳng… đâu 构成加强否定，表示“根本不……／哪儿也不……”。chẳng 是否定副词，语气比 không 更重；句末的 đâu
  进一步强化语气。如 chẳng thấy Việt An đâu 即“完全不见越安的踪影”。
examples:
- text: hôm sau đến lớp, chẳng thấy Việt An đâu.
