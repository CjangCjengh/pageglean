title: 句末语气词 đi：催促与祈使「……吧」
structure: （主语）+ 动词 +（宾语）+ đi!
structure_pattern: (S) + V + (O) + đi
explanation_zh: 句末的 đi 是语气助词，表示催促、建议或祈使，相当于汉语“吧”。注意与动词 đi（去）区分：如 ông đi thăm nó đi
  中，前一个 đi 是动词，句末的 đi 是助词。动词 + không? 还可构成简短选择问句，如 Đi không?（去不去？）。
