id: vi-grm-00469
language: vi
type: grammar
level: L1
level_rank: 1
title: 分类词（danh từ chỉ đơn vị）
structure: 数词 + 分类词 + 名词（如 viên 小而圆物 / bông 花 / cái 一般物品）
structure_pattern: số từ + danh từ chỉ đơn vị + danh từ
explanation_zh: 越南语计数时须在名词前加分类词（danh từ chỉ đơn vị / loại từ），语序为“数词＋分类词＋名词”。不同名词搭配不同分类词：viên
  用于小而圆的物体，bông 用于花，cái 用于一般物品。这是中文母语者需重点掌握的部分。
