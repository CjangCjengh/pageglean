title: 「hơn」：比较结构
structure: 形容词 + hơn +（比较对象）+（nhiều 表程度）（so sánh hơn）
structure_pattern: Adj + hơn + NP
explanation_zh: 「hơn」用于比较，结构为“形容词 + hơn +（比较对象）”，表示“比……更”，相当于比较级。词形不变，句末可加 nhiều（得多）加强程度。此处说弹珠“威风”得多，带调侃意味。
examples:
- text: nom "oai phong lẫm liệt" hơn hai viên bi của Tiểu Li nhiều.
