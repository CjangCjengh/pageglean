title: 是非问句：句末加「không」
structure: 陈述语序 + không?（câu nghi vấn）
structure_pattern: '... + không?'
explanation_zh: 越南语是非问句常在句末直接加「không」，结构为“陈述语序 + không?”，相当于中文的“……吗？”。无需倒装或添加助动词，是最基本、最常用的疑问句式。
