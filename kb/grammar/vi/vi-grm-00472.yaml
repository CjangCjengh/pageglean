id: vi-grm-00472
language: vi
type: grammar
level: L1
level_rank: 1
title: 分类词（量词）：cái / viên / thằng
structure: 数词或指代词 + 分类词 + 名词（如 hai người, mấy viên bi, cái ly）；thằng + 人名
structure_pattern: Num/Dem + danh từ chỉ đơn vị (loại từ) + N; thằng + tên riêng
explanation_zh: 越南语名词受数词或指代词修饰时通常必须加分类词（danh từ chỉ đơn vị/loại từ）：cái 用于一般无生命事物，viên
  用于小而圆的物体，người 用于人。提及熟悉的男性晚辈或同辈时常用 thằng + 名字，如 Thằng Hải，口语化且带亲昵色彩。汉语虽也有量词，但越南语分类词搭配更强制、更固定，需逐一积累。
