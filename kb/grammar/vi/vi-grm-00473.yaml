title: 时态副词 đã / đang / sẽ：过去、进行、将来
structure: đã / đang / sẽ + 动词/形容词（置于谓词之前）
structure_pattern: S + đã | đang | sẽ + V/Adj
explanation_zh: 越南语动词不变形，时体意义靠谓词前的时体副词（phó từ chỉ thời–thể）表达：đã 表过去/完成，đang 表进行，sẽ
  表将来。这些副词可以叠用，如片段中 đã thấy … đang đứng đợi（已经看见……正站着等）。它们与汉语的“了/着/将”并非一一对应，需按语境体会。
examples:
- text: Khi tôi lững thững dắt xe ra đã thấy Việt An, Hồng Hoa và Chiêu Minh đang
    đứng đợi.
