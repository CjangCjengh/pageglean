title: 句末助词 rồi：完成与已然
structure: 动词/形容词短语 + rồi（句末）
structure_pattern: VP/AP + rồi
explanation_zh: 句末的 rồi 是情态助词（trợ từ tình thái），表示动作已经完成或情况已经变化，相当于汉语句末的“了”。它与谓语前的
  đã 分工不同：đã 侧重动作完成，句末 rồi 侧重状态变化，两者可分可合。片段中 về rồi、chơi thua hết rồi 都是典型的已然用法。
examples:
- text: Thằng Hải tới tìm con, đợi lâu quá không được nó về rồi.
  reading: ''
