title: 确认疑问句：phải không 与 hả
structure: 陈述句 + phải không?／句子 + hả?
structure_pattern: clause + phải không? / clause + hả?
explanation_zh: 陈述句后加 phải không 构成附加疑问句，请求对方确认，相当于汉语“是不是/对吗”。hả 是口语化的句末疑问助词，带有一点惊讶或求证的语气，相当于“吗”。越南语是非问句靠句末助词构成，动词本身不发生任何变化。
