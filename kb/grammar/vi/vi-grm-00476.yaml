title: 疑问代词 gì / nào / đâu / sao（原位使用）
structure: gì（什么）/ nào（哪）/ đâu（哪里）/ sao（怎么）置于句中原位
structure_pattern: … + gì | nào | đâu | sao + …（疑问代词不前置）
explanation_zh: 越南语疑问代词与汉语一样原位使用，不前移：gì 问事物，nào 问选择（常置于数词或名词之后，如 hai người nào），đâu
  问地点，sao 问原因或方式。含疑问代词的句子不需要再加其他疑问词。片段中 Sao kỳ vậy? 即“怎么这么奇怪？”。
