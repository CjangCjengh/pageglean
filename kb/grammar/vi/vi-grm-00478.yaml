id: vi-grm-00478
language: vi
type: grammar
level: L3
level_rank: 3
title: 比喻结构 như / hệt như：像、简直像
structure: A + (hệt) như + B（比喻或类比，B 可为名词、动词短语或小句）
structure_pattern: A + như | hệt như + B
explanation_zh: như 是比较/比喻连词，相当于汉语“像”；hệt như 语气更强，意为“简直像、活像”。其后可接名词、动词短语乃至完整小句，构成比喻或类比。片段用拳击比赛的典故作比，并以
  như đi trong một màn sương 写恍惚之感，是文学语体中常见的修辞句法。
examples:
- text: Việt An đã cho tôi đo ván thảm hại, hệt như Myke Tyson đã kết liễu Micheal
    Spinks
