title: đã…rồi：已然与完成
structure: đã + 动词/形容词（+ 句末助词 rồi）
structure_pattern: đã + V/Adj (+ rồi)
explanation_zh: đã 是越南语学校语法中的时间—体貌副词（phó từ），置于动词、形容词前，表示动作已经发生或完成，相当于汉语的「已经……了」。句末可再加语气词
  rồi 强化「已然」语气，构成 đã…rồi 框架。
