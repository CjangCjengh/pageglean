id: vi-grm-00480
language: vi
type: grammar
level: L3
level_rank: 3
title: vừa…đã…／chưa kịp…đã…：刚……就……
structure: vừa + V1，đã + V2；chưa kịp + V1，đã + V2
structure_pattern: vừa + V1 … đã + V2 / chưa kịp + V1 … đã + V2
explanation_zh: vừa…đã… 表示前一动作刚发生、后一动作随即出现，即「刚……就……」；chưa kịp…đã… 表示「还没来得及做 V1，V2
  就已发生」。两者均由体貌副词（phó từ）构成框架，强调两个事件相隔极短或出乎意料。
