id: vi-grm-00481
language: vi
type: grammar
level: L3
level_rank: 3
title: suýt (một chút nữa) là：险些……
structure: suýt +（một chút nữa）+ là + VP
structure_pattern: suýt + một chút nữa + là + VP
explanation_zh: suýt 是语气副词，表示「差点儿」，指某种（多为不如意的）情况几乎发生但最终没有发生。加上 một chút nữa là 强调「只差一点点就……」，与汉语「差点儿没／险些」对应。
examples:
- text: Suýt một chút nữa là tôi buột miệng khai huỵch toẹt cái "chiến dịch băng giá"
    của quân sư Hải gầy
  reading: ''
