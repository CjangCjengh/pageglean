id: vi-grm-00483
language: vi
type: grammar
level: L3
level_rank: 3
title: 成对关联词：mặc dù…nhưng… 与 sở dĩ…bởi vì…
structure: mặc dù + A，nhưng + B；sở dĩ + 结果，bởi vì + 原因
structure_pattern: mặc dù + A, nhưng + B / sở dĩ + clause1, bởi vì + clause2
explanation_zh: 越南语学校语法称这类搭配为「成对关联词」（cặp quan hệ từ）。mặc dù…nhưng… 表让步转折，相当于「虽然……但是……」，与汉语不同，nhưng
  通常保留、不与 mặc dù 互斥；sở dĩ…bởi vì… 表因果，先果后因，即「之所以……是因为……」，语体较正式。
examples:
- text: Mặc dù nổi nóng nhưng thấy Tiểu Li bênh tôi, Lợi sứt cũng chịu "xuống nước".
  reading: ''
  annot: Mặc dù nổi nóng nhưng thấy Tiểu Li bênh tôi, Lợi sứt cũng chịu "xuống nước".
  translation_zh: 虽然很恼火，但见 Tiểu Li 护着我，Lợi sứt 也肯"服软"了。
