id: vi-grm-00484
language: vi
type: grammar
level: L2
level_rank: 2
title: …mà cũng…：竟然连……也……（责备语气）
structure: A + mà cũng + B
structure_pattern: A + mà cũng + B
explanation_zh: mà 在此为表转折、对立的关联词（quan hệ từ），带出乎意料或责备语气；cũng 加强「连……也」的意味。「A mà cũng
  B」常用于嘲讽或不满，意为「连 A 竟然也 B／A 居然也值得 B」。
examples:
