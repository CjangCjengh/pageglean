title: 疑问结构：…chưa？／…chi vậy？／…là sao？
structure: 陈述语序 + 疑问虚词（chưa / chi / sao）
structure_pattern: clause + chưa? / chi + vậy? / là + sao?
explanation_zh: 越南语疑问句不改变语序，靠疑问虚词标记：句末 chưa 询问「……了没有」；chi 是方言中的 gì（什么／为什么），加 vậy 构成询问原因或目的的「chi
  vậy？」；「là sao？」直问「是什么意思／怎么回事」。
