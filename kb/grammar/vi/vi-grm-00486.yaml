title: 分类词（loại từ）：viên／đàn／kẻ
structure: 数词 + 分类词 + 名词
structure_pattern: Num + loại từ + N
explanation_zh: 越南语学校语法把分类词归为「单位名词」（danh từ chỉ đơn vị / loại từ），计数或指称时必须选用与之搭配的分类词。viên
  用于小而成块、成粒之物（viên mực＝墨块）；đàn 用于成群的禽畜（đàn cừu＝羊群）；kẻ 指人，常含贬义（kẻ đối diện＝对面的人）。
