title: Vừa…vừa…：一边…一边…
structure: vừa + V1 … vừa + V2
structure_pattern: vừa + V … vừa + V
explanation_zh: 表示两个动作同时进行，相当于汉语「一边……一边……」。两个 vừa 分别置于两个动词短语之前，常用于叙述紧凑的连贯动作。
examples:
- text: Vừa nói, tôi vừa ném cặp xách lên bàn và xắn tay áo lên.
