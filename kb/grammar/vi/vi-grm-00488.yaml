title: 是非问句：có…không 与 phải không
structure: có + V + không？ / S + V + phải không？
structure_pattern: có + V + không | V + phải không
explanation_zh: 越南语是非问句最典型的框架是 có…không，có 放在动词前发问，không 置于句末。phải không 附在陈述句后构成附加问，相当于「……对吧／是不是」。口语中还可用语气词
  hả 表示惊讶、质疑式的简短追问（如「muốn chơi nhau hả?」）。
examples:
