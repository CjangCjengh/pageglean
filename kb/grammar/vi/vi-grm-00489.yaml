title: 让步连词：mặc dù…nhưng 与 mặc cho
structure: Mặc dù + 分句，(nhưng) + 分句；Mặc cho + 分句，主句
structure_pattern: mặc dù … nhưng … | mặc cho + clause
explanation_zh: mặc dù…nhưng 表示「虽然……但是……」，nhưng 有时可省。mặc cho 表示「任凭、不管」，后接分句，主句表示不受其影响的行为。两者在书面语与口语中都常用。
examples:
- text: Mặc dù nổi nóng nhưng thấy Tiểu Li bênh tôi, Lợi sứt cũng chịu "xuống nước".
