id: vi-grm-00493
language: vi
type: grammar
level: L3
level_rank: 3
title: 强调否定：…gì hết 与 có…đâu
structure: không/chẳng + V + gì hết；có + V + đâu
structure_pattern: không/chẳng … gì hết | có + V + đâu
explanation_zh: 越南语常用后置成分加强否定：gì hết 表示「什么都（不）……」，与 không / chẳng 呼应构成全盘否定。có + V
  + đâu（可加 hồi nào）用于强烈否认做过某事，相当于「哪里……过、根本没」。两者都带有强烈的辩解语气。
