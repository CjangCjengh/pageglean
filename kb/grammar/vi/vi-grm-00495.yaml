title: 「đã…chưa」：询问是否已经……
structure: đã + 动词 + chưa
structure_pattern: đã + V + chưa
explanation_zh: 越南语用「đã + 动词 + chưa」询问某事是否已经发生或完成，相当于中文「……了吗／……了没有」。đã 表已然置于动词前，chưa
  表「尚未」置于句末。与中文「……了吗」对应，但语序上一前一后夹住动词。
examples:
- text: Tôi định chạy lại sờ trán nó xem nó đã bớt nóng chưa.
