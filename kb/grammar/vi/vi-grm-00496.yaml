id: vi-grm-00496
language: vi
type: grammar
level: L2
level_rank: 2
title: 「vừa / mới」：刚刚
structure: vừa / mới + 动词
structure_pattern: vừa/mới + V
explanation_zh: vừa 和 mới 都置于动词前表示「刚刚」，vừa 强调动作刚发生，mới 侧重「才、仅仅」。常与 đã 呼应构成「mới…đã…」，意为「刚一……就已经……」。
examples:
- text: Buổi trưa, vừa về đến nhà, ăn qua loa vài chén cơm, tôi chạy qua thăm Tiểu
    Li.
