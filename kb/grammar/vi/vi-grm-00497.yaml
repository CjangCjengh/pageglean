title: 「V + hoài」：一直……不停
structure: 动词 + hoài
structure_pattern: V + hoài
explanation_zh: hoài 置于动词后，表示动作持续不断或反复进行，相当于中文「一直……／老是……」。为南部常用说法，北部多说 mãi。
examples:
