title: 「không thể nào…được」：怎么也……不了
structure: không thể nào + 动词 + được
structure_pattern: không thể nào + V + được
explanation_zh: 「không thể nào…được」表示「怎么也……不了／根本无法……」，语气比单纯的 không thể 更强烈。được 置于动词后表示可能，整个结构前后呼应。
