title: 「sự + V／形」：名词化
structure: sự + V/Adj（+ của + N）
structure_pattern: sự + V/Adj
explanation_zh: 「sự」加在动词或形容词前，把动作、状态变成抽象名词，相当于汉语的“…的事／…性／…感”。常与「của」（的）连用构成名词短语，在叙述文体中高频出现。
