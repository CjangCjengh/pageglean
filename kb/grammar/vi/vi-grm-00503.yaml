id: vi-grm-00503
language: vi
type: grammar
level: L2
level_rank: 2
title: đã…bao giờ chưa：询问经历「可曾…过吗」
structure: đã + V + (ai/什么) + bao giờ + chưa
structure_pattern: đã + V + bao giờ + chưa
explanation_zh: 越南语用「đã…bao giờ chưa」构成经历体疑问，相当于中文「可曾…过吗」，đã 与 chưa 框住动词表过去至今的经历。也可用
  đã từng 强调「曾经」。回答用 rồi（有过）或 chưa（还没有）。
examples:
