title: Vậy mà：转折让步「亏我还/结果却」
structure: Vậy mà + Chủ ngữ + V…
structure_pattern: Vậy mà + mệnh đề
explanation_zh: 「Vậy mà」表事实与预期相反，含失望或惊讶，相当于中文「亏我还…/结果却…」。连接前后两个相反的情形，后句常带 bất ngờ（出乎意料）的语气。
