title: Chỉ tổ + V：「只会弄得/净添」
structure: Chỉ + tổ + V/Adj
structure_pattern: chỉ + tổ + V
explanation_zh: 「chỉ tổ + 动词/形容词」表示某事只会带来负面结果，相当于中文「只会弄得/净是添乱」。tổ 在此为口语虚词，整个结构含贬义与不屑，常用于泼冷水。
