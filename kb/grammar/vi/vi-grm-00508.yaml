title: Hèn gì：恍然「难怪/怪不得」
structure: Hèn gì + mệnh đề
structure_pattern: hèn gì + mệnh đề
explanation_zh: 「Hèn gì」用于得知原因后表示恍然大悟，相当于中文「难怪/怪不得」，后接说明结果的分句。常与 thảo nào 互换使用，口语色彩浓。
