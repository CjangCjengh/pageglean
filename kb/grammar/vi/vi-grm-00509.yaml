title: muốn…gì/ai…(thì)…：任指让步「想…就…」
structure: muốn + V + 疑问代词 (gì/ai…) + (thì) + V
structure_pattern: muốn + V + nghi vấn từ + (thì) + V
explanation_zh: 用「muốn + 动词 + 疑问代词 + (则) + 重复动词」表示任凭、随意，相当于中文「想…就…/爱…就…」。疑问词 gì/ai
  在此不表疑问而表任指，可加 thì 也可省略，是地道口语结构。
examples:
