title: 「Trước khi」：在……之前
structure: Trước khi + 动词/小句，主句
structure_pattern: Trước khi + VP/S, S V
explanation_zh: “trước khi”引导时间状语从句，表示主句动作发生在该动作之前，对应中文“在……之前”。从句常前置并用逗号与主句隔开。反义结构为“sau
  khi”（……之后）。
examples:
- text: Trước khi quen tôi, anh đã quen mấy người rồi?
