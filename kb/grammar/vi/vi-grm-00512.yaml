title: 「không...nào cả」：彻底否定，一个也不……
structure: không + 名词/量词短语 + nào cả
structure_pattern: không + N + nào cả
explanation_zh: “không...nào cả”表彻底否定，强调“一个都不……”；“không có ai cả”即“没有任何人”。句末的“nào
  cả / ai cả”加强否定语气，相当于中文“……都没有 / 一个也没有”。
