title: 「mặc dù」：让步，尽管……
structure: mặc dù + 小句，主句
structure_pattern: mặc dù + S, S V
explanation_zh: “mặc dù”引导让步状语从句，对应中文“尽管/虽然……”，常与“nhưng”（但是）呼应，但此处省略了转折词。多用于书面或较为完整的叙述语体。
examples:
