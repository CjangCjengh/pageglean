title: 「vừa...lại vừa...」：既……又……
structure: vừa + 形容词 + lại vừa + 形容词
structure_pattern: vừa + Adj + lại vừa + Adj
explanation_zh: “vừa...lại vừa...”并列两种同时存在的状态，对应中文“既……又……”。两个形容词短语前后呼应，强调矛盾或并存的特质。注意与表“刚刚”的“vừa
  mới”区分。
examples:
- text: Tiểu Li vừa xa vời như những câu chuyện cổ lại vừa gần kề như những sớm mai.
