title: 「Cứ mỗi lần」：每当……的时候
structure: Cứ mỗi lần + 动词/小句，主句
structure_pattern: Cứ mỗi lần + VP/S, S V
explanation_zh: “cứ mỗi lần”表示“每当……”，引出反复出现的场景，后接规律性的结果，对应中文“每次/每当……”。“cứ”强调规律性与无一例外，带有“总是如此”的意味。
examples:
- text: Cứ mỗi lần nhớ đến Tiểu Li, tôi như chìm vào một lớp khói sương lãng đãng
    giữa mộng và thực
