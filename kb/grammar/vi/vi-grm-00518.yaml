  pointer: null
- text: Tôi cười vì không ngờ anh lại nhớ kỹ những chuyện hồi nhỏ đến như vậy.
  reading: ''
  annot: Tôi cười vì không ngờ anh lại nhớ kỹ những chuyện hồi nhỏ đến như vậy.
  translation_zh: 我笑是因为没想到你竟把小时候的事记得这么清楚。
