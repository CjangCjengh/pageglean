title: lại：竟然、反而（出乎意料）
structure: lại + 动词／形容词（语气副词，表示与预期相反或出乎意料）
structure_pattern: lại + V/Adj
explanation_zh: lại 在此是语气副词，表示事情出乎意料或与预期相反，相当于“竟然、反而”。常与 sao（为什么）、không ngờ（没想到）搭配，传达说话人的惊讶。注意与表“又、再次”义的
  lại 区分。
examples:
