id: vi-grm-00519
language: vi
type: grammar
level: L3
level_rank: 3
title: không bao giờ được：绝不可以（禁止）
structure: không bao giờ + được + 动词（任何时候都不可以做某事）
structure_pattern: không bao giờ được + V
explanation_zh: “không bao giờ được + V”意为“绝对不可以做……”，多用于叮嘱和禁令。其中 được 为情态动词（động từ
  tình thái），表允许；không bao giờ 作时间状语，强调“任何时候都不”。整体相当于汉语“千万别、永远不许”。
examples:
- text: Hải gầy đã từng dặn tôi không bao giờ được "ca tụng" trước mặt một người con
    gái về một người con gái khác
