title: hả：口语是非问语气词
structure: 陈述句 + hả？（句末加语气词构成是非问）
structure_pattern: Câu + hả
explanation_zh: hả 是口语中的疑问语气词（tình thái từ），加在陈述句末构成是非问，相当于汉语“吗／呀”，语气随意亲切。越南语是非问还可用
  không、phải không 等，而 hả 更生活化。本句“giận tôi hả?”即“生我的气了吗？”。
examples:
